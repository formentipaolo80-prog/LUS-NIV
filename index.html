 e termina quando il flusso inspiratorio scende sotto la soglia di cycling. Figura 2.2. PSV o NIV-PS. Il paziente triggera il ventilatore; il supporto pressorio sale sopra EPAP/PEEP e termina quando il flusso inspiratorio scende sotto la soglia di cycling. Attenzione: un pressure support troppo basso lascia il paziente tachipnoico e affaticato. Un pressure support troppo alto può produrre volumi eccessivi, asincronie, fastidio, perdite elevate e sovra-assistenza. Nel paziente ipossiemico de novo, volumi correnti elevati durante NIV-PS sono associati a rischio di fallimento e possibile danno. Non si aumenta il pressure support “perché il paziente satura poco”. Si aumenta il pressure support se il problema è ventilazione alveolare, ipercapnia o lavoro respiratorio. FiO₂ La FiO₂ serve a raggiungere il target di ossigenazione, ma non corregge il meccanismo dell’insufficienza respiratoria. Aumentare la FiO₂ può essere necessario, ma non deve diventare una scorciatoia per evitare la rivalutazione del polmone e del lavoro respiratorio. Una FiO₂ elevata persistente indica che il sistema non è stabile o che il supporto respiratorio impostato non sta correggendo il problema. Il trattamento non colpisce il bersaglio. In questi casi bisogna rivalutare: LUS e perdita di aerazione; reclutabilità; frequenza respiratoria; comfort e sincronia; EGA; indicazione a CPAP, NIV-PS o escalation . Messaggio operativo: la FiO₂ corregge la saturimetria, non la malattia. Trigger inspiratorio Il trigger è il meccanismo con cui il ventilatore riconosce l’inizio dello sforzo inspiratorio del paziente. Può essere impostato a pressione o a flusso. Nel trigger a pressione, il ventilatore eroga il supporto quando rileva una piccola caduta di pressione generata dallo sforzo inspiratorio del paziente. Nel trigger a flusso il ventilatore eroga il supporto quando rileva una variazione di flusso nel circuito. Problemi tipici che si possono verificare in NIV-PS: trigger inefficace: il paziente inspira ma il ventilatore non eroga supporto ; trigger ritardato: il ventilatore eroga il supporto tardi rispetto all’inspirazione del paziente, aumentando lo sforzo respiratorio complessivo; autotrigger: il ventilatore eroga supporto in assenza di inspirazione del paziente Nella BPCO, l’auto-PEEP può rendere difficile il trigger del ventilatore. Una EPAP adeguata può ridurre lo sforzo inspiratorio necessario ad attivare il trigger, ma solo se non aumenta ulteriormente l’iperinflazione. Le perdite elevate, soprattutto nei circuiti monotubo, possono invece favorire autotrigger o mancato trigger a seconda degli algoritmi di compensazione del ventilatore. Rise time Il rise time indica la velocità con cui la pressione sale da EPAP a IPAP. Un rise time troppo lento può dare sensazione di “fame d’aria”, perché il supporto arriva tardi. Un rise time troppo rapido può essere sgradevole, aumentare le perdite e peggiorare l’adattamento. Nella pratica clinica, quando valuto: paziente dispnoico, alto drive respiratorio, richiesta inspiratoria intensa: può servire una salita più rapida; paziente fragile, perdite elevate, fastidio o asincronie: può servire una salita più morbida. Il rise time non si regola guardando solo il ventilatore. Si regola guardando il paziente insieme al ventilatore: comfort, sincronia, frequenza respiratoria, uso dei muscoli accessori. Cycling espiratorio Il cycling è il passaggio dall’inspirazione all’espirazione. In NIV-PS, nella maggior parte dei ventilatori, avviene quando il flusso inspiratorio scende sotto una quota percentuale del picco di flusso inspiratorio. Una soglia di cycling più alta tende ad accorciare il tempo inspiratorio; una soglia più bassa tende ad allungarlo. Se il cycling è tardivo, il ventilatore continua a insufflare la miscela di aria/ossigeno quando il paziente vorrebbe già espirare. Questo può generare fastidio, asincronia, perdite elevate e iperinflazione. Se il cycling è precoce, l’assistenza termina troppo presto e il paziente può restare dispnoico o richiedere un nuovo sforzo immediato. Questo punto è particolarmente importante nella BPCO: tempi inspiratori troppo lunghi riducono il tempo espiratorio e favoriscono l’iperinflazione dinamica. In molti pazienti ostruttivi può essere utile un cycling più precoce, sempre verificando comfort, frequenza respiratoria, addominali attivi, entità delle perdite e curve del ventilatore. Figura 2.3. Ciclo assistito in NIV-PS: trigger, rise time e cycling. Il trigger avvia l’assistenza, il rise time determina la velocità di salita della pressione, il cycling definisce il passaggio all’espirazione. Molte asincronie dipendono da questi tre elementi più che dal valore assoluto delle pressioni. Figura 2.3. Ciclo assistito in NIV-PS: trigger, rise time e cycling. Il trigger avvia l’assistenza, il rise time determina la velocità di salita della pressione, il cycling definisce il passaggio all’espirazione. Molte asincronie dipendono da questi tre elementi più che dal valore assoluto delle pressioni. Backup rate La backup rate è la frequenza minima garantita dal ventilatore nelle modalità che prevedono atti temporizzati, per esempio S/T. Subentra quando il paziente non attiva spontaneamente il ventilatore entro l’intervallo previsto dalla frequenza impostata o quando viene rilevata una condizione assimilabile ad apnea secondo l’algoritmo del ventilatore. Nel paziente acuto tachipnoico, la backup rate non è quasi mai il primo parametro da correggere. Se il paziente respira a 30 atti/min, impostare una backup rate a 14/min non riduce la fatica: significa solo che il ventilatore interverrà se il paziente smette di respirare. Diventa più rilevante in caso di ipoventilazione centrale, sonno, patologia neuromuscolare, sedazione, encefalopatia o rischio di apnea. Figura 2.4. Modalità S/T. Gli atti spontanei assistiti restano prevalenti; se il paziente non triggera, la frequenza di backup genera un atto temporizzato. Figura 2.4. Modalità S/T. Gli atti spontanei assistiti restano prevalenti; se il paziente non triggera, la frequenza di backup genera un atto temporizzato. Messaggio operativo la backup rate è una rete di sicurezza, non il trattamento della dispnea. Parametri che posso leggere sul ventilatore Perdite Le perdite sono inevitabili in NIV, ma quando diventano eccessive compromettono l’efficacia del supporto respiratorio. Sono uno dei motivi più comuni del fallimento pratico della NIV. Possono ridurre il volume realmente erogato, disturbare trigger e cycling, aumentare fastidio, secchezza, rumore, lesioni cutanee e asincronie. Le perdite vanno sospettate quando: il paziente non si sincronizza, è agitato; il ventilatore mostra autotrigger; la pressione target (IPAP e/o EPAP) non viene raggiunta; il volume corrente stimato è incoerente; la maschera è rumorosa; il paziente è agitato o riferisce fastidio; gli occhi sono irritati da fuga d’aria verso l’alto, specie con le maschere naso-bocca è necessario stringere molto le cinghie dell’interfaccia Correggere le perdite non significa sempre semplicemente stringere di più le cinghie della maschera. A volte bisogna cambiare taglia, cambiare interfaccia, modificare la postura, ridurre transitoriamente le pressioni, umidificare meglio o correggere il trigger . Volume corrente stimato Molti ventilatori mostrano un volume corrente stimato, ovvero derivato in genere dell’integrale dell’onda di flusso. È utile, ma va interpretato con cautela perché le perdite possono renderlo impreciso. Nonostante questo limite, un volume molto basso può indicare supporto insufficiente o perdita eccessiva; un volume molto alto può suggerire sovra-assistenza o drive respiratorio elevato. Nel paziente ipossiemico de novo, volumi elevati durante NIV devono far aumentare il livello di attenzione: il paziente può continuare a generare grandi oscillazioni di pressione transpolmonare, peggiorare il danno polmonare ed essere a rischio di fallimento del trial. Lettura rapida del ventilatore Quando si rivaluta un paziente in NIV-PS, non basta chiedersi se “sta saturando”. Bisogna leggere insieme quattro livelli: Livello Cosa guardare Perché serve Pressioni EPAP, IPAP, PS effettivo capire quale parametro stiamo regolando Scambi FiO₂, SpO₂, EGA capire se ossigena e ventila Interazione perdite, trigger, cycling, asincronie capire se il supporto arriva davvero Risposta clinica FR, comfort, muscoli accessori, sensorio capire se il paziente lavora meno Tabella 2.1. Lettura rapida del ventilatore durante NIV. Figura 2.5. Lettura rapida del ventilatore durante NIV. I dati del ventilatore devono essere interpretati insieme a clinica ed ecografia. Il numero sul display conta solo se è coerente con il paziente. Figura 2.5. Lettura rapida del ventilatore durante NIV. I dati del ventilatore devono essere interpretati insieme a clinica ed ecografia. Il numero sul display conta solo se è coerente con il paziente. Messaggi chiave EPAP/PEEP e pressure support correggono problemi diversi: la prima agisce soprattutto su aerazione e ossigenazione, il secondo sulla ventilazione e sul lavoro respiratorio. Il vero supporto inspiratorio non è la IPAP da sola, ma la differenza tra IPAP ed EPAP. La FiO₂ migliora la saturazione, ma non corregge da sola il problema respiratorio. Trigger, rise time e cycling regolano la sincronia tra paziente e ventilatore. Le perdite possono rendere inefficace una NIV anche quando i parametri sembrano corretti. Il volume corrente letto sul ventilatore va interpretato con prudenza, soprattutto se ci sono perdite. Ogni modifica delle manopole deve avere un obiettivo preciso e va rivalutata sul paziente. Bibliografia del Capitolo 2 1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016. 2. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7. 3. Hess DR. Noninvasive ventilation for acute respiratory failure. Respir Care. 2013;58(6):950-972. doi:10.4187/respcare.02319. 4. Vignaux L, Vargas F, Roeseler J, Tassaux D, Thille AW, Kossowsky MP, et al. Patient-ventilator asynchrony during non-invasive ventilation for acute respiratory failure: a multicenter study. Intensive Care Med. 2009;35(5):840-846. doi:10.1007/s00134-009-1416-5. 5. Calderini E, Confalonieri M, Puccio PG, Francavilla N, Stella L, Gregoretti C. Patient-ventilator asynchrony during noninvasive ventilation: the role of expiratory trigger. Intensive Care Med. 1999;25(7):662-667. doi:10.1007/s001340050927. 6. Carteaux G, Lyazidi A, Córdoba-Izquierdo A, Vignaux L, Jolliet P, Thille AW, et al. Patient-ventilator asynchrony during noninvasive ventilation: a bench and clinical study. Chest. 2012;142(2):367-376. doi:10.1378/chest.11-2279. 7. Oto J, Chenelle CT, Marchese AD, Kacmarek RM. A comparison of leak compensation in acute care ventilators during noninvasive and invasive ventilation: a lung model study. Respir Care. 2013;58(12):2027-2037. doi:10.4187/respcare.02319. 8. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379. 9. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558. 10. Umbrello M, Formenti P. Ultrasonographic assessment of diaphragm function in critically ill subjects. Respir Care. 2016;61(4):542-555. doi:10.4187/respcare.04412."},{"part":"Parte I — Fondamenti pratici di ventilazione non invasiva","title":"Capitolo 3. Modalità ventilatorie, circuiti e curve: tradurre il nome in fisiologia","tag":"Capitolo 3","html":"\n<h3>Obiettivo pratico<\/h3>\n<p>Dopo aver chiarito i parametri principali della NIV nel capitolo precedente, è utile fermarsi sulla nomenclatura delle modalità. Nella pratica clinica lo stesso comportamento ventilatorio può essere chiamato in modo diverso a seconda del ventilatore; al contrario, due modalità con nomi simili possono avere logiche di controllo differenti. Il punto pratico è semplice: prima di scegliere una modalità bisogna chiedersi che cosa si vuole controllare. Voglio mantenere una pressione continua per stabilizzare il polmone? Voglio scaricare i muscoli respiratori con un supporto inspiratorio? Voglio garantire una frequenza minima se il paziente non triggera? Voglio ottenere un volume corrente medio più stabile perché la meccanica cambia durante il sonno o con la posizione?<\/p>\n<h3>Nomenclatura estesa e logica dell’onda di flusso<\/h3>\n<p><strong>CPAP<\/strong> significa continuous positive airway pressure: il ventilatore mantiene una pressione positiva continua, senza un supporto inspiratorio differenziale. <strong>BiPAP<\/strong>, termine commerciale entrato nell’uso clinico, e <strong>BiLevel<\/strong> indicano una ventilazione a due livelli pressori: EPAP durante l’espirazione e IPAP durante l’inspirazione. <strong>PSV o NIV-PS<\/strong> indicano la pressure support ventilation applicata in modo non invasivo: il paziente innesca l’atto e il ventilatore eroga un supporto inspiratorio sopra la EPAP.<\/p>\n<p>La modalità <strong>S/T<\/strong> significa spontanea/temporizzata: il respiro spontaneo resta centrale, ma il ventilatore aggiunge una frequenza di sicurezza se il paziente non triggera.<\/p>\n<p><strong>PC o PCV<\/strong> significa pressure-controlled ventilation: il ventilatore controlla la pressione inspiratoria e il volume corrente diventa una conseguenza della compliance, delle resistenze, dello sforzo del paziente e delle perdite. <strong>VC o VCV<\/strong> significa volume-controlled ventilation: il ventilatore controlla il volume corrente o il flusso inspiratorio programmato e la pressione necessaria varia in base alla meccanica respiratoria. <strong>PRVC<\/strong> significa pressure-regulated volume control: è una modalità a pressione con target di volume, nella quale il ventilatore modifica progressivamente la pressione inspiratoria per avvicinarsi al volume corrente impostato. <strong>VAPS o AVAPS<\/strong> indicano modalità di pressure support con volume assicurato o mediato nel tempo. <strong>SIMV-PC e SIMV-VC<\/strong> indicano synchronized intermittent mandatory ventilation con atti mandatori rispettivamente a pressione o a volume: sono modalità tipiche dei ventilatori da terapia intensiva e non vanno confuse con la NIV-PS spontanea usata nella maggior parte dei trial non invasivi acuti.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_09.png\" alt=\"Figura 3.1. SIMV-VC + PSV. Atti obbligati sincronizzati a volume controllato si alternano a respiri spontanei assistiti in pressione di supporto.\" loading=\"lazy\"><figcaption>Figura 3.1. SIMV-VC + PSV. Atti obbligati sincronizzati a volume controllato si alternano a respiri spontanei assistiti in pressione di supporto.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_09.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 3.1. SIMV-VC + PSV. Atti obbligati sincronizzati a volume controllato si alternano a respiri spontanei assistiti in pressione di supporto.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_10.png\" alt=\"Figura 3.2. SIMV-PC + PSV. Atti obbligati sincronizzati a pressione controllata si alternano a respiri spontanei assistiti in pressione di supporto.\" loading=\"lazy\"><figcaption>Figura 3.2. SIMV-PC + PSV. Atti obbligati sincronizzati a pressione controllata si alternano a respiri spontanei assistiti in pressione di supporto.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_10.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 3.2. SIMV-PC + PSV. Atti obbligati sincronizzati a pressione controllata si alternano a respiri spontanei assistiti in pressione di supporto.<\/p>\n<p>Il valore chiave, quando si confrontano modalità a pressione e modalità a volume, è l’onda di <strong>flusso inspiratorio<\/strong>. Nella ventilazione a pressione controllata la pressione viene portata rapidamente al livello impostato e tende a rimanere costante durante l’inspirazione: il flusso è alto all’inizio e poi decresce progressivamente. Nella ventilazione a volume controllato classica il ventilatore eroga un flusso predefinito, spesso costante, per ottenere il volume corrente impostato; la pressione delle vie aeree cresce in funzione di resistenze, elastanza e andamento del flusso. La differenza non è solo grafica: un flusso iniziale elevato e decrescente può migliorare la sincronia nei pazienti che richiedono molto flusso all’inizio dell’inspirazione, mentre un flusso costante rende più prevedibile il volume erogato ma può essere meno confortevole se non viene regolato con attenzione [17].<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_11.png\" alt=\"Figura 3.3. PCV. La pressione inspiratoria è controllata; il flusso è tipicamente decrescente e il volume corrente dipende da compliance, resistenze, perdite e sforzo del paziente.\" loading=\"lazy\"><figcaption>Figura 3.3. PCV. La pressione inspiratoria è controllata; il flusso è tipicamente decrescente e il volume corrente dipende da compliance, resistenze, perdite e sforzo del paziente.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_11.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 3.3. PCV. La pressione inspiratoria è controllata; il flusso è tipicamente decrescente e il volume corrente dipende da compliance, resistenze, perdite e sforzo del paziente.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_12.png\" alt=\"Figura 3.4. VCV. Il volume e il flusso inspiratorio sono predefiniti; la pressione necessaria per erogarli diventa una conseguenza della meccanica respiratoria.\" loading=\"lazy\"><figcaption>Figura 3.4. VCV. Il volume e il flusso inspiratorio sono predefiniti; la pressione necessaria per erogarli diventa una conseguenza della meccanica respiratoria.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_12.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 3.4. VCV. Il volume e il flusso inspiratorio sono predefiniti; la pressione necessaria per erogarli diventa una conseguenza della meccanica respiratoria.<\/p>\n<p>Per questo, davanti a un acronimo, la domanda pratica non è solo “come si chiama la modalità?”, ma “che cosa controlla il ventilatore e che forma assume l’onda di flusso?”.<\/p>\n<p>Se il ventilatore controlla la pressione, il volume dipende dal paziente e dal circuito. Se controlla il volume o il flusso, la pressione diventa il risultato della meccanica respiratoria. Se utilizza un target di volume con controllo pressorio, il comportamento del singolo atto resta pressometrico, ma la pressione viene adattata nel tempo per inseguire il volume medio desiderato.<\/p>\n<p class=\"manualCaptionText\">Tabella 3.1. Nomenclatura pratica delle modalità ventilatorie.<\/p>\n<p>Il punto pratico: prima si decide se il problema è aerazione, ventilazione alveolare, sincronizzazione, sicurezza in apnea o variabilità del volume corrente; solo dopo si sceglie la modalità più coerente<\/p>\n<h3>Dalla CPAP alla BiLevel: cosa cambia davvero<\/h3>\n<p>La CPAP mantiene una pressione positiva continua durante tutto il ciclo respiratorio. Non aggiunge un supporto inspiratorio differenziale: il paziente respira spontaneamente sopra un livello pressorio costante. È coerente quando il problema dominante è aerazione, collasso alveolare, edema polmonare cardiogeno o atelettasia potenzialmente reclutabile.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_13.png\" alt=\"Figura 3.5. CPAP. La pressione resta positiva e sostanzialmente costante durante tutto il ciclo; il paziente respira spontaneamente sopra il livello di CPAP/PEEP.\" loading=\"lazy\"><figcaption>Figura 3.5. CPAP. La pressione resta positiva e sostanzialmente costante durante tutto il ciclo; il paziente respira spontaneamente sopra il livello di CPAP/PEEP.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_13.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_14.png\" alt=\"Figura 3.5. CPAP. La pressione resta positiva e sostanzialmente costante durante tutto il ciclo; il paziente respira spontaneamente sopra il livello di CPAP/PEEP.\" loading=\"lazy\"><figcaption>Figura 3.5. CPAP. La pressione resta positiva e sostanzialmente costante durante tutto il ciclo; il paziente respira spontaneamente sopra il livello di CPAP/PEEP.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_14.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 3.5. CPAP. La pressione resta positiva e sostanzialmente costante durante tutto il ciclo; il paziente respira spontaneamente sopra il livello di CPAP/PEEP.<\/p>\n<p>La ventilazione BiLevel, nelle sue diverse forme, lavora invece su due livelli: EPAP durante l’espirazione e IPAP durante l’inspirazione. La differenza tra IPAP ed EPAP è il pressure support. Se il paziente triggera l’atto, il ventilatore lo assiste; se la modalità prevede una frequenza di sicurezza, il ventilatore può erogare un atto temporizzato quando manca uno sforzo efficace entro il tempo previsto.<\/p>\n<p>Nella modalità S/T, cioè spontanea/temporizzata, il respiro spontaneo resta il comportamento principale; la componente temporizzata è una rete di sicurezza. Nel paziente tachipnoico e vigile non è il parametro che scarica la fatica. Diventa importante quando esiste rischio di apnea, ipoventilazione centrale, sonno, sedazione, encefalopatia o malattia neuromuscolare.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_15.png\" alt=\"Figura 3.6. Modalità NIV: tradurre il nome in fisiologia. La stessa modalità può essere presentata con nomi diversi, ma al letto del paziente bisogna sempre capire che cosa resta costante, che cosa varia e quale bersaglio fisiopatologico si vuole correggere.\" loading=\"lazy\"><figcaption>Figura 3.6. Modalità NIV: tradurre il nome in fisiologia. La stessa modalità può essere presentata con nomi diversi, ma al letto del paziente bisogna sempre capire che cosa resta costante, che cosa varia e quale bersaglio fisiopatologico si vuole correggere.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_15.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 3.6. Modalità NIV: tradurre il nome in fisiologia. La stessa modalità può essere presentata con nomi diversi, ma al letto del paziente bisogna sempre capire che cosa resta costante, che cosa varia e quale bersaglio fisiopatologico si vuole correggere.<\/p>\n<h3>Modalità con target di volume: logica e limiti<\/h3>\n<p>Le modalità con target di volume non sono modalità “a volume puro”. PRVC, VAPS, AVAPS e modalità analoghe sono strumenti diversi, ma condividono una logica: il ventilatore usa un controllo prevalentemente pressometrico e modifica progressivamente la pressione inspiratoria entro limiti impostati per avvicinarsi a un volume target.<\/p>\n<p>Il singolo atto, quindi, non va letto come una VCV classica a flusso costante; va letto come un atto a pressione, spesso con flusso decrescente, guidato da un obiettivo di volume medio.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_16.png\" alt=\"Figura 3.7. PRVC. La modalità usa un controllo pressometrico adattato respiro per respiro per raggiungere un volume target, mantenendo un profilo di flusso decrescente.\" loading=\"lazy\"><figcaption>Figura 3.7. PRVC. La modalità usa un controllo pressometrico adattato respiro per respiro per raggiungere un volume target, mantenendo un profilo di flusso decrescente.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_16.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 3.7. PRVC. La modalità usa un controllo pressometrico adattato respiro per respiro per raggiungere un volume target, mantenendo un profilo di flusso decrescente.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_17.png\" alt=\"Figura 3.8. VAPS/AVAPS. Il supporto pressorio varia progressivamente per avvicinare il volume corrente al target impostato; il monitoraggio resta indispensabile in presenza di perdite o meccanica variabile.\" loading=\"lazy\"><figcaption>Figura 3.8. VAPS/AVAPS. Il supporto pressorio varia progressivamente per avvicinare il volume corrente al target impostato; il monitoraggio resta indispensabile in presenza di perdite o meccanica variabile.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_17.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 3.8. VAPS/AVAPS. Il supporto pressorio varia progressivamente per avvicinare il volume corrente al target impostato; il monitoraggio resta indispensabile in presenza di perdite o meccanica variabile.<\/p>\n<p>Questa logica può essere utile quando il volume corrente tende a variare per posizione, sonno, drive, compliance, resistenze o perdite. È il motivo per cui la letteratura ha studiato queste modalità soprattutto nell’obesity hypoventilation syndrome (OHS), nell’ipoventilazione cronica e nei pazienti con meccanica respiratoria variabile. Nei pazienti con OHS, uno studio crossover ha mostrato una maggiore riduzione della PtcCO₂ con volume-assured pressure support rispetto alla S/T convenzionale, senza un chiaro vantaggio aggiuntivo su qualità del sonno o qualità di vita [11]. Un altro studio ha rilevato un migliore controllo dell’ipoventilazione notturna, ma a prezzo di maggiore percezione di perdite, “troppa aria” e peggior comfort soggettivo [12].<\/p>\n<p>Negli studi randomizzati più ampi o con titolazione protocolizzata, il vantaggio rispetto al pressure support fisso è meno evidente. Nei pazienti con super-obesità e insufficienza respiratoria cronica, la modalità con target di volume non ha mostrato differenze clinicamente rilevanti rispetto alla pressure support fissa quando entrambe erano impostate con un protocollo rigoroso [13]. In pazienti con OHS stabile, l’aggiunta di auto-EPAP e target di volume ha prodotto risultati simili alla modalità S/T su gas exchange e qualità oggettiva del sonno, pur riducendo il tempo necessario al setup [14].<\/p>\n<p>Nel paziente acuto con BPCO riacutizzata, le evidenze sono più limitate. Un piccolo trial pilota non ha dimostrato un miglioramento statisticamente significativo del comfort rispetto alla S/T convenzionale, pur mostrando miglioramenti clinici in entrambi i gruppi [15]. Per questo, in acuto, il target di volume non deve sostituire la valutazione clinica precoce: frequenza respiratoria, comfort, EGA, perdite, volumi, asincronie e lavoro muscolare restano decisivi.<\/p>\n<h3>Auto-EPAP e modalità ibride<\/h3>\n<p>Alcune modalità ibride non regolano solo il supporto inspiratorio, ma possono variare anche la pressione espiratoria per mantenere la pervietà delle alte vie aeree e ridurre eventi ostruttivi residui. Il concetto fisiologico è distinguere due bersagli: l’EPAP lavora su collasso espiratorio, ostruzione delle alte vie aeree e aerazione; il pressure support lavora sulla ventilazione alveolare e sulla PaCO₂.<\/p>\n<p>Questa distinzione è molto utile nell’OHS associata ad apnee ostruttive, dove ipoventilazione e collasso delle alte vie aeree coesistono. Una modalità ibrida può cercare di adattare EPAP agli eventi ostruttivi e pressure support al volume target. Non significa però che la modalità sia automaticamente superiore: nei trial clinici il risultato dipende dal fenotipo del paziente, dalla qualità del setup, dall’interfaccia, dalle perdite e dalla tolleranza.<\/p>\n<h3>Circuito monotubo e bitubo<\/h3>\n<p>Il circuito è parte del sistema ventilatorio. Non determina da solo il successo della NIV, ma modifica la misura dei volumi, la gestione delle perdite, la possibilità di rebreathing e il comportamento di trigger e cycling.<\/p>\n<p>Nel circuito monotubo inspirazione ed espirazione passano nello stesso tubo. L’eliminazione della CO₂ richiede una perdita intenzionale calibrata o una valvola espiratoria. È semplice, molto usato nella NIV, ma rende la lettura dei volumi e delle perdite più dipendente dagli algoritmi del ventilatore. Se la perdita intenzionale non è adeguata, o se il circuito e l’interfaccia non sono compatibili, può comparire rebreathing.<\/p>\n<p>Nel circuito bitubo la branca inspiratoria e quella espiratoria sono separate. Questo consente una misura più controllata del flusso espiratorio e del volume espirato in molte condizioni, ma richiede compatibilità tra ventilatore, circuito e interfaccia. Non è “migliore” in assoluto: è diverso. Nel paziente acuto conta soprattutto che il sistema scelto consenta una pressione stabile, perdite gestibili e sincronia accettabile.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_18.png\" alt=\"Figura 3.9. Circuiti NIV: monotubo e bitubo. Nel circuito monotubo inspirazione ed espirazione condividono la stessa linea e l’eliminazione della CO₂ dipende da perdita intenzionale o valvola. Nel circuito bitubo le branche inspiratoria ed espiratoria sono separate, con diversa gestione della misura del flusso espiratorio.\" loading=\"lazy\"><figcaption>Figura 3.9. Circuiti NIV: monotubo e bitubo. Nel circuito monotubo inspirazione ed espirazione condividono la stessa linea e l’eliminazione della CO₂ dipende da perdita intenzionale o valvola. Nel circuito bitubo le branche inspiratoria ed espiratoria sono separate, con diversa gestione della misura del flusso espiratorio.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_18.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 3.9. Circuiti NIV: monotubo e bitubo. Nel circuito monotubo inspirazione ed espirazione condividono la stessa linea e l’eliminazione della CO₂ dipende da perdita intenzionale o valvola. Nel circuito bitubo le branche inspiratoria ed espiratoria sono separate, con diversa gestione della misura del flusso espiratorio.<\/p>\n<h3>Compensazione delle perdite, trigger e cycling automatici<\/h3>\n<p>La NIV è inevitabilmente una ventilazione con perdite. Il ventilatore deve distinguere il flusso che va al paziente dal flusso che esce dall’interfaccia o dal circuito. Per questo i ventilatori dedicati alla NIV utilizzano algoritmi di compensazione delle perdite e di stima del volume corrente. Questi dati sono utili, ma non vanno letti come misure perfette: diventano meno affidabili quando le perdite sono elevate, variabili o mal compensate.<\/p>\n<p>Gli algoritmi moderni possono adattare automaticamente soglie di trigger e cycling, stimare il flusso del paziente e correggere la baseline in presenza di leak. Il vantaggio pratico è ridurre la necessità di continue regolazioni manuali. Il limite è che l’automatismo non capisce il contesto clinico: autotrigger, sforzi inefficaci, cycling tardivo e asincronie possono comunque comparire, soprattutto con maschera instabile, auto-PEEP, ostruzione severa, drive elevato o sedazione.<\/p>\n<p>Per questo il display del ventilatore va interpretato insieme al paziente. Se il volume stimato sembra adeguato, ma il paziente resta tachipnoico, usa addominali, presenta TFdi elevata o peggiora all’EGA, la modalità non sta funzionando davvero. Se il LUS migliora ma il comfort peggiora e le perdite aumentano, la pressione può avere raggiunto un bersaglio polmonare ma aver compromesso la tolleranza del trial.<\/p>\n<h3>Lettura pratica delle curve pressione, flusso e volume<\/h3>\n<p>Le curve del ventilatore aiutano a capire la logica della modalità meglio del nome commerciale. La lettura minima deve sempre chiedere quale variabile è controllata, quale variabile è conseguenza della meccanica del paziente e quale forma assume l'onda di flusso inspiratorio.<\/p>\n<p>Le curve sono distribuite nei paragrafi pertinenti; titolo e numero restano nella didascalia, così la numerazione rimane modificabile anche se in futuro verranno aggiunte o rimosse altre immagini.<\/p>\n<p>Queste curve non servono per trasformare il manuale in un corso di ventilazione invasiva. Servono a rendere più chiara la logica: nelle modalità a pressione il flusso si adatta alla meccanica del paziente; nella VCV classica il flusso è impostato; nelle modalità ibride il ventilatore modifica la pressione per avvicinarsi a un volume target; nelle SIMV coesistono atti obbligati sincronizzati e atti spontanei assistiti.<\/p>\n<p>La domanda operativa resta sempre la stessa: la curva che vedo è coerente con il problema che voglio correggere, oppure sto solo cambiando etichetta alla modalità senza modificare davvero il bersaglio fisiopatologico?<\/p>\n<h3>Come scegliere la modalità in pratica<\/h3>\n<table class=\"manualTable\"><tr><th>Situazione prevalente<\/th><th>Modalità coerente<\/th><th>Controllo prioritario<\/th><\/tr>\n<tr><td>Ipossia con collasso/reclutabilità e muscoli respiratori conservata<\/td><td>CPAP o BiLevel con basso PS se serve comfort<\/td><td>LUS, SpO₂/FiO₂, pressione arteriosa, comfort<\/td><\/tr>\n<tr><td>Ipercapnia con fatica dei muscoli respiratori<\/td><td>NIV-PS / BiLevel S o S/T<\/td><td>pH, PaCO₂, FR, diaframma, perdite, asincronie<\/td><\/tr>\n<tr><td>Ipoventilazione cronica, OHS, meccanica variabile nel sonno<\/td><td>Bilevel S/T; considerare volume-targeted PS se Vt instabile<\/td><td>TcCO₂/PaCO₂, Vt stimato, aderenza, comfort, leak<\/td><\/tr>\n<tr><td>OHS con eventi ostruttivi residui<\/td><td>Bilevel con EPAP adeguata; possibile auto-EPAP se disponibile<\/td><td>AHI residuo, EPAP necessaria, comfort, PaCO₂<\/td><\/tr>\n<tr><td>Drive elevato, polmone disomogeneo, volumi alti in de novo hypoxemia<\/td><td>Trial breve o escalation: non inseguire solo il volume<\/td><td>FR, Vt stimato, LUS, EGA, segni di fallimento<\/td><\/tr><\/table>\n<p class=\"manualCaptionText\">Tabella 3.2. Scelta pratica della modalità NIV in base al problema dominante. Le modalità con target di volume o auto-EPAP vanno considerate come strumenti di adattamento, non come scorciatoie per evitare il monitoraggio precoce.<\/p>\n<h3>Ruolo dell’ecografia<\/h3>\n<p>L’ecografia non sceglie la modalità al posto del clinico, ma aiuta a capire se la modalità scelta ha un bersaglio reale. Se il problema dominante è aerazione, il LUS deve mostrare perdita di aerazione, collasso, edema o atelettasia potenzialmente modificabile. Se il problema dominante è muscolare respiratorio, la valutazione di diaframma, intercostali e addominali diventa più rilevante del solo pattern polmonare.<\/p>\n<p>Nelle modalità con target di volume l’ecografia è particolarmente utile per evitare una falsa sicurezza: un volume medio apparentemente adeguato può coesistere con drive elevato, diaframma sovraccarico, addominali attivi e polmone disomogeneo. In questi casi il problema non è “aggiustare il target”, ma capire se il trial non invasivo è ancora appropriato.<\/p>\n<h3>Errore da evitare<\/h3>\n<p>L’errore più comune è scegliere o modificare una modalità perché sembra “più avanzata”, senza sapere quale bersaglio si vuole correggere. Aumentare pressioni, cambiare modalità o inseguire un volume target non significa automaticamente fornire un supporto più efficace. La tecnologia aiuta solo quando è chiaro il problema da trattare: aerazione, ventilazione alveolare, sincronia, sicurezza in apnea o variabilità del volume corrente.<\/p>\n<table class=\"manualTable\"><tr><th>Messaggi chiave<br>Il nome della modalità non basta: bisogna capire che cosa il ventilatore controlla e quale problema si vuole trattare.<br>CPAP, BiLevel, NIV-PS, S/T, PCV, VCV, PRVC, AVAPS e SIMV non sono sinonimi.<br>La CPAP mantiene una pressione continua ed è utile soprattutto quando il problema è aerazione o ossigenazione.<br>La NIV-PS/BiLevel aggiunge un supporto inspiratorio ed è più indicata quando il problema è ipercapnia o fatica respiratoria.<br>Nelle modalità a pressione il volume dipende dal paziente e dalla meccanica respiratoria; nelle modalità a volume la pressione diventa la conseguenza.<br>Le modalità a target di volume possono aiutare, ma non sostituiscono il monitoraggio clinico, ventilatorio ed ecografico.<br>Il circuito monotubo o bitubo influenza perdite, rebreathing, misura dei volumi e sincronia.<br>Le curve di pressione, flusso e volume aiutano a capire meglio la modalità impostata.<\/th><\/tr><\/table>\n<h3>Bibliografia del Capitolo 3<\/h3>\n<p>1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.<\/p>\n<p>2. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7.<\/p>\n<p>3. Hess DR. Noninvasive ventilation for acute respiratory failure. Respir Care. 2013;58(6):950-972. doi:10.4187/respcare.02319.<\/p>\n<p>4. Vignaux L, Vargas F, Roeseler J, Tassaux D, Thille AW, Kossowsky MP, et al. Patient-ventilator asynchrony during non-invasive ventilation for acute respiratory failure: a multicenter study. Intensive Care Med. 2009;35(5):840-846. doi:10.1007/s00134-009-1416-5.<\/p>\n<p>5. Calderini E, Confalonieri M, Puccio PG, Francavilla N, Stella L, Gregoretti C. Patient-ventilator asynchrony during noninvasive ventilation: the role of expiratory trigger. Intensive Care Med. 1999;25(7):662-667. doi:10.1007/s001340050927.<\/p>\n<p>6. Carteaux G, Lyazidi A, Córdoba-Izquierdo A, Vignaux L, Jolliet P, Thille AW, et al. Patient-ventilator asynchrony during noninvasive ventilation: a bench and clinical study. Chest. 2012;142(2):367-376. doi:10.1378/chest.11-2279.<\/p>\n<p>7. Oto J, Chenelle CT, Marchese AD, Kacmarek RM. A comparison of leak compensation in acute care ventilators during noninvasive and invasive ventilation: a lung model study. Respir Care. 2013;58(12):2027-2037. doi:10.4187/respcare.02319.<\/p>\n<p>8. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.<\/p>\n<p>9. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p>\n<p>10. Umbrello M, Formenti P. Ultrasonographic assessment of diaphragm function in critically ill subjects. Respir Care. 2016;61(4):542-555. doi:10.4187/respcare.04412.<\/p>\n<p>11. Storre JH, Seuthe B, Fiechter R, Milioglou S, Dreher M, Sorichter S, Windisch W. Average volume-assured pressure support in obesity hypoventilation: a randomized crossover trial. Chest. 2006;130(3):815-821. doi:10.1378/chest.130.3.815.<\/p>\n<p>12. Janssens JP, Metzger M, Sforza E. Impact of volume targeting on efficacy of bi-level non-invasive ventilation and sleep in obesity-hypoventilation. Respir Med. 2009;103(2):165-172. doi:10.1016/j.rmed.2008.03.013.<\/p>\n<p>13. Murphy PB, Davidson C, Hind MD, Simonds A, Williams AJ, Hopkinson NS, Moxham J, Polkey M, Hart N. Volume targeted versus pressure support non-invasive ventilation in patients with super obesity and chronic respiratory failure: a randomised controlled trial. Thorax. 2012. doi:10.1136/thoraxjnl-2011-201081.<\/p>\n<p>14. Patout M, Gagnadoux F, Rabec C, Trzepizur W, Georges M, Perrin C, et al. AVAPS-AE versus ST mode: a randomized controlled trial in patients with obesity hypoventilation syndrome. Respirology. 2020. doi:10.1111/resp.13784.<\/p>\n<p>15. Limsuwat C, Rawangnam W, Ruangsomboon O, Prapruetkit N. Effect of non-invasive mechanical ventilation with average volume assured pressure support in patients with chronic obstructive pulmonary disease with acute exacerbation: a randomized pilot trial. Southwest Respir Crit Care Chron. 2019;7(30):19-28. doi:10.12746/swrccc.v7i30.560.<\/p>\n<p>16. Saddi V, Thambipillay G, Pithers S, Moody M, Martin B, Blecher G, Teng A. Average volume-assured pressure support vs conventional bilevel pressure support in pediatric nocturnal hypoventilation: a case series. J Clin Sleep Med. 2021;17(5):925-930. doi:10.5664/jcsm.9084.<\/p>\n<p>17. Natalini G. Ventilazione a volume controllato o ventilazione a pressione controllata? Quale la migliore? Ventilab. 27 novembre 2011. Risorsa didattica online: https://www.ventilab.it/2011/11/ventilazione-volume-controllato-o.html<\/p>","plain":"Obiettivo pratico Dopo aver chiarito i parametri principali della NIV nel capitolo precedente, è utile fermarsi sulla nomenclatura delle modalità. Nella pratica clinica lo stesso comportamento ventilatorio può essere chiamato in modo diverso a seconda del ventilatore; al contrario, due modalità con nomi simili possono avere logiche di controllo differenti. Il punto pratico è semplice: prima di scegliere una modalità bisogna chiedersi che cosa si vuole controllare. Voglio mantenere una pressione continua per stabilizzare il polmone? Voglio scaricare i muscoli respiratori con un supporto inspiratorio? Voglio garantire una frequenza minima se il paziente non triggera? Voglio ottenere un volume corrente medio più stabile perché la meccanica cambia durante il sonno o con la posizione? Nomenclatura estesa e logica dell’onda di flusso CPAP significa continuous positive airway pressure: il ventilatore mantiene una pressione positiva continua, senza un supporto inspiratorio differenziale. BiPAP , termine commerciale entrato nell’uso clinico, e BiLevel indicano una ventilazione a due livelli pressori: EPAP durante l’espirazione e IPAP durante l’inspirazione. PSV o NIV-PS indicano la pressure support ventilation applicata in modo non invasivo: il paziente innesca l’atto e il ventilatore eroga un supporto inspiratorio sopra la EPAP. La modalità S/T significa spontanea/temporizzata: il respiro spontaneo resta centrale, ma il ventilatore aggiunge una frequenza di sicurezza se il paziente non triggera. PC o PCV significa pressure-controlled ventilation: il ventilatore controlla la pressione inspiratoria e il volume corrente diventa una conseguenza della compliance, delle resistenze, dello sforzo del paziente e delle perdite. VC o VCV significa volume-controlled ventilation: il ventilatore controlla il volume corrente o il flusso inspiratorio programmato e la pressione necessaria varia in base alla meccanica respiratoria. PRVC significa pressure-regulated volume control: è una modalità a pressione con target di volume, nella quale il ventilatore modifica progressivamente la pressione inspiratoria per avvicinarsi al volume corrente impostato. VAPS o AVAPS indicano modalità di pressure support con volume assicurato o mediato nel tempo. SIMV-PC e SIMV-VC indicano synchronized intermittent mandatory ventilation con atti mandatori rispettivamente a pressione o a volume: sono modalità tipiche dei ventilatori da terapia intensiva e non vanno confuse con la NIV-PS spontanea usata nella maggior parte dei trial non invasivi acuti. Figura 3.1. SIMV-VC + PSV. Atti obbligati sincronizzati a volume controllato si alternano a respiri spontanei assistiti in pressione di supporto. Figura 3.1. SIMV-VC + PSV. Atti obbligati sincronizzati a volume controllato si alternano a respiri spontanei assistiti in pressione di supporto. Figura 3.2. SIMV-PC + PSV. Atti obbligati sincronizzati a pressione controllata si alternano a respiri spontanei assistiti in pressione di supporto. Figura 3.2. SIMV-PC + PSV. Atti obbligati sincronizzati a pressione controllata si alternano a respiri spontanei assistiti in pressione di supporto. Il valore chiave, quando si confrontano modalità a pressione e modalità a volume, è l’onda di flusso inspiratorio . Nella ventilazione a pressione controllata la pressione viene portata rapidamente al livello impostato e tende a rimanere costante durante l’inspirazione: il flusso è alto all’inizio e poi decresce progressivamente. Nella ventilazione a volume controllato classica il ventilatore eroga un flusso predefinito, spesso costante, per ottenere il volume corrente impostato; la pressione delle vie aeree cresce in funzione di resistenze, elastanza e andamento del flusso. La differenza non è solo grafica: un flusso iniziale elevato e decrescente può migliorare la sincronia nei pazienti che richiedono molto flusso all’inizio dell’inspirazione, mentre un flusso costante rende più prevedibile il volume erogato ma può essere meno confortevole se non viene regolato con attenzione [17]. Figura 3.3. PCV. La pressione inspiratoria è controllata; il flusso è tipicamente decrescente e il volume corrente dipende da compliance, resistenze, perdite e sforzo del paziente. Figura 3.3. PCV. La pressione inspiratoria è controllata; il flusso è tipicamente decrescente e il volume corrente dipende da compliance, resistenze, perdite e sforzo del paziente. Figura 3.4. VCV. Il volume e il flusso inspiratorio sono predefiniti; la pressione necessaria per erogarli diventa una conseguenza della meccanica respiratoria. Figura 3.4. VCV. Il volume e il flusso inspiratorio sono predefiniti; la pressione necessaria per erogarli diventa una conseguenza della meccanica respiratoria. Per questo, davanti a un acronimo, la domanda pratica non è solo “come si chiama la modalità?”, ma “che cosa controlla il ventilatore e che forma assume l’onda di flusso?”. Se il ventilatore controlla la pressione, il volume dipende dal paziente e dal circuito. Se controlla il volume o il flusso, la pressione diventa il risultato della meccanica respiratoria. Se utilizza un target di volume con controllo pressorio, il comportamento del singolo atto resta pressometrico, ma la pressione viene adattata nel tempo per inseguire il volume medio desiderato. Tabella 3.1. Nomenclatura pratica delle modalità ventilatorie. Il punto pratico: prima si decide se il problema è aerazione, ventilazione alveolare, sincronizzazione, sicurezza in apnea o variabilità del volume corrente; solo dopo si sceglie la modalità più coerente Dalla CPAP alla BiLevel: cosa cambia davvero La CPAP mantiene una pressione positiva continua durante tutto il ciclo respiratorio. Non aggiunge un supporto inspiratorio differenziale: il paziente respira spontaneamente sopra un livello pressorio costante. È coerente quando il problema dominante è aerazione, collasso alveolare, edema polmonare cardiogeno o atelettasia potenzialmente reclutabile. Figura 3.5. CPAP. La pressione resta positiva e sostanzialmente costante durante tutto il ciclo; il paziente respira spontaneamente sopra il livello di CPAP/PEEP. Figura 3.5. CPAP. La pressione resta positiva e sostanzialmente costante durante tutto il ciclo; il paziente respira spontaneamente sopra il livello di CPAP/PEEP. Figura 3.5. CPAP. La pressione resta positiva e sostanzialmente costante durante tutto il ciclo; il paziente respira spontaneamente sopra il livello di CPAP/PEEP. La ventilazione BiLevel, nelle sue diverse forme, lavora invece su due livelli: EPAP durante l’espirazione e IPAP durante l’inspirazione. La differenza tra IPAP ed EPAP è il pressure support. Se il paziente triggera l’atto, il ventilatore lo assiste; se la modalità prevede una frequenza di sicurezza, il ventilatore può erogare un atto temporizzato quando manca uno sforzo efficace entro il tempo previsto. Nella modalità S/T, cioè spontanea/temporizzata, il respiro spontaneo resta il comportamento principale; la componente temporizzata è una rete di sicurezza. Nel paziente tachipnoico e vigile non è il parametro che scarica la fatica. Diventa importante quando esiste rischio di apnea, ipoventilazione centrale, sonno, sedazione, encefalopatia o malattia neuromuscolare. Figura 3.6. Modalità NIV: tradurre il nome in fisiologia. La stessa modalità può essere presentata con nomi diversi, ma al letto del paziente bisogna sempre capire che cosa resta costante, che cosa varia e quale bersaglio fisiopatologico si vuole correggere. Figura 3.6. Modalità NIV: tradurre il nome in fisiologia. La stessa modalità può essere presentata con nomi diversi, ma al letto del paziente bisogna sempre capire che cosa resta costante, che cosa varia e quale bersaglio fisiopatologico si vuole correggere. Modalità con target di volume: logica e limiti Le modalità con target di volume non sono modalità “a volume puro”. PRVC, VAPS, AVAPS e modalità analoghe sono strumenti diversi, ma condividono una logica: il ventilatore usa un controllo prevalentemente pressometrico e modifica progressivamente la pressione inspiratoria entro limiti impostati per avvicinarsi a un volume target. Il singolo atto, quindi, non va letto come una VCV classica a flusso costante; va letto come un atto a pressione, spesso con flusso decrescente, guidato da un obiettivo di volume medio. Figura 3.7. PRVC. La modalità usa un controllo pressometrico adattato respiro per respiro per raggiungere un volume target, mantenendo un profilo di flusso decrescente. Figura 3.7. PRVC. La modalità usa un controllo pressometrico adattato respiro per respiro per raggiungere un volume target, mantenendo un profilo di flusso decrescente. Figura 3.8. VAPS/AVAPS. Il supporto pressorio varia progressivamente per avvicinare il volume corrente al target impostato; il monitoraggio resta indispensabile in presenza di perdite o meccanica variabile. Figura 3.8. VAPS/AVAPS. Il supporto pressorio varia progressivamente per avvicinare il volume corrente al target impostato; il monitoraggio resta indispensabile in presenza di perdite o meccanica variabile. Questa logica può essere utile quando il volume corrente tende a variare per posizione, sonno, drive, compliance, resistenze o perdite. È il motivo per cui la letteratura ha studiato queste modalità soprattutto nell’obesity hypoventilation syndrome (OHS), nell’ipoventilazione cronica e nei pazienti con meccanica respiratoria variabile. Nei pazienti con OHS, uno studio crossover ha mostrato una maggiore riduzione della PtcCO₂ con volume-assured pressure support rispetto alla S/T convenzionale, senza un chiaro vantaggio aggiuntivo su qualità del sonno o qualità di vita [11]. Un altro studio ha rilevato un migliore controllo dell’ipoventilazione notturna, ma a prezzo di maggiore percezione di perdite, “troppa aria” e peggior comfort soggettivo [12]. Negli studi randomizzati più ampi o con titolazione protocolizzata, il vantaggio rispetto al pressure support fisso è meno evidente. Nei pazienti con super-obesità e insufficienza respiratoria cronica, la modalità con target di volume non ha mostrato differenze clinicamente rilevanti rispetto alla pressure support fissa quando entrambe erano impostate con un protocollo rigoroso [13]. In pazienti con OHS stabile, l’aggiunta di auto-EPAP e target di volume ha prodotto risultati simili alla modalità S/T su gas exchange e qualità oggettiva del sonno, pur riducendo il tempo necessario al setup [14]. Nel paziente acuto con BPCO riacutizzata, le evidenze sono più limitate. Un piccolo trial pilota non ha dimostrato un miglioramento statisticamente significativo del comfort rispetto alla S/T convenzionale, pur mostrando miglioramenti clinici in entrambi i gruppi [15]. Per questo, in acuto, il target di volume non deve sostituire la valutazione clinica precoce: frequenza respiratoria, comfort, EGA, perdite, volumi, asincronie e lavoro muscolare restano decisivi. Auto-EPAP e modalità ibride Alcune modalità ibride non regolano solo il supporto inspiratorio, ma possono variare anche la pressione espiratoria per mantenere la pervietà delle alte vie aeree e ridurre eventi ostruttivi residui. Il concetto fisiologico è distinguere due bersagli: l’EPAP lavora su collasso espiratorio, ostruzione delle alte vie aeree e aerazione; il pressure support lavora sulla ventilazione alveolare e sulla PaCO₂. Questa distinzione è molto utile nell’OHS associata ad apnee ostruttive, dove ipoventilazione e collasso delle alte vie aeree coesistono. Una modalità ibrida può cercare di adattare EPAP agli eventi ostruttivi e pressure support al volume target. Non significa però che la modalità sia automaticamente superiore: nei trial clinici il risultato dipende dal fenotipo del paziente, dalla qualità del setup, dall’interfaccia, dalle perdite e dalla tolleranza. Circuito monotubo e bitubo Il circuito è parte del sistema ventilatorio. Non determina da solo il successo della NIV, ma modifica la misura dei volumi, la gestione delle perdite, la possibilità di rebreathing e il comportamento di trigger e cycling. Nel circuito monotubo inspirazione ed espirazione passano nello stesso tubo. L’eliminazione della CO₂ richiede una perdita intenzionale calibrata o una valvola espiratoria. È semplice, molto usato nella NIV, ma rende la lettura dei volumi e delle perdite più dipendente dagli algoritmi del ventilatore. Se la perdita intenzionale non è adeguata, o se il circuito e l’interfaccia non sono compatibili, può comparire rebreathing. Nel circuito bitubo la branca inspiratoria e quella espiratoria sono separate. Questo consente una misura più controllata del flusso espiratorio e del volume espirato in molte condizioni, ma richiede compatibilità tra ventilatore, circuito e interfaccia. Non è “migliore” in assoluto: è diverso. Nel paziente acuto conta soprattutto che il sistema scelto consenta una pressione stabile, perdite gestibili e sincronia accettabile. Figura 3.9. Circuiti NIV: monotubo e bitubo. Nel circuito monotubo inspirazione ed espirazione condividono la stessa linea e l’eliminazione della CO₂ dipende da perdita intenzionale o valvola. Nel circuito bitubo le branche inspiratoria ed espiratoria sono separate, con diversa gestione della misura del flusso espiratorio. Figura 3.9. Circuiti NIV: monotubo e bitubo. Nel circuito monotubo inspirazione ed espirazione condividono la stessa linea e l’eliminazione della CO₂ dipende da perdita intenzionale o valvola. Nel circuito bitubo le branche inspiratoria ed espiratoria sono separate, con diversa gestione della misura del flusso espiratorio. Compensazione delle perdite, trigger e cycling automatici La NIV è inevitabilmente una ventilazione con perdite. Il ventilatore deve distinguere il flusso che va al paziente dal flusso che esce dall’interfaccia o dal circuito. Per questo i ventilatori dedicati alla NIV utilizzano algoritmi di compensazione delle perdite e di stima del volume corrente. Questi dati sono utili, ma non vanno letti come misure perfette: diventano meno affidabili quando le perdite sono elevate, variabili o mal compensate. Gli algoritmi moderni possono adattare automaticamente soglie di trigger e cycling, stimare il flusso del paziente e correggere la baseline in presenza di leak. Il vantaggio pratico è ridurre la necessità di continue regolazioni manuali. Il limite è che l’automatismo non capisce il contesto clinico: autotrigger, sforzi inefficaci, cycling tardivo e asincronie possono comunque comparire, soprattutto con maschera instabile, auto-PEEP, ostruzione severa, drive elevato o sedazione. Per questo il display del ventilatore va interpretato insieme al paziente. Se il volume stimato sembra adeguato, ma il paziente resta tachipnoico, usa addominali, presenta TFdi elevata o peggiora all’EGA, la modalità non sta funzionando davvero. Se il LUS migliora ma il comfort peggiora e le perdite aumentano, la pressione può avere raggiunto un bersaglio polmonare ma aver compromesso la tolleranza del trial. Lettura pratica delle curve pressione, flusso e volume Le curve del ventilatore aiutano a capire la logica della modalità meglio del nome commerciale. La lettura minima deve sempre chiedere quale variabile è controllata, quale variabile è conseguenza della meccanica del paziente e quale forma assume l'onda di flusso inspiratorio. Le curve sono distribuite nei paragrafi pertinenti; titolo e numero restano nella didascalia, così la numerazione rimane modificabile anche se in futuro verranno aggiunte o rimosse altre immagini. Queste curve non servono per trasformare il manuale in un corso di ventilazione invasiva. Servono a rendere più chiara la logica: nelle modalità a pressione il flusso si adatta alla meccanica del paziente; nella VCV classica il flusso è impostato; nelle modalità ibride il ventilatore modifica la pressione per avvicinarsi a un volume target; nelle SIMV coesistono atti obbligati sincronizzati e atti spontanei assistiti. La domanda operativa resta sempre la stessa: la curva che vedo è coerente con il problema che voglio correggere, oppure sto solo cambiando etichetta alla modalità senza modificare davvero il bersaglio fisiopatologico? Come scegliere la modalità in pratica Situazione prevalente Modalità coerente Controllo prioritario Ipossia con collasso/reclutabilità e muscoli respiratori conservata CPAP o BiLevel con basso PS se serve comfort LUS, SpO₂/FiO₂, pressione arteriosa, comfort Ipercapnia con fatica dei muscoli respiratori NIV-PS / BiLevel S o S/T pH, PaCO₂, FR, diaframma, perdite, asincronie Ipoventilazione cronica, OHS, meccanica variabile nel sonno Bilevel S/T; considerare volume-targeted PS se Vt instabile TcCO₂/PaCO₂, Vt stimato, aderenza, comfort, leak OHS con eventi ostruttivi residui Bilevel con EPAP adeguata; possibile auto-EPAP se disponibile AHI residuo, EPAP necessaria, comfort, PaCO₂ Drive elevato, polmone disomogeneo, volumi alti in de novo hypoxemia Trial breve o escalation: non inseguire solo il volume FR, Vt stimato, LUS, EGA, segni di fallimento Tabella 3.2. Scelta pratica della modalità NIV in base al problema dominante. Le modalità con target di volume o auto-EPAP vanno considerate come strumenti di adattamento, non come scorciatoie per evitare il monitoraggio precoce. Ruolo dell’ecografia L’ecografia non sceglie la modalità al posto del clinico, ma aiuta a capire se la modalità scelta ha un bersaglio reale. Se il problema dominante è aerazione, il LUS deve mostrare perdita di aerazione, collasso, edema o atelettasia potenzialmente modificabile. Se il problema dominante è muscolare respiratorio, la valutazione di diaframma, intercostali e addominali diventa più rilevante del solo pattern polmonare. Nelle modalità con target di volume l’ecografia è particolarmente utile per evitare una falsa sicurezza: un volume medio apparentemente adeguato può coesistere con drive elevato, diaframma sovraccarico, addominali attivi e polmone disomogeneo. In questi casi il problema non è “aggiustare il target”, ma capire se il trial non invasivo è ancora appropriato. Errore da evitare L’errore più comune è scegliere o modificare una modalità perché sembra “più avanzata”, senza sapere quale bersaglio si vuole correggere. Aumentare pressioni, cambiare modalità o inseguire un volume target non significa automaticamente fornire un supporto più efficace. La tecnologia aiuta solo quando è chiaro il problema da trattare: aerazione, ventilazione alveolare, sincronia, sicurezza in apnea o variabilità del volume corrente. Messaggi chiave Il nome della modalità non basta: bisogna capire che cosa il ventilatore controlla e quale problema si vuole trattare. CPAP, BiLevel, NIV-PS, S/T, PCV, VCV, PRVC, AVAPS e SIMV non sono sinonimi. La CPAP mantiene una pressione continua ed è utile soprattutto quando il problema è aerazione o ossigenazione. La NIV-PS/BiLevel aggiunge un supporto inspiratorio ed è più indicata quando il problema è ipercapnia o fatica respiratoria. Nelle modalità a pressione il volume dipende dal paziente e dalla meccanica respiratoria; nelle modalità a volume la pressione diventa la conseguenza. Le modalità a target di volume possono aiutare, ma non sostituiscono il monitoraggio clinico, ventilatorio ed ecografico. Il circuito monotubo o bitubo influenza perdite, rebreathing, misura dei volumi e sincronia. Le curve di pressione, flusso e volume aiutano a capire meglio la modalità impostata. Bibliografia del Capitolo 3 1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016. 2. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7. 3. Hess DR. Noninvasive ventilation for acute respiratory failure. Respir Care. 2013;58(6):950-972. doi:10.4187/respcare.02319. 4. Vignaux L, Vargas F, Roeseler J, Tassaux D, Thille AW, Kossowsky MP, et al. Patient-ventilator asynchrony during non-invasive ventilation for acute respiratory failure: a multicenter study. Intensive Care Med. 2009;35(5):840-846. doi:10.1007/s00134-009-1416-5. 5. Calderini E, Confalonieri M, Puccio PG, Francavilla N, Stella L, Gregoretti C. Patient-ventilator asynchrony during noninvasive ventilation: the role of expiratory trigger. Intensive Care Med. 1999;25(7):662-667. doi:10.1007/s001340050927. 6. Carteaux G, Lyazidi A, Córdoba-Izquierdo A, Vignaux L, Jolliet P, Thille AW, et al. Patient-ventilator asynchrony during noninvasive ventilation: a bench and clinical ith average volume assured pressure support in patients with chronic obstructive pulmonary disease with acute exacerbation: a randomized pilot trial. Southwest Respir Crit Care Chron. 2019;7(30):19-28. doi:10.12746/swrccc.v7i30.560. 16. Saddi V, Thambipillay G, Pithers S, Moody M, Martin B, Blecher G, Teng A. Average volume-assured pressure support vs conventional bilevel pressure support in pediatric nocturnal hypoventilation: a case series. J Clin Sleep Med. 2021;17(5):925-930. doi:10.5664/jcsm.9084. 17. Natalini G. Ventilazione a volume controllato o ventilazione a pressione controllata? Quale la migliore? Ventilab. 27 novembre 2011. Risorsa didattica online: https://www.ventilab.it/2011/11/ventilazione-volume-controllato-o.html"},{"part":"Parte I — Fondamenti pratici di ventilazione non invasiva","title":"Capitolo 4. Interfacce, tolleranza e sicurezza del trial non invasivo","tag":"Capitolo 4","html":"\n<h3>Obiettivo pratico<\/h3>\n<p>La NIV non è fatta solo di pressioni. È fatta di paziente, ventilatore, circuito e interfaccia. Anche un settaggio corretto può fallire se la maschera perde, se il casco non è gestito bene, se il paziente è claustrofobico, se il <em>trigger<\/em> non riconosce lo sforzo, se il <em>cycling<\/em> è tardivo, se compaiono lesioni cutanee o se la distensione gastrica rende il supporto intollerabile.<\/p>\n<p>Questo capitolo ha un obiettivo molto pratico: scegliere l’interfaccia più adatta, riconoscere rapidamente i problemi di tolleranza e decidere quando il trial non invasivo non è più sicuro.<\/p>\n<p>Il messaggio centrale è: la NIV funziona solo se il supporto arriva davvero al paziente ed è tollerato abbastanza a lungo da produrre un effetto clinico.<\/p>\n<h3>Quando non iniziare o interrompere la NIV: controindicazioni pratiche<\/h3>\n<p>Prima di scegliere l’interfaccia bisogna stabilire se il trial non invasivo sia sicuro. La NIV richiede un paziente monitorabile, rivalutabile e in grado di tollerare il presidio. Quando queste condizioni mancano, il rischio principale non è “fallire la NIV”, ma ritardare una strategia più appropriata.<\/p>\n<p>Controindicazioni o condizioni di stop immediato: arresto respiratorio o gasping, instabilità emodinamica non controllata, shock non stabilizzato, incapacità di proteggere le vie aeree, vomito attivo o rischio elevato di aspirazione, secrezioni abbondanti non gestibili, emottisi significativa, trauma facciale o chirurgia recente che impediscono una tenuta sicura dell’interfaccia, pneumotorace non drenato quando clinicamente rilevante, rifiuto non superabile del paziente.<\/p>\n<p>Controindicazioni relative: agitazione, claustrofobia, ridotta collaborazione, sensorio fluttuante, grave dissincronia, lesioni cutanee importanti, recente chirurgia esofago-gastrica, dolore o distensione gastrica marcata. In questi casi un trial può essere considerato solo se il paziente è strettamente monitorato, con obiettivo chiaro e criteri di interruzione già definiti.<\/p>\n<p>La regola pratica è semplice: se non è possibile garantire protezione delle vie aeree, gestione delle secrezioni, correzione rapida dell’interfaccia e rivalutazione entro tempi brevi, la NIV non deve diventare una prova indefinita.<\/p>\n<h3>L’interfaccia è parte della terapia<\/h3>\n<p>L’interfaccia non è un accessorio. È – insieme al circuito - il collegamento tra il ventilatore e il paziente. Determina pressioni realmente erogate, perdite, comfort, sincronia, rischio di lesioni cutanee, possibilità di parlare, tossire, alimentarsi o comunicare.<\/p>\n<p>Una maschera oro-nasale può essere rapida ed efficace nell’acuto, ma può dare claustrofobia, dolore sul ponte nasale e perdite elevate. Il casco può essere molto utile nei trattamenti prolungati e nell’ipossiemia, ma richiede attenzione a flussi, rumore, spazio interno e asincronie. HFNC è spesso molto tollerata, ma non garantisce la stessa pressione positiva di CPAP o <em>full-face mask<\/em>. Una maschera nasale può essere adatta al cronico o al notturno, ma è meno indicata nel paziente acuto severo.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_19.png\" alt=\"Figura 4.1. Interfacce: scelta pratica e limiti principali. Le interfacce non sono equivalenti. La scelta deve tenere conto di problema respiratorio, urgenza, comfort, durata prevista del trattamento, rischio di perdite e necessità di pressione positiva stabile.\" loading=\"lazy\"><figcaption>Figura 4.1. Interfacce: scelta pratica e limiti principali. Le interfacce non sono equivalenti. La scelta deve tenere conto di problema respiratorio, urgenza, comfort, durata prevista del trattamento, rischio di perdite e necessità di pressione positiva stabile.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_19.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 4.1. Interfacce: scelta pratica e limiti principali. Le interfacce non sono equivalenti. La scelta deve tenere conto di problema respiratorio, urgenza, comfort, durata prevista del trattamento, rischio di perdite e necessità di pressione positiva stabile.<\/p>\n<h3>Maschera oro-nasale<\/h3>\n<p>È l’interfaccia più usata nella NIV acuta. Copre naso e bocca, permette di erogare rapidamente una pressione efficace ed è adatta alla maggior parte dei pazienti con insufficienza respiratoria ipercapnica o fatica respiratoria.<\/p>\n<p><strong>Punti di forza:<\/strong> disponibilità, rapidità, buona efficacia pressoria, semplicità di applicazione.<\/p>\n<p><strong>Problemi frequenti:<\/strong> claustrofobia, dolore, lesioni sul ponte nasale, perdite verso gli occhi, secchezza, difficoltà a parlare o espettorare.<\/p>\n<p><strong>Cosa controllare subito:<\/strong> tenuta senza eccessiva compressione, comfort, irritazione oculare, sincronizzazione, necessità di pause brevi e protezione della cute.<\/p>\n<h3>Full face mask<\/h3>\n<p>La maschera <em>full <\/em><em>face<\/em> copre l’intero volto. Può essere utile quando la maschera oro-nasale determina perdite difficili da correggere o lesioni cutanee localizzate. Distribuisce la pressione su una superficie più ampia e può migliorare la tolleranza in alcuni pazienti.<\/p>\n<p><strong>Punti di forza:<\/strong> migliore distribuzione della pressione, utile in caso di lesioni o perdite con maschera tradizionale.<\/p>\n<p><strong>Problemi frequenti:<\/strong> volume interno maggiore, possibile sensazione di isolamento, gestione delle perdite, necessità di buona esperienza infermieristica e medica.<\/p>\n<p><strong>Cosa controllare subito:<\/strong> comfort, perdite laterali, sincronia, eventuale aumento dello spazio morto percepito dal paziente.<\/p>\n<h3>Casco<\/h3>\n<p>Il casco consente di applicare CPAP o NIV senza contatto diretto con ponte nasale e guance. Può essere utile nei trattamenti prolungati, nei pazienti ipossiemici e quando si vuole ridurre il rischio di lesioni facciali. Nella letteratura il casco è stato studiato anche nei pazienti con insufficienza ipossiemica e ARDS, con risultati favorevoli in alcuni trial, ma richiede <em>setting<\/em> adeguato e personale esperto [6].<\/p>\n<p><strong>Punti di forza:<\/strong> migliore tolleranza prolungata, minori lesioni facciali, possibilità di mantenere PEEP/CPAP stabile.<\/p>\n<p><strong>Problemi frequenti: rumore, fastidio cervicale, volume interno elevato, asincronie, necessità di flussi adeguati, difficoltà di accesso rapido al volto.<\/strong><\/p>\n<p><strong>Cosa controllare subito:<\/strong> flusso, rumore, comfort, fissaggio, sincronia, CO₂ <em>rebreathing<\/em> se sistema non adeguato, possibilità di comunicazione.<\/p>\n<h3>HFNC come interfaccia-supporto<\/h3>\n<p>HFNC è insieme interfaccia e modalità di supporto; è generalmente molto ben tollerata: permette di parlare, alimentarsi (in casi selezionati), espettorare e comunicare meglio rispetto alle maschere.<\/p>\n<p><strong>Punti di forza:<\/strong> comfort, umidificazione, FiO₂ stabile, lavaggio dello spazio morto, minore claustrofobia.<\/p>\n<p><strong>Problemi frequenti: effetto pressorio variabile, rischio di sottostimare il fallimento, secchezza o fastidio se flusso/temperatura non sono tollerati.<\/strong><\/p>\n<p><strong>Cosa controllare<\/strong><strong>:<\/strong> frequenza respiratoria, SpO₂/FiO₂, ROX index, comfort, lavoro respiratorio, LUS se insufficienza ipossiemica.<\/p>\n<h3>Circuito monotubo e bitubo<\/h3>\n<p>Nel circuito monotubo inspirazione ed espirazione passano nello stesso tubo. L’eliminazione della CO₂ dipende dalla presenza di una perdita intenzionale calibrata o di una valvola espiratoria. Questo circuito è semplice e molto usato nella NIV, ma richiede attenzione a perdite, <em>rebreathing<\/em>, <em>trigger<\/em> e compensazione del ventilatore.<\/p>\n<p>Nel circuito bitubo inspirazione ed espirazione sono separate. Questo permette una misura più affidabile dei volumi espirati e una gestione più controllata del flusso espiratorio, ma non rende automaticamente migliore il supporto: conta la compatibilità tra ventilatore, circuito, interfaccia e paziente. Quando si confrontano ventilatori diversi, il circuito monotubo o bitubo può spiegare differenze di performance, soprattutto in presenza di perdite elevate.<\/p>\n<h3>Problemi relativi alle interfacce nel trial non invasivo<\/h3>\n<p>Le asincronie paziente-ventilatore sono uno dei motivi più frequenti di insuccesso pratico della NIV-PS. Non indicano sempre che il supporto sia “troppo basso”: spesso segnalano perdite eccessive, interfaccia non adeguata, trigger mal regolato, cycling non coerente con la meccanica del paziente, auto-PEEP o fastidio. Tali problemi vanno ricercati e corretti prima di aumentare i valori pressori [4,5].<\/p>\n<p>In pratica, l’asincronia va letta lungo il ciclo respiratorio. All’inizio dell’inspirazione bisogna capire se il ventilatore riconosce lo sforzo del paziente, individuando quindi le possibili asincronie di <em>trigger<\/em>. Durante l’inspirazione bisogna capire se il flusso erogato soddisfa la richiesta ventilatoria, individuando le possibili asincronie di flusso. Alla fine dell’inspirazione bisogna capire se il ventilatore termina l’assistenza quando il paziente vuole espirare, individuando le possibili asincronie di <em>cycling<\/em>.<\/p>\n<p><strong>Asincronie di <\/strong><strong><em>trigger<\/em><\/strong><\/p>\n<p><strong><em>Trigger<\/em><\/strong><strong> ritardato<\/strong>: il paziente inizia a inspirare, ma il ventilatore eroga il supporto con ritardo. Sulla curva di flusso o pressione si osserva uno sforzo iniziale non immediatamente seguito dall’atto assistito. Le cause più comuni sono: <em>trigger<\/em> poco sensibile, auto-PEEP, <em>drive<\/em> ridotto, sforzo debole o caratteristiche del ventilatore/circuito. In NIV bisogna controllare soprattutto perdite, interfaccia, <em>trigger<\/em> e possibile iperinflazione.<\/p>\n<p><strong>Sforzo inefficace<\/strong>: il paziente compie uno sforzo inspiratorio che non riesce ad attivare il ventilatore. Sulle curve si vedono piccole deflessioni o variazioni della pendenza del flusso espiratorio non seguite da un respiro meccanico. È frequente nei pazienti ostruttivi con auto-PEEP, nei pazienti deboli o quando il <em>pressure<\/em> <em>support<\/em> è eccessivo e riduce il <em>drive<\/em>. La correzione richiede: di ragionare su <em>trigger<\/em>, EPAP, tempo espiratorio, <em>pressure support<\/em>, perdite ed eventuale sedazione.<\/p>\n<p><strong>Autotrigger<\/strong>: il ventilatore eroga atti non richiesti dal paziente. In NIV è spesso legata a perdite, trigger troppo sensibile, acqua o secrezioni nel circuito, oscillazioni cardiache o compensazioni automatiche del ventilatore. Il segnale pratico è un atto meccanico senza una vera deflessione iniziale compatibile con lo sforzo inspiratorio. La correzione passa prima da ottimizzazione dell’interfaccia e riduzione delle perdite, poi dalla variazione della sensibilità del trigger.<\/p>\n<p><strong><em>Scheda 4.1A.<\/em><\/strong><em> Asincronie di trigger e di flusso nella NIV. Riconoscimento pratico sulle curve del ventilatore: ritardo di trigger, sforzo inefficace, autotrigger e asincronia di flusso.<\/em><\/p>\n<p><strong>Asincronia di flusso<\/strong><\/p>\n<p>L’asincronia di flusso compare quando il flusso erogato non soddisfa la richiesta del paziente. Clinicamente il paziente può apparire affamato d’aria, dispnoico, tachipnoico, agitato o con muscoli accessori ancora attivi. Nelle curve si può osservare una concavità o deformazione durante la pressurizzazione. Le cause più frequenti sono <em>drive<\/em> elevato, <em>rise <\/em><em>time<\/em> troppo lento, <em>pressure support<\/em> insufficiente o modalità non adeguata. La correzione non è automatica: può servire rendere più rapido il <em>rise time<\/em>, correggere il <em>pressure support<\/em>, migliorare comfort e interfaccia o riconoscere un trial non adeguato.<\/p>\n<p><strong>Asincronie<\/strong><strong> di <\/strong><strong><em>cycling<\/em><\/strong><\/p>\n<p><strong>Doppio <\/strong><strong><em>trigger<\/em><\/strong>: due atti meccanici vengono erogati durante un singolo sforzo inspiratorio. Spesso dipende da <em>cycling<\/em> troppo precoce, <em>pressure support<\/em> insufficiente, tempo inspiratorio troppo breve o <em>drive<\/em> elevato. È un segnale importante perché può aumentare il volume corrente complessivo e peggiorare il comfort.<\/p>\n<p><strong><em>Cycling<\/em><\/strong><strong> precoce<\/strong>: il ventilatore termina l’assistenza prima che lo sforzo inspiratorio del paziente sia concluso. Il paziente può continuare a inspirare, richiamare un secondo atto o restare dispnoico. In <em>pressure support<\/em> può dipendere da una soglia di <em>cycling<\/em> troppo alta, <em>pressure support <\/em>ridotto o tempo inspiratorio troppo breve. Può essere utile allungare l’assistenza riducendo la soglia di <em>cycling<\/em>, sempre controllando volumi, perdite e comfort.<\/p>\n<p><strong><em>Cycling<\/em><\/strong><strong> ritardato<\/strong>: il ventilatore continua a insufflare quando il paziente vorrebbe già espirare. È frequente in presenza di perdite, <em>pressure support<\/em> elevato, soglia di <em>cycling<\/em> troppo bassa o <em>rise time <\/em>non adeguato. Nel paziente ostruttivo può ridurre il tempo espiratorio e favorire iperinflazione dinamica. La correzione passa da riduzione delle perdite, riduzione del <em>pressure<\/em> <em>support<\/em> se eccessivo e anticipazione del <em>cycling<\/em>.<\/p>\n<p><strong><em>Scheda 4.1B.<\/em><\/strong><em> Asincronie terminali nella NIV. Fine dell’inspirazione e transizione espiratoria: doppio trigger, cycling precoce e cycling ritardato.<\/em><\/p>\n<h3>Complicanze extrapolmonari di una NIV non impostata correttamente<\/h3>\n<p>Distensione gastrica<\/p>\n<p>La distensione gastrica è spesso sottovalutata. Può peggiorare comfort, nausea, rischio di vomito, rischio di aspirazione e meccanica diaframmatica. È più probabile con pressioni elevate, perdite importanti, scarsa coordinazione paziente-ventilatore e ridotta tolleranza.<\/p>\n<p>Segni pratici:<\/p>\n<p>nausea;<\/p>\n<p>meteorismo;<\/p>\n<p>eruttazioni;<\/p>\n<p>dolore o tensione addominale;<\/p>\n<p>peggioramento del comfort;<\/p>\n<p>riduzione della tolleranza alla maschera.<\/p>\n<p><strong>Cosa fare<\/strong>: rivalutare pressioni, interfaccia, perdite, pause programmate, posizione del paziente e, se indicato, decompressione gastrica. In casi selezionati può essere utile anche l’ecografia gastrica, soprattutto se il quadro clinico è ambiguo.<\/p>\n<p><strong>Lesioni cutanee e comfort<\/strong><\/p>\n<p>Una NIV efficace ma non tollerata non è una NIV efficace. Il comfort deve essere considerato un parametro clinico. Dolore, claustrofobia, rumore, secchezza, pressione sul volto e impossibilità di comunicare possono trasformare un trattamento corretto in un fallimento.<\/p>\n<p>Le lesioni cutanee sono più frequenti su ponte nasale, zigomi e aree di appoggio. Vanno prevenute con scelta corretta dell’interfaccia, protezioni cutanee, controlli frequenti e alternanza dell’interfaccia quando possibile.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_20.png\" alt=\"Figura 4.2. Problemi precoci: cosa sospettare e cosa correggere. Perdite, fastidio, asincronie, distensione gastrica, lesioni cutanee e secchezza/secrezioni devono essere ricercati attivamente nelle prime fasi del trial non invasivo.\" loading=\"lazy\"><figcaption>Figura 4.2. Problemi precoci: cosa sospettare e cosa correggere. Perdite, fastidio, asincronie, distensione gastrica, lesioni cutanee e secchezza/secrezioni devono essere ricercati attivamente nelle prime fasi del trial non invasivo.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_20.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 4.2. Problemi precoci: cosa sospettare e cosa correggere. Perdite, fastidio, asincronie, distensione gastrica, lesioni cutanee e secchezza/secrezioni devono essere ricercati attivamente nelle prime fasi del trial non invasivo.<\/p>\n<h3>Errore da evitare<\/h3>\n<p>L’errore più frequente è interpretare il fallimento della NIV solo come “pressione insufficiente”. Molto spesso il problema è interfaccia, perdita elevata, asincronia, fastidio o indicazione sbagliata.<\/p>\n<p>Prima di aumentare le pressioni, bisogna chiedersi se il supporto stia arrivando davvero al paziente e se il paziente lo stia tollerando.<\/p>\n<h3>Bibliografia del Capitolo 4<\/h3>\n<p>1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.<\/p>\n<p>2. Hess DR. Noninvasive ventilation for acute respiratory failure. Respir Care. 2013;58(6):950-972. doi:10.4187/respcare
