.02319.<\/p>\n<p>3. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7.<\/p>\n<p>4. Vignaux L, Vargas F, Roeseler J, Tassaux D, Thille AW, Kossowsky MP, Brochard L, Jolliet P. Patient-ventilator asynchrony during non-invasive ventilation for acute respiratory failure: a multicenter study. Intensive Care Med. 2009;35(5):840-846. doi:10.1007/s00134-009-1416-5.<\/p>\n<p>5. Carteaux G, Lyazidi A, Córdoba-Izquierdo A, Vignaux L, Jolliet P, Thille AW, Brochard L. Patient-ventilator asynchrony during noninvasive ventilation: a bench and clinical study. Chest. 2012;142(2):367-376. doi:10.1378/chest.11-2279.<\/p>\n<p>6. Patel BK, Wolfe KS, Pohlman AS, Hall JB, Kress JP. Effect of noninvasive ventilation delivered by helmet vs face mask on the rate of endotracheal intubation in patients with acute respiratory distress syndrome: a randomized clinical trial. JAMA. 2016;315(22):2435-2441. doi:10.1001/jama.2016.6338.<\/p>\n<p>7. Oczkowski S, Ergan B, Bos L, Chatwin M, Ferrer M, Gregoretti C, et al. ERS clinical practice guidelines: high-flow nasal cannula in acute respiratory failure. Eur Respir J. 2022;59(4):2101574. doi:10.1183/13993003.01574-2021.<\/p>\n<p>8. Frat JP, Thille AW, Mercat A, Girault C, Ragot S, Perbet S, et al.; FLORALI Study Group. High-flow oxygen through nasal cannula in acute hypoxemic respiratory failure. N Engl J Med. 2015;372(23):2185-2196. doi:10.1056/NEJMoa1503326.<\/p>\n<p>9. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.<\/p>\n<p>10. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p>\n<p>11. Dres M, Rittayamai N, Brochard L. Monitoring patient-ventilator asynchrony. Curr Opin Crit Care. 2016;22(3):246-253. doi:10.1097/MCC.0000000000000307.<\/p>\n<p>12. Holanda MA, Vasconcelos Rdos S, Ferreira JC, Pinheiro BV. Patient-ventilator asynchrony. J Bras Pneumol. 2018;44(4):321-333. doi:10.1590/S1806-37562017000000185.<\/p>\n<p>13. Arnal JM. Monitoring Mechanical Ventilation Using Ventilator Waveforms. Cham: Springer International Publishing; 2018. ISBN:9783319586540.<\/p>","plain":"Obiettivo pratico La NIV non è fatta solo di pressioni. È fatta di paziente, ventilatore, circuito e interfaccia. Anche un settaggio corretto può fallire se la maschera perde, se il casco non è gestito bene, se il paziente è claustrofobico, se il trigger non riconosce lo sforzo, se il cycling è tardivo, se compaiono lesioni cutanee o se la distensione gastrica rende il supporto intollerabile. Questo capitolo ha un obiettivo molto pratico: scegliere l’interfaccia più adatta, riconoscere rapidamente i problemi di tolleranza e decidere quando il trial non invasivo non è più sicuro. Il messaggio centrale è: la NIV funziona solo se il supporto arriva davvero al paziente ed è tollerato abbastanza a lungo da produrre un effetto clinico. Quando non iniziare o interrompere la NIV: controindicazioni pratiche Prima di scegliere l’interfaccia bisogna stabilire se il trial non invasivo sia sicuro. La NIV richiede un paziente monitorabile, rivalutabile e in grado di tollerare il presidio. Quando queste condizioni mancano, il rischio principale non è “fallire la NIV”, ma ritardare una strategia più appropriata. Controindicazioni o condizioni di stop immediato: arresto respiratorio o gasping, instabilità emodinamica non controllata, shock non stabilizzato, incapacità di proteggere le vie aeree, vomito attivo o rischio elevato di aspirazione, secrezioni abbondanti non gestibili, emottisi significativa, trauma facciale o chirurgia recente che impediscono una tenuta sicura dell’interfaccia, pneumotorace non drenato quando clinicamente rilevante, rifiuto non superabile del paziente. Controindicazioni relative: agitazione, claustrofobia, ridotta collaborazione, sensorio fluttuante, grave dissincronia, lesioni cutanee importanti, recente chirurgia esofago-gastrica, dolore o distensione gastrica marcata. In questi casi un trial può essere considerato solo se il paziente è strettamente monitorato, con obiettivo chiaro e criteri di interruzione già definiti. La regola pratica è semplice: se non è possibile garantire protezione delle vie aeree, gestione delle secrezioni, correzione rapida dell’interfaccia e rivalutazione entro tempi brevi, la NIV non deve diventare una prova indefinita. L’interfaccia è parte della terapia L’interfaccia non è un accessorio. È – insieme al circuito - il collegamento tra il ventilatore e il paziente. Determina pressioni realmente erogate, perdite, comfort, sincronia, rischio di lesioni cutanee, possibilità di parlare, tossire, alimentarsi o comunicare. Una maschera oro-nasale può essere rapida ed efficace nell’acuto, ma può dare claustrofobia, dolore sul ponte nasale e perdite elevate. Il casco può essere molto utile nei trattamenti prolungati e nell’ipossiemia, ma richiede attenzione a flussi, rumore, spazio interno e asincronie. HFNC è spesso molto tollerata, ma non garantisce la stessa pressione positiva di CPAP o full-face mask . Una maschera nasale può essere adatta al cronico o al notturno, ma è meno indicata nel paziente acuto severo. Figura 4.1. Interfacce: scelta pratica e limiti principali. Le interfacce non sono equivalenti. La scelta deve tenere conto di problema respiratorio, urgenza, comfort, durata prevista del trattamento, rischio di perdite e necessità di pressione positiva stabile. Figura 4.1. Interfacce: scelta pratica e limiti principali. Le interfacce non sono equivalenti. La scelta deve tenere conto di problema respiratorio, urgenza, comfort, durata prevista del trattamento, rischio di perdite e necessità di pressione positiva stabile. Maschera oro-nasale È l’interfaccia più usata nella NIV acuta. Copre naso e bocca, permette di erogare rapidamente una pressione efficace ed è adatta alla maggior parte dei pazienti con insufficienza respiratoria ipercapnica o fatica respiratoria. Punti di forza: disponibilità, rapidità, buona efficacia pressoria, semplicità di applicazione. Problemi frequenti: claustrofobia, dolore, lesioni sul ponte nasale, perdite verso gli occhi, secchezza, difficoltà a parlare o espettorare. Cosa controllare subito: tenuta senza eccessiva compressione, comfort, irritazione oculare, sincronizzazione, necessità di pause brevi e protezione della cute. Full face mask La maschera full face copre l’intero volto. Può essere utile quando la maschera oro-nasale determina perdite difficili da correggere o lesioni cutanee localizzate. Distribuisce la pressione su una superficie più ampia e può migliorare la tolleranza in alcuni pazienti. Punti di forza: migliore distribuzione della pressione, utile in caso di lesioni o perdite con maschera tradizionale. Problemi frequenti: volume interno maggiore, possibile sensazione di isolamento, gestione delle perdite, necessità di buona esperienza infermieristica e medica. Cosa controllare subito: comfort, perdite laterali, sincronia, eventuale aumento dello spazio morto percepito dal paziente. Casco Il casco consente di applicare CPAP o NIV senza contatto diretto con ponte nasale e guance. Può essere utile nei trattamenti prolungati, nei pazienti ipossiemici e quando si vuole ridurre il rischio di lesioni facciali. Nella letteratura il casco è stato studiato anche nei pazienti con insufficienza ipossiemica e ARDS, con risultati favorevoli in alcuni trial, ma richiede setting adeguato e personale esperto [6]. Punti di forza: migliore tolleranza prolungata, minori lesioni facciali, possibilità di mantenere PEEP/CPAP stabile. Problemi frequenti: rumore, fastidio cervicale, volume interno elevato, asincronie, necessità di flussi adeguati, difficoltà di accesso rapido al volto. Cosa controllare subito: flusso, rumore, comfort, fissaggio, sincronia, CO₂ rebreathing se sistema non adeguato, possibilità di comunicazione. HFNC come interfaccia-supporto HFNC è insieme interfaccia e modalità di supporto; è generalmente molto ben tollerata: permette di parlare, alimentarsi (in casi selezionati), espettorare e comunicare meglio rispetto alle maschere. Punti di forza: comfort, umidificazione, FiO₂ stabile, lavaggio dello spazio morto, minore claustrofobia. Problemi frequenti: effetto pressorio variabile, rischio di sottostimare il fallimento, secchezza o fastidio se flusso/temperatura non sono tollerati. Cosa controllare : frequenza respiratoria, SpO₂/FiO₂, ROX index, comfort, lavoro respiratorio, LUS se insufficienza ipossiemica. Circuito monotubo e bitubo Nel circuito monotubo inspirazione ed espirazione passano nello stesso tubo. L’eliminazione della CO₂ dipende dalla presenza di una perdita intenzionale calibrata o di una valvola espiratoria. Questo circuito è semplice e molto usato nella NIV, ma richiede attenzione a perdite, rebreathing , trigger e compensazione del ventilatore. Nel circuito bitubo inspirazione ed espirazione sono separate. Questo permette una misura più affidabile dei volumi espirati e una gestione più controllata del flusso espiratorio, ma non rende automaticamente migliore il supporto: conta la compatibilità tra ventilatore, circuito, interfaccia e paziente. Quando si confrontano ventilatori diversi, il circuito monotubo o bitubo può spiegare differenze di performance, soprattutto in presenza di perdite elevate. Problemi relativi alle interfacce nel trial non invasivo Le asincronie paziente-ventilatore sono uno dei motivi più frequenti di insuccesso pratico della NIV-PS. Non indicano sempre che il supporto sia “troppo basso”: spesso segnalano perdite eccessive, interfaccia non adeguata, trigger mal regolato, cycling non coerente con la meccanica del paziente, auto-PEEP o fastidio. Tali problemi vanno ricercati e corretti prima di aumentare i valori pressori [4,5]. In pratica, l’asincronia va letta lungo il ciclo respiratorio. All’inizio dell’inspirazione bisogna capire se il ventilatore riconosce lo sforzo del paziente, individuando quindi le possibili asincronie di trigger . Durante l’inspirazione bisogna capire se il flusso erogato soddisfa la richiesta ventilatoria, individuando le possibili asincronie di flusso. Alla fine dell’inspirazione bisogna capire se il ventilatore termina l’assistenza quando il paziente vuole espirare, individuando le possibili asincronie di cycling . Asincronie di trigger Trigger ritardato : il paziente inizia a inspirare, ma il ventilatore eroga il supporto con ritardo. Sulla curva di flusso o pressione si osserva uno sforzo iniziale non immediatamente seguito dall’atto assistito. Le cause più comuni sono: trigger poco sensibile, auto-PEEP, drive ridotto, sforzo debole o caratteristiche del ventilatore/circuito. In NIV bisogna controllare soprattutto perdite, interfaccia, trigger e possibile iperinflazione. Sforzo inefficace : il paziente compie uno sforzo inspiratorio che non riesce ad attivare il ventilatore. Sulle curve si vedono piccole deflessioni o variazioni della pendenza del flusso espiratorio non seguite da un respiro meccanico. È frequente nei pazienti ostruttivi con auto-PEEP, nei pazienti deboli o quando il pressure support è eccessivo e riduce il drive . La correzione richiede: di ragionare su trigger , EPAP, tempo espiratorio, pressure support , perdite ed eventuale sedazione. Autotrigger : il ventilatore eroga atti non richiesti dal paziente. In NIV è spesso legata a perdite, trigger troppo sensibile, acqua o secrezioni nel circuito, oscillazioni cardiache o compensazioni automatiche del ventilatore. Il segnale pratico è un atto meccanico senza una vera deflessione iniziale compatibile con lo sforzo inspiratorio. La correzione passa prima da ottimizzazione dell’interfaccia e riduzione delle perdite, poi dalla variazione della sensibilità del trigger. Scheda 4.1A. Asincronie di trigger e di flusso nella NIV. Riconoscimento pratico sulle curve del ventilatore: ritardo di trigger, sforzo inefficace, autotrigger e asincronia di flusso. Asincronia di flusso L’asincronia di flusso compare quando il flusso erogato non soddisfa la richiesta del paziente. Clinicamente il paziente può apparire affamato d’aria, dispnoico, tachipnoico, agitato o con muscoli accessori ancora attivi. Nelle curve si può osservare una concavità o deformazione durante la pressurizzazione. Le cause più frequenti sono drive elevato, rise time troppo lento, pressure support insufficiente o modalità non adeguata. La correzione non è automatica: può servire rendere più rapido il rise time , correggere il pressure support , migliorare comfort e interfaccia o riconoscere un trial non adeguato. Asincronie di cycling Doppio trigger : due atti meccanici vengono erogati durante un singolo sforzo inspiratorio. Spesso dipende da cycling troppo precoce, pressure support insufficiente, tempo inspiratorio troppo breve o drive elevato. È un segnale importante perché può aumentare il volume corrente complessivo e peggiorare il comfort. Cycling precoce : il ventilatore termina l’assistenza prima che lo sforzo inspiratorio del paziente sia concluso. Il paziente può continuare a inspirare, richiamare un secondo atto o restare dispnoico. In pressure support può dipendere da una soglia di cycling troppo alta, pressure support ridotto o tempo inspiratorio troppo breve. Può essere utile allungare l’assistenza riducendo la soglia di cycling , sempre controllando volumi, perdite e comfort. Cycling ritardato : il ventilatore continua a insufflare quando il paziente vorrebbe già espirare. È frequente in presenza di perdite, pressure support elevato, soglia di cycling troppo bassa o rise time non adeguato. Nel paziente ostruttivo può ridurre il tempo espiratorio e favorire iperinflazione dinamica. La correzione passa da riduzione delle perdite, riduzione del pressure support se eccessivo e anticipazione del cycling . Scheda 4.1B. Asincronie terminali nella NIV. Fine dell’inspirazione e transizione espiratoria: doppio trigger, cycling precoce e cycling ritardato. Complicanze extrapolmonari di una NIV non impostata correttamente Distensione gastrica La distensione gastrica è spesso sottovalutata. Può peggiorare comfort, nausea, rischio di vomito, rischio di aspirazione e meccanica diaframmatica. È più probabile con pressioni elevate, perdite importanti, scarsa coordinazione paziente-ventilatore e ridotta tolleranza. Segni pratici: nausea; meteorismo; eruttazioni; dolore o tensione addominale; peggioramento del comfort; riduzione della tolleranza alla maschera. Cosa fare : rivalutare pressioni, interfaccia, perdite, pause programmate, posizione del paziente e, se indicato, decompressione gastrica. In casi selezionati può essere utile anche l’ecografia gastrica, soprattutto se il quadro clinico è ambiguo. Lesioni cutanee e comfort Una NIV efficace ma non tollerata non è una NIV efficace. Il comfort deve essere considerato un parametro clinico. Dolore, claustrofobia, rumore, secchezza, pressione sul volto e impossibilità di comunicare possono trasformare un trattamento corretto in un fallimento. Le lesioni cutanee sono più frequenti su ponte nasale, zigomi e aree di appoggio. Vanno prevenute con scelta corretta dell’interfaccia, protezioni cutanee, controlli frequenti e alternanza dell’interfaccia quando possibile. Figura 4.2. Problemi precoci: cosa sospettare e cosa correggere. Perdite, fastidio, asincronie, distensione gastrica, lesioni cutanee e secchezza/secrezioni devono essere ricercati attivamente nelle prime fasi del trial non invasivo. Figura 4.2. Problemi precoci: cosa sospettare e cosa correggere. Perdite, fastidio, asincronie, distensione gastrica, lesioni cutanee e secchezza/secrezioni devono essere ricercati attivamente nelle prime fasi del trial non invasivo. Errore da evitare L’errore più frequente è interpretare il fallimento della NIV solo come “pressione insufficiente”. Molto spesso il problema è interfaccia, perdita elevata, asincronia, fastidio o indicazione sbagliata. Prima di aumentare le pressioni, bisogna chiedersi se il supporto stia arrivando davvero al paziente e se il paziente lo stia tollerando. Bibliografia del Capitolo 4 1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016. 2. Hess DR. Noninvasive ventilation for acute respiratory failure. Respir Care. 2013;58(6):950-972. doi:10.4187/respcare.02319. 3. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7. 4. Vignaux L, Vargas F, Roeseler J, Tassaux D, Thille AW, Kossowsky MP, Brochard L, Jolliet P. Patient-ventilator asynchrony during non-invasive ventilation for acute respiratory failure: a multicenter study. Intensive Care Med. 2009;35(5):840-846. doi:10.1007/s00134-009-1416-5. 5. Carteaux G, Lyazidi A, Córdoba-Izquierdo A, Vignaux L, Jolliet P, Thille AW, Brochard L. Patient-ventilator asynchrony during noninvasive ventilation: a bench and clinical study. Chest. 2012;142(2):367-376. doi:10.1378/chest.11-2279. 6. Patel BK, Wolfe KS, Pohlman AS, Hall JB, Kress JP. Effect of noninvasive ventilation delivered by helmet vs face mask on the rate of endotracheal intubation in patients with acute respiratory distress syndrome: a randomized clinical trial. JAMA. 2016;315(22):2435-2441. doi:10.1001/jama.2016.6338. 7. Oczkowski S, Ergan B, Bos L, Chatwin M, Ferrer M, Gregoretti C, et al. ERS clinical practice guidelines: high-flow nasal cannula in acute respiratory failure. Eur Respir J. 2022;59(4):2101574. doi:10.1183/13993003.01574-2021. 8. Frat JP, Thille AW, Mercat A, Girault C, Ragot S, Perbet S, et al.; FLORALI Study Group. High-flow oxygen through nasal cannula in acute hypoxemic respiratory failure. N Engl J Med. 2015;372(23):2185-2196. doi:10.1056/NEJMoa1503326. 9. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379. 10. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558. 11. Dres M, Rittayamai N, Brochard L. Monitoring patient-ventilator asynchrony. Curr Opin Crit Care. 2016;22(3):246-253. doi:10.1097/MCC.0000000000000307. 12. Holanda MA, Vasconcelos Rdos S, Ferreira JC, Pinheiro BV. Patient-ventilator asynchrony. J Bras Pneumol. 2018;44(4):321-333. doi:10.1590/S1806-37562017000000185. 13. Arnal JM. Monitoring Mechanical Ventilation Using Ventilator Waveforms. Cham: Springer International Publishing; 2018. ISBN:9783319586540."},{"part":"Parte II — L’ecografia applicata alla NIV: il metodo AdET","title":"Capitolo 5. Cosa vede la sonda, cosa significa, cosa cambia","tag":"Capitolo 5","html":"\n<h3>Obiettivo pratico<\/h3>\n<p>Questo capitolo introduce il metodo AdET (Accademia di Ecografia Toracica) applicato alla NIV. L’ecografia non deve essere usata solo per “vedere qualcosa” o per confermare una diagnosi già sospettata. Deve diventare uno strumento operativo: il reperto osservato deve orientare una decisione sulla modalità di supporto, sui parametri, sulla posizione del paziente, sulla necessità di correggere l’interfaccia o sulla soglia di <em>escalation<\/em>.<\/p>\n<p>Il filo conduttore è:<\/p>\n<p>cosa vede la sonda → cosa significa → cosa cambia nella NIV.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_21.png\" alt=\"Figura 21\" loading=\"lazy\"><figcaption>Figura 21<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_21.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p>Questa impostazione evita due errori frequenti. Il primo è descrivere i segni ecografici senza tradurli in una scelta clinica. Il secondo è usare l’ecografia come un punteggio isolato, senza considerare distribuzione, qualità del <em>pattern<\/em>, contesto clinico e risposta nel tempo.<\/p>\n<p class=\"manualCaptionText\">Figura 5.1. Metodo ADET applicato alla NIV. Ogni reperto ecografico deve essere collegato a una interpretazione fisiopatologica e a una decisione pratica sul supporto respiratorio.<\/p>\n<h3>AdET come framework: cosa aggiunge al LUS tradizionale<\/h3>\n<p>In questo manuale AdET non viene usato come semplice marchio dell’Accademia di Ecografia Toracica, ma come framework operativo. Non sostituisce i protocolli LUS già validati e non pretende di essere uno score alternativo. Serve a trasformare il reperto ecografico in una decisione sul supporto respiratorio.<\/p>\n<p>Il percorso AdET può essere riassunto in quattro passaggi: 1) descrivere correttamente il segno ecografico; 2) interpretarlo alla luce della fisica dell’immagine e delle “trappole acustiche”; 3) tradurlo in un fenotipo fisiopatologico; 4) decidere se e come modificare supporto, parametri, posizione del paziente, terapia causale o soglia di escalation.<\/p>\n<p>Rispetto al BLUE protocol, che organizza il LUS come algoritmo diagnostico dell’insufficienza respiratoria acuta, AdET ha un obiettivo più gestionale: collegare il segno alla scelta del supporto. Rispetto alle raccomandazioni di Volpicelli, che standardizzano segni, indicazioni e appropriatezza del POCUS polmonare, AdET insiste sulla lettura qualitativa del segno e sulla sua conseguenza pratica. Rispetto al LUS score e alle sue modifiche, utili per quantificare la perdita di aerazione e seguirne il trend, AdET aggiunge una domanda operativa: che cosa cambia nella NIV?<\/p>\n<p>Il concetto di “trappola acustica” nasce da questa prospettiva. Gli artefatti verticali non sono considerati solo linee da contare, ma effetti acustici generati dall’interazione tra ultrasuoni, aria, liquido, tessuto e geometria subpleurica. Per questo, nel metodo AdET, distribuzione, regolarità della linea pleurica, coalescenza, attenuazione, aree di risparmio e consolidamenti contano quanto il numero di artefatti.<\/p>\n<p>Formula sintetica del metodo: cosa vede la sonda → perché lo vedo → quale fenotipo suggerisce → quale decisione modifica.<\/p>\n<h3>La sonda non sostituisce il ragionamento<\/h3>\n<p>La sonda mostra la superficie pleuro-polmonare esplorabile, la presenza o assenza di <em>sliding<\/em>, la qualità della linea pleurica, gli artefatti verticali, i consolidamenti, i versamenti e, con finestre dedicate, il diaframma e il cuore. Questi dati sono immediati, ripetibili e ottenibili al letto del paziente.<\/p>\n<p>Il limite è altrettanto importante: l’ecografia non vede tutto il polmone. Vede ciò che arriva alla pleura o modifica l’interfaccia acustica periferica. Per questo il reperto deve essere sempre interpretato insieme a clinica, EGA, dati letti sul ventilatore e andamento nel tempo.<\/p>\n<p>Messaggio pratico:<\/p>\n<p>esiste un bersaglio per CPAP o EPAP?<\/p>\n<p>il problema è più polmonare o più muscolare?<\/p>\n<p>il diaframma sta lavorando troppo o troppo poco?<\/p>\n<p>il supporto sta producendo ri-aerazione?<\/p>\n<p>il miglioramento della SpO₂ è reale o solo apparente?<\/p>\n<p>sto prolungando un trial non invasivo senza risposta?<\/p>\n<h3>Gli artefatti verticali non sono solo “B-<em>lines<\/em>”<\/h3>\n<p>Nella filosofia AdET, gli artefatti verticali non vanno trattati come semplici linee da contare. Sono informazioni sulla superficie polmonare periferica e sulla geometria acustica del parenchima subpleurico. Il termine “B-<em>lines<\/em>” è utile perché molto diffuso, ma può diventare riduttivo se porta a ignorare distribuzione, qualità della linea pleurica, coalescenza, aree di risparmio, consolidamenti e contesto clinico.<\/p>\n<p>In questo testo useremo il termine pratico “artefatti verticali”, mantenendo il riferimento alle B-lines quando necessario. La descrizione dell’esame ecografico dovrà sempre specificare:<\/p>\n<p>distribuzione: focale, diffusa, omogenea o disomogenea;<\/p>\n<p>caratteristiche della linea pleurica: regolare o irregolare;<\/p>\n<p>presenza di aree di risparmio;<\/p>\n<p>presenza di consolidamenti subpleurici;<\/p>\n<p><em>sliding<\/em>: conservato o assente;<\/p>\n<p>risposta dopo variazioni di supporto, posizione o terapia.<\/p>\n<p><strong>Trappole acustiche: perché gli artefatti verticali non vanno solo contati<\/strong><\/p>\n<p>Nella posizione AdET sugli artefatti verticali, il concetto di trappola acustica aiuta a spiegare perché l’aspetto degli artefatti dipenda dal rapporto tra tessuto e aria nella regione subpleurica, dalla geometria degli spazi aerei periferici, dal contenuto della trappola e dalle impostazioni di <em>imaging<\/em>. Non tutte le linee verticali hanno lo stesso significato. Gli ultrasuoni possono entrare in piccoli canali o “microbuchi acustici” tra interfacce molto riflettenti e rimanere intrappolati, generando segnali verticali diversi per luminosità, attenuazione e regolarità.<\/p>\n<p>Artefatti verticali brillanti, regolari, diffusi e associati a linea pleurica liscia orientano verso un pattern più ordinato. Artefatti disomogenei, attenuati, <em>patchy<\/em>, associati a pleura irregolare e consolidamenti orientano verso un sovvertimento periferico, più disordinato.<\/p>\n<h3>LUS score: utile, ma non autosufficiente<\/h3>\n<p>Il LUS score permette di trasformare la perdita di aerazione in un numero. Nella forma più usata, ogni regione esplorata riceve un punteggio da 0 a 3:<\/p>\n<table class=\"manualTable\"><tr><th>Score<\/th><th>Reperto pratico<\/th><th>Significato generale<\/th><\/tr>\n<tr><td>0<\/td><td>pattern A, sliding presente<\/td><td>aerazione conservata<\/td><\/tr>\n<tr><td>1<\/td><td>artefatti verticali limitati<\/td><td>perdita lieve di aerazione<\/td><\/tr>\n<tr><td>2<\/td><td>artefatti verticali confluenti o estesi<\/td><td>perdita severa di aerazione<\/td><\/tr>\n<tr><td>3<\/td><td>consolidamento<\/td><td>polmone non aerato/deaerato<\/td><\/tr><\/table>\n<p class=\"manualCaptionText\">Tabella 5.1. LUS score: punteggio della perdita di aerazione.<\/p>\n<p>Il valore del LUS score non è solo nel numero assoluto. È soprattutto nella <strong>variazione nel tempo<\/strong>. Un LUS score che migliora dopo CPAP/EPAP, pronazione, posizione seduta, fisioterapia o terapia diuretica suggerisce che il trattamento sta modificando positivamente il bersaglio. Un LUS invariato, nonostante pressioni crescenti, indica scarsa reclutabilità oppure un meccanismo non correggibile incrementando le pressioni di ventilazione.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_22.png\" alt=\"Figura 5.2. Esempi ecografici: LUS score 0–3. Esempi didattici di pattern ecografico progressivo: polmone aerato, perdita lieve di aerazione, perdita severa di aerazione e consolidamento. Il punteggio va sempre letto insieme a distribuzione, linea pleurica e contesto clinico. Immagini adattate dal materiale didattico ADET dell’autore.\" loading=\"lazy\"><figcaption>Figura 5.2. Esempi ecografici: LUS score 0–3. Esempi didattici di pattern ecografico progressivo: polmone aerato, perdita lieve di aerazione, perdita severa di aerazione e consolidamento. Il punteggio va sempre letto insieme a distribuzione, linea pleurica e contesto clinico. Immagini adattate dal materiale didattico ADET dell’autore.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_22.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 5.2. Esempi ecografici: LUS score 0–3. Esempi didattici di pattern ecografico progressivo: polmone aerato, perdita lieve di aerazione, perdita severa di aerazione e consolidamento. Il punteggio va sempre letto insieme a distribuzione, linea pleurica e contesto clinico. Immagini adattate dal materiale didattico ADET dell’autore.<\/p>\n<p>Ordine e disordine: la parte qualitativa del LUS<\/p>\n<p>Due pazienti possono avere lo stesso LUS score e fisiopatologie molto diverse. Per questo il punteggio deve essere affiancato da una lettura qualitativa.<\/p>\n<p>Un pattern <strong>ordinato<\/strong> è relativamente omogeneo, bilaterale, simmetrico, con linea pleurica conservata o poco alterata. In un contesto clinico coerente, può suggerire congestione cardiogena o aumento dell’acqua extravascolare polmonare. Qui CPAP/EPAP e terapia medica possono avere un bersaglio chiaro.<\/p>\n<p>Un pattern <strong>disordinato<\/strong> è irregolare, <em>patchy<\/em>, con aree di risparmio, pleura frammentata, consolidamenti subpleurici, distribuzione non uniforme. Questo pattern orienta verso polmonite, ARDS-like, trauma, patologia infiammatoria o perdita di aerazione non omogenea. In questo caso la NIV deve essere intrapresa con prudenza, perché il rischio non è solo l’ipossiemia, ma il mantenimento di un alto <em>drive<\/em> respiratorio su un polmone disomogeneo, con rischio di amplificazione del danno polmonare stesso<\/p>\n<table class=\"manualTable\"><tr><th>Messaggio operativo. il LUS score dice “quanto” polmone appare alterato. La qualità del pattern aiuta a capire “che tipo” di problema stiamo trattando.<\/th><\/tr><\/table>\n<p><strong>Consolidamento: non basta dire “score 3”<\/strong><\/p>\n<p>Il consolidamento è uno dei reperti più importanti perché cambia il bersaglio della NIV. Un’area consolidata può rappresentare polmonite, atelettasia, compressione da versamento, ostruzione bronchiale, secrezioni o combinazioni di questi meccanismi; ognuno di questi meccanismi richiede un trattamento specifico.<\/p>\n<p>Per questo, davanti a un consolidamento, la domanda non è solo “quanta PEEP serve?”. Prima bisogna chiedersi:<\/p>\n<p>il broncogramma è dinamico? O è statico?<\/p>\n<p>ci sono segni di bronchi pieni di liquido?<\/p>\n<p>il consolidamento è declive e potenzialmente reclutabile?<\/p>\n<p>c’è versamento pleurico compressivo?<\/p>\n<p>il paziente ha secrezioni non gestibili?<\/p>\n<p>Il broncogramma aereo dinamico suggerisce aria in movimento nelle vie aeree e bronchi pervi. Il broncogramma statico orienta verso aria intrappolata e possibile atelettasia ostruttiva o riassorbimento. Il broncogramma fluido suggerisce vie aeree piene di liquido o secrezioni, spesso in addensamenti ostruttivi. Queste differenze hanno un impatto pratico: la pressione positiva può aiutare solo se esiste reclutabilità, ma non risolve da sola l’ostruzione di un bronco ostruito o pieno di secrezioni.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_23.png\" alt=\"Figura 5.3. Consolidamento: immagini ecografiche e significato operativo. Il broncogramma statico e dinamico, insieme a C-lines, shred sign ed epatizzazione, aiuta a interpretare il consolidamento e a stimare il ruolo atteso della pressione positiva. Immagini ecografiche tratte dal materiale fornito dall’autore e impaginate a scopo didattico.\" loading=\"lazy\"><figcaption>Figura 5.3. Consolidamento: immagini ecografiche e significato operativo. Il broncogramma statico e dinamico, insieme a C-lines, shred sign ed epatizzazione, aiuta a interpretare il consolidamento e a stimare il ruolo atteso della pressione positiva. Immagini ecografiche tratte dal materiale fornito dall’autore e impaginate a scopo didattico.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_23.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 5.3. Consolidamento: immagini ecografiche e significato operativo. Il broncogramma statico e dinamico, insieme a C-lines, shred sign ed epatizzazione, aiuta a interpretare il consolidamento e a stimare il ruolo atteso della pressione positiva. Immagini ecografiche tratte dal materiale fornito dall’autore e impaginate a scopo didattico.<\/p>\n<h3>Dal reperto alla decisione ventilatoria<\/h3>\n<p>Il metodo AdET applicato alla NIV richiede una traduzione immediata del reperto ecografico.<\/p>\n<p>Un pattern A prevalente in un paziente ipercapnico orienta più verso un problema muscolare respiratorio che verso un problema di reclutamento. In questo caso la NIV-PS ha un razionale più forte della sola CPAP, e l’ecografia del diaframma può essere più informativa del conteggio degli artefatti verticali.<\/p>\n<p>Artefatti verticali diffusi e ordinati, in un paziente con quadro clinico di quadro cardiogeno, orientano verso CPAP/EPAP e terapia di decongestione. La risposta attesa è: riduzione degli artefatti e miglioramento dell’aerazione nel tempo.<\/p>\n<p>Un pattern disordinato, con pleura irregolare e consolidamenti, impone cautela: il supporto non invasivo può essere tentato solo se il paziente è stabile, collaborante e rivalutabile rapidamente. Se il <em>drive<\/em> respiratorio resta alto e il LUS score peggiora, non bisogna prolungare oltre il trial.<\/p>\n<p>Un versamento pleurico significativo o uno pneumotorace sospetto modificano completamente la strategia. Prima di aumentare le pressioni o insistere con la NIV, bisogna chiarire il reperto e trattare la causa, quando indicato.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_24.png\" alt=\"Figura 5.4. Dal reperto alla scelta ventilatoria. Sintesi operativa del passaggio dal reperto ecografico alla decisione sul supporto non invasivo.\" loading=\"lazy\"><figcaption>Figura 5.4. Dal reperto alla scelta ventilatoria. Sintesi operativa del passaggio dal reperto ecografico alla decisione sul supporto non invasivo.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_24.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 5.4. Dal reperto alla scelta ventilatoria. Sintesi operativa del passaggio dal reperto ecografico alla decisione sul supporto non invasivo.<\/p>\n<h3><em>Timing<\/em> dell’ecografia nel percorso NIV<\/h3>\n<p>L’ecografia può essere usata efficacemente in tre momenti.<\/p>\n<p><strong>Prima <\/strong><strong>di iniziare il <\/strong><strong>supporto<\/strong>, serve a definire il fenotipo: polmone aerato/iperinflato, congesto, disordinato, consolidato, compresso da versamento, complicato da pneumotorace, o associato a muscoli respiratori inefficiente.<\/p>\n<p><strong>Dopo pochi minuti dall’inizio del supporto, d<\/strong><strong>urante il settaggio<\/strong> serve a capire se il parametro impostato o modificato ha centrato il bersaglio: EPAP/CPAP per perdita di aerazione o congestione; <em>pressure<\/em> <em>support<\/em> per lavoro respiratorio e ventilazione alveolare; posizione per atelettasie declivi; interfaccia se il problema è tecnico.<\/p>\n<p><strong>Durante la rivalutazione<\/strong>, serve a distinguere risposta reale e risposta apparente. La SpO₂ può migliorare anche se il polmone resta disomogeneo e il diaframma continua a lavorare troppo. Il LUS seriale e la valutazione dei muscoli respiratori aiutano a decidere se continuare, correggere o interrompere il trial.<\/p>\n<h3>Errore da evitare<\/h3>\n<p>L’errore più frequente è fermarsi alla descrizione del segno ecografico: “ci sono B-lines”, “c’è consolidamento”, “il LUS è alto”. Questo non basta. È necessario chiedersi: che cosa cambia nella gestione?<\/p>\n<p>Un reperto ecografico che non modifica diagnosi, impostazioni, monitoraggio o soglia di escalation resta un’informazione incompleta.<\/p>\n<h3>Bibliografia del Capitolo 5<\/h3>\n<p>1. Smargiassi A, Zanforlin A, Perrone T, Buonsenso D, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Inchingolo R. Vertical artifacts as lung ultrasound signs: trick or trap? Part 2: an Accademia di Ecografia Toracica position paper on B-lines and sonographic interstitial syndrome. J Ultrasound Med. 2023;42(2):279-292. doi:10.1002/jum.16116.<\/p>\n<p>2. Inchingolo R, Zanforlin A, Buonsenso D, Perrone T, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Marchetti G, Carlucci P, Radovanovic D, Lohmeyer FM, Smargiassi A. Lung ultrasound signs: the beginning. Part 3: an Accademia di Ecografia Toracica comprehensive review on ultrasonographic signs and real needs. J Ultrasound Med. 2024;43(4):629-641. doi:10.1002/jum.16397.<\/p>\n<p>3. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p>\n<p>4. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4.<\/p>\n<p>5. Lichtenstein D, Mezière G, Seitz J. The dynamic air bronchogram: a lung ultrasound sign of alveolar consolidation ruling out atelectasis. Chest. 2009;135(6):1421-1425. doi:10.1378/chest.08-2281.<\/p>\n<p>6. Bouhemad B, Brisson H, Le-Guen M, Arbelot C, Lu Q, Rouby JJ. Bedside ultrasound assessment of positive end-expiratory pressure-induced lung recruitment. Am J Respir Crit Care Med. 2011;183(3):341-347. doi:10.1164/rccm.201003-0369OC.<\/p>\n<p>7. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI.<\/p>","plain":"Obiettivo pratico Questo capitolo introduce il metodo AdET (Accademia di Ecografia Toracica) applicato alla NIV. L’ecografia non deve essere usata solo per “vedere qualcosa” o per confermare una diagnosi già sospettata. Deve diventare uno strumento operativo: il reperto osservato deve orientare una decisione sulla modalità di supporto, sui parametri, sulla posizione del paziente, sulla necessità di correggere l’interfaccia o sulla soglia di escalation . Il filo conduttore è: cosa vede la sonda → cosa significa → cosa cambia nella NIV. Figura 21 Questa impostazione evita due errori frequenti. Il primo è descrivere i segni ecografici senza tradurli in una scelta clinica. Il secondo è usare l’ecografia come un punteggio isolato, senza considerare distribuzione, qualità del pattern , contesto clinico e risposta nel tempo. Figura 5.1. Metodo ADET applicato alla NIV. Ogni reperto ecografico deve essere collegato a una interpretazione fisiopatologica e a una decisione pratica sul supporto respiratorio. AdET come framework: cosa aggiunge al LUS tradizionale In questo manuale AdET non viene usato come semplice marchio dell’Accademia di Ecografia Toracica, ma come framework operativo. Non sostituisce i protocolli LUS già validati e non pretende di essere uno score alternativo. Serve a trasformare il reperto ecografico in una decisione sul supporto respiratorio. Il percorso AdET può essere riassunto in quattro passaggi: 1) descrivere correttamente il segno ecografico; 2) interpretarlo alla luce della fisica dell’immagine e delle “trappole acustiche”; 3) tradurlo in un fenotipo fisiopatologico; 4) decidere se e come modificare supporto, parametri, posizione del paziente, terapia causale o soglia di escalation. Rispetto al BLUE protocol, che organizza il LUS come algoritmo diagnostico dell’insufficienza respiratoria acuta, AdET ha un obiettivo più gestionale: collegare il segno alla scelta del supporto. Rispetto alle raccomandazioni di Volpicelli, che standardizzano segni, indicazioni e appropriatezza del POCUS polmonare, AdET insiste sulla lettura qualitativa del segno e sulla sua conseguenza pratica. Rispetto al LUS score e alle sue modifiche, utili per quantificare la perdita di aerazione e seguirne il trend, AdET aggiunge una domanda operativa: che cosa cambia nella NIV? Il concetto di “trappola acustica” nasce da questa prospettiva. Gli artefatti verticali non sono considerati solo linee da contare, ma effetti acustici generati dall’interazione tra ultrasuoni, aria, liquido, tessuto e geometria subpleurica. Per questo, nel metodo AdET, distribuzione, regolarità della linea pleurica, coalescenza, attenuazione, aree di risparmio e consolidamenti contano quanto il numero di artefatti. Formula sintetica del metodo: cosa vede la sonda → perché lo vedo → quale fenotipo suggerisce → quale decisione modifica. La sonda non sostituisce il ragionamento La sonda mostra la superficie pleuro-polmonare esplorabile, la presenza o assenza di sliding , la qualità della linea pleurica, gli artefatti verticali, i consolidamenti, i versamenti e, con finestre dedicate, il diaframma e il cuore. Questi dati sono immediati, ripetibili e ottenibili al letto del paziente. Il limite è altrettanto importante: l’ecografia non vede tutto il polmone. Vede ciò che arriva alla pleura o modifica l’interfaccia acustica periferica. Per questo il reperto deve essere sempre interpretato insieme a clinica, EGA, dati letti sul ventilatore e andamento nel tempo. Messaggio pratico: esiste un bersaglio per CPAP o EPAP? il problema è più polmonare o più muscolare? il diaframma sta lavorando troppo o troppo poco? il supporto sta producendo ri-aerazione? il miglioramento della SpO₂ è reale o solo apparente? sto prolungando un trial non invasivo senza risposta? Gli artefatti verticali non sono solo “B- lines ” Nella filosofia AdET, gli artefatti verticali non vanno trattati come semplici linee da contare. Sono informazioni sulla superficie polmonare periferica e sulla geometria acustica del parenchima subpleurico. Il termine “B- lines ” è utile perché molto diffuso, ma può diventare riduttivo se porta a ignorare distribuzione, qualità della linea pleurica, coalescenza, aree di risparmio, consolidamenti e contesto clinico. In questo testo useremo il termine pratico “artefatti verticali”, mantenendo il riferimento alle B-lines quando necessario. La descrizione dell’esame ecografico dovrà sempre specificare: distribuzione: focale, diffusa, omogenea o disomogenea; caratteristiche della linea pleurica: regolare o irregolare; presenza di aree di risparmio; presenza di consolidamenti subpleurici; sliding : conservato o assente; risposta dopo variazioni di supporto, posizione o terapia. Trappole acustiche: perché gli artefatti verticali non vanno solo contati Nella posizione AdET sugli artefatti verticali, il concetto di trappola acustica aiuta a spiegare perché l’aspetto degli artefatti dipenda dal rapporto tra tessuto e aria nella regione subpleurica, dalla geometria degli spazi aerei periferici, dal contenuto della trappola e dalle impostazioni di imaging . Non tutte le linee verticali hanno lo stesso significato. Gli ultrasuoni possono entrare in piccoli canali o “microbuchi acustici” tra interfacce molto riflettenti e rimanere intrappolati, generando segnali verticali diversi per luminosità, attenuazione e regolarità. Artefatti verticali brillanti, regolari, diffusi e associati a linea pleurica liscia orientano verso un pattern più ordinato. Artefatti disomogenei, attenuati, patchy , associati a pleura irregolare e consolidamenti orientano verso un sovvertimento periferico, più disordinato. LUS score: utile, ma non autosufficiente Il LUS score permette di trasformare la perdita di aerazione in un numero. Nella forma più usata, ogni regione esplorata riceve un punteggio da 0 a 3: Score Reperto pratico Significato generale 0 pattern A, sliding presente aerazione conservata 1 artefatti verticali limitati perdita lieve di aerazione 2 artefatti verticali confluenti o estesi perdita severa di aerazione 3 consolidamento polmone non aerato/deaerato Tabella 5.1. LUS score: punteggio della perdita di aerazione. Il valore del LUS score non è solo nel numero assoluto. È soprattutto nella variazione nel tempo . Un LUS score che migliora dopo CPAP/EPAP, pronazione, posizione seduta, fisioterapia o terapia diuretica suggerisce che il trattamento sta modificando positivamente il bersaglio. Un LUS invariato, nonostante pressioni crescenti, indica scarsa reclutabilità oppure un meccanismo non correggibile incrementando le pressioni di ventilazione. Figura 5.2. Esempi ecografici: LUS score 0–3. Esempi didattici di pattern ecografico progressivo: polmone aerato, perdita lieve di aerazione, perdita severa di aerazione e consolidamento. Il punteggio va sempre letto insieme a distribuzione, linea pleurica e contesto clinico. Immagini adattate dal materiale didattico ADET dell’autore. Figura 5.2. Esempi ecografici: LUS score 0–3. Esempi didattici di pattern ecografico progressivo: polmone aerato, perdita lieve di aerazione, perdita severa di aerazione e consolidamento. Il punteggio va sempre letto insieme a distribuzione, linea pleurica e contesto clinico. Immagini adattate dal materiale didattico ADET dell’autore. Ordine e disordine: la parte qualitativa del LUS Due pazienti possono avere lo stesso LUS score e fisiopatologie molto diverse. Per questo il punteggio deve essere affiancato da una lettura qualitativa. Un pattern ordinato è relativamente omogeneo, bilaterale, simmetrico, con linea pleurica conservata o poco alterata. In un contesto clinico coerente, può suggerire congestione cardiogena o aumento dell’acqua extravascolare polmonare. Qui CPAP/EPAP e terapia medica possono avere un bersaglio chiaro. Un pattern disordinato è irregolare, patchy , con aree di risparmio, pleura frammentata, consolidamenti subpleurici, distribuzione non uniforme. Questo pattern orienta verso polmonite, ARDS-like, trauma, patologia infiammatoria o perdita di aerazione non omogenea. In questo caso la NIV deve essere intrapresa con prudenza, perché il rischio non è solo l’ipossiemia, ma il mantenimento di un alto drive respiratorio su un polmone disomogeneo, con rischio di amplificazione del danno polmonare stesso Messaggio operativo. il LUS score dice “quanto” polmone appare alterato. La qualità del pattern aiuta a capire “che tipo” di problema stiamo trattando. Consolidamento: non basta dire “score 3” Il consolidamento è uno dei reperti più importanti perché cambia il bersaglio della NIV. Un’area consolidata può rappresentare polmonite, atelettasia, compressione da versamento, ostruzione bronchiale, secrezioni o combinazioni di questi meccanismi; ognuno di questi meccanismi richiede un trattamento specifico. Per questo, davanti a un consolidamento, la domanda non è solo “quanta PEEP serve?”. Prima bisogna chiedersi: il broncogramma è dinamico? O è statico? ci sono segni di bronchi pieni di liquido? il consolidamento è declive e potenzialmente reclutabile? c’è versamento pleurico compressivo? il paziente ha secrezioni non gestibili? Il broncogramma aereo dinamico suggerisce aria in movimento nelle vie aeree e bronchi pervi. Il broncogramma statico orienta verso aria intrappolata e possibile atelettasia ostruttiva o riassorbimento. Il broncogramma fluido suggerisce vie aeree piene di liquido o secrezioni, spesso in addensamenti ostruttivi. Queste differenze hanno un impatto pratico: la pressione positiva può aiutare solo se esiste reclutabilità, ma non risolve da sola l’ostruzione di un bronco ostruito o pieno di secrezioni. Figura 5.3. Consolidamento: immagini ecografiche e significato operativo. Il broncogramma statico e dinamico, insieme a C-lines, shred sign ed epatizzazione, aiuta a interpretare il consolidamento e a stimare il ruolo atteso della pressione positiva. Immagini ecografiche tratte dal materiale fornito dall’autore e impaginate a scopo didattico. Figura 5.3. Consolidamento: immagini ecografiche e significato operativo. Il broncogramma statico e dinamico, insieme a C-lines, shred sign ed epatizzazione, aiuta a interpretare il consolidamento e a stimare il ruolo atteso della pressione positiva. Immagini ecografiche tratte dal materiale fornito dall’autore e impaginate a scopo didattico. Dal reperto alla decisione ventilatoria Il metodo AdET applicato alla NIV richiede una traduzione immediata del reperto ecografico. Un pattern A prevalente in un paziente ipercapnico orienta più verso un problema muscolare respiratorio che verso un problema di reclutamento. In questo caso la NIV-PS ha un razionale più forte della sola CPAP, e l’ecografia del diaframma può essere più informativa del conteggio degli artefatti verticali. Artefatti verticali diffusi e ordinati, in un paziente con quadro clinico di quadro cardiogeno, orientano verso CPAP/EPAP e terapia di decongestione. La risposta attesa è: riduzione degli artefatti e miglioramento dell’aerazione nel tempo. Un pattern disordinato, con pleura irregolare e consolidamenti, impone cautela: il supporto non invasivo può essere tentato solo se il paziente è stabile, collaborante e rivalutabile rapidamente. Se il drive respiratorio resta alto e il LUS score peggiora, non bisogna prolungare oltre il trial. Un versamento pleurico significativo o uno pneumotorace sospetto modificano completamente la strategia. Prima di aumentare le pressioni o insistere con la NIV, bisogna chiarire il reperto e trattare la causa, quando indicato. Figura 5.4. Dal reperto alla scelta ventilatoria. Sintesi operativa del passaggio dal reperto ecografico alla decisione sul supporto non invasivo. Figura 5.4. Dal reperto alla scelta ventilatoria. Sintesi operativa del passaggio dal reperto ecografico alla decisione sul supporto non invasivo. Timing dell’ecografia nel percorso NIV L’ecografia può essere usata efficacemente in tre momenti. Prima di iniziare il supporto , serve a definire il fenotipo: polmone aerato/iperinflato, congesto, disordinato, consolidato, compresso da versamento, complicato da pneumotorace, o associato a muscoli respiratori inefficiente. Dopo pochi minuti dall’inizio del supporto, d urante il settaggio serve a capire se il parametro impostato o modificato ha centrato il bersaglio: EPAP/CPAP per perdita di aerazione o congestione; pressure support per lavoro respiratorio e ventilazione alveolare; posizione per atelettasie declivi; interfaccia se il problema è tecnico. Durante la rivalutazione , serve a distinguere risposta reale e risposta apparente. La SpO₂ può migliorare anche se il polmone resta disomogeneo e il diaframma continua a lavorare troppo. Il LUS seriale e la valutazione dei muscoli respiratori aiutano a decidere se continuare, correggere o interrompere il trial. Errore da evitare L’errore più frequente è fermarsi alla descrizione del segno ecografico: “ci sono B-lines”, “c’è consolidamento”, “il LUS è alto”. Questo non basta. È necessario chiedersi: che cosa cambia nella gestione? Un reperto ecografico che non modifica diagnosi, impostazioni, monitoraggio o soglia di escalation resta un’informazione incompleta. Bibliografia del Capitolo 5 1. Smargiassi A, Zanforlin A, Perrone T, Buonsenso D, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Inchingolo R. Vertical artifacts as lung ultrasound signs: trick or trap? Part 2: an Accademia di Ecografia Toracica position paper on B-lines and sonographic interstitial syndrome. J Ultrasound Med. 2023;42(2):279-292. doi:10.1002/jum.16116. 2. Inchingolo R, Zanforlin A, Buonsenso D, Perrone T, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Marchetti G, Carlucci P, Radovanovic D, Lohmeyer FM, Smargiassi A. Lung ultrasound signs: the beginning. Part 3: an Accademia di Ecografia Toracica comprehensive review on ultrasonographic signs and real needs. J Ultrasound Med. 2024;43(4):629-641. doi:10.1002/jum.16397. 3. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558. 4. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4. 5. Lichtenstein D, Mezière G, Seitz J. The dynamic air bronchogram: a lung ultrasound sign of alveolar consolidation ruling out atelectasis. Chest. 2009;135(6):1421-1425. doi:10.1378/chest.08-2281. 6. Bouhemad B, Brisson H, Le-Guen M, Arbelot C, Lu Q, Rouby JJ. Bedside ultrasound assessment of positive end-expiratory pressure-induced lung recruitment. Am J Respir Crit Care Med. 2011;183(3):341-347. doi:10.1164/rccm.201003-0369OC. 7. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI."},{"part":"Parte II — L’ecografia applicata alla NIV: il metodo AdET","title":"Capitolo 6. LUS pratico per la NIV","tag":"Capitolo 6","html":"\n<h3>Obiettivo pratico<\/h3>\n<p>Il LUS nel paziente candidato a HFNC, CPAP o NIV-PS, non deve essere un esame lungo o descrittivo. Deve rispondere rapidamente a poche domande operative:<\/p>\n<p>il polmone è prevalentemente aerato o ha perso aerazione?<\/p>\n<p>la perdita di aerazione è diffusa, focale, declive o disomogenea?<\/p>\n<p>esiste un bersaglio realistico per CPAP o EPAP?<\/p>\n<p>ci sono consolidamenti, versamenti pleurici o pneumotorace?<\/p>\n<p>il quadro sta migliorando dopo l’inizio del supporto o il miglioramento dell’SpO₂ sta solo mascherando il problema?<\/p>\n<p>L’ecografia deve aiutare a scegliere il supporto, impostare i parametri e decidere quando rivalutare.<\/p>\n<h3>Quale sonda usare<\/h3>\n<p>Nella pratica del LUS al letto del paziente, la sonda lineare è spesso la sonda di riferimento per lo studio superficiale, mentre la sonda convex o microconvex diventa molto utile quando servono profondità e visione d’insieme.<\/p>\n<p>In pratica, si utilizza:<\/p>\n<p><strong>sonda <\/strong><strong>lineare<\/strong><strong> <\/strong>per pleura, <em>sliding<\/em>, artefatti verticali superficiali, pneumotorace e piccoli consolidamenti subpleurici, contrazione dei muscoli respiratori<\/p>\n<p><strong>sonda <\/strong><strong>convex/microconvex<\/strong><strong> <\/strong>per zone posteriori e declivi, versamento pleurico, consolidamenti più profondi, escursione diaframmatica e scansioni panoramiche;<\/p>\n<p><strong>sonda <\/strong><strong><em>phased array<\/em><\/strong><strong>: <\/strong>non è la sonda standard per LUS, ma può essere utile come compromesso nel paziente critico quando si integra rapidamente cuore-polmone o quando le finestre sono difficili.<\/p>\n<p>L’impostazione deve essere coerente con il segno cercato. Profondità e fuoco devono essere adattati: non ha senso cercare <em>sliding<\/em> con un’immagine troppo profonda, né valutare un versamento pleurico con una profondità insufficiente.<\/p>\n<h3>Dove cercare<\/h3>\n<p>Usare un protocollo a <strong>12 zone<\/strong> permette di confrontare il paziente nel tempo e di costruire un LUS score ripetibile. Ogni emitorace viene diviso in regione anteriore, laterale e posteriore, ciascuna con settore superiore e inferiore.<\/p>\n<p>In urgenza si può iniziare con scansioni anteriori e laterali. Appena possibile, però, bisogna esplorare anche le aree posteriori e postero-inferiori: sono spesso le più ricche di consolidamenti, atelettasie e versamenti.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_25.png\" alt=\"Figura 6.1. Protocollo pratico a 12 zone per NIV. Le regioni anteriori e laterali permettono una valutazione rapida iniziale; le regioni posteriori sono fondamentali per consolidamenti, atelettasie declivi e versamenti.\" loading=\"lazy\"><figcaption>Figura 6.1. Protocollo pratico a 12 zone per NIV. Le regioni anteriori e laterali permettono una valutazione rapida iniziale; le regioni posteriori sono fondamentali per consolidamenti, atelettasie declivi e versamenti.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_25.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 6.1. Protocollo pratico a 12 zone per NIV. Le regioni anteriori e laterali permettono una valutazione rapida iniziale; le regioni posteriori sono fondamentali per consolidamenti, atelettasie declivi e versamenti.<\/p>\n<h3>Sequenza minima dell’esame<\/h3>\n<p>La sequenza di scansione deve essere rapida, ordinata e sempre uguale.<\/p>\n<p><strong>1. <\/strong><strong><em>Sliding<\/em><\/strong><strong> pleurico<\/strong><br>Prima domanda: il polmone scorre? Lo <em>sliding<\/em> presente rende improbabile lo pneumotorace nel punto esaminato. Lo <em>sliding<\/em> assente non basta da solo per diagnosticare lo pneumotorace: può mancare anche per presenza di aderenze, atelettasia, apnea, intubazione selettiva, ridotta ventilazione regionale o pleurodesi.<\/p>\n<p><strong>2. <\/strong><strong><em>Pattern<\/em><\/strong><strong> prevalente<\/strong><br><em>Pattern<\/em> A, artefatti verticali, consolidamento, versamento pleurico. Il <em>pattern<\/em> prevalente orienta il fenotipo: polmone aerato, congesto, disordinato, consolidato o compresso.<\/p>\n<p><strong>3. Distribuzione<\/strong><br>Focale o diffusa, anteriore o posteriore, simmetrica o asimmetrica, omogenea o <em>patchy<\/em>. La distribuzione è spesso più importante del numero di linee verticali visualizzate.<\/p>\n<p><strong>4. Consolidamenti e versamenti<\/strong><br>Vanno ricercati soprattutto nelle aree postero-laterali e declivi. Se c’è consolidamento, bisogna descrivere il broncogramma, cercare il margine profondo e un eventuale versamento pleurico associato e/o possibile reclutabilità.<\/p>\n<p><strong>5. LUS score se utile<\/strong><br>Il LUS score serve soprattutto per il monitoraggio seriale. Non deve sostituire la descrizione qualitativa.<\/p>\n<p>L’integrazione delle informazioni derivanti da questa sequenza di scansione serve a definire il fenotipo del paziente.<\/p>\n<h3>I reperti che cambiano le impostazioni iniziali della NIV<\/h3>\n<p><strong><em>Pattern<\/em><\/strong><strong> A<\/strong><\/p>\n<p>Il <em>pattern<\/em> A con <em>sliding<\/em> presente indica un polmone aerato nel punto esaminato. Nel paziente dispnoico può essere coerente con BPCO, asma, embolia polmonare, ipercapnia da deficit di muscoli respiratori o insufficienza respiratoria senza perdita periferica di aerazione.<\/p>\n<p><strong>Cosa cambia:<\/strong> non c’è un forte bersaglio per impostare/aumentare una EPAP/PEEP a scopo di reclutamento. Se il paziente è ipercapnico o affaticato, il bersaglio si sposta sull’impostazione del <em>pressure support<\/em> per diaframma, muscoli respiratori accessori, auto-PEEP e sincronia.<\/p>\n<p><strong>Artefatti verticali diffusi e ordinati<\/strong><\/p>\n<p>Artefatti verticali bilaterali, relativamente simmetrici, con linea pleurica liscia o poco alterata, orientano verso congestione o aumento dell’acqua extravascolare polmonare, se il quadro clinico è coerente.<\/p>\n<p><strong>Cosa cambia:<\/strong> CPAP o EPAP hanno un bersaglio plausibile. La risposta attesa è una riduzione degli artefatti e una migliore aerazione nel tempo, insieme alla riduzione del lavoro respiratorio e della FiO₂ necessaria.<\/p>\n<p><strong><em>Pattern<\/em><\/strong><strong> disordinato<\/strong><\/p>\n<p>Artefatti verticali disomogenei, aree di risparmio, pleura irregolare, piccoli consolidamenti subpleurici o distribuzione <em>patchy<\/em> orientano verso patologia polmonare primitiva: polmonite, ARDS-<em>like<\/em>, contusione polmonare, fibrosi o altra perdita di aerazione non omogenea.<\/p>\n<p><strong>Cosa cambia: il supporto non invasivo deve essere più prudente. Se il paziente ha alto drive, LUS elevato e diaframma iperattivo, la soglia di escalation deve essere bassa. L’obiettivo non è solo ottenere una buona SpO₂, ma ridurre realmente il lavoro respiratorio. Non prolungare un trial inefficace.<\/strong><\/p>\n<p><strong>Consolidamento<\/strong><\/p>\n<p>Il consolidamento è score 3, ma non tutti i consolidamenti hanno lo stesso significato. Può essere polmonite, atelettasia, compressione da versamento, ostruzione bronchiale o accumulo di secrezioni. Il broncogramma dinamico/statico/fluido e il contesto clinico diventano decisivi.<\/p>\n<p><strong>Cosa cambia: non bisogna aumentare automaticamente la PEEP. Prima bisogna capire se l’area è reclutabile, se i bronchi sono pervi, se ci sono secrezioni, versamento pleurico o necessità di fisioterapia, drenaggio del versamento associato o broncoscopia disostruente.<\/strong><\/p>\n<p><strong>Versamento pleurico<\/strong><\/p>\n<p>Il versamento pleurico può comprimere il polmone e contribuire a dispnea, atelettasia passiva e fallimento della NIV. Non sempre la NIV è il trattamento migliore in questo caso.<\/p>\n<p><strong>Cosa cambia:<\/strong> valutare entità, bilateralità, effetto compressivo e indicazione a drenaggio. Se il problema dominante è meccanico-compressivo, aumentare EPAP/PEEP può avere efficacia limitata.<\/p>\n<p><strong><em>Sliding<\/em><\/strong><strong> assente e sospetto pneumotorace<\/strong><\/p>\n<p>L’assenza di <em>sliding<\/em> non basta per diagnosticare uno pneumotorace, ma nel paziente in supporto a pressione positiva va presa sul serio. Bisogna cercare il <em>lung point<\/em>, valutare linee A, assenza di B-<em>lines<\/em> nel punto sospetto, segni clinici associati e stabilità emodinamica del paziente.<\/p>\n<p><strong>Cosa cambia: <\/strong>prima di aumentare le pressioni di ventilazione o insistere con NIV/CPAP, il sospetto va chiarito. Se lo pneumotorace è confermato e clinicamente rilevante, il trattamento della causa (drenaggio) ha priorità.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_26.png\" alt=\"Figura 6.2. Lung ultrasound: reperto, significato, effetto sulla NIV. Il reperto ecografico diventa utile quando modifica supporto, parametri, terapia causale o soglia di escalation.\" loading=\"lazy\"><figcaption>Figura 6.2. Lung ultrasound: reperto, significato, effetto sulla NIV. Il reperto ecografico diventa utile quando modifica supporto, parametri, terapia causale o soglia di escalation.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_26.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 6.2. Lung ultrasound: reperto, significato, effetto sulla NIV. Il reperto ecografico diventa utile quando modifica supporto, parametri, terapia causale o soglia di escalation.<\/p>\n<h3>LUS score nella pratica NIV<\/h3>\n<p>Il LUS score può essere usato prima dell’avvio del supporto e poi ripetuto a timing predefiniti o quando vengono eseguite delle correzioni terapeutiche. Non serve necessariamente calcolarlo in ogni paziente, ma è molto utile quando il quadro è ipossiemico, congestizio, disomogeneo o quando si vuole capire se CPAP/EPAP stanno modificando l’aerazione.<\/p>\n<p>Il punto chiave è la <strong>ripetizione nello stesso paziente<\/strong>. Il valore assoluto ha significato limitato se non è collegato a distribuzione e clinica. La variazione nel tempo è più informativa:<\/p>\n<p>LUS in miglioramento + frequenza respiratoria in calo + FiO₂ riducibile: risposta reale;<\/p>\n<p>LUS invariato + SpO₂ migliore ma FiO₂ elevata: risposta incerta;<\/p>\n<p>LUS peggiorato + <em>drive<\/em> respiratorio elevato + EGA sfavorevole: fallimento probabile.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_27.png\" alt=\"Figura 6.3. LUS seriale: risposta reale, incerta o sfavorevole. La variazione del LUS nel tempo aiuta a distinguere il miglioramento reale dalla stabilità apparente.\" loading=\"lazy\"><figcaption>Figura 6.3. LUS seriale: risposta reale, incerta o sfavorevole. La variazione del LUS nel tempo aiuta a distinguere il miglioramento reale dalla stabilità apparente.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_27.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 6.3. LUS seriale: risposta reale, incerta o sfavorevole. La variazione del LUS nel tempo aiuta a distinguere il miglioramento reale dalla stabilità apparente.<\/p>\n<p><strong>L<\/strong><strong>US<\/strong><strong> <\/strong><strong>e titolazione della EPAP/PEEP<\/strong><\/p>\n<p>Il LUS può aiutare a capire se l’aumento di EPAP/PEEP sta producendo ri-aerazione. Se una regione passa da consolidamento o artefatti confluenti a un <em>pattern<\/em> più aerato, il supporto ha un bersaglio reale. Se il LUS resta invariato nonostante pressioni crescenti, la probabilità di scarsa reclutabilità aumenta.<\/p>\n<p>Attenzione però: il LUS non misura direttamente la sovradistensione. Un miglioramento di alcune aree declivi può coesistere con la sovradistensione di aree già aerate, soprattutto nei pazienti disomogenei. Per questo la titolazione non deve basarsi solo sull’ecografia polmonare, ma anche su clinica, emodinamica, volumi letti al ventilatore, comfort del paziente, monitoraggio della funzione del diaframma e del cuore destro.<\/p>\n<h3>Referto orientato alla NIV<\/h3>\n<p>Un referto utile non deve essere lungo. Deve dire ciò che serve al trattamento.<\/p>\n<p><strong>Esempio di struttura breve:<\/strong><\/p>\n<p><em>Sliding<\/em>: presente/assente nelle regioni esplorate<strong>.<\/strong><\/p>\n<p><em>Pattern<\/em> prevalente: A, artefatti verticali, consolidamento, versamento.<\/p>\n<p>Distribuzione: focale/diffusa, omogenea/disomogenea, anteriore/laterale/posteriore.<\/p>\n<p>LUS score: se calcolato, con regioni più alterate.<\/p>\n<p>Consolidamenti: sede, caratteristiche del broncogramma, eventuale versamento pleurico associato.<\/p>\n<p>Interpretazione: polmone aerato, congesto, disordinato, consolidato, compresso.<\/p>\n<p>Implicazione NIV: HFNC/CPAP/NIV, EPAP/PEEP, rivalutazione, <em>escalation<\/em>.<\/p>\n<h3>Errore da evitare<\/h3>\n<p>L’errore più frequente è usare il LUS come fotografia iniziale e non come monitoraggio. Un LUS eseguito solo prima della NIV è utile per la diagnosi, ma perde gran parte del suo valore pratico se non viene ripetuto quando il paziente cambia clinicamente o quando si modificano le impostazioni di ventilazione.<\/p>\n<p>Il LUS nella NIV deve essere seriale, mirato e utile per decidere.<\/p>\n<h3>Bibliografia del Capitolo 6<\/h3>\n<p>1. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4.<\/p>\n<p>2. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p>\n<p>3. Bouhemad B, Brisson H, Le-Guen M, Arbelot C, Lu Q, Rouby JJ. Bedside ultrasound assessment of positive end-expiratory pressure-induced lung recruitment. Am J Respir Crit Care Med. 2011;183(3):341-347. doi:10.1164/rccm.201003-0369OC.<\/p>\n<p>4. Lichtenstein DA, Mezière GA. Relevance of lung ultrasound in the diagnosis of acute respiratory failure: the BLUE protocol. Chest. 2008;134(1):117-125. doi:10.1378/chest.07-2800.<\/p>\n<p>5. Mongodi S, Bouhemad B, Orlando A, Stella A, Tavazzi G, Via G, Iotti GA, Braschi A, Mojoli F. Modified Lung Ultrasound Score for Assessing and Monitoring Pulmonary Aeration. Ultraschall Med. 2017;38(5):530-537. doi:10.1055/s-0042-120260.<\/p>\n<p>6. Smargiassi A, Zanforlin A, Perrone T, Buonsenso D, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Inchingolo R. Vertical artifacts as lung ultrasound signs: trick or trap? Part 2: an Accademia di Ecografia Toracica position paper on B-lines and sonographic interstitial syndrome. J Ultrasound Med. 2023;42(2):279-292. doi:10.1002/jum.16116.<\/p>\n<p>7. Inchingolo R, Zanforlin A, Buonsenso D, Perrone T, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Marchetti G, Carlucci P, Radovanovic D, Lohmeyer FM, Smargiassi A. Lung ultrasound signs: the beginning. Part 3: an Accademia di Ecografia Toracica comprehensive review on ultrasonographic signs and real needs. J Ultrasound Med. 2024;43(4):629-641. doi:10.1002/jum.16397.<\/p>","plain":"Obiettivo pratico Il LUS nel paziente candidato a HFNC, CPAP o NIV-PS, non deve essere un esame lungo o descrittivo. Deve rispondere rapidamente a poche domande operative: il polmone è prevalentemente aerato o ha perso aerazione? la perdita di aerazione è diffusa, focale, declive o disomogenea? esiste un bersaglio realistico per CPAP o EPAP? ci sono consolidamenti, versamenti pleurici o pneumotorace? il quadro sta migliorando dopo l’inizio del supporto o il miglioramento dell’SpO₂ sta solo mascherando il problema? L’ecografia deve aiutare a scegliere il supporto, impostare i parametri e decidere quando rivalutare. Quale sonda usare Nella pratica del LUS al letto del paziente, la sonda lineare è spesso la sonda di riferimento per lo studio superficiale, mentre la sonda convex o microconvex diventa molto utile quando servono profondità e visione d’insieme. In pratica, si utilizza: sonda lineare per pleura, sliding , artefatti verticali superficiali, pneumotorace e piccoli consolidamenti subpleurici, contrazione dei muscoli respiratori sonda convex/microconvex per zone posteriori e declivi, versamento pleurico, consolidamenti più profondi, escursione diaframmatica e scansioni panoramiche; sonda phased array : non è la sonda standard per LUS, ma può essere utile come compromesso nel paziente critico quando si integra rapidamente cuore-polmone o quando le finestre sono difficili. L’impostazione deve essere coerente con il segno cercato. Profondità e fuoco devono essere adattati: non ha senso cercare sliding con un’immagine troppo profonda, né valutare un versamento pleurico con una profondità insufficiente. Dove cercare Usare un protocollo a 12 zone permette di confrontare il paziente nel tempo e di costruire un LUS score ripetibile. Ogni emitorace viene diviso in regione anteriore, laterale e posteriore, ciascuna con settore superiore e inferiore. In urgenza si può iniziare con scansioni anteriori e laterali. Appena possibile, però, bisogna esplorare anche le aree posteriori e postero-inferiori: sono spesso le più ricche di consolidamenti, atelettasie e versamenti. Figura 6.1. Protocollo pratico a 12 zone per NIV. Le regioni anteriori e laterali permettono una valutazione rapida iniziale; le regioni posteriori sono fondamentali per consolidamenti, atelettasie declivi e versamenti. Figura 6.1. Protocollo pratico a 12 zone per NIV. Le regioni anteriori e laterali permettono una valutazione rapida iniziale; le regioni posteriori sono fondamentali per consolidamenti, atelettasie declivi e versamenti. Sequenza minima dell’esame La sequenza di scansione deve essere rapida, ordinata e sempre uguale. 1. Sliding pleurico Prima domanda: il polmone scorre? Lo sliding presente rende improbabile lo pneumotorace nel punto esaminato. Lo sliding assente non basta da solo per diagnosticare lo pneumotorace: può mancare anche per presenza di aderenze, atelettasia, apnea, intubazione selettiva, ridotta ventilazione regionale o pleurodesi. 2. Pattern prevalente Pattern A, artefatti verticali, consolidamento, versamento pleurico. Il pattern prevalente orienta il fenotipo: polmone aerato, congesto, disordinato, consolidato o compresso. 3. Distribuzione Focale o diffusa, anteriore o posteriore, simmetrica o asimmetrica, omogenea o patchy . La distribuzione è spesso più importante del numero di linee verticali visualizzate. 4. Consolidamenti e versamenti Vanno ricercati soprattutto nelle aree postero-laterali e declivi. Se c’è consolidamento, bisogna descrivere il broncogramma, cercare il margine profondo e un eventuale versamento pleurico associato e/o possibile reclutabilità. 5. LUS score se utile Il LUS score serve soprattutto per il monitoraggio seriale. Non deve sostituire la descrizione qualitativa. L’integrazione delle informazioni derivanti da questa sequenza di scansione serve a definire il fenotipo del paziente. I reperti che cambiano le impostazioni iniziali della NIV Pattern A Il pattern A con sliding presente indica un polmone aerato nel punto esaminato. Nel paziente dispnoico può essere coerente con BPCO, asma, embolia polmonare, ipercapnia da deficit di muscoli respiratori o insufficienza respiratoria senza perdita periferica di aerazione. Cosa cambia: non c’è un forte bersaglio per impostare/aumentare una EPAP/PEEP a scopo di reclutamento. Se il paziente è ipercapnico o affaticato, il bersaglio si sposta sull’impostazione del pressure support per diaframma, muscoli respiratori accessori, auto-PEEP e sincronia. Artefatti verticali diffusi e ordinati Artefatti verticali bilaterali, relativamente simmetrici, con linea pleurica liscia o poco alterata, orientano verso congestione o aumento dell’acqua extravascolare polmonare, se il quadro clinico è coerente. Cosa cambia: CPAP o EPAP hanno un bersaglio plausibile. La risposta attesa è una riduzione degli artefatti e una migliore aerazione nel tempo, insieme alla riduzione del lavoro respiratorio e della FiO₂ necessaria. Pattern disordinato Artefatti verticali disomogenei, aree di risparmio, pleura irregolare, piccoli consolidamenti subpleurici o distribuzione patchy orientano verso patologia polmonare primitiva: polmonite, ARDS- like , contusione polmonare, fibrosi o altra perdita di aerazione non omogenea. Cosa cambia: il supporto non invasivo deve essere più prudente. Se il paziente ha alto drive, LUS elevato e diaframma iperattivo, la soglia di escalation deve essere bassa. L’obiettivo non è solo ottenere una buona SpO₂, ma ridurre realmente il lavoro respiratorio. Non prolungare un trial inefficace. Consolidamento Il consolidamento è score 3, ma non tutti i consolidamenti hanno lo stesso significato. Può essere polmonite, atelettasia, compressione da versamento, ostruzione bronchiale o accumulo di secrezioni. Il broncogramma dinamico/statico/fluido e il contesto clinico diventano decisivi. Cosa cambia: non bisogna aumentare automaticamente la PEEP. Prima bisogna capire se l’area è reclutabile, se i bronchi sono pervi, se ci sono secrezioni, versamento pleurico o necessità di fisioterapia, drenaggio del versamento associato o broncoscopia disostruente. Versamento pleurico Il versamento pleurico può comprimere il polmone e contribuire a dispnea, atelettasia passiva e fallimento della NIV. Non sempre la NIV è il trattamento migliore in questo caso. Cosa cambia: valutare entità, bilateralità, effetto compressivo e indicazione a drenaggio. Se il problema dominante è meccanico-compressivo, aumentare EPAP/PEEP può avere efficacia limitata. Sliding assente e sospetto pneumotorace L’assenza di sliding non basta per diagnosticare uno pneumotorace, ma nel paziente in supporto a pressione positiva va presa sul serio. Bisogna cercare il lung point , valutare linee A, assenza di B- lines nel punto sospetto, segni clinici associati e stabilità emodinamica del paziente. Cosa cambia: prima di aumentare le pressioni di ventilazione o insistere con NIV/CPAP, il sospetto va chiarito. Se lo pneumotorace è confermato e clinicamente rilevante, il trattamento della causa (drenaggio) ha priorità. Figura 6.2. Lung ultrasound: reperto, significato, effetto sulla NIV. Il reperto ecografico diventa utile quando modifica supporto, parametri, terapia causale o soglia di escalation. Figura 6.2. Lung ultrasound: reperto, significato, effetto sulla NIV. Il reperto ecografico diventa utile quando modifica supporto, parametri, terapia causale o soglia di escalation. LUS score nella pratica NIV Il LUS score può essere usato prima dell’avvio del supporto e poi ripetuto a timing predefiniti o quando vengono eseguite delle correzioni terapeutiche. Non serve necessariamente calcolarlo in ogni paziente, ma è molto utile quando il quadro è ipossiemico, congestizio, disomogeneo o quando si vuole capire se CPAP/EPAP stanno modificando l’aerazione. Il punto chiave è la ripetizione nello stesso paziente . Il valore assoluto ha significato limitato se non è collegato a distribuzione e clinica. La variazione nel tempo è più informativa: LUS in miglioramento + frequenza respiratoria in calo + FiO₂ riducibile: risposta reale; LUS invariato + SpO₂ migliore ma FiO₂ elevata: risposta incerta; LUS peggiorato + drive respiratorio elevato + EGA sfavorevole: fallimento probabile. Figura 6.3. LUS seriale: risposta reale, incerta o sfavorevole. La variazione del LUS nel tempo aiuta a distinguere il miglioramento reale dalla stabilità apparente. Figura 6.3. LUS seriale: risposta reale, incerta o sfavorevole. La variazione del LUS nel tempo aiuta a distinguere il miglioramento reale dalla stabilità apparente. L US e titolazione della EPAP/PEEP Il LUS può aiutare a capire se l’aumento di EPAP/PEEP sta producendo ri-aerazione. Se una regione passa da consolidamento o artefatti confluenti a un pattern più aerato, il supporto ha un bersaglio reale. Se il LUS resta invariato nonostante pressioni crescenti, la probabilità di scarsa reclutabilità aumenta. Attenzione però: il LUS non misura direttamente la sovradistensione. Un miglioramento di alcune aree declivi può coesistere con la sovradistensione di aree già aerate, soprattutto nei pazienti disomogenei. Per questo la titolazione non deve basarsi solo sull’ecografia polmonare, ma anche su clinica, emodinamica, volumi letti al ventilatore, comfort del paziente, monitoraggio della funzione del diaframma e del cuore destro. Referto orientato alla NIV Un referto utile non deve essere lungo. Deve dire ciò che serve al trattamento. Esempio di struttura breve: Sliding : presente/assente nelle regioni esplorate . Pattern prevalente: A, artefatti verticali, consolidamento, versamento. Distribuzione: focale/diffusa, omogenea/disomogenea, anteriore/laterale/posteriore. LUS score: se calcolato, con regioni più alterate. Consolidamenti: sede, caratteristiche del broncogramma, eventuale versamento pleurico associato. Interpretazione: polmone aerato, congesto, disordinato, consolidato, compresso. Implicazione NIV: HFNC/CPAP/NIV, EPAP/PEEP, rivalutazione, escalation . Errore da evitare L’errore più frequente è usare il LUS come fotografia iniziale e non come monitoraggio. Un LUS eseguito solo prima della NIV è utile per la diagnosi, ma perde gran parte del suo valore pratico se non viene ripetuto quando il paziente cambia clinicamente o quando si modificano le impostazioni di ventilazione. Il LUS nella NIV deve essere seriale, mirato e utile per decidere. Bibliografia del Capitolo 6 1. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4. 2. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558. 3. Bouhemad B, Brisson H, Le-Guen M, Arbelot C, Lu Q, Rouby JJ. Bedside ultrasound assessment of positive end-expiratory pressure-induced lung recruitment. Am J Respir Crit Care Med. 2011;183(3):341-347. doi:10.1164/rccm.201003-0369OC. 4. Lichtenstein DA, Mezière GA. Relevance of lung ultrasound in the diagnosis of acute respiratory failure: the BLUE protocol. Chest. 2008;134(1):117-125. doi:10.1378/chest.07-2800. 5. Mongodi S, Bouhemad B, Orlando A, Stella A, Tavazzi G, Via G, Iotti GA, Braschi A, Mojoli F. Modified Lung Ultrasound Score for Assessing and Monitoring Pulmonary Aeration. Ultraschall Med. 2017;38(5):530-537. doi:10.1055/s-0042-120260. 6. Smargiassi A, Zanforlin A, Perrone T, Buonsenso D, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Inchingolo R. Vertical artifacts as lung ultrasound signs: trick or trap? Part 2: an Accademia di Ecografia Toracica position paper on B-lines and sonographic interstitial syndrome. J Ultrasound Med. 2023;42(2):279-292. doi:10.1002/jum.16116. 7. Inchingolo R, Zanforlin A, Buonsenso D, Perrone T, Torri E, Limoli G, Mossolani EE, Tursi F, Soldati G, Marchetti G, Carlucci P, Radovanovic D, Lohmeyer FM, Smargiassi A. Lung ultrasound signs: th
