strong ion difference (SID) e acidi deboli totali (ATOT), rappresentati soprattutto da albumina e fosfati.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_52.png\" alt=\"Figura 12.2. Le tre variabili indipendenti dell&#x27;approccio di Stewart. PaCO₂, SID e ATOT aiutano a capire quale meccanismo sta guidando il pH.\" loading=\"lazy\"><figcaption>Figura 12.2. Le tre variabili indipendenti dell'approccio di Stewart. PaCO₂, SID e ATOT aiutano a capire quale meccanismo sta guidando il pH.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_52.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 12.2. Le tre variabili indipendenti dell'approccio di Stewart. PaCO₂, SID e ATOT aiutano a capire quale meccanismo sta guidando il pH.<\/p>\n<p>La scorciatoia più utile è guardare il cloro rispetto al sodio. Se sodio e cloro sono troppo vicini, la SID si riduce e il plasma tende all'acidosi. Se il cloro è basso rispetto al sodio, la SID aumenta e compare una tendenza alcalinizzante. Il lattato si comporta come anione forte: quando aumenta, riduce la SID e spinge verso acidosi. L'albumina bassa, invece, riduce gli acidi deboli e ha un effetto alcalinizzante, potendo mascherare acidosi lattica o ipercloremica.<\/p>\n<p>Questo è particolarmente utile dopo grandi volumi di NaCl 0,9%. La soluzione fisiologica ha SID pari a zero: se somministrata in quantità rilevante, aumenta il cloro rispetto al sodio e può generare acidosi metabolica ipercloremica. In quel caso il paziente può essere acidotico non per ipoperfusione, ma per effetto dei fluidi.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_53.png\" alt=\"Figura 12.3. Stewart nella pratica clinica. Correggere il pH significa agire sulla variabile che lo determina: ventilazione alveolare/NIV, composizione dei fluidi e degli ioni forti, albumina e fosfati.\" loading=\"lazy\"><figcaption>Figura 12.3. Stewart nella pratica clinica. Correggere il pH significa agire sulla variabile che lo determina: ventilazione alveolare/NIV, composizione dei fluidi e degli ioni forti, albumina e fosfati.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_53.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 12.3. Stewart nella pratica clinica. Correggere il pH significa agire sulla variabile che lo determina: ventilazione alveolare/NIV, composizione dei fluidi e degli ioni forti, albumina e fosfati.<\/p>\n<h3>EGA nei quattro timing della NIV ecoguidata<\/h3>\n<p>L'EGA va inserita nel timing decisionale del trial non invasivo. Prima della NIV definisce indicazione, gravità e bersaglio. Nei primi 5-10 minuti il problema e soprattutto tecnico e di adattamento: l'EGA non sempre deve essere ripetuta, ma se il paziente peggiora bisogna verificare che il setting e la FiO₂ reale siano noti. A 30-60 minuti l'EGA deve iniziare a mostrare un trend coerente con la risposta fisiopatologica. A due ore contribuisce alla decisione: proseguire, correggere o interrompere il trial.<\/p>\n<p>Nel paziente ipercapnico la direzione attesa è miglioramento del pH e riduzione o stabilizzazione della PaCO₂ con minore lavoro respiratorio. Nel paziente ipossiemico, si cerca riduzione della FiO₂ necessaria, miglioramento del PaO₂/FiO₂ e coerenza con LUS e clinica. Nel paziente settico o ipoperfuso, il lattato e il base excess devono essere letti insieme alla perfusione, non attribuiti automaticamente al supporto respiratorio.<\/p>\n<table class=\"manualTable\"><tr><th>Timing<\/th><th>Domanda principale<\/th><th>Cosa cercare nell'EGA<\/th><th>Decisione pratica<\/th><\/tr>\n<tr><td>Prima della NIV<\/td><td>Il supporto non invasivo ha indicazione?<\/td><td>pH, PaCO₂, HCO3/BE, PaO2/FiO₂, lattato, eventuale AG e cloro.<\/td><td>Scegliere HFNC, CPAP o NIV-PS in base al bersaglio fisiopatologico.<\/td><\/tr>\n<tr><td>5-10 minuti<\/td><td>Il supporto arriva davvero al paziente?<\/td><td>EGA solo se peggioramento o instabilità; verificare FiO₂ reale e setting.<\/td><td>Correggere interfaccia, perdite, trigger, cycling e comfort prima di aumentare pressioni.<\/td><\/tr>\n<tr><td>30-60 minuti<\/td><td>Sta comparendo una risposta fisiopatologica?<\/td><td>pH e PaCO₂ in miglioramento se ipercapnia; FiO₂ riducibile; lattato non in aumento.<\/td><td>Continuare se trend coerente; correggere se risposta incompleta.<\/td><\/tr>\n<tr><td>2 ore<\/td><td>Il trial va proseguito?<\/td><td>pH/PaCO₂, PaO2/FiO₂, FiO₂ richiesta, lattato, coerenza con clinica e LUS.<\/td><td>Proseguire, modificare strategia o interrompere trial se fallimento probabile.<\/td><\/tr><\/table>\n<p class=\"manualCaptionText\">Tabella 12.3. Uso pratico dell'EGA nei quattro momenti principali del trial NIV ecoguidato.<\/p>\n<h3>Esempi clinici essenziali<\/h3>\n<p>Alcuni profili EGA ricorrono spesso nel percorso NIV e aiutano a collegare il dato biochimico alla scelta del supporto.<\/p>\n<table class=\"manualTable\"><tr><th>Scenario<\/th><th>Profilo EGA tipico<\/th><th>Lettura NIV<\/th><\/tr>\n<tr><td>BPCO ipercapnico<\/td><td>PaCO₂ alta, pH basso se acuto o acuto su cronico, HCO3 alto se compenso cronico.<\/td><td>NIV-PS, controllo di pH/PaCO₂, comfort, perdite, auto-PEEP, cycling e cloro se alcalosi metabolica.<\/td><\/tr>\n<tr><td>Edema polmonare cardiogeno<\/td><td>Ipossiemia, possibile ipocapnia da distress o ipercapnia se fatica; lattato se ipoperfusione.<\/td><td>CPAP/EPAP se fenotipo congestizio; EGA deve migliorare insieme a LUS e clinica.<\/td><\/tr>\n<tr><td>Polmonite/ipossiemia de novo<\/td><td>PaO2/FiO₂ ridotto, spesso PaCO₂ bassa da alto drive; PaCO₂ che sale e segnale sfavorevole.<\/td><td>Trial breve, soglia bassa di escalation se drive, LUS e EGA non migliorano.<\/td><\/tr>\n<tr><td>Sepsi/lattato<\/td><td>Acidosi metabolica lattica, spesso alcalosi respiratoria; pH anche normale se forze opposte.<\/td><td>Non confondere compenso respiratorio con stabilità; trattare perfusione e causa.<\/td><\/tr>\n<tr><td>Acidosi ipercloremica<\/td><td>BE negativo, HCO3 basso, lattato non elevato, Cl alto rispetto a Na.<\/td><td>Rivedere fluidi e cloro; non attribuire automaticamente l'acidosi a fallimento ventilatorio.<\/td><\/tr><\/table>\n<p class=\"manualCaptionText\">Tabella 12.4. Profili EGA frequenti e implicazioni nel trial NIV.<\/p>\n<h3>Errore da evitare<\/h3>\n<p>L'errore più frequente è usare l'EGA per nominare un disturbo senza tradurlo in una decisione. Scrivere 'acidosi respiratoria' o 'acidosi metabolica' non basta. Bisogna dire se il compenso è adeguato, se esiste un disturbo misto, se l'ossigenazione e valutabile con la FiO₂ in atto, se lattato e cloro spiegano parte del quadro e se il trend autorizza a proseguire la NIV.<\/p>\n<p>Un altro errore è confondere la correzione della SpO₂ con il successo del trial. Se la SpO₂ migliora ma pH, PaCO₂, lattato, FiO₂ richiesta, LUS o lavoro respiratorio non si muovono nella direzione corretta, il paziente non deve essere considerato stabilizzato.<\/p>\n<h3>Bibliografia del Capitolo 12<\/h3>\n<p>1. Stewart PA. Modern quantitative acid-base chemistry. Can J Physiol Pharmacol. 1983;61(12):1444-1461.<\/p>\n<p>2. Figge J, Jabor A, Kazda A, Fencl V. Anion gap and hypoalbuminemia. Crit Care Med. 1998;26(11):1807-1810.<\/p>\n<p>3. Kellum JA. Clinical review: reunification of acid-base physiology. Crit Care. 2005;9(5):500-507.<\/p>\n<p>4. Morgan TJ. The meaning of acid-base abnormalities in the intensive care unit: effects of fluid administration. Crit Care. 2005;9(2):204-211.<\/p>\n<p>5. Morgan TJ. The Stewart approach - one clinician's perspective. Clin Biochem Rev. 2009;30(2):41-54.<\/p>\n<p>6. Wooten EW. Quantitative acid-base physiology using the Stewart model. Crit Care. 2004;8(6):448-452.<\/p>\n<p>7. Berend K, de Vries APJ, Gans ROB. Physiological approach to assessment of acid-base disturbances. N Engl J Med. 2014;371(15):1434-1445.<\/p>\n<p>8. Yee J, Durning SJ, O'Connor AB, Battistone MJ. Fundamentals of arterial blood gas interpretation. J Clin Med. 2022;11(17):5082.<\/p>","plain":"Obiettivo pratico L'emogasanalisi arteriosa (EGA) non deve essere letta come un elenco di valori separati, ma come una storia fisiologica compressa in pochi numeri. Nel paziente candidato a HFNC, CPAP o NIV in pressione di supporto, l'EGA aiuta a capire se il problema dominante sia ventilatorio, metabolico, perfusivo o di ossigenazione, e permette di distinguere una risposta reale da una stabilizzazione solo apparente. Nel percorso NIV ecoguidato, l'EGA non sostituisce la clinica, il ventilatore o l'ecografia. Li collega. La PaCO₂ racconta la ventilazione alveolare, il pH dice se il compenso sta ancora reggendo, bicarbonati e base excess descrivono la componente metabolica, lattato e cloro chiariscono il contesto perfusivo e iatrogeno, PaO₂ e FiO₂ definiscono l'ossigenazione. Il valore pratico non nasce dal singolo numero, ma dal trend dopo l'avvio o la modifica del supporto. Messaggio operativo. La domanda non e solo \"che pH ha il paziente?\". La domanda corretta e: quale variabile sta guidando il pH e che cosa devo cambiare nella NIV o nella terapia causale? Perché l'EGA è indispensabile nella NIV La NIV può migliorare rapidamente la saturazione senza correggere davvero il problema fisiopatologico. Una FiO₂ piu alta puo rendere la SpO₂ accettabile, mentre il paziente resta tachipnoico, ipercapnico, acidotico o con alto drive respiratorio. Allo stesso modo, una buona immagine ecografica iniziale non garantisce che il supporto stia ventilando il paziente o riducendo il lavoro dei muscoli respiratori. L'EGA serve quindi in tre situazioni principali: prima di iniziare il supporto, per definire la gravità è il meccanismo; durante il trial, per verificare se pH, PaCO₂ e ossigenazione si muovono nella direzione attesa; al momento della decisione, per evitare di prolungare una NIV inefficace. Nei pazienti ipercapnici, in particolare, non basta osservare la frequenza respiratoria o la SpO₂: il miglioramento deve comparire anche su pH e PaCO₂, tenendo conto della cronicità del disturbo. Prima di interpretare: campione, contesto e setting Prima di discutere formule e compensi, bisogna chiedersi se il campione sia affidabile e se il contesto sia noto. Una EGA senza ora del prelievo, FiO₂ reale, tipo di supporto, EPAP/PEEP, pressure support, frequenza respiratoria e terapia ricevuta nelle ore precedenti e un dato incompleto. Anche il miglior metodo interpretativo puo portare a conclusioni sbagliate se il campione e venoso, diluito, analizzato in ritardo o non coerente con il quadro clinico. Nel manuale, ogni EGA usata per decisioni NIV dovrebbe essere collegata a tre informazioni minime: supporto in atto e impostazioni principali, timing rispetto all'inizio o alla modifica della NIV, trend clinico del paziente. In assenza di queste informazioni, l'EGA rischia di diventare un numero isolato e non una guida al trattamento. Figura 12.1. Algoritmo integrato di lettura dell'EGA. La lettura parte dal pH identifica la variabile che lo guida e collega il dato alla modifica della NIV o della terapia causale. Figura 12.1. Algoritmo integrato di lettura dell'EGA. La lettura parte dal pH identifica la variabile che lo guida e collega il dato alla modifica della NIV o della terapia causale. Sequenza pratica di lettura Una sequenza fissa riduce gli errori. Il primo passaggio è il pH, che orienta verso acidemia, alcalemia o pH apparentemente normale. Il secondo è la PaCO₂, che identifica la componente ventilatoria immediata: se aumenta tende ad acidificare, se scende tende ad alcalinizzare. Il terzo passaggio e la componente metabolica, letta attraverso bicarbonati, base excess, anion gap, lattato, cloro e albumina. La lettura diventa affidabile solo quando si verifica il compenso atteso. Se il compenso non torna, il disturbo non è semplice. Nel paziente critico questo è frequente: una acidosi lattica può essere accompagnata da alcalosi respiratoria, una ipercapnia cronica da alcalosi metabolica ipocloremica, una acidosi ipocloremica da fluidi può sovrapporsi a sepsi o insufficienza renale. Domanda Variabile principale Significato pratico nella NIV Il pH e basso, alto o normale? pH Definisce il verso apparente del disturbo, ma non basta per giudicare la gravita. La ventilazione alveolare e adeguata? PaCO₂ PaCO₂ alta indica ipoventilazione effettiva o fatica; PaCO₂ molto bassa puo indicare alto drive. La componente metabolica e rilevante? HCO3 / BE Quantifica il peso metabolico globale, senza identificarne da sola la causa. Il compenso e quello atteso? Formule di compenso Se non torna, cercare un disturbo misto. Ci sono anioni non misurati? AG corretto per albumina Utile per lattato, chetoni, uremia, tossici e acidità mascherata. Il cloro o i fluidi stanno pesando? Na-Cl / SID semplificata Aiuta a riconoscere acidosi ipocloremica o alcalosi ipocloremica. L'ossigenazione e coerente? PaO2/FiO₂, SaO2, Hb La PaO2 isolata non basta senza FiO₂, PEEP/CPAP e Hb. Tabella 12.1. Sequenza pratica per leggere una EGA nel paziente in supporto non invasivo. pH normale: la trappola più frequente Un pH nel range normale non esclude un disturbo grave. Può essere il risultato di forze opposte: acidosi metabolica lattica e alcalosi respiratoria, acidosi ipocloremica e ipoalbuminemia, ipercapnia cronica e alcalosi metabolica da diuretici. Nel paziente settico, per esempio, lattato alto e bicarbonati bassi possono essere mascherati da una PaCO₂ molto bassa e da ipoalbuminemia. Per questo, ogni volta che il pH è normale ma PaCO₂, bicarbonati, base excess o lattato sono alterati, bisogna sospettare un disturbo misto. La stabilità del pH non deve rassicurare se le variabili sottostanti sono in conflitto. Il compenso va calcolato, non intuito Il compenso fisiologico ha limiti prevedibili e non sovracompensa. Se una acidosi metabolica ha una PaCO₂ piu bassa o piu alta di quanto previsto, esiste una componente respiratoria sovrapposta. Se un paziente ipercapnico ha bicarbonati piu elevati di quanto atteso per la cronicità, puo esserci una alcalosi metabolica aggiuntiva, spesso legata a diuretici, vomito, ipocloremia o carico di bicarbonati. Nel paziente in NIV, questa distinzione è decisiva. Una PaCO₂ alta con pH poco alterato può indicare cronicità e compenso renale. Una PaCO₂ alta con pH in rapido peggioramento indica ipoventilazione acuta o acuta su cronica e richiede una rivalutazione del supporto, delle perdite, della sincronia e della soglia di escalation. Disturbo primario Compenso atteso Quando sospettare disturbo misto Acidosi metabolica PaCO₂ = 1,5 x HCO3 + 8 +/- 2 PaCO₂ piu alta: componente respiratoria acida; PaCO₂ piu bassa: alcalosi respiratoria associata. Alcalosi metabolica PaCO₂ circa 0,7 x HCO3 + 20 +/- 5 PaCO₂ non adeguata al bicarbonato o quadro clinico non coerente. Acidosi respiratoria acuta HCO3 aumenta circa 1 mEq/L ogni +10 mmHg PaCO₂ Bicarbonato troppo alto o troppo basso rispetto al tempo di insorgenza. Acidosi respiratoria cronica HCO3 aumenta circa 3,5-4 mEq/L ogni +10 mmHg PaCO₂ pH piu basso del previsto o alcalosi metabolica sovrapposta. Alcalosi respiratoria acuta HCO3 scende circa 2 mEq/L ogni -10 mmHg PaCO₂ HCO3 molto basso: componente metabolica associata. Alcalosi respiratoria cronica HCO3 scende circa 4-5 mEq/L ogni -10 mmHg PaCO₂ Valori discordanti con storia clinica e trend. Tabella 12.2. Compensi attesi: il valore misurato va confrontato con quello previsto prima di definire un disturbo semplice. Ipercapnia acuta, cronica e acuta su cronica Nel paziente ipercapnico la storia clinica conta quanto il numero. Una PaCO₂ di 70 mmHg in un paziente con BPCO stabile e bicarbonati elevati non ha lo stesso significato di una PaCO₂ di 70 mmHg con pH 7,20 e bicarbonati solo lievemente aumentati. Nel primo caso il compenso renale suggerisce cronicità; nel secondo il problema e acuto o acuto su cronico. La NIV-PS è particolarmente razionale quando l'ipercapnia si associa ad acidemia, lavoro respiratorio elevato e segni di fatica. L'obiettivo iniziale non è normalizzare la PaCO₂, ma migliorare pH, comfort, frequenza respiratoria e lavoro dei muscoli respiratori. Nel BPCO cronico, inseguire una PaCO₂ normale può essere irrealistico e potenzialmente dannoso; conta il trend e la coerenza con il quadro clinico. Applicazione alla NIV. Nel paziente BPCO o OHS, una alcalosi metabolica ipocloremica puo mantenere bicarbonati elevati e rendere piu difficile la ventilazione. Guardare cloro, potassio e terapia diuretica prima di attribuire tutto ali muscoli respiratori. Base excess, anion gap e albumina Il base excess quantifica la componente metabolica globale, ma non dice quale meccanismo la generi. Un BE di -8 può dipendere da lattato, ipercloremia, insufficienza renale o più cause insieme. Per questo e necessario affiancare anion gap, albumina, lattato e cloro. L'anion gap è utile per cercare anioni non misurati, ma nel paziente critico deve essere corretto per l'albumina. L'ipoalbuminemia riduce gli anioni deboli plasmatici e abbassa il gap apparente, mascherando una acidosi ad alto gap. La formula pratica e: AG corretto = AG + 2,5 x (4 - albumina in g/dL). Un paziente settico ipoalbuminemico può avere un anion gap solo moderatamente aumentato, nonostante lattato elevato. Senza correzione si rischia di sottostimare la gravità del disturbo metabolico. Lattato: perfusione, stress e trend Il lattato non è sinonimo automatico di ipossia tissutale, ma resta un segnale di stress metabolico e perfusivo. Nel contesto della NIV, un lattato elevato cambia la lettura del trial: un paziente con insufficienza respiratoria e lattato in aumento non va interpretato solo come problema ventilatorio. Bisogna cercare shock, sepsi, ischemia, adrenergic drive, compromissione epatica o ridotta clearance. Il trend è più informativo del valore isolato. Se dopo l'avvio della NIV migliorano SpO₂ e PaCO₂ ma il lattato aumenta, la risposta non è completamente favorevole. Il paziente può essere ancora in debito perfusivo o emodinamicamente instabile, e il supporto non invasivo non deve distrarre dalla terapia causale. Ossigenazione: PaO₂ senza FiO₂ è un numero monco La PaO₂ isolata è poco interpretabile se non si conoscono FiO₂, EPAP/PEEP o CPAP, emoglobina, saturazione e contesto. Nel manuale NIV ecoguidato, l'ossigenazione va letta come relazione tra scambio gassoso, supporto impostato e richiesta di ossigeno. Una PaO₂ accettabile ottenuta con FiO₂ molto elevata non indica necessariamente successo. Il rapporto PaO₂/FiO₂ può aiutare a descrivere la gravità dell'ipossiemia, ma va contestualizzato: CPAP/EPAP, posizione, reclutamento, pattern LUS e comfort del paziente possono modificarne il significato. Anche il contenuto arterioso di ossigeno e rilevante: un paziente anemico puo avere PaO₂ e SaO2 accettabili ma trasporto di ossigeno insufficiente. Da ricordare. SpO₂ e PaO2 descrivono l'ossigenazione. Non dimostrano da sole che la ventilazione alveolare, il lavoro respiratorio o la perfusione siano migliorati. Stewart semplificato: cloro, SID, albumina e fluidi L'approccio tradizionale orienta rapidamente. Stewart aiuta a spiegare alcune EGA complesse, soprattutto nei pazienti critici trattati con fluidi, diuretici, catecolamine o in presenza di ipoalbuminemia. Non serve trasformarlo in un esercizio matematico: al letto del paziente basta ricordare tre variabili indipendenti principali: PaCO₂, strong ion difference (SID) e acidi deboli totali (ATOT), rappresentati soprattutto da albumina e fosfati. Figura 12.2. Le tre variabili indipendenti dell'approccio di Stewart. PaCO₂, SID e ATOT aiutano a capire quale meccanismo sta guidando il pH. Figura 12.2. Le tre variabili indipendenti dell'approccio di Stewart. PaCO₂, SID e ATOT aiutano a capire quale meccanismo sta guidando il pH. La scorciatoia più utile è guardare il cloro rispetto al sodio. Se sodio e cloro sono troppo vicini, la SID si riduce e il plasma tende all'acidosi. Se il cloro è basso rispetto al sodio, la SID aumenta e compare una tendenza alcalinizzante. Il lattato si comporta come anione forte: quando aumenta, riduce la SID e spinge verso acidosi. L'albumina bassa, invece, riduce gli acidi deboli e ha un effetto alcalinizzante, potendo mascherare acidosi lattica o ipercloremica. Questo è particolarmente utile dopo grandi volumi di NaCl 0,9%. La soluzione fisiologica ha SID pari a zero: se somministrata in quantità rilevante, aumenta il cloro rispetto al sodio e può generare acidosi metabolica ipercloremica. In quel caso il paziente può essere acidotico non per ipoperfusione, ma per effetto dei fluidi. Figura 12.3. Stewart nella pratica clinica. Correggere il pH significa agire sulla variabile che lo determina: ventilazione alveolare/NIV, composizione dei fluidi e degli ioni forti, albumina e fosfati. Figura 12.3. Stewart nella pratica clinica. Correggere il pH significa agire sulla variabile che lo determina: ventilazione alveolare/NIV, composizione dei fluidi e degli ioni forti, albumina e fosfati. EGA nei quattro timing della NIV ecoguidata L'EGA va inserita nel timing decisionale del trial non invasivo. Prima della NIV definisce indicazione, gravità e bersaglio. Nei primi 5-10 minuti il problema e soprattutto tecnico e di adattamento: l'EGA non sempre deve essere ripetuta, ma se il paziente peggiora bisogna verificare che il setting e la FiO₂ reale siano noti. A 30-60 minuti l'EGA deve iniziare a mostrare un trend coerente con la risposta fisiopatologica. A due ore contribuisce alla decisione: proseguire, correggere o interrompere il trial. Nel paziente ipercapnico la direzione attesa è miglioramento del pH e riduzione o stabilizzazione della PaCO₂ con minore lavoro respiratorio. Nel paziente ipossiemico, si cerca riduzione della FiO₂ necessaria, miglioramento del PaO₂/FiO₂ e coerenza con LUS e clinica. Nel paziente settico o ipoperfuso, il lattato e il base excess devono essere letti insieme alla perfusione, non attribuiti automaticamente al supporto respiratorio. Timing Domanda principale Cosa cercare nell'EGA Decisione pratica Prima della NIV Il supporto non invasivo ha indicazione? pH, PaCO₂, HCO3/BE, PaO2/FiO₂, lattato, eventuale AG e cloro. Scegliere HFNC, CPAP o NIV-PS in base al bersaglio fisiopatologico. 5-10 minuti Il supporto arriva davvero al paziente? EGA solo se peggioramento o instabilità; verificare FiO₂ reale e setting. Correggere interfaccia, perdite, trigger, cycling e comfort prima di aumentare pressioni. 30-60 minuti Sta comparendo una risposta fisiopatologica? pH e PaCO₂ in miglioramento se ipercapnia; FiO₂ riducibile; lattato non in aumento. Continuare se trend coerente; correggere se risposta incompleta. 2 ore Il trial va proseguito? pH/PaCO₂, PaO2/FiO₂, FiO₂ richiesta, lattato, coerenza con clinica e LUS. Proseguire, modificare strategia o interrompere trial se fallimento probabile. Tabella 12.3. Uso pratico dell'EGA nei quattro momenti principali del trial NIV ecoguidato. Esempi clinici essenziali Alcuni profili EGA ricorrono spesso nel percorso NIV e aiutano a collegare il dato biochimico alla scelta del supporto. Scenario Profilo EGA tipico Lettura NIV BPCO ipercapnico PaCO₂ alta, pH basso se acuto o acuto su cronico, HCO3 alto se compenso cronico. NIV-PS, controllo di pH/PaCO₂, comfort, perdite, auto-PEEP, cycling e cloro se alcalosi metabolica. Edema polmonare cardiogeno Ipossiemia, possibile ipocapnia da distress o ipercapnia se fatica; lattato se ipoperfusione. CPAP/EPAP se fenotipo congestizio; EGA deve migliorare insieme a LUS e clinica. Polmonite/ipossiemia de novo PaO2/FiO₂ ridotto, spesso PaCO₂ bassa da alto drive; PaCO₂ che sale e segnale sfavorevole. Trial breve, soglia bassa di escalation se drive, LUS e EGA non migliorano. Sepsi/lattato Acidosi metabolica lattica, spesso alcalosi respiratoria; pH anche normale se forze opposte. Non confondere compenso respiratorio con stabilità; trattare perfusione e causa. Acidosi ipercloremica BE negativo, HCO3 basso, lattato non elevato, Cl alto rispetto a Na. Rivedere fluidi e cloro; non attribuire automaticamente l'acidosi a fallimento ventilatorio. Tabella 12.4. Profili EGA frequenti e implicazioni nel trial NIV. Errore da evitare L'errore più frequente è usare l'EGA per nominare un disturbo senza tradurlo in una decisione. Scrivere 'acidosi respiratoria' o 'acidosi metabolica' non basta. Bisogna dire se il compenso è adeguato, se esiste un disturbo misto, se l'ossigenazione e valutabile con la FiO₂ in atto, se lattato e cloro spiegano parte del quadro e se il trend autorizza a proseguire la NIV. Un altro errore è confondere la correzione della SpO₂ con il successo del trial. Se la SpO₂ migliora ma pH, PaCO₂, lattato, FiO₂ richiesta, LUS o lavoro respiratorio non si muovono nella direzione corretta, il paziente non deve essere considerato stabilizzato. Bibliografia del Capitolo 12 1. Stewart PA. Modern quantitative acid-base chemistry. Can J Physiol Pharmacol. 1983;61(12):1444-1461. 2. Figge J, Jabor A, Kazda A, Fencl V. Anion gap and hypoalbuminemia. Crit Care Med. 1998;26(11):1807-1810. 3. Kellum JA. Clinical review: reunification of acid-base physiology. Crit Care. 2005;9(5):500-507. 4. Morgan TJ. The meaning of acid-base abnormalities in the intensive care unit: effects of fluid administration. Crit Care. 2005;9(2):204-211. 5. Morgan TJ. The Stewart approach - one clinician's perspective. Clin Biochem Rev. 2009;30(2):41-54. 6. Wooten EW. Quantitative acid-base physiology using the Stewart model. Crit Care. 2004;8(6):448-452. 7. Berend K, de Vries APJ, Gans ROB. Physiological approach to assessment of acid-base disturbances. N Engl J Med. 2014;371(15):1434-1445. 8. Yee J, Durning SJ, O'Connor AB, Battistone MJ. Fundamentals of arterial blood gas interpretation. J Clin Med. 2022;11(17):5082."},{"part":"Parte IV — Sintesi operativa finale","title":"Capitolo 13. Timing decisionale della NIV ecoguidata","tag":"Capitolo 13","html":"\n<h3>Obiettivo pratico<\/h3>\n<p>L’ecografia applicata alla ventilazione non invasiva non deve produrre un percorso parallelo alla clinica. Deve ordinare il ragionamento nel tempo. Il punto finale del manuale non è compilare una scheda, ma sapere quando iniziare un trial, come correggerlo nei primi minuti, come riconoscere una risposta fisiopatologica reale e quando interromperlo senza attendere oltre.<\/p>\n<p>L’intero percorso può essere letto attraverso quattro timing decisionali. Ogni timing ha una domanda dominante. Prima della NIV la domanda è se esista un’indicazione e quale bersaglio si voglia trattare. A 5–10 minuti la domanda è se il supporto stia arrivando davvero al paziente. A 30–60 minuti la domanda è se il sistema stia modificando il meccanismo fisiopatologico. A due ore la domanda non è più come aggiustare ancora qualcosa, ma se il trial debba proseguire oppure terminare.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_54.png\" alt=\"Figura 13.1. Sequenza temporale della NIV ecoguidata. Il percorso conclusivo riassume le quattro finestre decisionali: indicazione, adattamento tecnico, risposta fisiopatologica e decisione a due ore.\" loading=\"lazy\"><figcaption>Figura 13.1. Sequenza temporale della NIV ecoguidata. Il percorso conclusivo riassume le quattro finestre decisionali: indicazione, adattamento tecnico, risposta fisiopatologica e decisione a due ore.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_54.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 13.1. Sequenza temporale della NIV ecoguidata. Il percorso conclusivo riassume le quattro finestre decisionali: indicazione, adattamento tecnico, risposta fisiopatologica e decisione a due ore.<\/p>\n<h3>Schema 1. Prima di impostare la NIV: indicazione<\/h3>\n<p>La valutazione iniziale serve a evitare la domanda generica “metto la NIV?” e a sostituirla con una domanda più utile: quale problema voglio correggere con un supporto non invasivo? In questa fase si integrano quadro clinico, EGA, lavoro respiratorio, LUS, diaframma, muscoli accessori e tolleranza emodinamica alla pressione positiva.<\/p>\n<p><strong>Valutare: <\/strong>pattern LUS prevalente, distribuzione della perdita di aerazione, presenza di consolidamenti o versamento, segni di congestione, pattern A con ipercapnia, attività diaframmatica e muscolare, stato emodinamico e capacità del paziente di collaborare e proteggere le vie aeree.<\/p>\n<p><strong>Interpretare: <\/strong>un pattern A con ipercapnia orienta verso problema muscolare respiratorio e NIV in pressure support; un pattern congestizio ordinato sostiene CPAP/EPAP; un polmone disomogeneo con alto drive richiede prudenza e criteri di stop precoci; un consolidamento declive obbliga a chiedersi se vi sia reclutabilità o una causa non correggibile con pressione positiva.<\/p>\n<p><strong>Decisione: <\/strong>scegliere il supporto iniziale più coerente, cioè HFNC, CPAP/EPAP o NIV-PS, definendo già quale parametro avrà senso modificare e dopo quanto tempo rivalutare.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_55.png\" alt=\"Figura 13.2. Valutazione iniziale per indicare la NIV. Il supporto nasce dall’integrazione tra polmone, muscoli respiratori, cuore e condizioni del paziente.\" loading=\"lazy\"><figcaption>Figura 13.2. Valutazione iniziale per indicare la NIV. Il supporto nasce dall’integrazione tra polmone, muscoli respiratori, cuore e condizioni del paziente.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_55.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 13.2. Valutazione iniziale per indicare la NIV. Il supporto nasce dall’integrazione tra polmone, muscoli respiratori, cuore e condizioni del paziente.<\/p>\n<h3>Schema 2. A 5–10 minuti dall’inizio: adattamento e ottimizzazione della NIV<\/h3>\n<p>Nei primi minuti non si giudica ancora il successo fisiopatologico del trattamento. Si giudica la qualità dell’interazione tra paziente, interfaccia, circuito e ventilatore. Un trial può sembrare inefficace solo perché la maschera perde, il casco non è ben pressurizzato, il trigger è instabile, il cycling è tardivo o il paziente non tollera il presidio.<\/p>\n<p><strong>Valutare: <\/strong>comfort, claustrofobia, dolore, perdite, rumore, raggiungimento delle pressioni impostate, trigger inefficace o autotrigger, cycling precoce o ritardato, rise time, volume corrente stimato, frequenza respiratoria e uso evidente dei muscoli accessori.<\/p>\n<p><strong>Interpretare: <\/strong>se il paziente resta agitato o tachipnoico, prima di aumentare pressure support o EPAP bisogna capire se il supporto viene realmente erogato. Le asincronie e le perdite possono mantenere elevato il lavoro respiratorio anche con valori pressori apparentemente adeguati.<\/p>\n<p><strong>Decisione: <\/strong>ottimizzare interfaccia, tenuta, trigger, cycling, rise time e comfort. Solo dopo aver corretto la tecnica ha senso attribuire la mancata risposta al fenotipo o ai parametri impostati.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_56.png\" alt=\"Figura 13.3. Adattamento nei primi minuti. Prima di giudicare il fallimento bisogna correggere interfaccia, perdite, trigger, cycling, rise time e comfort.\" loading=\"lazy\"><figcaption>Figura 13.3. Adattamento nei primi minuti. Prima di giudicare il fallimento bisogna correggere interfaccia, perdite, trigger, cycling, rise time e comfort.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_56.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 13.3. Adattamento nei primi minuti. Prima di giudicare il fallimento bisogna correggere interfaccia, perdite, trigger, cycling, rise time e comfort.<\/p>\n<h3>Schema 3. A 30–60 minuti dall’inizio: risposta fisiopatologica<\/h3>\n<p>A 30–60 minuti il trial deve mostrare una direzione. Il miglioramento della SpO₂ da solo non basta: può dipendere solo dall’aumento della FiO₂ e mascherare un lavoro respiratorio ancora elevato. La risposta è favorevole quando clinica, ventilatore, EGA ed ecografia si muovono nella stessa direzione.<\/p>\n<p><strong>Valutare: <\/strong>frequenza respiratoria, comfort, FiO₂ necessaria, SpO₂/FiO₂, pH e PaCO₂ quando pertinenti, LUS seriale nelle zone più alterate, TFdi, intercostali, addominali, perdite residue, volumi stimati e tolleranza emodinamica.<\/p>\n<p><strong>Interpretare: <\/strong>una risposta reale associa riduzione del lavoro respiratorio, miglioramento o stabilità del LUS, FiO₂ riducibile, comfort migliore ed EGA coerente. Una risposta apparente si riconosce quando la saturazione migliora, ma FiO₂ resta alta, drive e muscoli restano attivi, LUS non migliora o peggiora, pH e PaCO₂ non cambiano nella direzione attesa.<\/p>\n<p><strong>Decisione: <\/strong>se la risposta è favorevole, proseguire mantenendo un piano di rivalutazione; se è incerta, correggere un solo elemento alla volta e rivalutare a breve; se è sfavorevole, non trasformare il trial in attesa passiva.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_57.png\" alt=\"Figura 13.4. Risposta fisiopatologica a 30–60 minuti. La risposta reale richiede coerenza tra clinica, EGA, LUS, muscoli respiratori e dati del ventilatore.\" loading=\"lazy\"><figcaption>Figura 13.4. Risposta fisiopatologica a 30–60 minuti. La risposta reale richiede coerenza tra clinica, EGA, LUS, muscoli respiratori e dati del ventilatore.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_57.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 13.4. Risposta fisiopatologica a 30–60 minuti. La risposta reale richiede coerenza tra clinica, EGA, LUS, muscoli respiratori e dati del ventilatore.<\/p>\n<h3>Schema 4. A due ore: proseguire la NIV o terminare il trial<\/h3>\n<p>A due ore il trial non invasivo deve avere una traiettoria leggibile. Non significa che ogni paziente debba essere completamente stabilizzato entro questo tempo, ma significa che la decisione deve essere esplicita. Continuare la NIV ha senso se il bersaglio iniziale è stato almeno parzialmente raggiunto. Insistere diventa pericoloso quando il supporto conserva una saturazione accettabile ma non riduce il drive, non migliora l’EGA e non modifica il pattern ecografico.<\/p>\n<p><strong>Valutare: <\/strong>trend clinico, EGA, FiO₂, LUS, muscoli respiratori, sensorio, secrezioni, protezione delle vie aeree, emodinamica, tolleranza dell’interfaccia e andamento dei parametri ventilatori.<\/p>\n<p><strong>Interpretare: <\/strong>il trial può proseguire se il paziente respira meno, lavora meno, richiede meno FiO₂, mostra stabilità o miglioramento ecografico e ha EGA coerente. Va terminato o convertito in altra strategia se peggiorano pH, PaCO₂, sensorio, emodinamica, LUS, drive respiratorio o tolleranza.<\/p>\n<p><strong>Decisione: <\/strong>proseguire NIV, iniziare de-escalation, passare a HFNC/ossigeno quando appropriato, oppure interrompere il trial e considerare escalation. La decisione deve derivare dal trend, non da un singolo numero.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_58.png\" alt=\"Figura 13.5. Decisione a due ore. Il trial può proseguire, essere corretto o de-escalato, oppure essere terminato se il trend è sfavorevole.\" loading=\"lazy\"><figcaption>Figura 13.5. Decisione a due ore. Il trial può proseguire, essere corretto o de-escalato, oppure essere terminato se il trend è sfavorevole.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_58.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 13.5. Decisione a due ore. Il trial può proseguire, essere corretto o de-escalato, oppure essere terminato se il trend è sfavorevole.<\/p>\n<h3>Conclusione<\/h3>\n<p>La NIV ecoguidata non è un algoritmo chiuso. È un modo per rendere visibili i bersagli della terapia e per impedire che il trial non invasivo diventi indefinito. La sonda non decide al posto del clinico, ma aiuta a distinguere ciò che sta migliorando da ciò che appare solo temporaneamente compensato. Il ventilatore non va regolato inseguendo numeri isolati: ogni manopola ha senso solo se collegata a un bersaglio, a una finestra temporale e a una rivalutazione. Il filo conduttore resta lo stesso in tutto il manuale: scegliere il supporto in base al fenotipo, ottimizzarlo nei primi minuti, verificare la risposta fisiopatologica entro la prima ora e decidere entro un tempo definito se proseguire o fermarsi.<\/p>\n<h3>Errore da evitare<\/h3>\n<p>L’errore conclusivo è considerare la NIV un tentativo generico da prolungare finché la SpO₂ rimane accettabile. La NIV deve avere un’indicazione, un bersaglio, una correzione tecnica precoce, una risposta fisiopatologica documentabile e una decisione entro tempi definiti.<\/p>\n<table class=\"manualTable\"><tr><th>Messaggi chiave<br>La valutazione iniziale definisce indicazione, fenotipo e bersaglio del supporto.<br>A 5–10 minuti si correggono tecnica, interfaccia, perdite e sincronia.<br>A 30–60 minuti si cerca una risposta fisiopatologica reale, non solo una SpO₂ migliore.<br>A due ore bisogna decidere se proseguire, correggere, de-escalare o terminare il trial.<br>Il trend integrato conta più del singolo dato.<\/th><\/tr><\/table>\n<h3>Bibliografia del Capitolo 13<\/h3>\n<p>1. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4.<\/p>\n<p>2. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p>\n<p>3. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI.<\/p>\n<p>4. Haaksma ME, Smit JM, Boussuges A, Demoule A, Dres M, Ferrari G, Formenti P, et al. EXpert consensus On Diaphragm UltraSonography in the critically ill (EXODUS): a Delphi consensus statement on the measurement of diaphragm ultrasound-derived parameters in a critical care setting. Crit Care. 2022;26(1):99. doi:10.1186/s13054-022-03975-5.<\/p>\n<p>5. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.<\/p>","plain":"Obiettivo pratico L’ecografia applicata alla ventilazione non invasiva non deve produrre un percorso parallelo alla clinica. Deve ordinare il ragionamento nel tempo. Il punto finale del manuale non è compilare una scheda, ma sapere quando iniziare un trial, come correggerlo nei primi minuti, come riconoscere una risposta fisiopatologica reale e quando interromperlo senza attendere oltre. L’intero percorso può essere letto attraverso quattro timing decisionali. Ogni timing ha una domanda dominante. Prima della NIV la domanda è se esista un’indicazione e quale bersaglio si voglia trattare. A 5–10 minuti la domanda è se il supporto stia arrivando davvero al paziente. A 30–60 minuti la domanda è se il sistema stia modificando il meccanismo fisiopatologico. A due ore la domanda non è più come aggiustare ancora qualcosa, ma se il trial debba proseguire oppure terminare. Figura 13.1. Sequenza temporale della NIV ecoguidata. Il percorso conclusivo riassume le quattro finestre decisionali: indicazione, adattamento tecnico, risposta fisiopatologica e decisione a due ore. Figura 13.1. Sequenza temporale della NIV ecoguidata. Il percorso conclusivo riassume le quattro finestre decisionali: indicazione, adattamento tecnico, risposta fisiopatologica e decisione a due ore. Schema 1. Prima di impostare la NIV: indicazione La valutazione iniziale serve a evitare la domanda generica “metto la NIV?” e a sostituirla con una domanda più utile: quale problema voglio correggere con un supporto non invasivo? In questa fase si integrano quadro clinico, EGA, lavoro respiratorio, LUS, diaframma, muscoli accessori e tolleranza emodinamica alla pressione positiva. Valutare: pattern LUS prevalente, distribuzione della perdita di aerazione, presenza di consolidamenti o versamento, segni di congestione, pattern A con ipercapnia, attività diaframmatica e muscolare, stato emodinamico e capacità del paziente di collaborare e proteggere le vie aeree. Interpretare: un pattern A con ipercapnia orienta verso problema muscolare respiratorio e NIV in pressure support; un pattern congestizio ordinato sostiene CPAP/EPAP; un polmone disomogeneo con alto drive richiede prudenza e criteri di stop precoci; un consolidamento declive obbliga a chiedersi se vi sia reclutabilità o una causa non correggibile con pressione positiva. Decisione: scegliere il supporto iniziale più coerente, cioè HFNC, CPAP/EPAP o NIV-PS, definendo già quale parametro avrà senso modificare e dopo quanto tempo rivalutare. Figura 13.2. Valutazione iniziale per indicare la NIV. Il supporto nasce dall’integrazione tra polmone, muscoli respiratori, cuore e condizioni del paziente. Figura 13.2. Valutazione iniziale per indicare la NIV. Il supporto nasce dall’integrazione tra polmone, muscoli respiratori, cuore e condizioni del paziente. Schema 2. A 5–10 minuti dall’inizio: adattamento e ottimizzazione della NIV Nei primi minuti non si giudica ancora il successo fisiopatologico del trattamento. Si giudica la qualità dell’interazione tra paziente, interfaccia, circuito e ventilatore. Un trial può sembrare inefficace solo perché la maschera perde, il casco non è ben pressurizzato, il trigger è instabile, il cycling è tardivo o il paziente non tollera il presidio. Valutare: comfort, claustrofobia, dolore, perdite, rumore, raggiungimento delle pressioni impostate, trigger inefficace o autotrigger, cycling precoce o ritardato, rise time, volume corrente stimato, frequenza respiratoria e uso evidente dei muscoli accessori. Interpretare: se il paziente resta agitato o tachipnoico, prima di aumentare pressure support o EPAP bisogna capire se il supporto viene realmente erogato. Le asincronie e le perdite possono mantenere elevato il lavoro respiratorio anche con valori pressori apparentemente adeguati. Decisione: ottimizzare interfaccia, tenuta, trigger, cycling, rise time e comfort. Solo dopo aver corretto la tecnica ha senso attribuire la mancata risposta al fenotipo o ai parametri impostati. Figura 13.3. Adattamento nei primi minuti. Prima di giudicare il fallimento bisogna correggere interfaccia, perdite, trigger, cycling, rise time e comfort. Figura 13.3. Adattamento nei primi minuti. Prima di giudicare il fallimento bisogna correggere interfaccia, perdite, trigger, cycling, rise time e comfort. Schema 3. A 30–60 minuti dall’inizio: risposta fisiopatologica A 30–60 minuti il trial deve mostrare una direzione. Il miglioramento della SpO₂ da solo non basta: può dipendere solo dall’aumento della FiO₂ e mascherare un lavoro respiratorio ancora elevato. La risposta è favorevole quando clinica, ventilatore, EGA ed ecografia si muovono nella stessa direzione. Valutare: frequenza respiratoria, comfort, FiO₂ necessaria, SpO₂/FiO₂, pH e PaCO₂ quando pertinenti, LUS seriale nelle zone più alterate, TFdi, intercostali, addominali, perdite residue, volumi stimati e tolleranza emodinamica. Interpretare: una risposta reale associa riduzione del lavoro respiratorio, miglioramento o stabilità del LUS, FiO₂ riducibile, comfort migliore ed EGA coerente. Una risposta apparente si riconosce quando la saturazione migliora, ma FiO₂ resta alta, drive e muscoli restano attivi, LUS non migliora o peggiora, pH e PaCO₂ non cambiano nella direzione attesa. Decisione: se la risposta è favorevole, proseguire mantenendo un piano di rivalutazione; se è incerta, correggere un solo elemento alla volta e rivalutare a breve; se è sfavorevole, non trasformare il trial in attesa passiva. Figura 13.4. Risposta fisiopatologica a 30–60 minuti. La risposta reale richiede coerenza tra clinica, EGA, LUS, muscoli respiratori e dati del ventilatore. Figura 13.4. Risposta fisiopatologica a 30–60 minuti. La risposta reale richiede coerenza tra clinica, EGA, LUS, muscoli respiratori e dati del ventilatore. Schema 4. A due ore: proseguire la NIV o terminare il trial A due ore il trial non invasivo deve avere una traiettoria leggibile. Non significa che ogni paziente debba essere completamente stabilizzato entro questo tempo, ma significa che la decisione deve essere esplicita. Continuare la NIV ha senso se il bersaglio iniziale è stato almeno parzialmente raggiunto. Insistere diventa pericoloso quando il supporto conserva una saturazione accettabile ma non riduce il drive, non migliora l’EGA e non modifica il pattern ecografico. Valutare: trend clinico, EGA, FiO₂, LUS, muscoli respiratori, sensorio, secrezioni, protezione delle vie aeree, emodinamica, tolleranza dell’interfaccia e andamento dei parametri ventilatori. Interpretare: il trial può proseguire se il paziente respira meno, lavora meno, richiede meno FiO₂, mostra stabilità o miglioramento ecografico e ha EGA coerente. Va terminato o convertito in altra strategia se peggiorano pH, PaCO₂, sensorio, emodinamica, LUS, drive respiratorio o tolleranza. Decisione: proseguire NIV, iniziare de-escalation, passare a HFNC/ossigeno quando appropriato, oppure interrompere il trial e considerare escalation. La decisione deve derivare dal trend, non da un singolo numero. Figura 13.5. Decisione a due ore. Il trial può proseguire, essere corretto o de-escalato, oppure essere terminato se il trend è sfavorevole. Figura 13.5. Decisione a due ore. Il trial può proseguire, essere corretto o de-escalato, oppure essere terminato se il trend è sfavorevole. Conclusione La NIV ecoguidata non è un algoritmo chiuso. È un modo per rendere visibili i bersagli della terapia e per impedire che il trial non invasivo diventi indefinito. La sonda non decide al posto del clinico, ma aiuta a distinguere ciò che sta migliorando da ciò che appare solo temporaneamente compensato. Il ventilatore non va regolato inseguendo numeri isolati: ogni manopola ha senso solo se collegata a un bersaglio, a una finestra temporale e a una rivalutazione. Il filo conduttore resta lo stesso in tutto il manuale: scegliere il supporto in base al fenotipo, ottimizzarlo nei primi minuti, verificare la risposta fisiopatologica entro la prima ora e decidere entro un tempo definito se proseguire o fermarsi. Errore da evitare L’errore conclusivo è considerare la NIV un tentativo generico da prolungare finché la SpO₂ rimane accettabile. La NIV deve avere un’indicazione, un bersaglio, una correzione tecnica precoce, una risposta fisiopatologica documentabile e una decisione entro tempi definiti. Messaggi chiave La valutazione iniziale definisce indicazione, fenotipo e bersaglio del supporto. A 5–10 minuti si correggono tecnica, interfaccia, perdite e sincronia. A 30–60 minuti si cerca una risposta fisiopatologica reale, non solo una SpO₂ migliore. A due ore bisogna decidere se proseguire, correggere, de-escalare o terminare il trial. Il trend integrato conta più del singolo dato. Bibliografia del Capitolo 13 1. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4. 2. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558. 3. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI. 4. Haaksma ME, Smit JM, Boussuges A, Demoule A, Dres M, Ferrari G, Formenti P, et al. EXpert consensus On Diaphragm UltraSonography in the critically ill (EXODUS): a Delphi consensus statement on the measurement of diaphragm ultrasound-derived parameters in a critical care setting. Crit Care. 2022;26(1):99. doi:10.1186/s13054-022-03975-5. 5. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016."}],"phenotypes":[{"id":"pump","title":"Muscoli respiratori / ipercapnia","question":"Il polmone è relativamente aerato ma il paziente lavora molto?","lus":"Pattern A prevalente, artefatti verticali scarsi o assenti, assenza di chiara perdita di aerazione come problema dominante.","pump":"TFdi elevata, TR intercostale elevato, FR elevata, possibile uso addominali se espirazione attiva o auto-PEEP.","ventilator":"Controllare PS effettivo, trigger, cycling, perdite, tempo espiratorio, auto-PEEP, comfort.","action":"Ottimizzare supporto di pressione e sincronia. Non aumentare EPAP/PEEP se non c'è un bersaglio di reclutamento.","reassess":"FR, comfort, pH/PaCO₂, TFdi, TR intercostale, addominali, perdite e asincronie.","risk":"Errore tipico: inseguire SpO₂ o FR aumentando EPAP quando il problema è i muscoli respiratori."},{"id":"congestion","title":"Congestione / interstizio ordinato","question":"La perdita di aerazione è diffusa e ordinata?","lus":"Artefatti verticali diffusi, relativamente simmetrici, linea pleurica poco alterata, assenza di marcata disomogeneità.","pump":"La muscoli respiratori può essere secondariamente attivata. La risposta favorevole dovrebbe ridurre FR, TFdi e TR intercostale e comfort respiratorio.","ventilator":"CPAP/EPAP come supporto di reclutamento/redistribuzione, PS se coesistono ipercapnia o fatica.","action":"EPAP/CPAP più terapia causale. Rivalutare precocemente LUS e lavoro respiratorio, non solo saturazione.","reassess":"ΔLUS, FiO₂, FR, comfort, TFdi, TR intercostale, emodinamica e terapia causale.","risk":"Errore tipico: chiamare edema ogni artefatto verticale senza guardare pleura, distribuzione e trend."},{"id":"hypoxemic","title":"Ipossiemia de novo / pattern disordinato","question":"Il quadro è disomogeneo, infiammatorio o ARDS-like?","lus":"Pleura irregolare, artefatti verticali non omogenei, aree di risparmio, consolidamenti subpleurici, pattern patchy.","pump":"Alto drive: TFdi e TR intercostale elevati e possibile attivazione addominale. Rischio di risposta solo apparente.","ventilator":"Trial NIV solo se sorvegliato e ben tollerato; considerare HFNC o cambio strategia se drive persiste.","action":"Definire una finestra breve di rivalutazione. Non prolungare NIV se FiO₂, FR, EGA o muscoli restano sfavorevoli.","reassess":"FR, FiO₂, SpO₂/FiO₂, EGA, LUS seriale, TFdi e TR intercostale, addominali, comfort, sensorio.","risk":"Errore tipico: considerare successo una SpO₂ migliore con drive e pattern ecografico non migliorati."},{"id":"atelectasis","title":"Atelettasia / post-operatorio / obesità","question":"La perdita di aerazione è declive, compressiva o potenzialmente reclutabile?","lus":"Consolidamenti declivi/posteriori, perdita regionale di aerazione, possibile broncogramma, versamento o compressione.","pump":"Il paziente può attivare diaframma/intercostali per compenso; addominali se espirazione attiva o tosse inefficace.","ventilator":"EPAP/CPAP se reclutabile, ma insieme a posizione, analgesia, fisioterapia, tosse/secrezioni.","action":"Trattare il meccanismo: reclutamento se utile, mobilizzazione, dolore, secrezioni, eventuale versamento.","reassess":"Ri-aerazione delle zone declivi, comfort, FiO₂, FR, broncogramma, secrezioni, dolore.","risk":"Errore tipico: considerare ogni consolidamento reclutabile aumentando solo EPAP."},{"id":"rv","title":"Cuore destro fragile / pressione poco tollerata","question":"La pressione positiva rischia di peggiorare emodinamica o VD?","lus":"LUS variabile: il problema dominante può non essere il polmone, ma la tolleranza alla pressione.","pump":"Muscoli respiratori possono restare attivi per ipoperfusione, discomfort o peggioramento meccanico.","ventilator":"Prudenza con EPAP/PEEP e pressioni alte. Valutare VD, VCI, PA, ipoperfusione.","action":"Usare il minimo supporto efficace, rivalutare emodinamica e considerare strategie alternative.","reassess":"PA, segni di ipoperfusione, VD, VCI/congestione, FiO₂, FR, comfort, EGA.","risk":"Errore tipico: aumentare pressione positiva in modo cieco se peggiora l’emodinamica."}],"phrases":{"favorevole":"Quadro coerente con risposta favorevole al supporto non invasivo: riduzione del lavoro respiratorio, miglioramento del comfort, parametri ventilatori tollerati e reperti ecografici stabili o in miglioramento. Proseguire supporto e rivalutare secondo andamento clinico.","apparente":"Quadro compatibile con risposta solo apparente: SpO₂ migliorata, ma persistenza di elevato lavoro respiratorio e/o FiO₂ elevata e/o reperti LUS/muscolari non migliorati. Necessaria rivalutazione ravvicinata e correzione mirata del supporto.","sfavorevole":"Quadro compatibile con risposta sfavorevole o fallimento probabile del trial non invasivo: persistenza o peggioramento di drive respiratorio, reperti ecografici sfavorevoli, emogas non migliorata o tolleranza insufficiente. Non prolungare il trial senza rivalutazione collegiale ed eventuale cambio di strategia.","deescalation":"Quadro stabile in miglioramento. Valutabile riduzione progressiva del supporto, un parametro alla volta, mantenendo controllo di frequenza respiratoria, FiO₂, comfort, LUS, muscoli respiratori ed emogas se indicata."},"appendices":[{"title":"Appendice 1. Scheda bedside LUS-NIV","desc":"Scheda pratica per identificazione, supporto, fenotipo, LUS, muscoli respiratori, clinica/emogas e decisione.","src":"images_app/app_image_01.png","download":"Appendice_1_Scheda_bedside_LUS_NIV.png"},{"title":"Appendice 2. Modello sintetico di referto","desc":"Referto LUS-NIV orientato alla decisione, con indicazione, supporto, reperti, muscoli respiratori, interpretazione e conclusione.","src":"images_app/app_image_02.png","download":"Appendice_2_Modello_sintetico_referto.png"},{"title":"Appendice 3. Checklist qualità immagini LUS","desc":"Checklist per acquisizione, monitoraggio, confronto seriale ed errori da evitare nella documentazione ecografica.","src":"images_app/app_image_03.png","download":"Appendice_3_Checklist_qualita_immagini_LUS.png"},{"title":"Appendice 4. Algoritmo finale LUS-NIV","desc":"Algoritmo operativo dal fenotipo alla decisione: supporto, tecnica, rivalutazione, decisione e documentazione.","src":"images_app/app_image_04.png","download":"Appendice_4_Algoritmo_finale_LUS_NIV.png"},{"title":"Appendice 5. Tabelle rapide","desc":"Promemoria rapido per pattern LUS, muscoli respiratori, fenotipo, supporto iniziale e segnali di fallimento.","src":"images_app/app_image_05.png","download":"Appendice_5_Tabelle_rapide.png"}],"atlas":[{"title":"Pattern A con sliding","tag":"Polmone aerato","type":"patternA","video":"videos/01_pattern_a_con_sliding.mp4","caption":"Pattern A con sliding conservato","vedi":"Linea pleurica con sliding conservato e artefatti orizzontali ripetitivi.","significa":"Nel paziente ipercapnico o ostruttivo orienta verso problema muscolare respiratorio più che verso reclutamento alveolare.","nivariation":"Valutare pressure support effettivo, trigger, cycling, auto-PEEP, comfort, perdite e muscoli respiratori.","errore":"Aumentare EPAP/PEEP solo perché il paziente desatura, senza bersaglio ecografico di reclutamento."},{"title":"Pattern A","tag":"Aerazione conservata","type":"patternA","video":"videos/02_pattern_a.mp4","caption":"Pattern A / artefatti orizzontali","vedi":"Artefatti orizzontali ripetitivi profondi alla linea pleurica.","significa":"Non vi è un bersaglio ecografico evidente per reclutamento in quella regione.","nivariation":"Integrare con FR, EGA, diaframma, intercostali, addominali, perdite e sincronia.","errore":"Usare un LUS poco alterato per sottostimare un paziente clinicamente instabile o ipercapnico."},{"title":"Sliding assente","tag":"Da chiarire","type":"barcode","video":"videos/03_sliding_assente.mp4","caption":"Assenza di sliding nel punto esplorato","vedi":"Assenza di scorrimento pleurico visibile.","significa":"Può essere pneumotorace, ma anche aderenze, atelectasia, apnea, scarsa ventilazione regionale o artefatto tecnico.","nivariation":"Non aumentare le pressioni in modo cieco. Cercare lung point e integrare con clinica, simmetria ed emodinamica.","errore":"Diagnosticare pneumotorace solo perché lo sliding non è evidente in un singolo punto."},{"title":"Lung point","tag":"Pneumotorace","type":"lungPoint","video":"videos/04_lung_point.mp4","caption":"Lung point","vedi":"Alternanza tra area con sliding e area senza sliding.","significa":"Nel contesto adeguato è un segno fortemente suggestivo di pneumotorace.","nivariation":"Se confermato e clinicamente riparametronte, trattare la causa prima di insistere con pressione positiva.","errore":"Proseguire NIV/CPAP aumentando pressioni senza chiarire il reperto."},{"title":"Artefatti verticali isolati","tag":"Perdita lieve","type":"verticalFew","video":"videos/05_artefatti_verticali_isolati.mp4","caption":"Artefatti verticali isolati","vedi":"Pochi artefatti verticali, separati, con linea pleurica relativamente conservata.","significa":"Possibile perdita lieve di aerazione o alterazione focale, da interpretare con distribuzione e contesto.","nivariation":"Non basta per definire congestione; valutare estensione, FiO₂, FR, comfort e trend.","errore":"Contare gli artefatti senza descrivere sede, estensione e qualità della linea pleurica."},{"title":"Artefatti verticali isolati: secondo esempio","tag":"Perdita lieve","type":"verticalFew","video":"videos/06_artefatti_verticali_diffusi_ordinati.mp4","caption":"Artefatti verticali isolati, secondo esempio","vedi":"Artefatti verticali non confluenti, separati da aree aerate.","significa":"Il reperto isolato non identifica automaticamente una causa.","nivariation":"Usarlo come parte del fenotipo ecografico, non come diagnosi isolata.","errore":"Chiamare automaticamente edema cardiogeno ogni artefatto verticale."},{"title":"Artefatti verticali diffusi ordinati","tag":"Perdita diffusa","type":"verticalOrdered","video":"videos/07_artefatti_verticali_confluenti.mp4","caption":"Artefatti verticali diffusi ordinati","vedi":"Artefatti verticali ripetuti, relativamente ordinati e separati da aree ancora aerate.","significa":"Se quadro coerente, può orientare verso congestione/interstizio, soprattutto con distribuzione simmetrica e pleura poco alterata.","nivariation":"Può esserci bersaglio per CPAP/EPAP e terapia causale. Verificare risposta con LUS seriale, FiO₂, FR e comfort.","errore":"Chiamare automaticamente edema ogni artefatto verticale senza descrivere distribuzione, pleura e trend."},{"title":"Artefatti verticali confluenti","tag":"Perdita severa","type":"verticalConfluent","video":"videos/08_pattern_disordinato.mp4","caption":"Artefatti verticali confluenti","vedi":"Artefatti verticali numerosi e ravvicinati, con riduzione degli spazi aerati.","significa":"Perdita più marcata di aerazione. Il significato cambia se il pattern è ordinato/congestizio o disordinato/infiammatorio.","nivariation":"Se congestizio, considerare CPAP/EPAP; se disordinato, trial breve e monitoraggio stretto.","errore":"Aumentare EPAP solo per inseguire SpO₂ senza valutare drive, FiO₂, LUS seriale ed emodinamica."},{"title":"Pattern disordinato","tag":"Ipossiemia de novo","type":"disordered","video":"videos/09_broncogramma_aereo_dinamico.mp4","caption":"Pattern disordinato","vedi":"Pleura irregolare, artefatti verticali non omogenei, aree di risparmio e perdita focale di aerazione.","significa":"Quadro compatibile con polmonite, pattern ARDS-like o danno disomogeneo.","nivariation":"Trial NIV solo se sorvegliato; rivalutare presto drive, FiO₂, LUS, muscoli ed EGA.","errore":"Considerare riuscito il trial solo perché la saturazione migliora mentre drive e LUS restano sfavorevoli."},{"title":"Consolidamento con shred sign","tag":"Score 3","type":"shred","video":"videos/10_shred_sign.mp4","caption":"Shred sign","vedi":"Area tissue-like subpleurica con margine profondo irregolare e frastagliato.","significa":"Perdita avanzata di aerazione o consolidamento periferico; non definisce da solo la causa.","nivariation":"Valutare broncogramma, secrezioni, versamento, distribuzione e reclutabilità prima di aumentare EPAP/PEEP.","errore":"Considerare ogni consolidamento come bersaglio reclutabile con più pressione."},{"title":"Broncogramma aereo dinamico","tag":"Vie aeree pervie","type":"broncoDyn","video":"videos/11_versamento_pleurico.mp4","caption":"Broncogramma aereo dinamico","vedi":"Punti o linee iperecogene mobili nel consolidamento, sincroni con il respiro.","significa":"Suggerisce passaggio d’aria nelle vie aeree del segmento consolidato.","nivariation":"Integrare con clinica e trend. La pressione positiva aiuta solo se migliora lavoro, scambi e reperti seriali.","errore":"Basare la decisione solo sul broncogramma, senza drive, FiO₂, EGA, comfort e andamento."},{"title":"Versamento pleurico","tag":"Compressione","type":"fluid","video":"videos/12_diaframma_tf.mp4","caption":"Versamento pleurico","vedi":"Raccolta anecogena o ipoecogena nello spazio pleurico, con possibile compressione del parenchima adiacente.","significa":"Può contribuire alla perdita di aerazione per compressione e limitare l’efficacia di una strategia basata solo su pressione positiva.","nivariation":"Valutare dimensione, distribuzione, polmone compresso, tolleranza clinica e trattamento causale.","errore":"Interpretare la mancata risposta alla NIV come semplice necessità di aumentare EPAP."},{"title":"Diaframma: thickening fraction","tag":"Muscoli respiratori","type":"diaphragm","video":"videos/13_sternocleidomastoideo_smp.mp4","caption":"Diaframma in zona di apposizione / TFdi","vedi":"Diaframma trilaminare in zona di apposizione con variazione di spessore tra fine espirazione e fine inspirazione.","significa":"La TFdi descrive l’attività contrattile del diaframma durante respiro spontaneo o assistito.","nivariation":"TFdi alta può indicare alto drive/sottoassistenza; TFdi molto bassa può indicare iperassistenza o disfunzione.","errore":"Interpretare TFdi senza considerare PS, EPAP, FR, comfort e asincronie."},{"title":"Intercostali parasternal: thickening ratio","tag":"Muscolo inspiratorio accessorio","type":"intercostal","video":"videos/14_intercostali_parasternali.mp4","caption":"Video reale H.264: finestra parasternale per valutazione dinamica degli intercostali e calcolo del TR intercostale.","vedi":"Spessore del muscolo intercostale parasternale tra due coste, misurato in espirazione e inspirazione.","significa":"Un TR intercostale elevato suggerisce attivazione inspiratoria accessoria e possibile aumento del drive o sottoassistenza.","nivariation":"Integrare con TFdi, FR, comfort, PS effettivo, trigger, cycling e asincronie.","errore":"Misurare pettorale o tessuti superficiali pensando di misurare l’intercostale.","poster":"images_app/app_image_06.png"},{"title":"Addominali espiratori: OE, OI, TrA","tag":"Muscolo espiratorio","type":"abdominal","video":"videos/15_parete_addominale.mp4","caption":"Video reale H.264: parete addominale laterale con riconoscimento di obliquo esterno, obliquo interno e trasverso.","vedi":"Tre strati laterali: obliquo esterno, obliquo interno e trasverso dell’addome, valutati durante il ciclo respiratorio.","significa":"L’attivazione addominale indica espirazione attiva, possibile carico espiratorio, discomfort, ostruzione, auto-PEEP o risposta sfavorevole al supporto.","nivariation":"Valutare se EPAP/PEEP, trigger, cycling, tempo espiratorio o perdite stanno aumentando il lavoro espiratorio.","errore":"Interpretare l’addome come semplice numero senza guardare fase respiratoria, ventilatore e comfort.","poster":"images_app/app_image_07.png"}],"asynchronyBoxes":[{"title":"Scheda 3.1","subtitle":"Asincronie di trigger e di flusso nella NIV","src":"images_app/app_image_08.png"},{"title":"Scheda 3.2","subtitle":"Asincronie terminali nella NIV","src":"images_app/app_image_09.png"}],"asynchronyCards":[{"phase":"Inizio inspirazione","title":"Trigger ritardato","what":"Il supporto arriva in ritardo rispetto allo sforzo inspiratorio.","causes":"Trigger poco sensibile, auto-PEEP, sforzo debole, drive ridotto.","action":"Controllare perdite e interfaccia, aumentare la sensibilità del trigger entro limiti adeguati, ridurre auto-PEEP, ottimizzare EPAP/PEEP."},{"phase":"Inizio inspirazione","title":"Sforzo inefficace","what":"Lo sforzo del paziente non attiva il ventilatore.","causes":"Auto-PEEP, soglia di trigger troppo alta, debolezza, sovra-assistenza o sedazione.","action":"Rendere il trigger più sensibile, ridurre iperinflazione dinamica, rivalutare assistenza e sedazione."},{"phase":"Inizio inspirazione","title":"Autotrigger","what":"Il ventilatore eroga atti non richiesti dal paziente.","causes":"Perdite, condensa, secrezioni, oscillazioni cardiache, trigger troppo sensibile.","action":"Correggere perdite, svuotare condensa, aspirare/igienizzare circuito, ridurre sensibilità del trigger se eccessiva."},{"phase":"Durante inspirazione","title":"Asincronia di flusso","what":"Il flusso erogato non segue la domanda inspiratoria del paziente.","causes":"Drive elevato, rise time lento, supporto insufficiente, modalità non adeguata.","action":"Adeguare rise time, supporto di pressione, comfort, interfaccia e strategia complessiva."},{"phase":"Fine inspirazione","title":"Doppio trigger","what":"Due atti assistiti compaiono durante un singolo sforzo prolungato.","causes":"Cycling troppo precoce, tempo inspiratorio breve, supporto insufficiente, drive elevato.","action":"Prolungare assistenza inspiratoria se appropriato, rivedere soglia ETS/cycling, ottimizzare supporto e drive."},{"phase":"Fine inspirazione","title":"Cycling precoce","what":"Il ventilatore termina l’assistenza prima che lo sforzo del paziente sia concluso.","causes":"ETS troppo alta, tempo inspiratorio breve, supporto basso, costante di tempo breve.","action":"Ridurre soglia ETS se appropriato, allungare tempo inspiratorio se applicabile, ottimizzare supporto."},{"phase":"Fine inspirazione","title":"Cycling ritardato","what":"Il ventilatore continua l’inspirazione quando il paziente vuole espirare.","causes":"Perdite, ETS troppo bassa, tempo inspiratorio lungo, supporto eccessivo, costante di tempo lunga.","action":"Correggere perdite, aumentare ETS se appropriato, ridurre tempo inspiratorio e supporto se eccessivi."}],"asynchronyVideos":[{"id":"01_trigger_ritardato","title":"Trigger ritardato","desc":"Ritardo tra sforzo del paziente e inizio del supporto ventilatorio.","video":"videos/16_trigger_ritardato.mp4","poster":"images_app/app_image_10.png"},{"id":"02_sforzo_inefficace","title":"Sforzo inspiratorio inefficace","desc":"Sforzo del paziente non seguito da un atto ventilatorio.","video":"videos/17_sforzo_inefficace.mp4","poster":"images_app/app_image_11.png"},{"id":"03_autotrigger","title":"Autotrigger","desc":"Atti erogati dal ventilatore senza reale richiesta inspiratoria del paziente.","video":"videos/18_autotrigger.mp4","poster":"images_app/app_image_12.png"},{"id":"04_asincronia_flusso","title":"Asincronia di flusso","desc":"Flusso erogato non adeguato alla richiesta inspiratoria del paziente.","video":"videos/19_asincronia_di_flusso.mp4","poster":"images_app/app_image_13.png"},{"id":"05_doppio_trigger","title":"Doppio trigger","desc":"Due atti ravvicinati per tempo inspiratorio insufficiente rispetto alla richiesta del paziente.","video":"videos/20_doppio_trigger.mp4","poster":"images_app/app_image_14.png"},{"id":"06_cycling_precoce","title":"Cycling precoce","desc":"Fine anticipata dell’inspirazione rispetto allo sforzo del paziente.","video":"videos/21_cycling_precoce.mp4","poster":"images_app/app_image_15.png"},{"id":"07_cycling_ritardato","title":"Cycling ritardato","desc":"Inspirazione prolungata oltre la richiesta inspiratoria del paziente.","video":"videos/22_cycling_ritardato.mp4","poster":"images_app/app_image_16.png"}],"materials":{"figures":[{"index":1,"caption":"Figura 1.1. Lo spettro del supporto respiratorio non invasivo. Ossigenoterapia convenzionale, HFNC, CPAP e NIV in pressione di supporto rappresentano livelli differenti di intervento. Non sono equivalenti: aumentano FiO₂, flusso, pressione continua o supporto inspiratorio in modo diverso.","file":"figure_scaricabili/figura_01.png"},{"index":2,"caption":"Figura 1.2. CPAP vs NIV-PS. La CPAP mantiene una pressione positiva continua. Nella NIV in pressione di supporto, la pressione sale da EPAP a IPAP durante l’inspirazione; la differenza tra i due livelli è il pressure support.","file":"figure_scaricabili/figura_02.png"},{"index":3,"caption":"Figura 1.3. EPAP/PEEP e pressure support: due parametri regolabili diversi. EPAP/PEEP e pressure support rispondono a problemi diversi. La prima agisce soprattutto su aerazione e ossigenazione; il secondo agisce su lavoro inspiratorio e ventilazione alveolare.","file":"figure_scaricabili/figura_03.png"},{"index":4,"caption":"Figura 2.1. Parametri NIV: cosa controllano davvero. I parametri principali della NIV non sono equivalenti: EPAP/PEEP, IPAP, pressure support, FiO₂, trigger, cycling, rise time e backup rate hanno bersagli differenti.","file":"figure_scaricabili/figura_04.png"},{"index":5,"caption":"Figura 2.2. PSV o NIV-PS. Il paziente triggera il ventilatore; il supporto pressorio sale sopra EPAP/PEEP e termina quando il flusso inspiratorio scende sotto la soglia di cycling.","file":"figure_scaricabili/figura_05.png"},{"index":6,"caption":"Figura 2.3. Ciclo assistito in NIV-PS: trigger, rise time e cycling. Il trigger avvia l’assistenza, il rise time determina la velocità di salita della pressione, il cycling definisce il passaggio all’espirazione. Molte asincronie dipendono da questi tre elementi più che dal valore assoluto delle pressioni.","file":"figure_scaricabili/figura_06.png"},{"index":7,"caption":"Figura 2.4. Modalità S/T. Gli atti spontanei assistiti restano prevalenti; se il paziente non triggera, la frequenza di backup genera un atto temporizzato.","file":"figure_scaricabili/figura_07.png"},{"index":8,"caption":"Figura 2.5. Lettura rapida del ventilatore durante NIV. I dati del ventilatore devono essere interpretati insieme a clinica ed ecografia. Il numero sul display conta solo se è coerente con il paziente.","file":"figure_scaricabili/figura_08.png"},{"index":9,"caption":"Figura 3.1. SIMV-VC + PSV. Atti obbligati sincronizzati a volume controllato si alternano a respiri spontanei assistiti in pressione di supporto.","file":"figure_scaricabili/figura_09.png"},{"index":10,"caption":"Figura 3.2. SIMV-PC + PSV. Atti obbligati sincronizzati a pressione controllata si alternano a respiri spontanei assistiti in pressione di supporto.","file":"figure_scaricabili/figura_10.png"},{"index":11,"caption":"Figura 3.3. PCV. La pressione inspiratoria è controllata; il flusso è tipicamente decrescente e il volume corrente dipende da compliance, resistenze, perdite e sforzo del paziente.","file":"figure_scaricabili/figura_11.png"},{"index":12,"caption":"Figura 3.4. VCV. Il volume e il flusso inspiratorio sono predefiniti; la pressione necessaria per erogarli diventa una conseguenza della meccanica respiratoria.","file":"figure_scaricabili/figura_12.png"},{"index":13,"caption":"Figura 3.5. CPAP. La pressione resta positiva e sostanzialmente costante durante tutto il ciclo; il paziente respira spontaneamente sopra il livello di CPAP/PEEP.","file":"figure_scaricabili/figura_13.png"},{"index":14,"caption":"Figura 3.5. CPAP. La pressione resta positiva e sostanzialmente costante durante tutto il ciclo; il paziente respira spontaneamente sopra il livello di CPAP/PEEP.","file":"figure_scaricabili/figura_14.png"},{"index":15,"caption":"Figura 3.6. Modalità NIV: tradurre il nome in fisiologia. La stessa modalità può essere presentata con nomi diversi, ma al letto del paziente bisogna sempre capire che cosa resta costante, che cosa varia e quale bersaglio fisiopatologico si vuole correggere.","file":"figure_scaricabili/figura_15.png"},{"index":16,"caption":"Figura 3.7. PRVC. La modalità usa un controllo pressometrico adattato respiro per respiro per raggiungere un volume target, mantenendo un profilo di flusso decrescente.","file":"figure_scaricabili/figura_16.png"},{"index":17,"caption":"Figura 3.8. VAPS/AVAPS. Il supporto pressorio varia progressivamente per avvicinare il volume corrente al target impostato; il monitoraggio resta indispensabile in presenza di perdite o meccanica variabile.","file":"figure_scaricabili/figura_17.png"},{"index":18,"caption":"Figura 3.9. Circuiti NIV: monotubo e bitubo. Nel circuito monotubo inspirazione ed espirazione condividono la stessa linea e l’eliminazione della CO₂ dipende da perdita intenzionale o valvola. Nel circuito bitubo le branche inspiratoria ed espiratoria sono separate, con diversa gestione della misura del flusso espiratorio.","file":"figure_scaricabili/figura_18.png"},{"index":19,"caption":"Figura 4.1. Interfacce: scelta pratica e limiti principali. Le interfacce non sono equivalenti. La scelta deve tenere conto di problema respiratorio, urgenza, comfort, durata prevista del trattamento, rischio di perdite e necessità di pressione positiva stabile.","file":"figure_scaricabili/figura_19.png"},{"index":20,"caption":"Figura 4.2. Problemi precoci: cosa sospettare e cosa correggere. Perdite, fastidio, asincronie, distensione gastrica, lesioni cutanee e secchezza/secrezioni devono essere ricercati attivamente nelle prime fasi del trial non invasivo.","file":"figure_scaricabili/figura_20.png"},{"index":21,"caption":"Figura 21","file":"figure_scaricabili/figura_21.png"},{"index":22,"caption":"Figura 5.2. Esempi ecografici: LUS score 0–3. Esempi didattici di pattern ecografico progressivo: polmone aerato, perdita lieve di aerazione, perdita severa di aerazione e consolidamento. Il punteggio va sempre letto insieme a distribuzione, linea pleurica e contesto clinico. Immagini adattate dal materiale didattico ADET dell’autore.","file":"figure_scaricabili/figura_22.png"},{"index":23,"caption":"Figura 5.3. Consolidamento: immagini ecografiche e significato operativo. Il broncogramma statico e dinamico, insieme a C-lines, shred sign ed epatizzazione, aiuta a interpretare il consolidamento e a stimare il ruolo atteso della pressione positiva. Immagini ecografiche tratte dal materiale fornito dall’autore e impaginate a scopo didattico.","file":"figure_scaricabili/figura_23.png"},{"index":24,"caption":"Figura 5.4. Dal reperto alla scelta ventilatoria. Sintesi operativa del passaggio dal reperto ecografico alla decisione sul supporto non invasivo.","file":"figure_scaricabili/figura_24.png"},{"index":25,"caption":"Figura 6.1. Protocollo pratico a 12 zone per NIV. Le regioni anteriori e laterali permettono una valutazione rapida iniziale; le regioni posteriori sono fondamentali per consolidamenti, atelettasie declivi e versamenti.","file":"figure_scaricabili/figura_25.png"},{"index":26,"caption":"Figura 6.2. Lung ultrasound: reperto, significato, effetto sulla NIV. Il reperto ecografico diventa utile quando modifica supporto, parametri, terapia causale o soglia di escalation.","file":"figure_scaricabili/figura_26.png"},{"index":27,"caption":"Figura 6.3. LUS seriale: risposta reale, incerta o sfavorevole. La variazione del LUS nel tempo aiuta a distinguere il miglioramento reale dalla stabilità apparente.","file":"figure_scaricabili/figura_27.png"},{"index":28,"caption":"Figura 7.1. Spessore diaframmatico e Thickening Fraction. Lo spessore del diaframma si misura nella zona di apposizione con sonda lineare. Tdi-exp descrive il valore basale e consente il monitoraggio dell’atrofia; Tdi-insp consente di calcolare la TFdi, cioè la variazione percentuale dello spessore durante l’inspirazione.","file":"figure_scaricabili/figura_28.png"},{"index":29,"caption":"Figura 7.2. Escursione diaframmatica: finestra e misura. L’escursione diaframmatica misura lo spostamento della cupola diaframmatica, si misura in M-mode. Durante NIV, l’escursione diaframmatica interpretata dopo spessore/TFdi e insieme a lavoro respiratorio, supporto impostato, sincronia ed EGA.","file":"figure_scaricabili/figura_29.png"},{"index":30,"caption":"Figura 7.3. Ecografia dei muscoli intercostali: Thickness Ratio. Gli intercostali si valutano con sonda lineare nello spazio intercostale. Il TR descrive l’ispessimento inspiratorio e può aiutare a riconoscere compenso muscolare, distress o supporto ventilatorio insufficiente.","file":"figure_scaricabili/figura_30.png"},{"index":31,"caption":"Figura 7.4. Ecografia dei muscoli addominali: parete laterale e TFadb. Gli addominali laterali, obliquo esterno, obliquo interno e trasverso dell’addome, possono essere valutati con sonda lineare. La TFadb aiuta a riconoscere espirazione attiva e aumento del carico espiratorio.","file":"figure_scaricabili/figura_31.png"},{"index":32,"caption":"Figura 7.5. Muscoli respiratori durante NIV: lettura integrata. La combinazione di TFdi, escursione diaframmatica, TR intercostale, TFadb, frequenza respiratoria, comfort e EGA aiuta a distinguere assistenza insufficiente, assistenza adeguata, sovra-assistenza e ostruzione/iperinflazione.","file":"figure_scaricabili/figura_32.png"},{"index":33,"caption":"Figura 7.6. Pressione positiva: tracce ventilatorie ed effetti emodinamici. La traccia ventilatoria di pressione, flusso e volume è stata separata dai box emodinamici per mantenere leggibile il ciclo respiratorio. Il messaggio operativo resta lo stesso: durante l’inspirazione a pressione positiva aumentano pressione intratoracica e volume polmonare, con effetti su precarico, postcarico e tolleranza di ventricolo destro e ventricolo sinistro.","file":"figure_scaricabili/figura_33.png"},{"index":34,"caption":"Figura 8.1. Triangolo decisionale: polmone, muscolo respiratorio, cuore. Il supporto non invasivo modifica contemporaneamente aerazione polmonare, lavoro dei muscoli respiratori e interazione cuore-polmone. La scelta della modalità e dei parametri deve integrare questi tre livelli.","file":"figure_scaricabili/figura_34.png"},{"index":35,"caption":"Figura 8.2. Dal fenotipo ecografico alla scelta del supporto. La scelta iniziale tra HFNC, CPAP/EPAP e NIV in pressure support dipende dal fenotipo dominante: muscoli respiratori, congestione, ipossiemia non cardiogena, atelettasia o tolleranza emodinamica.","file":"figure_scaricabili/figura_35.png"},{"index":36,"caption":"Figura 8.3. Prima ora di NIV ecoguidata. Sequenza pratica per evitare trial non invasivi indefiniti: fenotipo iniziale, controllo tecnico, risposta fisiologica e decisione entro tempi definiti.","file":"figure_scaricabili/figura_36.png"},{"index":37,"caption":"Figura 9.1. I parametri regolabili del settaggio NIV ecoguidato. Pressure support, EPAP/PEEP, FiO₂, trigger/cycling e interfaccia sono riportati in forma tabellare per collegare ogni parametro regolabile al bersaglio fisiologico, all’indicazione pratica e alla rivalutazione.","file":"figure_scaricabili/figura_37.png"},{"index":38,"caption":"Figura 9.2. Titolazione del pressure support. Il pressure support deve scaricare i muscoli respiratori senza generare sovra-assistenza, volumi eccessivi o asincronie. TFdi, TR intercostale,
