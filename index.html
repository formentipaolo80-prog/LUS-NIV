ort del paziente sono segnali importanti. Bersaglio: ossigenazione senza meccanismo chiaro Aumentare EPAP/PEEP solo per inseguire la SpO₂ è rischioso. Se LUS non migliora, il drive resta alto e il paziente richiede FiO₂ elevata, la risposta è incerta o sfavorevole. Figura 9.3. Titolazione di EPAP/PEEP con LUS e cuore. Ogni incremento di EPAP/PEEP deve avere un bersaglio: congestione, reclutamento, auto-PEEP o atelettasia. Dopo la modifica vanno rivalutati LUS, FiO₂, frequenza respiratoria, comfort e tolleranza emodinamica. Figura 9.3. Titolazione di EPAP/PEEP con LUS e cuore. Ogni incremento di EPAP/PEEP deve avere un bersaglio: congestione, reclutamento, auto-PEEP o atelettasia. Dopo la modifica vanno rivalutati LUS, FiO₂, frequenza respiratoria, comfort e tolleranza emodinamica. FiO₂: stabilizza, ma non cura il meccanismo La FiO₂ è necessaria per garantire un’ossigenazione sicura, ma non corregge il problema fisiopatologico. Se si aumenta solo la FiO₂ senza che si riducano lavoro respiratorio, LUS score o drive respiratorio, si rischia di mascherare il fallimento del supporto NIV. In pratica, una FiO₂ che scende dopo avvio del supporto è un segnale favorevole. Una FiO₂ che resta alta, anche con SpO₂ accettabile, è un segnale di risposta incompleta. Se il paziente resta tachipnoico, con muscoli attivi e LUS score invariato o peggiorato, non bisogna interpretare una SpO₂ sufficiente come successo. Trigger , cycling e rise time Molti problemi di NIV nascono dalle asincronie. L’ecografia può mostrare diaframma e intercostali ancora attivi, ma la causa può essere una cattiva interazione paziente-ventilatore. Trigger inefficace Il paziente inspira, ma il ventilatore non eroga il pressure support o lo eroga in ritardo. Clinicamente si vedono sforzi inspiratori, fastidio, tachipnea e aumento del reclutamento dei muscoli accessori. Nel paziente BPCO può dipendere anche da auto-PEEP. La correzione passa da ottimizzazione di trigger, perdite, EPAP/PEEP e interfaccia. Cycling ritardato Il ventilatore continua a insufflare quando il paziente vorrebbe espirare. Questo è frequente con perdite e pressure support elevato. Può peggiorare fastidio, addominali attivi, espirazione forzata e asincronia. Cycling precoce Il ventilatore termina l’inspirazione troppo presto. Il paziente resta affamato d’aria, può richiamare subito un altro atto e mantenere alto drive e FR. Rise time Un rise time troppo lento può causare fame d’aria; viceversa, un rise time troppo rapido può aumentare fastidio, perdite e pressurizzazione brusca. Figura 9.4. Prima di cambiare i parametri: controllare tecnica e sincronia. Perdite, trigger inefficace, cycling errato e rise time inadeguato possono simulare assistenza inefficace o fallimento. Prima di aumentare PS o EPAP/PEEP bisogna correggere la tecnica. Figura 9.4. Prima di cambiare i parametri: controllare tecnica e sincronia. Perdite, trigger inefficace, cycling errato e rise time inadeguato possono simulare assistenza inefficace o fallimento. Prima di aumentare PS o EPAP/PEEP bisogna correggere la tecnica. Interfaccia: parte del settaggio, non dettaglio logistico La scelta dell’interfaccia modifica efficacia, perdite, comfort, asincronie e tolleranza. Una maschera troppo stretta può essere intollerabile; una maschera troppo lasca rende instabile il trigger . Il casco può essere utile in alcuni contesti, ma richiede attenzione a flussi, pressurizzazione, rumore, ritardo di risposta e comfort. Nella pratica, l’interfaccia va considerata una vera variabile regolabile terapeutica. Se il paziente non tollera l’interfaccia, il miglior algoritmo ecografico non funziona Errore da evitare L’errore più frequente è aumentare progressivamente tutto: più FiO₂, più pressure support, più EPAP/PEEP, maschera più stretta. Questo produce una NIV apparentemente più intensa, ma non necessariamente più efficace. Il settaggio ecoguidato non è aumentare i numeri: è scegliere il parametro regolabile giusto per il bersaglio giusto. Bibliografia del Capitolo 9 1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016. 2. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7. 3. Vignaux L, Vargas F, Roeseler J, Tassaux D, Thille AW, Kossowsky MP, Brochard L, Jolliet P. Patient-ventilator asynchrony during non-invasive ventilation for acute respiratory failure: a multicenter study. Intensive Care Med. 2009;35(5):840-846. doi:10.1007/s00134-009-1416-5. 4. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379. 5. Vivier E, Mekontso Dessap A, Dimassi S, Vargas F, Lyazidi A, Thille AW, et al. Diaphragm ultrasonography to estimate the work of breathing during non-invasive ventilation. Intensive Care Med. 2012;38(5):796-803. doi:10.1007/s00134-012-2547-7. 6. Bouhemad B, Brisson H, Le-Guen M, Arbelot C, Lu Q, Rouby JJ. Bedside ultrasound assessment of positive end-expiratory pressure-induced lung recruitment. Am J Respir Crit Care Med. 2011;183(3):341-347. doi:10.1164/rccm.201003-0369OC. 7. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558. 8. Vieillard-Baron A, Matthay M, Teboul JL, Bein T, Schultz M, Magder S, Marini JJ. Experts’ opinion on management of hemodynamics in ARDS patients: focus on the effects of mechanical ventilation. Intensive Care Med. 2016;42(5):739-749. doi:10.1007/s00134-016-4326-3."},{"part":"Parte III — Scegliere e settare il supporto","title":"Capitolo 10. Monitoraggio, fallimento e de-escalation","tag":"Capitolo 10","html":"\n<h3>Obiettivo pratico<\/h3>\n<p>La NIV ecoguidata non termina quando si imposta il ventilatore. Inizia davvero quando si osserva la risposta. Il monitoraggio serve a distinguere tre situazioni molto diverse:<\/p>\n<p>successo reale, quando il supporto corregge il meccanismo fisiopatologico;<\/p>\n<p>risposta apparente, quando migliora la SpO₂ ma non migliorano <em>drive<\/em>, reclutamento muscolare, LUS score o EGA;<\/p>\n<p>fallimento, quando il trial non invasivo sta ritardando una strategia più adeguata.<\/p>\n<p>Il monitoraggio non deve diventare un accumulo di misure. Deve essere una sequenza ordinata di controlli che risponde a domande pratiche: il paziente respira meglio? Il polmone si sta ri-aerando? La muscoli respiratori è scaricata? L’EGA migliora? Il cuore tollera la pressione positiva? Posso ridurre il supporto o devo cambiare strada?<\/p>\n<h3>Il principio: trend, non fotografia<\/h3>\n<p>Una singola valutazione ecografica ha valore limitato. La forza dell’approccio ecoguidato sta nel confronto seriale: stesso paziente, stesso obiettivo, stessa area di interesse, dopo una modifica terapeutica.<\/p>\n<p>Il LUS iniziale descrive il fenotipo. Il LUS successivo dice se il supporto ha cambiato qualcosa. La TFdi iniziale descrive il carico diaframmatico. La TFdi successiva dice se il supporto ha scaricato i muscoli respiratori. Gli intercostali e gli addominali dicono se il paziente sta ancora compensando. L’EGA conferma se il miglioramento è fisiopatologico e non solo cosmetico.<\/p>\n<p>La domanda corretta non è “com’è l’ecografia?”, ma “è cambiata nella direzione giusta dopo la nostra modifica?”.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_41.png\" alt=\"Figura 10.1. Monitoraggio seriale della NIV ecoguidata. La risposta al supporto deve essere rivalutata nel tempo integrando paziente, ventilatore, ecografia, EGA e decisione pratica.\" loading=\"lazy\"><figcaption>Figura 10.1. Monitoraggio seriale della NIV ecoguidata. La risposta al supporto deve essere rivalutata nel tempo integrando paziente, ventilatore, ecografia, EGA e decisione pratica.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_41.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 10.1. Monitoraggio seriale della NIV ecoguidata. La risposta al supporto deve essere rivalutata nel tempo integrando paziente, ventilatore, ecografia, EGA e decisione pratica.<\/p>\n<h3>T0: definire il punto di partenza<\/h3>\n<p>Prima di avviare o modificare la NIV bisogna fissare un punto di partenza. Non serve misurare tutto in tutti i pazienti, ma bisogna sapere qual è il problema dominante, ovvero definire il fenotipo prevalente<\/p>\n<p>Nel paziente ipercapnico saranno centrali pH, PaCO₂, frequenza respiratoria, TFdi/TR e sincronia. Nel paziente congesto saranno centrali LUS, FiO₂, lavoro respiratorio e stabilità emodinamica. Nel paziente ipossiemico non cardiogeno bisognerà guardare LUS, <em>drive<\/em>, FiO₂, volume corrente stimato se disponibile e rischio di fallimento. Nel paziente ostruttivo conteranno anche addominali, auto-PEEP sospetta, <em>cycling<\/em>, <em>rise time<\/em> e tempo espiratorio.<\/p>\n<p>Il T0 deve essere scritto o almeno mentalmente definito. Senza T0 non esiste un trend.<\/p>\n<h3>5–10 minuti: tecnica, comfort e sincronia<\/h3>\n<p>I primi minuti servono soprattutto a capire se il supporto è realmente erogato. In questa fase non bisogna interpretare subito ogni mancata risposta come fallimento fisiopatologico. Molte volte il problema è tecnico: perdite, interfaccia non tollerata, <em>trigger<\/em> inefficace, <em>cycling<\/em> ritardato o pressurizzazione inadeguata.<\/p>\n<p>Segnali da controllare subito:<\/p>\n<p>rumore ed entità delle perdite;<\/p>\n<p>fastidio della maschera o del casco;<\/p>\n<p>fame d’aria;<\/p>\n<p>sforzi inefficaci;<\/p>\n<p>inspirazione troppo lunga o troppo breve;<\/p>\n<p>aumento dell’attivazione degliaddominali o del fastidio;<\/p>\n<p>volume corrente stimato non plausibile.<\/p>\n<p>La correzione tecnica precede la titolazione fisiologica. Se la tecnica è sbagliata, l’ecografia misurerà la fatica generata da un supporto inefficace.<\/p>\n<h3>30–60 minuti: cercare una risposta fisiopatologica<\/h3>\n<p>A 30–60 minuti bisogna vedere se il paziente sta cambiando nella direzione giusta. La SpO₂ può migliorare rapidamente, ma non basta. Il miglioramento reale richiede coerenza.<\/p>\n<p>Nel paziente in HFNC, il ROX index può essere riportato come dato di supporto al trend, senza sostituire frequenza respiratoria, lavoro respiratorio, LUS ed EGA quando indicata.<\/p>\n<p>Segnali favorevoli:<\/p>\n<p>frequenza respiratoria in riduzione;<\/p>\n<p>minore uso dei muscoli accessori;<\/p>\n<p>TFdi/TR in calo verso un range più adeguato;<\/p>\n<p>addominali meno attivi se il problema era ostruzione/iperinflazione;<\/p>\n<p><strong>FiO₂ riducibile;<\/strong><\/p>\n<p>LUS score stabile o in miglioramento;<\/p>\n<p>pH e PaCO₂ in miglioramento se il problema era l’ipercapnia;<\/p>\n<p>comfort migliore.<\/p>\n<p>Segnali di risposta solo apparente:<\/p>\n<p>SpO₂ migliore ma FiO₂ ancora alta;<\/p>\n<p>frequenza respiratoria persistentemente elevata;<\/p>\n<p>TFdi/TR ancora elevati;<\/p>\n<p>LUS score invariato o peggiore;<\/p>\n<p>comfort instabile;<\/p>\n<p>EGA non migliorata.<\/p>\n<p>Questa distinzione è sintetizzata nella Figura 10.2, mentre la Figura 10.4 aggiunge esempi ecografici LUS per mostrare come il pattern possa migliorare, rimanere invariato o peggiorare durante il monitoraggio seriale.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_42.png\" alt=\"Figura 10.2. Successo reale, risposta apparente, fallimento. La risposta alla NIV deve essere classificata integrando SpO₂, FiO₂, frequenza respiratoria, LUS, muscoli respiratori ed EGA.\" loading=\"lazy\"><figcaption>Figura 10.2. Successo reale, risposta apparente, fallimento. La risposta alla NIV deve essere classificata integrando SpO₂, FiO₂, frequenza respiratoria, LUS, muscoli respiratori ed EGA.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_42.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 10.2. Successo reale, risposta apparente, fallimento. La risposta alla NIV deve essere classificata integrando SpO₂, FiO₂, frequenza respiratoria, LUS, muscoli respiratori ed EGA.<\/p>\n<p>Non basta “provare la NIV”. Bisogna sapere cosa ci si aspetta: riduzione della frequenza respiratoria, miglioramento del comfort, riduzione del lavoro muscolare, miglioramento del pH e della PaCO₂ se ipercapnico, riduzione della FiO₂ necessaria, miglioramento o stabilità del LUS.<\/p>\n<p><strong>Risposta favorevole<\/strong>:<strong> <\/strong>il trial può proseguire se il paziente è più tranquillo, la frequenza respiratoria scende, le perdite sono limitate, il sensorio è stabile, la pressione arteriosa è adeguata, l’EGA migliora se alterato in precedenza e il quadro ecografico è stabile o in miglioramento.<\/p>\n<p><strong>Risposta incerta<\/strong>: serve correggere e rivalutare il supporto se la SpO₂ migliora, ma la frequenza respiratoria resta alta, la FiO₂ rimane elevata, il paziente è poco tollerante ai presidi, ci sono perdite elevate o asincronie, il LUS non migliora o il diaframma appare ancora molto attivo.<\/p>\n<p>Risposta sfavorevole: non bisogna insistere se durante il trial peggiorano pH o PaCO₂, compare instabilità emodinamica, il sensorio peggiora, le secrezioni non sono gestibili, la protezione delle vie aeree è insufficiente, il LUS peggiora, il diaframma appare esausto o il paziente non tollera l’interfaccia.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_43.png\" alt=\"Figura 10.3. Sicurezza del trial non invasivo: semaforo clinico. Il trial deve essere classificato rapidamente come favorevole, incerto o sfavorevole. La risposta incerta richiede correzione e rivalutazione ravvicinata; la risposta sfavorevole richiede escalation o cambio di strategia.\" loading=\"lazy\"><figcaption>Figura 10.3. Sicurezza del trial non invasivo: semaforo clinico. Il trial deve essere classificato rapidamente come favorevole, incerto o sfavorevole. La risposta incerta richiede correzione e rivalutazione ravvicinata; la risposta sfavorevole richiede escalation o cambio di strategia.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_43.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 10.3. Sicurezza del trial non invasivo: semaforo clinico. Il trial deve essere classificato rapidamente come favorevole, incerto o sfavorevole. La risposta incerta richiede correzione e rivalutazione ravvicinata; la risposta sfavorevole richiede escalation o cambio di strategia.<\/p>\n<p>Immagini LUS esemplificative nel monitoraggio<\/p>\n<p>Nel monitoraggio della NIV il LUS non deve essere riportato solo come numero. Serve riconoscere se il <em>pattern<\/em> ecografico si muove verso ri-aerazione, resta invariato o peggiora. Per questo, quando possibile, è utile documentare almeno una o due immagini delle stesse zone esplorate: una al T0 e una dopo la modifica del supporto.<\/p>\n<p>Un miglioramento reale può essere suggerito dalla riduzione delle linee B coalescenti, dal passaggio verso un <em>pattern<\/em> meno denso o dalla ri-aerazione di aree precedentemente compromesse. Una risposta apparente è invece il caso in cui la SpO₂ migliora, ma il <em>pattern<\/em> LUS resta sostanzialmente invariato e il paziente mantiene alto <em>drive<\/em> o FiO₂ elevata. Il fallimento diventa più probabile quando compaiono nuove aree deaerate, consolidamenti o peggioramento delle regioni declivi.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_44.png\" alt=\"Figura 10.4. Esempi ecografici per leggere il monitoraggio seriale LUS. La figura integra immagini ecografiche esemplificative per distinguere risposta reale, risposta apparente e fallimento probabile. Le immagini sono adattate dal materiale fornito dall’autore e hanno finalità didattica: non rappresentano una serie dello stesso paziente.\" loading=\"lazy\"><figcaption>Figura 10.4. Esempi ecografici per leggere il monitoraggio seriale LUS. La figura integra immagini ecografiche esemplificative per distinguere risposta reale, risposta apparente e fallimento probabile. Le immagini sono adattate dal materiale fornito dall’autore e hanno finalità didattica: non rappresentano una serie dello stesso paziente.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_44.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 10.4. Esempi ecografici per leggere il monitoraggio seriale LUS. La figura integra immagini ecografiche esemplificative per distinguere risposta reale, risposta apparente e fallimento probabile. Le immagini sono adattate dal materiale fornito dall’autore e hanno finalità didattica: non rappresentano una serie dello stesso paziente.<\/p>\n<h3>Due ore: decidere, non attendere indefinitamente<\/h3>\n<p>Entro circa due ore deve essere chiaro se il trial sta funzionando, se richiede correzioni o se va interrotto. Questo non significa che ogni paziente debba essere intubato dopo due ore se non è perfetto. Significa che il trial deve avere una direzione.<\/p>\n<p>Se il paziente migliora, si continua. Se il paziente è incerto, si corregge un parametro regolabile e si rivaluta a breve. Se il paziente peggiora, non si deve prolungare il supporto solo perché la SpO₂ è temporaneamente accettabile.<\/p>\n<p>Nel paziente ipossiemico de novo, nel polmone disomogeneo, nella polmonite estesa e nel paziente con <em>drive<\/em> elevato, la soglia di stop deve essere più bassa. Il rischio non è solo il fallimento della NIV, ma il fallimento tardivamente riconosciuto.<\/p>\n<p>Segnali di allarme<\/p>\n<p>Il fallimento raramente è riconducibile ad un singolo numero. Di solito nasce dalla convergenza di segnali in più domini.<\/p>\n<p>Il paziente resta tachipnoico. Il pH non migliora o peggiora. La PaCO₂ sale. La FiO₂ resta elevata. Il LUS mostra aumento della perdita di aerazione. Il diaframma e gli intercostali restano iperattivi. Gli addominali indicano espirazione forzata. Il ventilatore mostra perdite elevate o asincronie persistenti. Il cuore destro non tollera l’aumento delle pressioni di ventilazione.<\/p>\n<p>In questi casi il monitoraggio serve a togliere ambiguità: il paziente non sta andando nella direzione giusta.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_45.png\" alt=\"Figura 10.5. Segnali di allarme durante NIV. I segnali clinici, EGA, ecografici, muscolari, ventilatori ed emodinamici devono essere letti insieme. Quando peggiorano più domini, il trial non invasivo non va prolungato.\" loading=\"lazy\"><figcaption>Figura 10.5. Segnali di allarme durante NIV. I segnali clinici, EGA, ecografici, muscolari, ventilatori ed emodinamici devono essere letti insieme. Quando peggiorano più domini, il trial non invasivo non va prolungato.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_45.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 10.5. Segnali di allarme durante NIV. I segnali clinici, EGA, ecografici, muscolari, ventilatori ed emodinamici devono essere letti insieme. Quando peggiorano più domini, il trial non invasivo non va prolungato.<\/p>\n<p>HACOR e score di rischio: utili, ma non autosufficienti<\/p>\n<p>Gli score clinici possono aiutare a oggettivare il rischio. Il punteggio HACOR integra frequenza cardiaca, acidosi, stato di coscienza, ossigenazione e frequenza respiratoria. È utile perché obbliga a guardare parametri semplici e disponibili al letto del paziente.<\/p>\n<p>Nel manuale pratico, però, lo score non deve sostituire il ragionamento ecografico. Un HACOR sfavorevole con LUS peggiorato e TFdi/TR elevati rafforza l’indicazione a cambiare strategia. Un HACOR intermedio in un paziente che sta migliorando ecograficamente e clinicamente può essere interpretato con maggiore prudenza.<\/p>\n<p>Lo score aiuta a non negare il fallimento. L’ecografia aiuta a capire perché il fallimento sta avvenendo.<\/p>\n<h3>De-escalation: ridurre il supporto senza perdere il risultato<\/h3>\n<p>Quando il paziente migliora, bisogna evitare l’errore opposto: lasciare una NIV troppo intensa troppo a lungo. L’obiettivo non è mantenere il paziente attaccato al ventilatore, ma ridurre progressivamente il supporto senza far ricomparire il problema.<\/p>\n<p>La de-escalation deve essere guidata da stabilità:<\/p>\n<p>frequenza respiratoria controllata;<\/p>\n<p><strong>FiO₂ ridotta;<\/strong><\/p>\n<p>comfort buono;<\/p>\n<p>pH e PaCO₂ stabili se ipercapnia;<\/p>\n<p>LUS non peggiorato;<\/p>\n<p>TFdi/TR non nuovamente elevati;<\/p>\n<p>addominali non iperattivi;<\/p>\n<p>emodinamica stabile.<\/p>\n<p>La riduzione deve seguire il problema iniziale. Se il problema era muscolare respiratorio, si riduce prima il <em>pressure<\/em> <em>support<\/em>. Se il problema era congestione o atelettasia, si riduce EPAP/PEEP con più cautela. Se il problema era ipossiemia, si riduce FiO₂ senza perdere di vista LUS e lavoro respiratorio.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_46.png\" alt=\"Figura 10.6. De-escalation: quando ridurre NIV o passare a HFNC/ossigeno. La riduzione del supporto deve essere progressiva: stabilità, riduzione dell’intensità, pause controllate e stop della NIV solo se il trend rimane favorevole.\" loading=\"lazy\"><figcaption>Figura 10.6. De-escalation: quando ridurre NIV o passare a HFNC/ossigeno. La riduzione del supporto deve essere progressiva: stabilità, riduzione dell’intensità, pause controllate e stop della NIV solo se il trend rimane favorevole.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_46.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 10.6. De-escalation: quando ridurre NIV o passare a HFNC/ossigeno. La riduzione del supporto deve essere progressiva: stabilità, riduzione dell’intensità, pause controllate e stop della NIV solo se il trend rimane favorevole.<\/p>\n<h3>Referto di monitoraggio orientato alla decisione<\/h3>\n<p>Un referto utile dopo avvio o modifica della NIV non deve essere lungo. Deve dire se il paziente sta migliorando e quale decisione ne deriva.<\/p>\n<p>Esempio pratico:<\/p>\n<p>“Dopo 45 minuti di NIV in PS, paziente più confortevole, FR ridotta da 32 a 24/min, FiO₂ ridotta da 0.60 a 0.45. LUS antero-laterale invariato, senza nuovi consolidamenti. TFdi ridotta rispetto al basale, intercostali meno attivi. EGA in miglioramento. Quadro coerente con risposta favorevole; proseguire supporto e rivalutare entro 2 ore.”<\/p>\n<p>Oppure:<\/p>\n<p>“SpO₂ migliorata con FiO₂ 0.80, ma FR persistente 34/min, TFdi/TR elevati, LUS postero-laterale peggiorato con aumento delle aree di perdita di aerazione, EGA non migliorata. Quadro di risposta apparente/fallimento probabile; non prolungare trial senza rivalutazione collegiale ed eventuale escalation.”<\/p>\n<h3>Errore da evitare<\/h3>\n<p>L’errore più frequente è confondere una saturazione accettabile con una risposta favorevole. La SpO₂ può migliorare mentre il paziente continua a generare alto drive, alto lavoro respiratorio e peggioramento della perdita di aerazione.<\/p>\n<p>Il monitoraggio serve a vedere se il paziente migliora davvero, non se il monitor fa meno paura.<\/p>\n<h3>Bibliografia del Capitolo 10<\/h3>\n<p>1. Duan J, Han X, Bai L, Zhou L, Huang S. Assessment of heart rate, acidosis, consciousness, oxygenation, and respiratory rate to predict noninvasive ventilation failure in hypoxemic patients. Intensive Care Med. 2017;43(2):192-199. doi:10.1007/s00134-016-4601-3.<\/p>\n<p>2. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.<\/p>\n<p>3. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.<\/p>\n<p>4. Oczkowski S, Ergan B, Bos L, Chatwin M, Ferrer M, Gregoretti C, et al. ERS clinical practice guidelines: high-flow nasal cannula in acute respiratory failure. Eur Respir J. 2022;59(4):2101574. doi:10.1183/13993003.01574-2021.<\/p>\n<p>5. Vignaux L, Vargas F, Roeseler J, Tassaux D, Thille AW, Kossowsky MP, Brochard L, Jolliet P. Patient-ventilator asynchrony during non-invasive ventilation for acute respiratory failure: a multicenter study. Intensive Care Med. 2009;35(5):840-846. doi:10.1007/s00134-009-1416-5.<\/p>\n<p>6. Vivier E, Mekontso Dessap A, Dimassi S, Vargas F, Lyazidi A, Thille AW, et al. Diaphragm ultrasonography to estimate the work of breathing during non-invasive ventilation. Intensive Care Med. 2012;38(5):796-803. doi:10.1007/s00134-012-2547-7.<\/p>\n<p>7. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p>\n<p>8. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI.<\/p>","plain":"Obiettivo pratico La NIV ecoguidata non termina quando si imposta il ventilatore. Inizia davvero quando si osserva la risposta. Il monitoraggio serve a distinguere tre situazioni molto diverse: successo reale, quando il supporto corregge il meccanismo fisiopatologico; risposta apparente, quando migliora la SpO₂ ma non migliorano drive , reclutamento muscolare, LUS score o EGA; fallimento, quando il trial non invasivo sta ritardando una strategia più adeguata. Il monitoraggio non deve diventare un accumulo di misure. Deve essere una sequenza ordinata di controlli che risponde a domande pratiche: il paziente respira meglio? Il polmone si sta ri-aerando? La muscoli respiratori è scaricata? L’EGA migliora? Il cuore tollera la pressione positiva? Posso ridurre il supporto o devo cambiare strada? Il principio: trend, non fotografia Una singola valutazione ecografica ha valore limitato. La forza dell’approccio ecoguidato sta nel confronto seriale: stesso paziente, stesso obiettivo, stessa area di interesse, dopo una modifica terapeutica. Il LUS iniziale descrive il fenotipo. Il LUS successivo dice se il supporto ha cambiato qualcosa. La TFdi iniziale descrive il carico diaframmatico. La TFdi successiva dice se il supporto ha scaricato i muscoli respiratori. Gli intercostali e gli addominali dicono se il paziente sta ancora compensando. L’EGA conferma se il miglioramento è fisiopatologico e non solo cosmetico. La domanda corretta non è “com’è l’ecografia?”, ma “è cambiata nella direzione giusta dopo la nostra modifica?”. Figura 10.1. Monitoraggio seriale della NIV ecoguidata. La risposta al supporto deve essere rivalutata nel tempo integrando paziente, ventilatore, ecografia, EGA e decisione pratica. Figura 10.1. Monitoraggio seriale della NIV ecoguidata. La risposta al supporto deve essere rivalutata nel tempo integrando paziente, ventilatore, ecografia, EGA e decisione pratica. T0: definire il punto di partenza Prima di avviare o modificare la NIV bisogna fissare un punto di partenza. Non serve misurare tutto in tutti i pazienti, ma bisogna sapere qual è il problema dominante, ovvero definire il fenotipo prevalente Nel paziente ipercapnico saranno centrali pH, PaCO₂, frequenza respiratoria, TFdi/TR e sincronia. Nel paziente congesto saranno centrali LUS, FiO₂, lavoro respiratorio e stabilità emodinamica. Nel paziente ipossiemico non cardiogeno bisognerà guardare LUS, drive , FiO₂, volume corrente stimato se disponibile e rischio di fallimento. Nel paziente ostruttivo conteranno anche addominali, auto-PEEP sospetta, cycling , rise time e tempo espiratorio. Il T0 deve essere scritto o almeno mentalmente definito. Senza T0 non esiste un trend. 5–10 minuti: tecnica, comfort e sincronia I primi minuti servono soprattutto a capire se il supporto è realmente erogato. In questa fase non bisogna interpretare subito ogni mancata risposta come fallimento fisiopatologico. Molte volte il problema è tecnico: perdite, interfaccia non tollerata, trigger inefficace, cycling ritardato o pressurizzazione inadeguata. Segnali da controllare subito: rumore ed entità delle perdite; fastidio della maschera o del casco; fame d’aria; sforzi inefficaci; inspirazione troppo lunga o troppo breve; aumento dell’attivazione degliaddominali o del fastidio; volume corrente stimato non plausibile. La correzione tecnica precede la titolazione fisiologica. Se la tecnica è sbagliata, l’ecografia misurerà la fatica generata da un supporto inefficace. 30–60 minuti: cercare una risposta fisiopatologica A 30–60 minuti bisogna vedere se il paziente sta cambiando nella direzione giusta. La SpO₂ può migliorare rapidamente, ma non basta. Il miglioramento reale richiede coerenza. Nel paziente in HFNC, il ROX index può essere riportato come dato di supporto al trend, senza sostituire frequenza respiratoria, lavoro respiratorio, LUS ed EGA quando indicata. Segnali favorevoli: frequenza respiratoria in riduzione; minore uso dei muscoli accessori; TFdi/TR in calo verso un range più adeguato; addominali meno attivi se il problema era ostruzione/iperinflazione; FiO₂ riducibile; LUS score stabile o in miglioramento; pH e PaCO₂ in miglioramento se il problema era l’ipercapnia; comfort migliore. Segnali di risposta solo apparente: SpO₂ migliore ma FiO₂ ancora alta; frequenza respiratoria persistentemente elevata; TFdi/TR ancora elevati; LUS score invariato o peggiore; comfort instabile; EGA non migliorata. Questa distinzione è sintetizzata nella Figura 10.2, mentre la Figura 10.4 aggiunge esempi ecografici LUS per mostrare come il pattern possa migliorare, rimanere invariato o peggiorare durante il monitoraggio seriale. Figura 10.2. Successo reale, risposta apparente, fallimento. La risposta alla NIV deve essere classificata integrando SpO₂, FiO₂, frequenza respiratoria, LUS, muscoli respiratori ed EGA. Figura 10.2. Successo reale, risposta apparente, fallimento. La risposta alla NIV deve essere classificata integrando SpO₂, FiO₂, frequenza respiratoria, LUS, muscoli respiratori ed EGA. Non basta “provare la NIV”. Bisogna sapere cosa ci si aspetta: riduzione della frequenza respiratoria, miglioramento del comfort, riduzione del lavoro muscolare, miglioramento del pH e della PaCO₂ se ipercapnico, riduzione della FiO₂ necessaria, miglioramento o stabilità del LUS. Risposta favorevole : il trial può proseguire se il paziente è più tranquillo, la frequenza respiratoria scende, le perdite sono limitate, il sensorio è stabile, la pressione arteriosa è adeguata, l’EGA migliora se alterato in precedenza e il quadro ecografico è stabile o in miglioramento. Risposta incerta : serve correggere e rivalutare il supporto se la SpO₂ migliora, ma la frequenza respiratoria resta alta, la FiO₂ rimane elevata, il paziente è poco tollerante ai presidi, ci sono perdite elevate o asincronie, il LUS non migliora o il diaframma appare ancora molto attivo. Risposta sfavorevole: non bisogna insistere se durante il trial peggiorano pH o PaCO₂, compare instabilità emodinamica, il sensorio peggiora, le secrezioni non sono gestibili, la protezione delle vie aeree è insufficiente, il LUS peggiora, il diaframma appare esausto o il paziente non tollera l’interfaccia. Figura 10.3. Sicurezza del trial non invasivo: semaforo clinico. Il trial deve essere classificato rapidamente come favorevole, incerto o sfavorevole. La risposta incerta richiede correzione e rivalutazione ravvicinata; la risposta sfavorevole richiede escalation o cambio di strategia. Figura 10.3. Sicurezza del trial non invasivo: semaforo clinico. Il trial deve essere classificato rapidamente come favorevole, incerto o sfavorevole. La risposta incerta richiede correzione e rivalutazione ravvicinata; la risposta sfavorevole richiede escalation o cambio di strategia. Immagini LUS esemplificative nel monitoraggio Nel monitoraggio della NIV il LUS non deve essere riportato solo come numero. Serve riconoscere se il pattern ecografico si muove verso ri-aerazione, resta invariato o peggiora. Per questo, quando possibile, è utile documentare almeno una o due immagini delle stesse zone esplorate: una al T0 e una dopo la modifica del supporto. Un miglioramento reale può essere suggerito dalla riduzione delle linee B coalescenti, dal passaggio verso un pattern meno denso o dalla ri-aerazione di aree precedentemente compromesse. Una risposta apparente è invece il caso in cui la SpO₂ migliora, ma il pattern LUS resta sostanzialmente invariato e il paziente mantiene alto drive o FiO₂ elevata. Il fallimento diventa più probabile quando compaiono nuove aree deaerate, consolidamenti o peggioramento delle regioni declivi. Figura 10.4. Esempi ecografici per leggere il monitoraggio seriale LUS. La figura integra immagini ecografiche esemplificative per distinguere risposta reale, risposta apparente e fallimento probabile. Le immagini sono adattate dal materiale fornito dall’autore e hanno finalità didattica: non rappresentano una serie dello stesso paziente. Figura 10.4. Esempi ecografici per leggere il monitoraggio seriale LUS. La figura integra immagini ecografiche esemplificative per distinguere risposta reale, risposta apparente e fallimento probabile. Le immagini sono adattate dal materiale fornito dall’autore e hanno finalità didattica: non rappresentano una serie dello stesso paziente. Due ore: decidere, non attendere indefinitamente Entro circa due ore deve essere chiaro se il trial sta funzionando, se richiede correzioni o se va interrotto. Questo non significa che ogni paziente debba essere intubato dopo due ore se non è perfetto. Significa che il trial deve avere una direzione. Se il paziente migliora, si continua. Se il paziente è incerto, si corregge un parametro regolabile e si rivaluta a breve. Se il paziente peggiora, non si deve prolungare il supporto solo perché la SpO₂ è temporaneamente accettabile. Nel paziente ipossiemico de novo, nel polmone disomogeneo, nella polmonite estesa e nel paziente con drive elevato, la soglia di stop deve essere più bassa. Il rischio non è solo il fallimento della NIV, ma il fallimento tardivamente riconosciuto. Segnali di allarme Il fallimento raramente è riconducibile ad un singolo numero. Di solito nasce dalla convergenza di segnali in più domini. Il paziente resta tachipnoico. Il pH non migliora o peggiora. La PaCO₂ sale. La FiO₂ resta elevata. Il LUS mostra aumento della perdita di aerazione. Il diaframma e gli intercostali restano iperattivi. Gli addominali indicano espirazione forzata. Il ventilatore mostra perdite elevate o asincronie persistenti. Il cuore destro non tollera l’aumento delle pressioni di ventilazione. In questi casi il monitoraggio serve a togliere ambiguità: il paziente non sta andando nella direzione giusta. Figura 10.5. Segnali di allarme durante NIV. I segnali clinici, EGA, ecografici, muscolari, ventilatori ed emodinamici devono essere letti insieme. Quando peggiorano più domini, il trial non invasivo non va prolungato. Figura 10.5. Segnali di allarme durante NIV. I segnali clinici, EGA, ecografici, muscolari, ventilatori ed emodinamici devono essere letti insieme. Quando peggiorano più domini, il trial non invasivo non va prolungato. HACOR e score di rischio: utili, ma non autosufficienti Gli score clinici possono aiutare a oggettivare il rischio. Il punteggio HACOR integra frequenza cardiaca, acidosi, stato di coscienza, ossigenazione e frequenza respiratoria. È utile perché obbliga a guardare parametri semplici e disponibili al letto del paziente. Nel manuale pratico, però, lo score non deve sostituire il ragionamento ecografico. Un HACOR sfavorevole con LUS peggiorato e TFdi/TR elevati rafforza l’indicazione a cambiare strategia. Un HACOR intermedio in un paziente che sta migliorando ecograficamente e clinicamente può essere interpretato con maggiore prudenza. Lo score aiuta a non negare il fallimento. L’ecografia aiuta a capire perché il fallimento sta avvenendo. De-escalation: ridurre il supporto senza perdere il risultato Quando il paziente migliora, bisogna evitare l’errore opposto: lasciare una NIV troppo intensa troppo a lungo. L’obiettivo non è mantenere il paziente attaccato al ventilatore, ma ridurre progressivamente il supporto senza far ricomparire il problema. La de-escalation deve essere guidata da stabilità: frequenza respiratoria controllata; FiO₂ ridotta; comfort buono; pH e PaCO₂ stabili se ipercapnia; LUS non peggiorato; TFdi/TR non nuovamente elevati; addominali non iperattivi; emodinamica stabile. La riduzione deve seguire il problema iniziale. Se il problema era muscolare respiratorio, si riduce prima il pressure support . Se il problema era congestione o atelettasia, si riduce EPAP/PEEP con più cautela. Se il problema era ipossiemia, si riduce FiO₂ senza perdere di vista LUS e lavoro respiratorio. Figura 10.6. De-escalation: quando ridurre NIV o passare a HFNC/ossigeno. La riduzione del supporto deve essere progressiva: stabilità, riduzione dell’intensità, pause controllate e stop della NIV solo se il trend rimane favorevole. Figura 10.6. De-escalation: quando ridurre NIV o passare a HFNC/ossigeno. La riduzione del supporto deve essere progressiva: stabilità, riduzione dell’intensità, pause controllate e stop della NIV solo se il trend rimane favorevole. Referto di monitoraggio orientato alla decisione Un referto utile dopo avvio o modifica della NIV non deve essere lungo. Deve dire se il paziente sta migliorando e quale decisione ne deriva. Esempio pratico: “Dopo 45 minuti di NIV in PS, paziente più confortevole, FR ridotta da 32 a 24/min, FiO₂ ridotta da 0.60 a 0.45. LUS antero-laterale invariato, senza nuovi consolidamenti. TFdi ridotta rispetto al basale, intercostali meno attivi. EGA in miglioramento. Quadro coerente con risposta favorevole; proseguire supporto e rivalutare entro 2 ore.” Oppure: “SpO₂ migliorata con FiO₂ 0.80, ma FR persistente 34/min, TFdi/TR elevati, LUS postero-laterale peggiorato con aumento delle aree di perdita di aerazione, EGA non migliorata. Quadro di risposta apparente/fallimento probabile; non prolungare trial senza rivalutazione collegiale ed eventuale escalation.” Errore da evitare L’errore più frequente è confondere una saturazione accettabile con una risposta favorevole. La SpO₂ può migliorare mentre il paziente continua a generare alto drive, alto lavoro respiratorio e peggioramento della perdita di aerazione. Il monitoraggio serve a vedere se il paziente migliora davvero, non se il monitor fa meno paura. Bibliografia del Capitolo 10 1. Duan J, Han X, Bai L, Zhou L, Huang S. Assessment of heart rate, acidosis, consciousness, oxygenation, and respiratory rate to predict noninvasive ventilation failure in hypoxemic patients. Intensive Care Med. 2017;43(2):192-199. doi:10.1007/s00134-016-4601-3. 2. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379. 3. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016. 4. Oczkowski S, Ergan B, Bos L, Chatwin M, Ferrer M, Gregoretti C, et al. ERS clinical practice guidelines: high-flow nasal cannula in acute respiratory failure. Eur Respir J. 2022;59(4):2101574. doi:10.1183/13993003.01574-2021. 5. Vignaux L, Vargas F, Roeseler J, Tassaux D, Thille AW, Kossowsky MP, Brochard L, Jolliet P. Patient-ventilator asynchrony during non-invasive ventilation for acute respiratory failure: a multicenter study. Intensive Care Med. 2009;35(5):840-846. doi:10.1007/s00134-009-1416-5. 6. Vivier E, Mekontso Dessap A, Dimassi S, Vargas F, Lyazidi A, Thille AW, et al. Diaphragm ultrasonography to estimate the work of breathing during non-invasive ventilation. Intensive Care Med. 2012;38(5):796-803. doi:10.1007/s00134-012-2547-7. 7. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558. 8. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI."},{"part":"Parte III — Scegliere e settare il supporto","title":"Capitolo 11. Percorsi clinici LUS-guidati: quattro scenari pratici","tag":"Capitolo 11","html":"\n<h3>Obiettivo pratico<\/h3>\n<p>Dopo aver definito fenotipi, parametri, monitoraggio e criteri di stop, serve una sintesi clinica. Questo capitolo raccoglie quattro scenari frequenti in cui il LUS modifica davvero la gestione della NIV:<\/p>\n<p>BPCO/ipercapnia;<\/p>\n<p>edema polmonare cardiogeno;<\/p>\n<p>polmonite o insufficienza respiratoria ipossiemica de novo;<\/p>\n<p>post-operatorio, obesità, atelettasie e perdita declive di aerazione.<\/p>\n<p>Il capitolo non propone protocolli rigidi. Propone percorsi pratici con impostazioni iniziali ragionevoli, timing di rivalutazione e criteri di stop. Le pressioni e i flussi riportati sono esempi operativi: vanno adattati a ventilatore, interfaccia, tolleranza, EGA, LUS e rischio di fallimento.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_47.png\" alt=\"Figura 11.1. Percorsi clinici NIV ecoguidati: dal LUS alla decisione. La figura integra immagini ecografiche esemplificative nei quattro scenari pratici principali: BPCO/ipercapnia, edema cardiogeno, polmonite/ipossiemia de novo e post-operatorio/atelettasia.\" loading=\"lazy\"><figcaption>Figura 11.1. Percorsi clinici NIV ecoguidati: dal LUS alla decisione. La figura integra immagini ecografiche esemplificative nei quattro scenari pratici principali: BPCO/ipercapnia, edema cardiogeno, polmonite/ipossiemia de novo e post-operatorio/atelettasia.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_47.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 11.1. Percorsi clinici NIV ecoguidati: dal LUS alla decisione. La figura integra immagini ecografiche esemplificative nei quattro scenari pratici principali: BPCO/ipercapnia, edema cardiogeno, polmonite/ipossiemia de novo e post-operatorio/atelettasia.<\/p>\n<h3>Scenario 1. BPCO riacutizzata e insufficienza respiratoria ipercapnica<\/h3>\n<p>Nel paziente con BPCO riacutizzata, la NIV ha un razionale forte quando sono presenti acidosi respiratoria, ipercapnia, aumento del lavoro respiratorio e segni di fatica. In questo scenario il LUS spesso non mostra una perdita diffusa di aerazione. Il reperto può essere un <em>pattern<\/em> A prevalente, con <em>sliding<\/em> conservato e assenza di un chiaro bersaglio di reclutamento.<\/p>\n<p>Questo non significa che il LUS sia inutile. Significa che il LUS aiuta a non sbagliare bersaglio. Se il polmone è prevalentemente aerato, la priorità non è aumentare EPAP/PEEP per “aprire” il polmone. La priorità è scaricare i muscoli respiratori, migliorare la ventilazione alveolare, correggere acidosi e ipercapnia, ridurre il lavoro inspiratorio e ottimizzare la sincronia.<\/p>\n<p>Gli elementi più utili sono:<\/p>\n<p><em>pattern<\/em> A prevalente o assenza di importante perdita di aerazione;<\/p>\n<p>TFdi elevata se il diaframma è sovraccarico;<\/p>\n<p>TR intercostale aumentato se il paziente compensa con muscoli inspiratori accessori;<\/p>\n<p>addominali attivi se c’è espirazione forzata, ostruzione o iperinflazione;<\/p>\n<p><em>trigger<\/em> difficile, espirazione prolungata o <em>cycling<\/em> non adeguato.<\/p>\n<p>Il supporto iniziale è di solito NIV-PS. Il pressure support viene titolato sul lavoro respiratorio, sul comfort, sulla frequenza respiratoria e sull’EGA. L’EPAP va impostata con attenzione: può aiutare a contrastare l’auto-PEEP e migliorare il trigger, ma se eccessiva può peggiorare iperinflazione e fastidio.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_48.png\" alt=\"Figura 11.2. BPCO/ipercapnia: dal pattern A alla NIV in pressure support. Nel paziente ipercapnico con polmone prevalentemente aerato, il LUS orienta il ragionamento verso muscoli respiratori, auto-PEEP, trigger, cycling, pressure support e attività dei muscoli accessori.\" loading=\"lazy\"><figcaption>Figura 11.2. BPCO/ipercapnia: dal pattern A alla NIV in pressure support. Nel paziente ipercapnico con polmone prevalentemente aerato, il LUS orienta il ragionamento verso muscoli respiratori, auto-PEEP, trigger, cycling, pressure support e attività dei muscoli accessori.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_48.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 11.2. BPCO/ipercapnia: dal pattern A alla NIV in pressure support. Nel paziente ipercapnico con polmone prevalentemente aerato, il LUS orienta il ragionamento verso muscoli respiratori, auto-PEEP, trigger, cycling, pressure support e attività dei muscoli accessori.<\/p>\n<p>Dopo 30–60 minuti bisogna vedere se il paziente sta davvero ventilando meglio. I segnali attesi sono riduzione della frequenza respiratoria, comfort migliore, riduzione di TFdi/TR, minore attivazione addominale se presente, miglioramento di pH e PaCO₂. Se il pH non migliora, la PaCO₂ sale, le perdite sono importanti o gli sforzi restano inefficaci, non bisogna limitarsi ad aumentare FiO₂.<\/p>\n<h3>Caso operativo: BPCO riacutizzata con acidosi respiratoria<\/h3>\n<p>Esempio iniziale: paziente con BPCO riacutizzata, dispnea intensa, FR 32/min, uso dei muscoli accessori, SpO₂ 89–90% in Venturi 35%. EGA: pH 7,28, PaCO₂ 72 mmHg, HCO₃⁻ 33 mEq/L, PaO₂ 58 mmHg, lattato normale. LUS: pattern A prevalente, assenza di consolidamenti estesi, diaframma e intercostali iperattivi, addominali attivi in espirazione.<\/p>\n<p>Impostazione iniziale ragionevole: maschera oro-nasale ben tollerata, EPAP 4–5 cmH₂O, IPAP 14–16 cmH₂O, quindi pressure support circa 9–11 cmH₂O; FiO₂ regolata per SpO₂ 88–92%; trigger sufficientemente sensibile ma senza auto-trigger; rise time medio-rapido se il paziente ha fame d’aria; cycling tendenzialmente più precoce se l’espirazione è lunga o compaiono segni di iperinflazione; backup rate 12–14/min come sicurezza, non come trattamento della tachipnea.<\/p>\n<p>Controllo a 5–10 minuti: verificare perdite, comfort, sincronizzazione, raggiungimento di EPAP/IPAP, volume corrente plausibile, assenza di cycling tardivo e riduzione della fame d’aria. Se il paziente resta agitato, prima si correggono interfaccia, trigger, cycling e rise time; solo dopo si aumenta il pressure support.<\/p>\n<p>Risposta attesa a 30 minuti: FR in riduzione, per esempio da 32 a 24–26/min; minore attivazione dei muscoli accessori; comfort migliore; SpO₂ nel target con FiO₂ non crescente; pH in lieve miglioramento, per esempio 7,31–7,33; PaCO₂ stabile o in calo, senza pretendere normalizzazione immediata. La TFdi può ridursi verso un range di lavoro meno estremo.<\/p>\n<p>Segnali di fallimento o di correzione insufficiente: pH invariato o in peggioramento, PaCO₂ in aumento, FR persistentemente &gt;30/min, sensorio peggiore, secrezioni non gestibili, perdite non correggibili, addominali sempre molto attivi, cycling tardivo non risolto, instabilità emodinamica o intolleranza dell’interfaccia. In questi casi il trial non va prolungato solo perché la SpO₂ è accettabile.<\/p>\n<h3><strong>Errore da evitare<\/strong><\/h3>\n<p>L’errore più frequente è trattare la BPCO come se fosse un problema di reclutamento. In un paziente ostruttivo, aumentare EPAP senza un bersaglio chiaro può peggiorare iperinflazione, comfort e tolleranza.<\/p>\n<h3>Scenario 2. Edema polmonare cardiogeno<\/h3>\n<p>Nel paziente con edema polmonare cardiogeno, il LUS spesso mostra artefatti verticali diffusi, relativamente ordinati e bilaterali, con distribuzione compatibile con congestione. Il quadro clinico deve essere coerente: dispnea acuta, ipertensione o sovraccarico, segni cardiaci, risposta alla terapia di decongestione.<\/p>\n<p>In questo scenario CPAP/EPAP ha un bersaglio fisiopatologico chiaro. La pressione positiva può ridurre il lavoro respiratorio, migliorare ossigenazione, ridurre ritorno venoso in condizioni di congestione e contribuire a ridurre il postcarico del ventricolo sinistro. La NIV -PS può essere utile se coesistono ipercapnia, fatica o insufficiente ventilazione alveolare.<\/p>\n<p>Gli elementi da cercare sono:<\/p>\n<p>B-<em>lines<\/em> diffuse e abbastanza ordinate;<\/p>\n<p>distribuzione bilaterale e compatibile con congestione;<\/p>\n<p>assenza di marcata disomogeneità pleurica o consolidamenti dominanti;<\/p>\n<p>cuore sinistro coerente, se valutato;<\/p>\n<p>riduzione di lavoro respiratorio dopo CPAP/EPAP.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_49.png\" alt=\"Figura 11.3. Edema cardiogeno: B-lines ordinate e CPAP/EPAP. Le B-lines diffuse e ordinate, se coerenti con il quadro clinico, rappresentano un bersaglio razionale per CPAP/EPAP e terapia causale.\" loading=\"lazy\"><figcaption>Figura 11.3. Edema cardiogeno: B-lines ordinate e CPAP/EPAP. Le B-lines diffuse e ordinate, se coerenti con il quadro clinico, rappresentano un bersaglio razionale per CPAP/EPAP e terapia causale.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_49.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 11.3. Edema cardiogeno: B-lines ordinate e CPAP/EPAP. Le B-lines diffuse e ordinate, se coerenti con il quadro clinico, rappresentano un bersaglio razionale per CPAP/EPAP e terapia causale.<\/p>\n<p>La risposta attesa è rapida: riduzione della dispnea, frequenza respiratoria in calo, FiO₂ riducibile, comfort migliore, pressione arteriosa tollerata, LUS stabile o in miglioramento. Se il LUS non cambia, la FiO₂ resta alta, il <em>pattern<\/em> è disomogeneo o compaiono segni di instabilità emodinamica, bisogna rivalutare il fenotipo.<\/p>\n<h3><strong>Errore da evitare<\/strong><\/h3>\n<p>Non tutte le B-lines sono edema cardiogeno. B-lines disordinate, pleura irregolare, consolidamenti subpleurici e distribuzione patchy devono far pensare a polmonite, ARDS-like, fibrosi o danno polmonare primitivo.<\/p>\n<h3>Scenario 3. Polmonite e insufficienza respiratoria ipossiemica de novo<\/h3>\n<p>Questo scenario è quello in cui il LUS è più utile per non illudersi. Il paziente può migliorare la SpO₂ con FiO₂ elevata e pressione positiva, ma continuare ad avere alto <em>drive<\/em>, alto lavoro respiratorio e peggioramento regionale della perdita di aerazione.<\/p>\n<p>Il LUS può mostrare:<\/p>\n<p>pleura irregolare;<\/p>\n<p><em>pattern<\/em> disordinato;<\/p>\n<p>aree di risparmio alternate ad aree patologiche;<\/p>\n<p>consolidamenti subpleurici o più estesi;<\/p>\n<p>broncogrammi;<\/p>\n<p>distribuzione focale o asimmetrica.<\/p>\n<p>In questo scenario il supporto iniziale può essere HFNC, oppure un trial NIV-PS se il paziente è molto selezionato, collaborante, monitorabile e senza criteri di immediata intubazione. La NIV non deve diventare un modo per ritardare <em>l’escalation<\/em>.<\/p>\n<h3>HFNC nello scenario ipossiemico de novo<\/h3>\n<p>Se si sceglie HFNC, il trial deve avere la stessa disciplina temporale della NIV: flusso adeguato e tollerato, FiO₂ per target di saturazione, controllo precoce di frequenza respiratoria, lavoro muscolare, LUS e ROX index. Una SpO₂ accettabile con FiO₂ elevata, ROX non in miglioramento e diaframma/intercostali ancora iperattivi non deve essere considerata stabilizzazione.<\/p>\n<p>La rivalutazione precoce è obbligatoria. Se il paziente mantiene frequenza respiratoria alta, FiO₂ elevata, TFdi/TR alti, LUS invariato o peggiorato, EGA sfavorevole o comfort precario, il trial è a rischio.<\/p>\n<h3>Scenario 4. Post-operatorio, obesità e atelettasia declive<\/h3>\n<p>Nel paziente post-operatorio, obeso, allettato o dolorante, il problema può essere una perdita declive di aerazione. Il LUS può mostrare consolidamenti posteriori o basali, ridotta aerazione regionale, broncogrammi, versamento pleurico associato o segni di compressione.<\/p>\n<p>In questo scenario la pressione positiva può essere utile, ma deve essere integrata con altri interventi. CPAP/EPAP può favorire la ri-aerazione se l’area è reclutabile. Posizione, analgesia, mobilizzazione, fisioterapia respiratoria, gestione delle secrezioni e tosse efficace sono spesso altrettanto importanti.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_50.png\" alt=\"Figura 11.4. Polmone disomogeneo: polmonite, ipossiemia de novo e atelettasia. Nei quadri disomogenei il LUS serve a distinguere perdita di aerazione reclutabile, consolidamento non reclutabile e peggioramento progressivo durante il trial non invasivo.\" loading=\"lazy\"><figcaption>Figura 11.4. Polmone disomogeneo: polmonite, ipossiemia de novo e atelettasia. Nei quadri disomogenei il LUS serve a distinguere perdita di aerazione reclutabile, consolidamento non reclutabile e peggioramento progressivo durante il trial non invasivo.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_50.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 11.4. Polmone disomogeneo: polmonite, ipossiemia de novo e atelettasia. Nei quadri disomogenei il LUS serve a distinguere perdita di aerazione reclutabile, consolidamento non reclutabile e peggioramento progressivo durante il trial non invasivo.<\/p>\n<p>Il controllo deve concentrarsi sulle zone declivi e posteriori. Se il supporto funziona, ci si aspetta riduzione della richiesta di FiO₂, migliore comfort, possibile ri-aerazione parziale e riduzione del lavoro respiratorio. Se il consolidamento resta invariato o peggiora, bisogna pensare a secrezioni, ostruzione bronchiale, broncogramma statico, versamento o patologia non reclutabile.<\/p>\n<h3><strong>Errore da evitare<\/strong><\/h3>\n<p>L’errore più frequente è considerare ogni consolidamento come reclutabile. Il LUS deve aiutare a capire se aumentare EPAP/PEEP ha senso o se serve una terapia causale diversa.<\/p>\n<p>L’errore più frequente è trasformare il LUS in una diagnosi isolata. Il LUS non dice da solo quale supporto ventilatorio usare. Dice quale bersaglio è plausibile. La decisione nasce dall’integrazione tra pattern ecografico, lavoro respiratorio, EGA, comfort e tolleranza emodinamica.<\/p>\n<p>Il LUS non sceglie la modalità: rende visibile il problema che la modalità dovrebbe correggere.<\/p>\n<h3>Bibliografia del Capitolo 11<\/h3>\n<p>1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.<\/p>\n<p>2. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7.<\/p>\n<p>3. Masip J, Roque M, Sánchez B, Fernández R, Subirana M, Expósito JA. Noninvasive ventilation in acute cardiogenic pulmonary edema: systematic review and meta-analysis. JAMA. 2005;294(24):3124-3130. doi:10.1001/jama.294.24.3124.<\/p>\n<p>4. Frat JP, Thille AW, Mercat A, Girault C, Ragot S, Perbet S, et al.; FLORALI Study Group. High-flow oxygen through nasal cannula in acute hypoxemic respiratory failure. N Engl J Med. 2015;372(23):2185-2196. doi:10.1056/NEJMoa1503326.<\/p>\n<p>5. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.<\/p>\n<p>6. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p>\n<p>7. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI.<\/p>\n<p>8. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4.<\/p>\n<p>9. Lichtenstein DA, Mezière GA. Relevance of lung ultrasound in the diagnosis of acute respiratory failure: the BLUE protocol. Chest. 2008;134(1):117-125. doi:10.1378/chest.07-2800.<\/p>","plain":"Obiettivo pratico Dopo aver definito fenotipi, parametri, monitoraggio e criteri di stop, serve una sintesi clinica. Questo capitolo raccoglie quattro scenari frequenti in cui il LUS modifica davvero la gestione della NIV: BPCO/ipercapnia; edema polmonare cardiogeno; polmonite o insufficienza respiratoria ipossiemica de novo; post-operatorio, obesità, atelettasie e perdita declive di aerazione. Il capitolo non propone perinflazione; backup rate 12–14/min come sicurezza, non come trattamento della tachipnea. Controllo a 5–10 minuti: verificare perdite, comfort, sincronizzazione, raggiungimento di EPAP/IPAP, volume corrente plausibile, assenza di cycling tardivo e riduzione della fame d’aria. Se il paziente resta agitato, prima si correggono interfaccia, trigger, cycling e rise time; solo dopo si aumenta il pressure support. Risposta attesa a 30 minuti: FR in riduzione, per esempio da 32 a 24–26/min; minore attivazione dei muscoli accessori; comfort migliore; SpO₂ nel target con FiO₂ non crescente; pH in lieve miglioramento, per esempio 7,31–7,33; PaCO₂ stabile o in calo, senza pretendere normalizzazione immediata. La TFdi può ridursi verso un range di lavoro meno estremo. Segnali di fallimento o di correzione insufficiente: pH invariato o in peggioramento, PaCO₂ in aumento, FR persistentemente >30/min, sensorio peggiore, secrezioni non gestibili, perdite non correggibili, addominali sempre molto attivi, cycling tardivo non risolto, instabilità emodinamica o intolleranza dell’interfaccia. In questi casi il trial non va prolungato solo perché la SpO₂ è accettabile. Errore da evitare L’errore più frequente è trattare la BPCO come se fosse un problema di reclutamento. In un paziente ostruttivo, aumentare EPAP senza un bersaglio chiaro può peggiorare iperinflazione, comfort e tolleranza. Scenario 2. Edema polmonare cardiogeno Nel paziente con edema polmonare cardiogeno, il LUS spesso mostra artefatti verticali diffusi, relativamente ordinati e bilaterali, con distribuzione compatibile con congestione. Il quadro clinico deve essere coerente: dispnea acuta, ipertensione o sovraccarico, segni cardiaci, risposta alla terapia di decongestione. In questo scenario CPAP/EPAP ha un bersaglio fisiopatologico chiaro. La pressione positiva può ridurre il lavoro respiratorio, migliorare ossigenazione, ridurre ritorno venoso in condizioni di congestione e contribuire a ridurre il postcarico del ventricolo sinistro. La NIV -PS può essere utile se coesistono ipercapnia, fatica o insufficiente ventilazione alveolare. Gli elementi da cercare sono: B- lines diffuse e abbastanza ordinate; distribuzione bilaterale e compatibile con congestione; assenza di marcata disomogeneità pleurica o consolidamenti dominanti; cuore sinistro coerente, se valutato; riduzione di lavoro respiratorio dopo CPAP/EPAP. Figura 11.3. Edema cardiogeno: B-lines ordinate e CPAP/EPAP. Le B-lines diffuse e ordinate, se coerenti con il quadro clinico, rappresentano un bersaglio razionale per CPAP/EPAP e terapia causale. Figura 11.3. Edema cardiogeno: B-lines ordinate e CPAP/EPAP. Le B-lines diffuse e ordinate, se coerenti con il quadro clinico, rappresentano un bersaglio razionale per CPAP/EPAP e terapia causale. La risposta attesa è rapida: riduzione della dispnea, frequenza respiratoria in calo, FiO₂ riducibile, comfort migliore, pressione arteriosa tollerata, LUS stabile o in miglioramento. Se il LUS non cambia, la FiO₂ resta alta, il pattern è disomogeneo o compaiono segni di instabilità emodinamica, bisogna rivalutare il fenotipo. Errore da evitare Non tutte le B-lines sono edema cardiogeno. B-lines disordinate, pleura irregolare, consolidamenti subpleurici e distribuzione patchy devono far pensare a polmonite, ARDS-like, fibrosi o danno polmonare primitivo. Scenario 3. Polmonite e insufficienza respiratoria ipossiemica de novo Questo scenario è quello in cui il LUS è più utile per non illudersi. Il paziente può migliorare la SpO₂ con FiO₂ elevata e pressione positiva, ma continuare ad avere alto drive , alto lavoro respiratorio e peggioramento regionale della perdita di aerazione. Il LUS può mostrare: pleura irregolare; pattern disordinato; aree di risparmio alternate ad aree patologiche; consolidamenti subpleurici o più estesi; broncogrammi; distribuzione focale o asimmetrica. In questo scenario il supporto iniziale può essere HFNC, oppure un trial NIV-PS se il paziente è molto selezionato, collaborante, monitorabile e senza criteri di immediata intubazione. La NIV non deve diventare un modo per ritardare l’escalation . HFNC nello scenario ipossiemico de novo Se si sceglie HFNC, il trial deve avere la stessa disciplina temporale della NIV: flusso adeguato e tollerato, FiO₂ per target di saturazione, controllo precoce di frequenza respiratoria, lavoro muscolare, LUS e ROX index. Una SpO₂ accettabile con FiO₂ elevata, ROX non in miglioramento e diaframma/intercostali ancora iperattivi non deve essere considerata stabilizzazione. La rivalutazione precoce è obbligatoria. Se il paziente mantiene frequenza respiratoria alta, FiO₂ elevata, TFdi/TR alti, LUS invariato o peggiorato, EGA sfavorevole o comfort precario, il trial è a rischio. Scenario 4. Post-operatorio, obesità e atelettasia declive Nel paziente post-operatorio, obeso, allettato o dolorante, il problema può essere una perdita declive di aerazione. Il LUS può mostrare consolidamenti posteriori o basali, ridotta aerazione regionale, broncogrammi, versamento pleurico associato o segni di compressione. In questo scenario la pressione positiva può essere utile, ma deve essere integrata con altri interventi. CPAP/EPAP può favorire la ri-aerazione se l’area è reclutabile. Posizione, analgesia, mobilizzazione, fisioterapia respiratoria, gestione delle secrezioni e tosse efficace sono spesso altrettanto importanti. Figura 11.4. Polmone disomogeneo: polmonite, ipossiemia de novo e atelettasia. Nei quadri disomogenei il LUS serve a distinguere perdita di aerazione reclutabile, consolidamento non reclutabile e peggioramento progressivo durante il trial non invasivo. Figura 11.4. Polmone disomogeneo: polmonite, ipossiemia de novo e atelettasia. Nei quadri disomogenei il LUS serve a distinguere perdita di aerazione reclutabile, consolidamento non reclutabile e peggioramento progressivo durante il trial non invasivo. Il controllo deve concentrarsi sulle zone declivi e posteriori. Se il supporto funziona, ci si aspetta riduzione della richiesta di FiO₂, migliore comfort, possibile ri-aerazione parziale e riduzione del lavoro respiratorio. Se il consolidamento resta invariato o peggiora, bisogna pensare a secrezioni, ostruzione bronchiale, broncogramma statico, versamento o patologia non reclutabile. Errore da evitare L’errore più frequente è considerare ogni consolidamento come reclutabile. Il LUS deve aiutare a capire se aumentare EPAP/PEEP ha senso o se serve una terapia causale diversa. L’errore più frequente è trasformare il LUS in una diagnosi isolata. Il LUS non dice da solo quale supporto ventilatorio usare. Dice quale bersaglio è plausibile. La decisione nasce dall’integrazione tra pattern ecografico, lavoro respiratorio, EGA, comfort e tolleranza emodinamica. Il LUS non sceglie la modalità: rende visibile il problema che la modalità dovrebbe correggere. Bibliografia del Capitolo 11 1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016. 2. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7. 3. Masip J, Roque M, Sánchez B, Fernández R, Subirana M, Expósito JA. Noninvasive ventilation in acute cardiogenic pulmonary edema: systematic review and meta-analysis. JAMA. 2005;294(24):3124-3130. doi:10.1001/jama.294.24.3124. 4. Frat JP, Thille AW, Mercat A, Girault C, Ragot S, Perbet S, et al.; FLORALI Study Group. High-flow oxygen through nasal cannula in acute hypoxemic respiratory failure. N Engl J Med. 2015;372(23):2185-2196. doi:10.1056/NEJMoa1503326. 5. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379. 6. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558. 7. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI. 8. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4. 9. Lichtenstein DA, Mezière GA. Relevance of lung ultrasound in the diagnosis of acute respiratory failure: the BLUE protocol. Chest. 2008;134(1):117-125. doi:10.1378/chest.07-2800."},{"part":"Parte IV — Sintesi operativa finale","title":"Capitolo 12. Interpretazione dell'EGA nella NIV ecoguidata","tag":"Capitolo 12","html":"\n<h3>Obiettivo pratico<\/h3>\n<p>L'emogasanalisi arteriosa (EGA) non deve essere letta come un elenco di valori separati, ma come una storia fisiologica compressa in pochi numeri. Nel paziente candidato a HFNC, CPAP o NIV in pressione di supporto, l'EGA aiuta a capire se il problema dominante sia ventilatorio, metabolico, perfusivo o di ossigenazione, e permette di distinguere una risposta reale da una stabilizzazione solo apparente.<\/p>\n<p>Nel percorso NIV ecoguidato, l'EGA non sostituisce la clinica, il ventilatore o l'ecografia. Li collega. La PaCO₂ racconta la ventilazione alveolare, il pH dice se il compenso sta ancora reggendo, bicarbonati e base excess descrivono la componente metabolica, lattato e cloro chiariscono il contesto perfusivo e iatrogeno, PaO₂ e FiO₂ definiscono l'ossigenazione. Il valore pratico non nasce dal singolo numero, ma dal trend dopo l'avvio o la modifica del supporto.<\/p>\n<table class=\"manualTable\"><tr><th>Messaggio operativo. La domanda non e solo \"che pH ha il paziente?\". La domanda corretta e: quale variabile sta guidando il pH e che cosa devo cambiare nella NIV o nella terapia causale?<\/th><\/tr><\/table>\n<h3>Perché l'EGA è indispensabile nella NIV<\/h3>\n<p>La NIV può migliorare rapidamente la saturazione senza correggere davvero il problema fisiopatologico. Una FiO₂ piu alta puo rendere la SpO₂ accettabile, mentre il paziente resta tachipnoico, ipercapnico, acidotico o con alto drive respiratorio. Allo stesso modo, una buona immagine ecografica iniziale non garantisce che il supporto stia ventilando il paziente o riducendo il lavoro dei muscoli respiratori.<\/p>\n<p>L'EGA serve quindi in tre situazioni principali: prima di iniziare il supporto, per definire la gravità è il meccanismo; durante il trial, per verificare se pH, PaCO₂ e ossigenazione si muovono nella direzione attesa; al momento della decisione, per evitare di prolungare una NIV inefficace. Nei pazienti ipercapnici, in particolare, non basta osservare la frequenza respiratoria o la SpO₂: il miglioramento deve comparire anche su pH e PaCO₂, tenendo conto della cronicità del disturbo.<\/p>\n<h3>Prima di interpretare: campione, contesto e setting<\/h3>\n<p>Prima di discutere formule e compensi, bisogna chiedersi se il campione sia affidabile e se il contesto sia noto. Una EGA senza ora del prelievo, FiO₂ reale, tipo di supporto, EPAP/PEEP, pressure support, frequenza respiratoria e terapia ricevuta nelle ore precedenti e un dato incompleto. Anche il miglior metodo interpretativo puo portare a conclusioni sbagliate se il campione e venoso, diluito, analizzato in ritardo o non coerente con il quadro clinico.<\/p>\n<p>Nel manuale, ogni EGA usata per decisioni NIV dovrebbe essere collegata a tre informazioni minime: supporto in atto e impostazioni principali, timing rispetto all'inizio o alla modifica della NIV, trend clinico del paziente. In assenza di queste informazioni, l'EGA rischia di diventare un numero isolato e non una guida al trattamento.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_51.png\" alt=\"Figura 12.1. Algoritmo integrato di lettura dell&#x27;EGA. La lettura parte dal pH identifica la variabile che lo guida e collega il dato alla modifica della NIV o della terapia causale.\" loading=\"lazy\"><figcaption>Figura 12.1. Algoritmo integrato di lettura dell'EGA. La lettura parte dal pH identifica la variabile che lo guida e collega il dato alla modifica della NIV o della terapia causale.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_51.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 12.1. Algoritmo integrato di lettura dell'EGA. La lettura parte dal pH identifica la variabile che lo guida e collega il dato alla modifica della NIV o della terapia causale.<\/p>\n<h3>Sequenza pratica di lettura<\/h3>\n<p>Una sequenza fissa riduce gli errori. Il primo passaggio è il pH, che orienta verso acidemia, alcalemia o pH apparentemente normale. Il secondo è la PaCO₂, che identifica la componente ventilatoria immediata: se aumenta tende ad acidificare, se scende tende ad alcalinizzare. Il terzo passaggio e la componente metabolica, letta attraverso bicarbonati, base excess, anion gap, lattato, cloro e albumina.<\/p>\n<p>La lettura diventa affidabile solo quando si verifica il compenso atteso. Se il compenso non torna, il disturbo non è semplice. Nel paziente critico questo è frequente: una acidosi lattica può essere accompagnata da alcalosi respiratoria, una ipercapnia cronica da alcalosi metabolica ipocloremica, una acidosi ipocloremica da fluidi può sovrapporsi a sepsi o insufficienza renale.<\/p>\n<table class=\"manualTable\"><tr><th>Domanda<\/th><th>Variabile principale<\/th><th>Significato pratico nella NIV<\/th><\/tr>\n<tr><td>Il pH e basso, alto o normale?<\/td><td>pH<\/td><td>Definisce il verso apparente del disturbo, ma non basta per giudicare la gravita.<\/td><\/tr>\n<tr><td>La ventilazione alveolare e adeguata?<\/td><td>PaCO₂<\/td><td>PaCO₂ alta indica ipoventilazione effettiva o fatica; PaCO₂ molto bassa puo indicare alto drive.<\/td><\/tr>\n<tr><td>La componente metabolica e rilevante?<\/td><td>HCO3 / BE<\/td><td>Quantifica il peso metabolico globale, senza identificarne da sola la causa.<\/td><\/tr>\n<tr><td>Il compenso e quello atteso?<\/td><td>Formule di compenso<\/td><td>Se non torna, cercare un disturbo misto.<\/td><\/tr>\n<tr><td>Ci sono anioni non misurati?<\/td><td>AG corretto per albumina<\/td><td>Utile per lattato, chetoni, uremia, tossici e acidità mascherata.<\/td><\/tr>\n<tr><td>Il cloro o i fluidi stanno pesando?<\/td><td>Na-Cl / SID semplificata<\/td><td>Aiuta a riconoscere acidosi ipocloremica o alcalosi ipocloremica.<\/td><\/tr>\n<tr><td>L'ossigenazione e coerente?<\/td><td>PaO2/FiO₂, SaO2, Hb<\/td><td>La PaO2 isolata non basta senza FiO₂, PEEP/CPAP e Hb.<\/td><\/tr><\/table>\n<p class=\"manualCaptionText\">Tabella 12.1. Sequenza pratica per leggere una EGA nel paziente in supporto non invasivo.<\/p>\n<h3>pH normale: la trappola più frequente<\/h3>\n<p>Un pH nel range normale non esclude un disturbo grave. Può essere il risultato di forze opposte: acidosi metabolica lattica e alcalosi respiratoria, acidosi ipocloremica e ipoalbuminemia, ipercapnia cronica e alcalosi metabolica da diuretici. Nel paziente settico, per esempio, lattato alto e bicarbonati bassi possono essere mascherati da una PaCO₂ molto bassa e da ipoalbuminemia.<\/p>\n<p>Per questo, ogni volta che il pH è normale ma PaCO₂, bicarbonati, base excess o lattato sono alterati, bisogna sospettare un disturbo misto. La stabilità del pH non deve rassicurare se le variabili sottostanti sono in conflitto.<\/p>\n<h3>Il compenso va calcolato, non intuito<\/h3>\n<p>Il compenso fisiologico ha limiti prevedibili e non sovracompensa. Se una acidosi metabolica ha una PaCO₂ piu bassa o piu alta di quanto previsto, esiste una componente respiratoria sovrapposta. Se un paziente ipercapnico ha bicarbonati piu elevati di quanto atteso per la cronicità, puo esserci una alcalosi metabolica aggiuntiva, spesso legata a diuretici, vomito, ipocloremia o carico di bicarbonati.<\/p>\n<p>Nel paziente in NIV, questa distinzione è decisiva. Una PaCO₂ alta con pH poco alterato può indicare cronicità e compenso renale. Una PaCO₂ alta con pH in rapido peggioramento indica ipoventilazione acuta o acuta su cronica e richiede una rivalutazione del supporto, delle perdite, della sincronia e della soglia di escalation.<\/p>\n<table class=\"manualTable\"><tr><th>Disturbo primario<\/th><th>Compenso atteso<\/th><th>Quando sospettare disturbo misto<\/th><\/tr>\n<tr><td>Acidosi metabolica<\/td><td>PaCO₂ = 1,5 x HCO3 + 8 +/- 2<\/td><td>PaCO₂ piu alta: componente respiratoria acida; PaCO₂ piu bassa: alcalosi respiratoria associata.<\/td><\/tr>\n<tr><td>Alcalosi metabolica<\/td><td>PaCO₂ circa 0,7 x HCO3 + 20 +/- 5<\/td><td>PaCO₂ non adeguata al bicarbonato o quadro clinico non coerente.<\/td><\/tr>\n<tr><td>Acidosi respiratoria acuta<\/td><td>HCO3 aumenta circa 1 mEq/L ogni +10 mmHg PaCO₂<\/td><td>Bicarbonato troppo alto o troppo basso rispetto al tempo di insorgenza.<\/td><\/tr>\n<tr><td>Acidosi respiratoria cronica<\/td><td>HCO3 aumenta circa 3,5-4 mEq/L ogni +10 mmHg PaCO₂<\/td><td>pH piu basso del previsto o alcalosi metabolica sovrapposta.<\/td><\/tr>\n<tr><td>Alcalosi respiratoria acuta<\/td><td>HCO3 scende circa 2 mEq/L ogni -10 mmHg PaCO₂<\/td><td>HCO3 molto basso: componente metabolica associata.<\/td><\/tr>\n<tr><td>Alcalosi respiratoria cronica<\/td><td>HCO3 scende circa 4-5 mEq/L ogni -10 mmHg PaCO₂<\/td><td>Valori discordanti con storia clinica e trend.<\/td><\/tr><\/table>\n<p class=\"manualCaptionText\">Tabella 12.2. Compensi attesi: il valore misurato va confrontato con quello previsto prima di definire un disturbo semplice.<\/p>\n<h3>Ipercapnia acuta, cronica e acuta su cronica<\/h3>\n<p>Nel paziente ipercapnico la storia clinica conta quanto il numero. Una PaCO₂ di 70 mmHg in un paziente con BPCO stabile e bicarbonati elevati non ha lo stesso significato di una PaCO₂ di 70 mmHg con pH 7,20 e bicarbonati solo lievemente aumentati. Nel primo caso il compenso renale suggerisce cronicità; nel secondo il problema e acuto o acuto su cronico.<\/p>\n<p>La NIV-PS è particolarmente razionale quando l'ipercapnia si associa ad acidemia, lavoro respiratorio elevato e segni di fatica. L'obiettivo iniziale non è normalizzare la PaCO₂, ma migliorare pH, comfort, frequenza respiratoria e lavoro dei muscoli respiratori. Nel BPCO cronico, inseguire una PaCO₂ normale può essere irrealistico e potenzialmente dannoso; conta il trend e la coerenza con il quadro clinico.<\/p>\n<table class=\"manualTable\"><tr><th>Applicazione alla NIV. Nel paziente BPCO o OHS, una alcalosi metabolica ipocloremica puo mantenere bicarbonati elevati e rendere piu difficile la ventilazione. Guardare cloro, potassio e terapia diuretica prima di attribuire tutto ali muscoli respiratori.<\/th><\/tr><\/table>\n<h3>Base excess, anion gap e albumina<\/h3>\n<p>Il base excess quantifica la componente metabolica globale, ma non dice quale meccanismo la generi. Un BE di -8 può dipendere da lattato, ipercloremia, insufficienza renale o più cause insieme. Per questo e necessario affiancare anion gap, albumina, lattato e cloro.<\/p>\n<p>L'anion gap è utile per cercare anioni non misurati, ma nel paziente critico deve essere corretto per l'albumina. L'ipoalbuminemia riduce gli anioni deboli plasmatici e abbassa il gap apparente, mascherando una acidosi ad alto gap. La formula pratica e: AG corretto = AG + 2,5 x (4 - albumina in g/dL).<\/p>\n<p>Un paziente settico ipoalbuminemico può avere un anion gap solo moderatamente aumentato, nonostante lattato elevato. Senza correzione si rischia di sottostimare la gravità del disturbo metabolico.<\/p>\n<h3>Lattato: perfusione, stress e trend<\/h3>\n<p>Il lattato non è sinonimo automatico di ipossia tissutale, ma resta un segnale di stress metabolico e perfusivo. Nel contesto della NIV, un lattato elevato cambia la lettura del trial: un paziente con insufficienza respiratoria e lattato in aumento non va interpretato solo come problema ventilatorio. Bisogna cercare shock, sepsi, ischemia, adrenergic drive, compromissione epatica o ridotta clearance.<\/p>\n<p>Il trend è più informativo del valore isolato. Se dopo l'avvio della NIV migliorano SpO₂ e PaCO₂ ma il lattato aumenta, la risposta non è completamente favorevole. Il paziente può essere ancora in debito perfusivo o emodinamicamente instabile, e il supporto non invasivo non deve distrarre dalla terapia causale.<\/p>\n<h3>Ossigenazione: PaO₂ senza FiO₂ è un numero monco<\/h3>\n<p>La PaO₂ isolata è poco interpretabile se non si conoscono FiO₂, EPAP/PEEP o CPAP, emoglobina, saturazione e contesto. Nel manuale NIV ecoguidato, l'ossigenazione va letta come relazione tra scambio gassoso, supporto impostato e richiesta di ossigeno. Una PaO₂ accettabile ottenuta con FiO₂ molto elevata non indica necessariamente successo.<\/p>\n<p>Il rapporto PaO₂/FiO₂ può aiutare a descrivere la gravità dell'ipossiemia, ma va contestualizzato: CPAP/EPAP, posizione, reclutamento, pattern LUS e comfort del paziente possono modificarne il significato. Anche il contenuto arterioso di ossigeno e rilevante: un paziente anemico puo avere PaO₂ e SaO2 accettabili ma trasporto di ossigeno insufficiente.<\/p>\n<table class=\"manualTable\"><tr><th>Da ricordare. SpO₂ e PaO2 descrivono l'ossigenazione. Non dimostrano da sole che la ventilazione alveolare, il lavoro respiratorio o la perfusione siano migliorati.<\/th><\/tr><\/table>\n<h3>Stewart semplificato: cloro, SID, albumina e fluidi<\/h3>\n<p>L'approccio tradizionale orienta rapidamente. Stewart aiuta a spiegare alcune EGA complesse, soprattutto nei pazienti critici trattati con fluidi, diuretici, catecolamine o in presenza di ipoalbuminemia. Non serve trasformarlo in un esercizio matematico: al letto del paziente basta ricordare tre variabili indipendenti principali: PaCO₂,
