e beginning. Part 3: an Accademia di Ecografia Toracica comprehensive review on ultrasonographic signs and real needs. J Ultrasound Med. 2024;43(4):629-641. doi:10.1002/jum.16397."},{"part":"Parte II — L’ecografia applicata alla NIV: il metodo AdET","title":"Capitolo 7. Diaframma, muscoli respiratori e cuore","tag":"Capitolo 7","html":"\n<h3>Obiettivo pratico<\/h3>\n<p>La NIV non agisce solo sul polmone. Agisce sulla <strong>muscoli respiratori<\/strong> e modifica l’interazione cuore-polmone. Per questo, bisogna capire se il supporto stia davvero riducendo il lavoro del paziente, se il diaframma sia ancora sovraccarico, se gli altri muscoli respiratori stiano compensando e se la pressione positiva sia ben tollerata dal cuore.<\/p>\n<p>La domanda resta sempre la stessa:<\/p>\n<p>cosa vedo → cosa significa → cosa imposto/cambio nella NIV.<\/p>\n<h3>Spessore diaframmatico e <em>thickening<\/em> <em>fraction<\/em><\/h3>\n<p>La misura più utile per valutare il diaframma durante ventilazione assistita non è, di solito, lo spostamento della cupola, ma l’<strong>ispessimento del muscolo<\/strong><strong>, o <\/strong><strong><em>thickening fraction<\/em><\/strong>. Lo spessore diaframmatico si misura nella <strong>zona di apposizione<\/strong>, con sonda lineare ad alta frequenza, in genere tra VII e IX spazio intercostale lungo la linea ascellare anteriore-media.<\/p>\n<p>Il diaframma deve apparire come una struttura trilaminare: due linee iperecogene, pleura e peritoneo, con il muscolo ipoecogeno in mezzo.<\/p>\n<p>Le misure principali sono:<\/p>\n<p><strong>Tdi-exp:<\/strong><strong> spessore a fine espirazione;<\/strong><\/p>\n<p><strong>Tdi-insp:<\/strong><strong> spessore a fine inspirazione;<\/strong><\/p>\n<p><strong>TFdi: <\/strong><strong><em>thickening fraction<\/em><\/strong><strong> diaframmatica (indicata in letteratura anche come DTF).<\/strong><\/p>\n<p>La formula è:<\/p>\n<p><strong>TFdi (%) = [(Tdi-insp − Tdi-exp) / Tdi-exp] × 100<\/strong><\/p>\n<p>Il significato pratico è diverso per ogni parametro. Tdi-exp descrive soprattutto lo spessore basale e aiuta a monitorare l’atrofia nel tempo. TFdi (chiamato anche DTF) descrive l’attività contrattile relativa durante l’inspirazione.<\/p>\n<p>Durante NIV, valori molto bassi di TFdi possono indicare disfunzione, fatica respiratoria o sovra-assistenza. Valori elevati di TFdi possono indicare alto <em>drive<\/em> respiratorio, assistenza insufficiente o rischio di affaticamento. Un valore di riferimento normale in NIV, da interpretare sempre nel contesto clinico, è 20–30%.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_28.png\" alt=\"Figura 7.1. Spessore diaframmatico e Thickening Fraction. Lo spessore del diaframma si misura nella zona di apposizione con sonda lineare. Tdi-exp descrive il valore basale e consente il monitoraggio dell’atrofia; Tdi-insp consente di calcolare la TFdi, cioè la variazione percentuale dello spessore durante l’inspirazione.\" loading=\"lazy\"><figcaption>Figura 7.1. Spessore diaframmatico e Thickening Fraction. Lo spessore del diaframma si misura nella zona di apposizione con sonda lineare. Tdi-exp descrive il valore basale e consente il monitoraggio dell’atrofia; Tdi-insp consente di calcolare la TFdi, cioè la variazione percentuale dello spessore durante l’inspirazione.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_28.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 7.1. Spessore diaframmatico e Thickening Fraction. Lo spessore del diaframma si misura nella zona di apposizione con sonda lineare. Tdi-exp descrive il valore basale e consente il monitoraggio dell’atrofia; Tdi-insp consente di calcolare la TFdi, cioè la variazione percentuale dello spessore durante l’inspirazione.<\/p>\n<h3>Escursione diaframmatica<\/h3>\n<p>L’escursione diaframmatica (DE) misura lo spostamento cranio-caudale della cupola durante l’inspirazione. Si valuta con sonda convex con approccio sottocostale, di solito a destra, usando il M-mode.<\/p>\n<p>È una misura intuitiva e rapida, ma ha un limite importante: <strong>descrive il movimento<\/strong><strong> del muscolo<\/strong><strong>, non la forza<\/strong>. Il diaframma può spostarsi perché si contrae, ma anche per effetto dei muscoli respiratori accessori, della pressione pleurica o del supporto ventilatorio.<\/p>\n<p>Per questo, in NIV, la valutazione dell’escursione non deve venire prima della valutazione dello spessore/TFdi nel ragionamento clinico. Va usata come informazione complementare.<\/p>\n<p><strong>Cosa può indicare:<\/strong><\/p>\n<p>escursione conservata: buona mobilità della cupola, ma non prova forza normale;<\/p>\n<p>escursione ridotta: disfunzione, iperinflazione, obesità, dolore, scarso <em>drive<\/em> respiratorio o finestra non ottimale;<\/p>\n<p>movimento paradosso: sospetto di disfunzione diaframmatica severa, da confermare con il quadro clinico.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_29.png\" alt=\"Figura 7.2. Escursione diaframmatica: finestra e misura. L’escursione diaframmatica misura lo spostamento della cupola diaframmatica, si misura in M-mode. Durante NIV, l’escursione diaframmatica interpretata dopo spessore/TFdi e insieme a lavoro respiratorio, supporto impostato, sincronia ed EGA.\" loading=\"lazy\"><figcaption>Figura 7.2. Escursione diaframmatica: finestra e misura. L’escursione diaframmatica misura lo spostamento della cupola diaframmatica, si misura in M-mode. Durante NIV, l’escursione diaframmatica interpretata dopo spessore/TFdi e insieme a lavoro respiratorio, supporto impostato, sincronia ed EGA.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_29.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 7.2. Escursione diaframmatica: finestra e misura. L’escursione diaframmatica misura lo spostamento della cupola diaframmatica, si misura in M-mode. Durante NIV, l’escursione diaframmatica interpretata dopo spessore/TFdi e insieme a lavoro respiratorio, supporto impostato, sincronia ed EGA.<\/p>\n<h3>Muscoli intercostali e parasternali<\/h3>\n<p>Il diaframma non lavora da solo. Quando il carico respiratorio aumenta o il diaframma è debole, sfavorito dall’iperinflazione o sovra-assistito, il paziente può reclutare i muscoli intercostali e parasternali.<\/p>\n<p>Gli intercostali si valutano con sonda lineare nello spazio intercostale, visualizzando le due coste, le ombre acustiche posteriori, il muscolo intercostale e la pleura. Il parametro più semplice è il <strong><em>Thickness<\/em><\/strong><strong> <\/strong><strong><em>Ratio<\/em><\/strong><strong> intercostale (TR)<\/strong>:<\/p>\n<p><strong>TR (%) = [(spessore inspiratorio − spessore espiratorio) / spessore espiratorio] × 100<\/strong><\/p>\n<p>Un TR aumentato suggerisce reclutamento inspiratorio accessorio. Questo è particolarmente importante quando la TFdi è bassa o ambigua: il diaframma può sembrare poco attivo poiché il paziente sta compensando con altri muscoli.<\/p>\n<p><strong>Cosa cambia nella NIV:<\/strong><\/p>\n<p>TR alto + tachipnea: possibile supporto insufficiente o alto <em>drive<\/em><em> <\/em>respiratorio;<\/p>\n<p>TR alto + TFdi bassa: possibile compenso di disfunzione diaframmatica;<\/p>\n<p>TR basso + TFdi bassa: muscoli respiratori poco attiva, possibile sovra-assistenza o debolezza;<\/p>\n<p>TR persistentemente alto nonostante NIV: rivalutare <em>pressure<\/em> <em>support<\/em>, <em>trigger<\/em>, perdite, comfort e indicazione al supporto non invasivo.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_30.png\" alt=\"Figura 7.3. Ecografia dei muscoli intercostali: Thickness Ratio. Gli intercostali si valutano con sonda lineare nello spazio intercostale. Il TR descrive l’ispessimento inspiratorio e può aiutare a riconoscere compenso muscolare, distress o supporto ventilatorio insufficiente.\" loading=\"lazy\"><figcaption>Figura 7.3. Ecografia dei muscoli intercostali: Thickness Ratio. Gli intercostali si valutano con sonda lineare nello spazio intercostale. Il TR descrive l’ispessimento inspiratorio e può aiutare a riconoscere compenso muscolare, distress o supporto ventilatorio insufficiente.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_30.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 7.3. Ecografia dei muscoli intercostali: Thickness Ratio. Gli intercostali si valutano con sonda lineare nello spazio intercostale. Il TR descrive l’ispessimento inspiratorio e può aiutare a riconoscere compenso muscolare, distress o supporto ventilatorio insufficiente.<\/p>\n<h3>Muscoli addominali<\/h3>\n<p>I muscoli addominali non sono inspiratori, ma diventano importanti quando il paziente attiva l’espirazione. In condizioni normali, l’espirazione tranquilla è prevalentemente passiva. Se gli addominali si contraggono in modo marcato, il paziente sta usando una muscolo espiratorio.<\/p>\n<p>Questo può avvenire in caso di BPCO, ostruzione, iperinflazione dinamica, tosse inefficace, secrezioni, fastidio, asincronie o aumento del carico respiratorio.<\/p>\n<p>La valutazione si esegue con sonda lineare sulla parete addominale. A livello laterale si possono visualizzare tre strati principali:<\/p>\n<p><strong>OE:<\/strong><strong> obliquo esterno;<\/strong><\/p>\n<p><strong>OI:<\/strong><strong> obliquo interno;<\/strong><\/p>\n<p><strong>TrA:<\/strong><strong> trasverso dell’addome.<\/strong><\/p>\n<p>Un parametro pratico è la <em>thickening<\/em> <em>fraction<\/em> degli addominali, <strong>TFadb<\/strong>, calcolata in modo orientato all’espirazione:<\/p>\n<p><strong>TFadb (%) = [(spessore fine espirazione − spessore fine inspirazione) / spessore fine inspirazione] × 100<\/strong><\/p>\n<p>Un aumento della TFadb indica contrazione espiratoria attiva.<\/p>\n<p><strong>Cosa cambia nella NIV:<\/strong><\/p>\n<p>addominali molto attivi: sospettare espirazione forzata, ostruzione o iperinflazione;<\/p>\n<p>addominali attivi + BPCO: rivalutare EPAP, <em>cycling<\/em> e tempo espiratorio;<\/p>\n<p>addominali attivi + secrezioni: pensare a tosse inefficace e toilette bronchiale;<\/p>\n<p>aumento progressivo della TFadb: possibile fatica o peggioramento del carico espiratorio.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_31.png\" alt=\"Figura 7.4. Ecografia dei muscoli addominali: parete laterale e TFadb. Gli addominali laterali, obliquo esterno, obliquo interno e trasverso dell’addome, possono essere valutati con sonda lineare. La TFadb aiuta a riconoscere espirazione attiva e aumento del carico espiratorio.\" loading=\"lazy\"><figcaption>Figura 7.4. Ecografia dei muscoli addominali: parete laterale e TFadb. Gli addominali laterali, obliquo esterno, obliquo interno e trasverso dell’addome, possono essere valutati con sonda lineare. La TFadb aiuta a riconoscere espirazione attiva e aumento del carico espiratorio.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_31.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 7.4. Ecografia dei muscoli addominali: parete laterale e TFadb. Gli addominali laterali, obliquo esterno, obliquo interno e trasverso dell’addome, possono essere valutati con sonda lineare. La TFadb aiuta a riconoscere espirazione attiva e aumento del carico espiratorio.<\/p>\n<h3>Lettura integrata durante NIV<\/h3>\n<p>Le misure muscolari hanno senso solo se vengono integrate con clinica del paziente e impostazioni del ventilatore.<\/p>\n<p><strong>A<\/strong><strong>ssistenza<\/strong><strong> insufficiente<\/strong><\/p>\n<p>Il paziente resta tachipnoico, dispnoico, con TFdi elevata, TR intercostale aumentato, muscoli accessori attivi, PaCO₂ o pH non migliorati. In questo caso il supporto può essere insufficiente, mal sincronizzato o ostacolato da perdite elevate.<\/p>\n<p><strong>Assistenza adeguata<\/strong><\/p>\n<p>La frequenza respiratoria scende, il comfort migliora, TFdi si colloca in un range compatibile con sforzo moderato, l’utilizzo dei muscoli accessori si riduce, EGA e LUS sono coerenti. Il supporto sta scaricando i muscoli respiratori senza spegnere il diaframma.<\/p>\n<p><strong>Sovra-<\/strong><strong>assistenza<\/strong><\/p>\n<p>TFdi molto bassa, muscoli inspiratori accessori poco attivi, volume corrente stimato elevato, asincronie o perdite elevate. Il ventilatore può dominare eccessivamente il respiro. In questo caso ridurre il <em>pressure<\/em> <em>support<\/em> può essere ragionevole, se clinicamente sicuro.<\/p>\n<p><strong>Ostruzione o iperinflazione<\/strong><\/p>\n<p>Muscoli addominali attivi, TR aumentato, escursione diaframmatica ridotta o rapida, espirazione forzata. In questo caso bisogna rivalutare auto-PEEP, EPAP, <em>cycling<\/em>, tempo espiratorio e comfort.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_32.png\" alt=\"Figura 7.5. Muscoli respiratori durante NIV: lettura integrata. La combinazione di TFdi, escursione diaframmatica, TR intercostale, TFadb, frequenza respiratoria, comfort e EGA aiuta a distinguere assistenza insufficiente, assistenza adeguata, sovra-assistenza e ostruzione/iperinflazione.\" loading=\"lazy\"><figcaption>Figura 7.5. Muscoli respiratori durante NIV: lettura integrata. La combinazione di TFdi, escursione diaframmatica, TR intercostale, TFadb, frequenza respiratoria, comfort e EGA aiuta a distinguere assistenza insufficiente, assistenza adeguata, sovra-assistenza e ostruzione/iperinflazione.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_32.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 7.5. Muscoli respiratori durante NIV: lettura integrata. La combinazione di TFdi, escursione diaframmatica, TR intercostale, TFadb, frequenza respiratoria, comfort e EGA aiuta a distinguere assistenza insufficiente, assistenza adeguata, sovra-assistenza e ostruzione/iperinflazione.<\/p>\n<h3>Cuore e tolleranza alla pressione positiva<\/h3>\n<p>La pressione positiva modifica ritorno venoso, precarico, postcarico, pressione intratoracica e interazione cuore-polmone. L’ecocardioscopia essenziale non serve a fare una diagnosi cardiologica completa, ma a evitare errori grossolani quando si aumenta EPAP/PEEP.<\/p>\n<p><strong>Cuore sinistro<\/strong><\/p>\n<p>Nel paziente con edema polmonare cardiogeno, CPAP/EPAP può essere molto utile perché riduce il lavoro respiratorio, migliora l’ossigenazione e può avere effetti favorevoli sul precarico e sul postcarico del ventricolo sinistro.<\/p>\n<p><strong>Cuore destro<\/strong><\/p>\n<p>Un ventricolo destro dilatato, un D-<em>shape<\/em> del ventricolo sinistro, ipotensione o sospetta ipertensione polmonare rendono il paziente più vulnerabile agli incrementi pressori. In questi casi non bisogna aumentare EPAP/PEEP in modo non controllato.<\/p>\n<p><strong>Vena cava inferiore e congestione<\/strong><\/p>\n<p>La vena cava inferiore (VCI) può dare informazioni orientative, ma durante NIV/CPAP va interpretata con cautela. Diametro e collassabilità dipendono da volume, pressione intratoracica, <em>drive<\/em> respiratorio e pressione applicata. Non deve essere usata da sola per decidere una eventuale infusione di fluidi, l’impostazione della PEEP/EPAP o <em>escalation<\/em>.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_33.png\" alt=\"Figura 7.6. Pressione positiva: tracce ventilatorie ed effetti emodinamici. La traccia ventilatoria di pressione, flusso e volume è stata separata dai box emodinamici per mantenere leggibile il ciclo respiratorio. Il messaggio operativo resta lo stesso: durante l’inspirazione a pressione positiva aumentano pressione intratoracica e volume polmonare, con effetti su precarico, postcarico e tolleranza di ventricolo destro e ventricolo sinistro.\" loading=\"lazy\"><figcaption>Figura 7.6. Pressione positiva: tracce ventilatorie ed effetti emodinamici. La traccia ventilatoria di pressione, flusso e volume è stata separata dai box emodinamici per mantenere leggibile il ciclo respiratorio. Il messaggio operativo resta lo stesso: durante l’inspirazione a pressione positiva aumentano pressione intratoracica e volume polmonare, con effetti su precarico, postcarico e tolleranza di ventricolo destro e ventricolo sinistro.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_33.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 7.6. Pressione positiva: tracce ventilatorie ed effetti emodinamici. La traccia ventilatoria di pressione, flusso e volume è stata separata dai box emodinamici per mantenere leggibile il ciclo respiratorio. Il messaggio operativo resta lo stesso: durante l’inspirazione a pressione positiva aumentano pressione intratoracica e volume polmonare, con effetti su precarico, postcarico e tolleranza di ventricolo destro e ventricolo sinistro.<\/p>\n<h3>Errore da evitare<\/h3>\n<p>L’errore più frequente è usare una singola misura, soprattutto l’escursione diaframmatica, come se fosse una misura diretta della funzione diaframmatica. Nella NIV non basta sapere quanto il diaframma si muove. Bisogna sapere se si ispessisce, se altri muscoli stanno compensando, se il paziente espira attivamente e se il cuore tollera il supporto.<\/p>\n<p>Il diaframma non va letto come un numero isolato, ma come una risposta al supporto.<\/p>\n<h3>Bibliografia del Capitolo 7<\/h3>\n<p>1. Umbrello M, Formenti P. Ultrasonographic assessment of diaphragm function in critically ill subjects. Respir Care. 2016;61(4):542-555. doi:10.4187/respcare.04412.<\/p>\n<p>2. Haaksma ME, Smit JM, Boussuges A, Demoule A, Dres M, Ferrari G, Formenti P, et al. EXpert consensus On Diaphragm UltraSonography in the critically ill (EXODUS): a Delphi consensus statement on the measurement of diaphragm ultrasound-derived parameters in a critical care setting. Crit Care. 2022;26(1):99. doi:10.1186/s13054-022-03975-5.<\/p>\n<p>3. Vivier E, Mekontso Dessap A, Dimassi S, Vargas F, Lyazidi A, Thille AW, et al. Diaphragm ultrasonography to estimate the work of breathing during non-invasive ventilation. Intensive Care Med. 2012;38(5):796-803. doi:10.1007/s00134-012-2547-7.<\/p>\n<p>4. Goligher EC, Fan E, Herridge MS, Murray A, Vorona S, Brace D, Rittayamai N, et al. Evolution of diaphragm thickness during mechanical ventilation: impact of inspiratory effort. Am J Respir Crit Care Med. 2015;192(9):1080-1088. doi:10.1164/rccm.201503-0620OC.<\/p>\n<p>5. Formenti P, Umbrello M, Dres M, Chiumello D. Ultrasonographic assessment of parasternal intercostal muscles during mechanical ventilation. Ann Intensive Care. 2020;10(1):120. doi:10.1186/s13613-020-00749-0.<\/p>\n<p>6. Dres M, Dubé BP, Goligher E, Vorona S, Demiri S, Morawiec E, et al. Usefulness of parasternal intercostal muscle ultrasound during weaning from mechanical ventilation. Anesthesiology. 2020;132(5):1114-1125. doi:10.1097/ALN.0000000000003191.<\/p>\n<p>7. McCool FD, Tzelepis GE. Dysfunction of the diaphragm. N Engl J Med. 2012;366(10):932-942. doi:10.1056/NEJMra1007236.<\/p>\n<p>8. Boussuges A, Gole Y, Blanc P. Diaphragmatic motion studied by M-mode ultrasonography: methods, reproducibility, and normal values. Chest. 2009;135(2):391-400. doi:10.1378/chest.08-1541.<\/p>\n<p>9. Vieillard-Baron A, Matthay M, Teboul JL, Bein T, Schultz M, Magder S, Marini JJ. Experts’ opinion on management of hemodynamics in ARDS patients: focus on the effects of mechanical ventilation. Intensive Care Med. 2016;42(5):739-749. doi:10.1007/s00134-016-4326-3.<\/p>\n<p>10. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI.<\/p>","plain":"Obiettivo pratico La NIV non agisce solo sul polmone. Agisce sui muscoli respiratori e modifica l’interazione cuore-polmone. Per questo, bisogna capire se il supporto stia davvero riducendo il lavoro del paziente, se il diaframma sia ancora sovraccarico, se gli altri muscoli respiratori stiano compensando e se la pressione positiva sia ben tollerata dal cuore. La domanda resta sempre la stessa: cosa vedo → cosa significa → cosa imposto/cambio nella NIV. Spessore diaframmatico e thickening fraction La misura più utile per valutare il diaframma durante ventilazione assistita non è, di solito, lo spostamento della cupola, ma l’ ispessimento del muscolo , o thickening fraction . Lo spessore diaframmatico si misura nella zona di apposizione , con sonda lineare ad alta frequenza, in genere tra VII e IX spazio intercostale lungo la linea ascellare anteriore-media. Il diaframma deve apparire come una struttura trilaminare: due linee iperecogene, pleura e peritoneo, con il muscolo ipoecogeno in mezzo. Le misure principali sono: Tdi-exp: spessore a fine espirazione; Tdi-insp: spessore a fine inspirazione; TFdi: thickening fraction diaframmatica (indicata in letteratura anche come DTF). La formula è: TFdi (%) = [(Tdi-insp − Tdi-exp) / Tdi-exp] × 100 Il significato pratico è diverso per ogni parametro. Tdi-exp descrive soprattutto lo spessore basale e aiuta a monitorare l’atrofia nel tempo. TFdi (chiamato anche DTF) descrive l’attività contrattile relativa durante l’inspirazione. Durante NIV, valori molto bassi di TFdi possono indicare disfunzione, fatica respiratoria o sovra-assistenza. Valori elevati di TFdi possono indicare alto drive respiratorio, assistenza insufficiente o rischio di affaticamento. Un valore di riferimento normale in NIV, da interpretare sempre nel contesto clinico, è 20–30%. Figura 7.1. Spessore diaframmatico e Thickening Fraction. Lo spessore del diaframma si misura nella zona di apposizione con sonda lineare. Tdi-exp descrive il valore basale e consente il monitoraggio dell’atrofia; Tdi-insp consente di calcolare la TFdi, cioè la variazione percentuale dello spessore durante l’inspirazione. Figura 7.1. Spessore diaframmatico e Thickening Fraction. Lo spessore del diaframma si misura nella zona di apposizione con sonda lineare. Tdi-exp descrive il valore basale e consente il monitoraggio dell’atrofia; Tdi-insp consente di calcolare la TFdi, cioè la variazione percentuale dello spessore durante l’inspirazione. Escursione diaframmatica L’escursione diaframmatica (DE) misura lo spostamento cranio-caudale della cupola durante l’inspirazione. Si valuta con sonda convex con approccio sottocostale, di solito a destra, usando il M-mode. È una misura intuitiva e rapida, ma ha un limite importante: descrive il movimento del muscolo , non la forza . Il diaframma può spostarsi perché si contrae, ma anche per effetto dei muscoli respiratori accessori, della pressione pleurica o del supporto ventilatorio. Per questo, in NIV, la valutazione dell’escursione non deve venire prima della valutazione dello spessore/TFdi nel ragionamento clinico. Va usata come informazione complementare. Cosa può indicare: escursione conservata: buona mobilità della cupola, ma non prova forza normale; escursione ridotta: disfunzione, iperinflazione, obesità, dolore, scarso drive respiratorio o finestra non ottimale; movimento paradosso: sospetto di disfunzione diaframmatica severa, da confermare con il quadro clinico. Figura 7.2. Escursione diaframmatica: finestra e misura. L’escursione diaframmatica misura lo spostamento della cupola diaframmatica, si misura in M-mode. Durante NIV, l’escursione diaframmatica interpretata dopo spessore/TFdi e insieme a lavoro respiratorio, supporto impostato, sincronia ed EGA. Figura 7.2. Escursione diaframmatica: finestra e misura. L’escursione diaframmatica misura lo spostamento della cupola diaframmatica, si misura in M-mode. Durante NIV, l’escursione diaframmatica interpretata dopo spessore/TFdi e insieme a lavoro respiratorio, supporto impostato, sincronia ed EGA. Muscoli intercostali e parasternali Il diaframma non lavora da solo. Quando il carico respiratorio aumenta o il diaframma è debole, sfavorito dall’iperinflazione o sovra-assistito, il paziente può reclutare i muscoli intercostali e parasternali. Gli intercostali si valutano con sonda lineare nello spazio intercostale, visualizzando le due coste, le ombre acustiche posteriori, il muscolo intercostale e la pleura. Il parametro più semplice è il Thickness Ratio intercostale (TR) : TR (%) = [(spessore inspiratorio − spessore espiratorio) / spessore espiratorio] × 100 Un TR aumentato suggerisce reclutamento inspiratorio accessorio. Questo è particolarmente importante quando la TFdi è bassa o ambigua: il diaframma può sembrare poco attivo poiché il paziente sta compensando con altri muscoli. Cosa cambia nella NIV: TR alto + tachipnea: possibile supporto insufficiente o alto drive respiratorio; TR alto + TFdi bassa: possibile compenso di disfunzione diaframmatica; TR basso + TFdi bassa: muscoli respiratori poco attiva, possibile sovra-assistenza o debolezza; TR persistentemente alto nonostante NIV: rivalutare pressure support , trigger , perdite, comfort e indicazione al supporto non invasivo. Figura 7.3. Ecografia dei muscoli intercostali: Thickness Ratio. Gli intercostali si valutano con sonda lineare nello spazio intercostale. Il TR descrive l’ispessimento inspiratorio e può aiutare a riconoscere compenso muscolare, distress o supporto ventilatorio insufficiente. Figura 7.3. Ecografia dei muscoli intercostali: Thickness Ratio. Gli intercostali si valutano con sonda lineare nello spazio intercostale. Il TR descrive l’ispessimento inspiratorio e può aiutare a riconoscere compenso muscolare, distress o supporto ventilatorio insufficiente. Muscoli addominali I muscoli addominali non sono inspiratori, ma diventano importanti quando il paziente attiva l’espirazione. In condizioni normali, l’espirazione tranquilla è prevalentemente passiva. Se gli addominali si contraggono in modo marcato, il paziente sta usando una muscolo espiratorio. Questo può avvenire in caso di BPCO, ostruzione, iperinflazione dinamica, tosse inefficace, secrezioni, fastidio, asincronie o aumento del carico respiratorio. La valutazione si esegue con sonda lineare sulla parete addominale. A livello laterale si possono visualizzare tre strati principali: OE: obliquo esterno; OI: obliquo interno; TrA: trasverso dell’addome. Un parametro pratico è la thickening fraction degli addominali, TFadb , calcolata in modo orientato all’espirazione: TFadb (%) = [(spessore fine espirazione − spessore fine inspirazione) / spessore fine inspirazione] × 100 Un aumento della TFadb indica contrazione espiratoria attiva. Cosa cambia nella NIV: addominali molto attivi: sospettare espirazione forzata, ostruzione o iperinflazione; addominali attivi + BPCO: rivalutare EPAP, cycling e tempo espiratorio; addominali attivi + secrezioni: pensare a tosse inefficace e toilette bronchiale; aumento progressivo della TFadb: possibile fatica o peggioramento del carico espiratorio. Figura 7.4. Ecografia dei muscoli addominali: parete laterale e TFadb. Gli addominali laterali, obliquo esterno, obliquo interno e trasverso dell’addome, possono essere valutati con sonda lineare. La TFadb aiuta a riconoscere espirazione attiva e aumento del carico espiratorio. Figura 7.4. Ecografia dei muscoli addominali: parete laterale e TFadb. Gli addominali laterali, obliquo esterno, obliquo interno e trasverso dell’addome, possono essere valutati con sonda lineare. La TFadb aiuta a riconoscere espirazione attiva e aumento del carico espiratorio. Lettura integrata durante NIV Le misure muscolari hanno senso solo se vengono integrate con clinica del paziente e impostazioni del ventilatore. A ssistenza insufficiente Il paziente resta tachipnoico, dispnoico, con TFdi elevata, TR intercostale aumentato, muscoli accessori attivi, PaCO₂ o pH non migliorati. In questo caso il supporto può essere insufficiente, mal sincronizzato o ostacolato da perdite elevate. Assistenza adeguata La frequenza respiratoria scende, il comfort migliora, TFdi si colloca in un range compatibile con sforzo moderato, l’utilizzo dei muscoli accessori si riduce, EGA e LUS sono coerenti. Il supporto sta scaricando i muscoli respiratori senza spegnere il diaframma. Sovra- assistenza TFdi molto bassa, muscoli inspiratori accessori poco attivi, volume corrente stimato elevato, asincronie o perdite elevate. Il ventilatore può dominare eccessivamente il respiro. In questo caso ridurre il pressure support può essere ragionevole, se clinicamente sicuro. Ostruzione o iperinflazione Muscoli addominali attivi, TR aumentato, escursione diaframmatica ridotta o rapida, espirazione forzata. In questo caso bisogna rivalutare auto-PEEP, EPAP, cycling , tempo espiratorio e comfort. Figura 7.5. Muscoli respiratori durante NIV: lettura integrata. La combinazione di TFdi, escursione diaframmatica, TR intercostale, TFadb, frequenza respiratoria, comfort e EGA aiuta a distinguere assistenza insufficiente, assistenza adeguata, sovra-assistenza e ostruzione/iperinflazione. Figura 7.5. Muscoli respiratori durante NIV: lettura integrata. La combinazione di TFdi, escursione diaframmatica, TR intercostale, TFadb, frequenza respiratoria, comfort e EGA aiuta a distinguere assistenza insufficiente, assistenza adeguata, sovra-assistenza e ostruzione/iperinflazione. Cuore e tolleranza alla pressione positiva La pressione positiva modifica ritorno venoso, precarico, postcarico, pressione intratoracica e interazione cuore-polmone. L’ecocardioscopia essenziale non serve a fare una diagnosi cardiologica completa, ma a evitare errori grossolani quando si aumenta EPAP/PEEP. Cuore sinistro Nel paziente con edema polmonare cardiogeno, CPAP/EPAP può essere molto utile perché riduce il lavoro respiratorio, migliora l’ossigenazione e può avere effetti favorevoli sul precarico e sul postcarico del ventricolo sinistro. Cuore destro Un ventricolo destro dilatato, un D- shape del ventricolo sinistro, ipotensione o sospetta ipertensione polmonare rendono il paziente più vulnerabile agli incrementi pressori. In questi casi non bisogna aumentare EPAP/PEEP in modo non controllato. Vena cava inferiore e congestione La vena cava inferiore (VCI) può dare informazioni orientative, ma durante NIV/CPAP va interpretata con cautela. Diametro e collassabilità dipendono da volume, pressione intratoracica, drive respiratorio e pressione applicata. Non deve essere usata da sola per decidere una eventuale infusione di fluidi, l’impostazione della PEEP/EPAP o escalation . Figura 7.6. Pressione positiva: tracce ventilatorie ed effetti emodinamici. La traccia ventilatoria di pressione, flusso e volume è stata separata dai box emodinamici per mantenere leggibile il ciclo respiratorio. Il messaggio operativo resta lo stesso: durante l’inspirazione a pressione positiva aumentano pressione intratoracica e volume polmonare, con effetti su precarico, postcarico e tolleranza di ventricolo destro e ventricolo sinistro. Figura 7.6. Pressione positiva: tracce ventilatorie ed effetti emodinamici. La traccia ventilatoria di pressione, flusso e volume è stata separata dai box emodinamici per mantenere leggibile il ciclo respiratorio. Il messaggio operativo resta lo stesso: durante l’inspirazione a pressione positiva aumentano pressione intratoracica e volume polmonare, con effetti su precarico, postcarico e tolleranza di ventricolo destro e ventricolo sinistro. Errore da evitare L’errore più frequente è usare una singola misura, soprattutto l’escursione diaframmatica, come se fosse una misura diretta della funzione diaframmatica. Nella NIV non basta sapere quanto il diaframma si muove. Bisogna sapere se si ispessisce, se altri muscoli stanno compensando, se il paziente espira attivamente e se il cuore tollera il supporto. Il diaframma non va letto come un numero isolato, ma come una risposta al supporto. Bibliografia del Capitolo 7 1. Umbrello M, Formenti P. Ultrasonographic assessment of diaphragm function in critically ill subjects. Respir Care. 2016;61(4):542-555. doi:10.4187/respcare.04412. 2. Haaksma ME, Smit JM, Boussuges A, Demoule A, Dres M, Ferrari G, Formenti P, et al. EXpert consensus On Diaphragm UltraSonography in the critically ill (EXODUS): a Delphi consensus statement on the measurement of diaphragm ultrasound-derived parameters in a critical care setting. Crit Care. 2022;26(1):99. doi:10.1186/s13054-022-03975-5. 3. Vivier E, Mekontso Dessap A, Dimassi S, Vargas F, Lyazidi A, Thille AW, et al. Diaphragm ultrasonography to estimate the work of breathing during non-invasive ventilation. Intensive Care Med. 2012;38(5):796-803. doi:10.1007/s00134-012-2547-7. 4. Goligher EC, Fan E, Herridge MS, Murray A, Vorona S, Brace D, Rittayamai N, et al. Evolution of diaphragm thickness during mechanical ventilation: impact of inspiratory effort. Am J Respir Crit Care Med. 2015;192(9):1080-1088. doi:10.1164/rccm.201503-0620OC. 5. Formenti P, Umbrello M, Dres M, Chiumello D. Ultrasonographic assessment of parasternal intercostal muscles during mechanical ventilation. Ann Intensive Care. 2020;10(1):120. doi:10.1186/s13613-020-00749-0. 6. Dres M, Dubé BP, Goligher E, Vorona S, Demiri S, Morawiec E, et al. Usefulness of parasternal intercostal muscle ultrasound during weaning from mechanical ventilation. Anesthesiology. 2020;132(5):1114-1125. doi:10.1097/ALN.0000000000003191. 7. McCool FD, Tzelepis GE. Dysfunction of the diaphragm. N Engl J Med. 2012;366(10):932-942. doi:10.1056/NEJMra1007236. 8. Boussuges A, Gole Y, Blanc P. Diaphragmatic motion studied by M-mode ultrasonography: methods, reproducibility, and normal values. Chest. 2009;135(2):391-400. doi:10.1378/chest.08-1541. 9. Vieillard-Baron A, Matthay M, Teboul JL, Bein T, Schultz M, Magder S, Marini JJ. Experts’ opinion on management of hemodynamics in ARDS patients: focus on the effects of mechanical ventilation. Intensive Care Med. 2016;42(5):739-749. doi:10.1007/s00134-016-4326-3. 10. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI."},{"part":"Parte III — Scegliere e settare il supporto","title":"Capitolo 8. Fenotipi ecografici e scelta iniziale del supporto","tag":"Capitolo 8","html":"\n<h3>Obiettivo pratico<\/h3>\n<p>Il primo settaggio della NIV deve essere semplice, motivato e rivalutabile. Prima di impostare EPAP, <em>pressure<\/em> <em>support<\/em> o FiO₂ bisogna identificare il fenotipo dominante:<\/p>\n<p><strong>problema di <\/strong><strong>muscoli respiratori<\/strong><strong>;<\/strong><\/p>\n<p><strong>problema di <\/strong><strong>congestione/interstizio<\/strong><strong>;<\/strong><\/p>\n<p><strong>problema di <\/strong><strong>ipossiemia non cardiogena<\/strong><strong>;<\/strong><\/p>\n<p><strong>problema <\/strong><strong>atelettasico o post-operatorio<\/strong><strong>;<\/strong><\/p>\n<p><strong>problema di <\/strong><strong>tolleranza emodinamica alla pressione positiva<\/strong><strong>.<\/strong><\/p>\n<p>Questi fenotipi non sono diagnosi definitive. Sono categorie operative per decidere da dove partire e cosa controllare subito dopo.<\/p>\n<p>La domanda guida è: cosa voglio ottenere dal supporto respiratorio?<\/p>\n<p>il supporto deve scaricare i muscoli respiratori, reclutare il polmone, trattare congestione, correggere una perdita focale di aerazione o evitare un danno da pressione positiva?<\/p>\n<h3>Il principio: non partire dalla SpO₂<\/h3>\n<p>La saturazione è importante, ma non basta. Due pazienti con la stessa SpO₂ possono avere problemi opposti: uno può avere edema polmonare cardiogeno e rispondere rapidamente alla CPAP; un altro può avere polmonite disomogenea, alto <em>drive<\/em> respiratorio e elevato rischio di fallimento della NIV. Un terzo paziente può essere ipercapnico, con <em>pattern<\/em> A e diaframma sovraccarico: in quel caso la priorità non è reclutare, ma ventilare e scaricare i muscoli respiratori.?<\/p>\n<p>Il settaggio ecoguidato parte dall’integrazione della risposta a tre domande:<\/p>\n<p><strong>Polmone:<\/strong> aerato, congesto, disordinato, consolidato o compresso?<br><strong>Muscoli respiratori:<\/strong> diaframma e muscoli accessori stanno lavorando troppo o troppo poco?<br><strong>Cuore:<\/strong> la pressione positiva è plausibilmente utile o rischiosa?<\/p>\n<p>Da tale integrazione, è possibile definire i fenotipi ecografici prevalenti e quindi impostare un supporto adeguato.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_34.png\" alt=\"Figura 8.1. Triangolo decisionale: polmone, muscolo respiratorio, cuore. Il supporto non invasivo modifica contemporaneamente aerazione polmonare, lavoro dei muscoli respiratori e interazione cuore-polmone. La scelta della modalità e dei parametri deve integrare questi tre livelli.\" loading=\"lazy\"><figcaption>Figura 8.1. Triangolo decisionale: polmone, muscolo respiratorio, cuore. Il supporto non invasivo modifica contemporaneamente aerazione polmonare, lavoro dei muscoli respiratori e interazione cuore-polmone. La scelta della modalità e dei parametri deve integrare questi tre livelli.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_34.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 8.1. Triangolo decisionale: polmone, muscolo respiratorio, cuore. Il supporto non invasivo modifica contemporaneamente aerazione polmonare, lavoro dei muscoli respiratori e interazione cuore-polmone. La scelta della modalità e dei parametri deve integrare questi tre livelli.<\/p>\n<h3>Fenotipo 1: problema muscolare respiratorio<\/h3>\n<p>Il fenotipo di muscoli respiratori è tipico del paziente ipercapnico, spesso sottende BPCO, obesità-ipoventilazione, riacutizzazione ostruttiva, patologia neuromuscolare o affaticamento ventilatorio. Il LUS può mostrare un <em>pattern<\/em> A prevalente, senza un chiaro bersaglio di reclutamento. Il diaframma può avere TFdi elevata, gli intercostali possono essere attivi e gli addominali possono indicare espirazione forzata.<\/p>\n<p>In questo fenotipo il supporto iniziale più logico è la <strong>NIV<\/strong><strong>-PS<\/strong>. Il <em>pressure<\/em> <em>support<\/em> serve a ridurre il lavoro inspiratorio e migliorare la ventilazione alveolare. L’EPAP va impostata con attenzione: troppo bassa può non contrastare auto-PEEP e <em>trigger<\/em> inefficace; troppo alta può peggiorare iperinflazione e tolleranza.<\/p>\n<p><strong>Cosa <\/strong><strong>rivalutare in fase di settaggio<\/strong><strong>:<\/strong> frequenza respiratoria, pH, PaCO₂, comfort, <em>perdite<\/em>, <em>trigger<\/em>, <em>cycling<\/em>, TFdi/TR intercostale e attività addominale.<\/p>\n<p><strong>Errore da evitare:<\/strong> aumentare EPAP/PEEP come se il problema fosse sempre reclutamento.<\/p>\n<h3>Fenotipo 2: congestione cardiogena o interstiziale ordinata<\/h3>\n<p>In questo fenotipo il LUS mostra artefatti verticali diffusi, relativamente ordinati, spesso simmetrici, con linea pleurica non troppo irregolare. Se il quadro clinico e cardiaco è coerente, la pressione positiva ha un bersaglio chiaro: ridurre il lavoro respiratorio, migliorare l’ossigenazione e contribuire alla redistribuzione dei volumi intratoracici.<\/p>\n<p>Il supporto iniziale può essere <strong>CPAP/EPAP<\/strong>. La NIV-PS può essere utile se coesistono ipercapnia, fatica respiratoria o insufficiente ventilazione alveolare.<\/p>\n<p><strong>Cosa <\/strong><strong>monitorare<\/strong><strong>:<\/strong> riduzione della dispnea, calo della frequenza respiratoria, riduzione FiO₂, stabilità pressoria, miglioramento LUS, risposta alla terapia eziologica.<\/p>\n<p><strong>Errore da evitare:<\/strong> guardare solo la SpO₂ senza controllare se il LUS e il lavoro respiratorio migliorano davvero.<\/p>\n<h3>Fenotipo 3: ipossiemia non cardiogena e polmone disomogeneo<\/h3>\n<p>Questo è il fenotipo più delicato. Il LUS mostra <em>pattern<\/em> disordinato, pleura irregolare, aree di risparmio, consolidamenti subpleurici o perdita di aerazione non omogenea. Può corrispondere a polmonite, ARDS-<em>like<\/em>, danno infiammatorio o insufficienza respiratoria ipossiemica de novo.<\/p>\n<p>In questo contesto la NIV può essere rischiosa se il <em>drive<\/em> resta elevato. Il paziente può generare volumi correnti importanti, mantenere alto stress polmonare e mascherare il fallimento con una SpO₂ temporaneamente accettabile.<\/p>\n<p>La scelta iniziale può essere <strong>HFNC<\/strong> se il paziente è collaborante, emodinamicamente stabile e senza marcata ipercapnia. Un trial NIV-PS può essere considerato solo con sorveglianza stretta e con criteri di fallimento predefiniti.<\/p>\n<p><strong>Cosa <\/strong><strong>monitorare<\/strong><strong>:<\/strong> frequenza respiratoria, FiO₂ richiesta, LUS score seriale, TFdi/TR, volume corrente stimato se disponibile, EGA, sensorio e comfort.<\/p>\n<p><strong>Errore da evitare:<\/strong> prolungare la NIV solo perché la SpO₂ è migliorata.<\/p>\n<h3>Fenotipo 4: atelettasia, post-operatorio e consolidamenti declivi<\/h3>\n<p>Nel paziente post-operatorio, obeso, allettato o dolorante, il problema può essere una perdita focale o declive di aerazione. Il LUS mostra consolidamenti posteriori o postero-basali, talvolta con broncogramma, versamento associato o ridotta espansione regionale.<\/p>\n<p>In questo fenotipo CPAP/EPAP, ottimizzazione della posizione e dell’analgesia, fisioterapia respiratoria e mobilizzazione possono avere un ruolo importante. La pressione positiva è utile se l’area è almeno parzialmente reclutabile, ma non risolve da sola un bronco ostruito da secrezioni o un consolidamento non reclutabile.<\/p>\n<p><strong>Cosa <\/strong><strong>monitorare<\/strong><strong>:<\/strong> ri-aerazione delle zone declivi, riduzione FiO₂, comfort, dolore, tosse, secrezioni e broncogramma.<\/p>\n<p><strong>Errore da evitare:<\/strong> pensare che lo score 3 del LUS sia sempre correggibile impostando/aumentando EPAP/PEEP.<\/p>\n<h3>Fenotipo 5: cuore destro fragile o scarsa tolleranza emodinamica<\/h3>\n<p>La pressione positiva può essere utile, ma non è neutra. Se il ventricolo destro è dilatato, il paziente è ipoteso, c’è sospetto di embolia polmonare, ipertensione polmonare o shock, l’aumento di EPAP/PEEP può ridurre ritorno venoso e peggiorare la tolleranza emodinamica.<\/p>\n<p>In questo fenotipo bisogna essere prudenti. Può essere preferibile HFNC, un trial CPAP/NIV-PS con pressioni basse o una strategia diversa, in base al quadro clinico.<\/p>\n<p><strong>Cosa <\/strong><strong>monitorare<\/strong><strong>:<\/strong> pressione arteriosa, segni di ipoperfusione, ventricolo destro, VCI/congestione, FiO₂ richiesta e risposta clinica.<\/p>\n<p><strong>Errore da evitare:<\/strong> aumentare la pressione positiva in un paziente che sta peggiorando emodinamicamente.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_35.png\" alt=\"Figura 8.2. Dal fenotipo ecografico alla scelta del supporto. La scelta iniziale tra HFNC, CPAP/EPAP e NIV in pressure support dipende dal fenotipo dominante: muscoli respiratori, congestione, ipossiemia non cardiogena, atelettasia o tolleranza emodinamica.\" loading=\"lazy\"><figcaption>Figura 8.2. Dal fenotipo ecografico alla scelta del supporto. La scelta iniziale tra HFNC, CPAP/EPAP e NIV in pressure support dipende dal fenotipo dominante: muscoli respiratori, congestione, ipossiemia non cardiogena, atelettasia o tolleranza emodinamica.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_35.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 8.2. Dal fenotipo ecografico alla scelta del supporto. La scelta iniziale tra HFNC, CPAP/EPAP e NIV in pressure support dipende dal fenotipo dominante: muscoli respiratori, congestione, ipossiemia non cardiogena, atelettasia o tolleranza emodinamica.<\/p>\n<h3>La prima ora: non aspettare troppo<\/h3>\n<p>La prima ora serve a confermare se il fenotipo iniziale era corretto e se il supporto produce un trend favorevole. La sequenza dettagliata dei quattro timing decisionali è ripresa nel Capitolo 13; qui conta soprattutto ricordare che ogni modifica deve avere un bersaglio e una rivalutazione ravvicinata.<\/p>\n<p>Nei primi minuti si controllano tecnica e tolleranza; a 30–60 minuti si cerca una risposta fisiopatologica; a circa 2 ore si decide se continuare, correggere o interrompere il trial.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_36.png\" alt=\"Figura 8.3. Prima ora di NIV ecoguidata. Sequenza pratica per evitare trial non invasivi indefiniti: fenotipo iniziale, controllo tecnico, risposta fisiologica e decisione entro tempi definiti.\" loading=\"lazy\"><figcaption>Figura 8.3. Prima ora di NIV ecoguidata. Sequenza pratica per evitare trial non invasivi indefiniti: fenotipo iniziale, controllo tecnico, risposta fisiologica e decisione entro tempi definiti.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_36.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 8.3. Prima ora di NIV ecoguidata. Sequenza pratica per evitare trial non invasivi indefiniti: fenotipo iniziale, controllo tecnico, risposta fisiologica e decisione entro tempi definiti.<\/p>\n<h3>Errore da evitare<\/h3>\n<p>L’errore più frequente è scegliere la NIV perché “il paziente desatura” e poi inseguire la SpO₂ aumentando pressioni e FiO₂. La SpO₂ è un outcome, non una diagnosi fisiopatologica.<\/p>\n<p>La scelta del supporto deve nascere dal fenotipo, non dalla sola SpO₂.<\/p>\n<h3>Bibliografia del Capitolo 8<\/h3>\n<p>1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.<\/p>\n<p>2. Oczkowski S, Ergan B, Bos L, Chatwin M, Ferrer M, Gregoretti C, et al. ERS clinical practice guidelines: high-flow nasal cannula in acute respiratory failure. Eur Respir J. 2022;59(4):2101574. doi:10.1183/13993003.01574-2021.<\/p>\n<p>3. Frat JP, Thille AW, Mercat A, Girault C, Ragot S, Perbet S, et al.; FLORALI Study Group. High-flow oxygen through nasal cannula in acute hypoxemic respiratory failure. N Engl J Med. 2015;372(23):2185-2196. doi:10.1056/NEJMoa1503326.<\/p>\n<p>4. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.<\/p>\n<p>5. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7.<\/p>\n<p>6. Masip J, Roque M, Sánchez B, Fernández R, Subirana M, Expósito JA. Noninvasive ventilation in acute cardiogenic pulmonary edema: systematic review and meta-analysis. JAMA. 2005;294(24):3124-3130. doi:10.1001/jama.294.24.3124.<\/p>\n<p>7. Vivier E, Mekontso Dessap A, Dimassi S, Vargas F, Lyazidi A, Thille AW, et al. Diaphragm ultrasonography to estimate the work of breathing during non-invasive ventilation. Intensive Care Med. 2012;38(5):796-803. doi:10.1007/s00134-012-2547-7.<\/p>\n<p>8. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p>\n<p>9. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI.<\/p>\n<p>10. Vieillard-Baron A, Matthay M, Teboul JL, Bein T, Schultz M, Magder S, Marini JJ. Experts’ opinion on management of hemodynamics in ARDS patients: focus on the effects of mechanical ventilation. Intensive Care Med. 2016;42(5):739-749. doi:10.1007/s00134-016-4326-3.<\/p>","plain":"Obiettivo pratico Il primo settaggio della NIV deve essere semplice, motivato e rivalutabile. Prima di impostare EPAP, pressure support o FiO₂ bisogna identificare il fenotipo dominante: problema muscolare respiratorio ; problema di congestione/interstizio ; problema di ipossiemia non cardiogena ; problema atelettasico o post-operatorio ; problema di tolleranza emodinamica alla pressione positiva . Questi fenotipi non sono diagnosi definitive. Sono categorie operative per decidere da dove partire e cosa controllare subito dopo. La domanda guida è: cosa voglio ottenere dal supporto respiratorio? il supporto deve scaricare i muscoli respiratori, reclutare il polmone, trattare congestione, correggere una perdita focale di aerazione o evitare un danno da pressione positiva? Il principio: non partire dalla SpO₂ La saturazione è importante, ma non basta. Due pazienti con la stessa SpO₂ possono avere problemi opposti: uno può avere edema polmonare cardiogeno e rispondere rapidamente alla CPAP; un altro può avere polmonite disomogenea, alto drive respiratorio e elevato rischio di fallimento della NIV. Un terzo paziente può essere ipercapnico, con pattern A e diaframma sovraccarico: in quel caso la priorità non è reclutare, ma ventilare e scaricare i muscoli respiratori.? Il settaggio ecoguidato parte dall’integrazione della risposta a tre domande: Polmone: aerato, congesto, disordinato, consolidato o compresso? Muscoli respiratori: diaframma e muscoli accessori stanno lavorando troppo o troppo poco? Cuore: la pressione positiva è plausibilmente utile o rischiosa? Da tale integrazione, è possibile definire i fenotipi ecografici prevalenti e quindi impostare un supporto adeguato. Figura 8.1. Triangolo decisionale: polmone, muscolo respiratorio, cuore. Il supporto non invasivo modifica contemporaneamente aerazione polmonare, lavoro dei muscoli respiratori e interazione cuore-polmone. La scelta della modalità e dei parametri deve integrare questi tre livelli. Figura 8.1. Triangolo decisionale: polmone, muscolo respiratorio, cuore. Il supporto non invasivo modifica contemporaneamente aerazione polmonare, lavoro dei muscoli respiratori e interazione cuore-polmone. La scelta della modalità e dei parametri deve integrare questi tre livelli. Fenotipo 1: problema muscolare respiratorio Il fenotipo di muscoli respiratori è tipico del paziente ipercapnico, spesso sottende BPCO, obesità-ipoventilazione, riacutizzazione ostruttiva, patologia neuromuscolare o affaticamento ventilatorio. Il LUS può mostrare un pattern A prevalente, senza un chiaro bersaglio di reclutamento. Il diaframma può avere TFdi elevata, gli intercostali possono essere attivi e gli addominali possono indicare espirazione forzata. In questo fenotipo il supporto iniziale più logico è la NIV -PS . Il pressure support serve a ridurre il lavoro inspiratorio e migliorare la ventilazione alveolare. L’EPAP va impostata con attenzione: troppo bassa può non contrastare auto-PEEP e trigger inefficace; troppo alta può peggiorare iperinflazione e tolleranza. Cosa rivalutare in fase di settaggio : frequenza respiratoria, pH, PaCO₂, comfort, perdite , trigger , cycling , TFdi/TR intercostale e attività addominale. Errore da evitare: aumentare EPAP/PEEP come se il problema fosse sempre reclutamento. Fenotipo 2: congestione cardiogena o interstiziale ordinata In questo fenotipo il LUS mostra artefatti verticali diffusi, relativamente ordinati, spesso simmetrici, con linea pleurica non troppo irregolare. Se il quadro clinico e cardiaco è coerente, la pressione positiva ha un bersaglio chiaro: ridurre il lavoro respiratorio, migliorare l’ossigenazione e contribuire alla redistribuzione dei volumi intratoracici. Il supporto iniziale può essere CPAP/EPAP . La NIV-PS può essere utile se coesistono ipercapnia, fatica respiratoria o insufficiente ventilazione alveolare. Cosa monitorare : riduzione della dispnea, calo della frequenza respiratoria, riduzione FiO₂, stabilità pressoria, miglioramento LUS, risposta alla terapia eziologica. Errore da evitare: guardare solo la SpO₂ senza controllare se il LUS e il lavoro respiratorio migliorano davvero. Fenotipo 3: ipossiemia non cardiogena e polmone disomogeneo Questo è il fenotipo più delicato. Il LUS mostra pattern disordinato, pleura irregolare, aree di risparmio, consolidamenti subpleurici o perdita di aerazione non omogenea. Può corrispondere a polmonite, ARDS- like , danno infiammatorio o insufficienza respiratoria ipossiemica de novo. In questo contesto la NIV può essere rischiosa se il drive resta elevato. Il paziente può generare volumi correnti importanti, mantenere alto stress polmonare e mascherare il fallimento con una SpO₂ temporaneamente accettabile. La scelta iniziale può essere HFNC se il paziente è collaborante, emodinamicamente stabile e senza marcata ipercapnia. Un trial NIV-PS può essere considerato solo con sorveglianza stretta e con criteri di fallimento predefiniti. Cosa monitorare : frequenza respiratoria, FiO₂ richiesta, LUS score seriale, TFdi/TR, volume corrente stimato se disponibile, EGA, sensorio e comfort. Errore da evitare: prolungare la NIV solo perché la SpO₂ è migliorata. Fenotipo 4: atelettasia, post-operatorio e consolidamenti declivi Nel paziente post-operatorio, obeso, allettato o dolorante, il problema può essere una perdita focale o declive di aerazione. Il LUS mostra consolidamenti posteriori o postero-basali, talvolta con broncogramma, versamento associato o ridotta espansione regionale. In questo fenotipo CPAP/EPAP, ottimizzazione della posizione e dell’analgesia, fisioterapia respiratoria e mobilizzazione possono avere un ruolo importante. La pressione positiva è utile se l’area è almeno parzialmente reclutabile, ma non risolve da sola un bronco ostruito da secrezioni o un consolidamento non reclutabile. Cosa monitorare : ri-aerazione delle zone declivi, riduzione FiO₂, comfort, dolore, tosse, secrezioni e broncogramma. Errore da evitare: pensare che lo score 3 del LUS sia sempre correggibile impostando/aumentando EPAP/PEEP. Fenotipo 5: cuore destro fragile o scarsa tolleranza emodinamica La pressione positiva può essere utile, ma non è neutra. Se il ventricolo destro è dilatato, il paziente è ipoteso, c’è sospetto di embolia polmonare, ipertensione polmonare o shock, l’aumento di EPAP/PEEP può ridurre ritorno venoso e peggiorare la tolleranza emodinamica. In questo fenotipo bisogna essere prudenti. Può essere preferibile HFNC, un trial CPAP/NIV-PS con pressioni basse o una strategia diversa, in base al quadro clinico. Cosa monitorare : pressione arteriosa, segni di ipoperfusione, ventricolo destro, VCI/congestione, FiO₂ richiesta e risposta clinica. Errore da evitare: aumentare la pressione positiva in un paziente che sta peggiorando emodinamicamente. Figura 8.2. Dal fenotipo ecografico alla scelta del supporto. La scelta iniziale tra HFNC, CPAP/EPAP e NIV in pressure support dipende dal fenotipo dominante: muscoli respiratori, congestione, ipossiemia non cardiogena, atelettasia o tolleranza emodinamica. Figura 8.2. Dal fenotipo ecografico alla scelta del supporto. La scelta iniziale tra HFNC, CPAP/EPAP e NIV in pressure support dipende dal fenotipo dominante: muscoli respiratori, congestione, ipossiemia non cardiogena, atelettasia o tolleranza emodinamica. La prima ora: non aspettare troppo La prima ora serve a confermare se il fenotipo iniziale era corretto e se il supporto produce un trend favorevole. La sequenza dettagliata dei quattro timing decisionali è ripresa nel Capitolo 13; qui conta soprattutto ricordare che ogni modifica deve avere un bersaglio e una rivalutazione ravvicinata. Nei primi minuti si controllano tecnica e tolleranza; a 30–60 minuti si cerca una risposta fisiopatologica; a circa 2 ore si decide se continuare, correggere o interrompere il trial. Figura 8.3. Prima ora di NIV ecoguidata. Sequenza pratica per evitare trial non invasivi indefiniti: fenotipo iniziale, controllo tecnico, risposta fisiologica e decisione entro tempi definiti. Figura 8.3. Prima ora di NIV ecoguidata. Sequenza pratica per evitare trial non invasivi indefiniti: fenotipo iniziale, controllo tecnico, risposta fisiologica e decisione entro tempi definiti. Errore da evitare L’errore più frequente è scegliere la NIV perché “il paziente desatura” e poi inseguire la SpO₂ aumentando pressioni e FiO₂. La SpO₂ è un outcome, non una diagnosi fisiopatologica. La scelta del supporto deve nascere dal fenotipo, non dalla sola SpO₂. Bibliografia del Capitolo 8 1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016. 2. Oczkowski S, Ergan B, Bos L, Chatwin M, Ferrer M, Gregoretti C, et al. ERS clinical practice guidelines: high-flow nasal cannula in acute respiratory failure. Eur Respir J. 2022;59(4):2101574. doi:10.1183/13993003.01574-2021. 3. Frat JP, Thille AW, Mercat A, Girault C, Ragot S, Perbet S, et al.; FLORALI Study Group. High-flow oxygen through nasal cannula in acute hypoxemic respiratory failure. N Engl J Med. 2015;372(23):2185-2196. doi:10.1056/NEJMoa1503326. 4. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379. 5. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7. 6. Masip J, Roque M, Sánchez B, Fernández R, Subirana M, Expósito JA. Noninvasive ventilation in acute cardiogenic pulmonary edema: systematic review and meta-analysis. JAMA. 2005;294(24):3124-3130. doi:10.1001/jama.294.24.3124. 7. Vivier E, Mekontso Dessap A, Dimassi S, Vargas F, Lyazidi A, Thille AW, et al. Diaphragm ultrasonography to estimate the work of breathing during non-invasive ventilation. Intensive Care Med. 2012;38(5):796-803. doi:10.1007/s00134-012-2547-7. 8. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558. 9. Mojoli F, Bouhemad B, Mongodi S, Lichtenstein D. Lung ultrasound for critically ill patients. Am J Respir Crit Care Med. 2019;199(6):701-714. doi:10.1164/rccm.201802-0236CI. 10. Vieillard-Baron A, Matthay M, Teboul JL, Bein T, Schultz M, Magder S, Marini JJ. Experts’ opinion on management of hemodynamics in ARDS patients: focus on the effects of mechanical ventilation. Intensive Care Med. 2016;42(5):739-749. doi:10.1007/s00134-016-4326-3."},{"part":"Parte III — Scegliere e settare il supporto","title":"Capitolo 9. Titolazione ecoguidata dei parametri NIV","tag":"Capitolo 9","html":"\n<h3>Obiettivo pratico<\/h3>\n<p>Dopo aver scelto il supporto iniziale, il problema diventa più concreto: <strong>quale parametro modificare, di quanto e perché?<\/strong><\/p>\n<p>La titolazione ecoguidata non significa cambiare continuamente i parametri in base a ogni immagine. Significa collegare ogni modifica a un bersaglio fisiopatologico:<\/p>\n<p><strong><em>pressure<\/em><\/strong><strong> <\/strong><strong><em>support<\/em><\/strong> se il problema è carico inspiratorio, ipercapnia o muscoli respiratori;<\/p>\n<p><strong>EPAP/PEEP<\/strong><strong> se il problema è reclutamento, congestione, auto-PEEP o atelettasia;<\/strong><\/p>\n<p><strong>FiO₂<\/strong> se serve stabilizzare l’ossigenazione, ricordando che non corregge il meccanismo;<\/p>\n<p><strong><em>trigger<\/em><\/strong><strong>, <\/strong><strong><em>cycling<\/em><\/strong><strong> <\/strong><strong>e<\/strong><strong> <\/strong><strong><em>rise time<\/em><\/strong><strong> se il problema è asincronia;<\/strong><\/p>\n<p><strong>interfaccia<\/strong><strong> se il problema è perdita<\/strong><strong> elevata<\/strong><strong>, comfort o intolleranza.<\/strong><\/p>\n<p>La regola è semplice:<\/p>\n<p>una modifica, un bersaglio, una rivalutazione.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_37.png\" alt=\"Figura 9.1. I parametri regolabili del settaggio NIV ecoguidato. Pressure support, EPAP/PEEP, FiO₂, trigger/cycling e interfaccia sono riportati in forma tabellare per collegare ogni parametro regolabile al bersaglio fisiologico, all’indicazione pratica e alla rivalutazione.\" loading=\"lazy\"><figcaption>Figura 9.1. I parametri regolabili del settaggio NIV ecoguidato. Pressure support, EPAP/PEEP, FiO₂, trigger/cycling e interfaccia sono riportati in forma tabellare per collegare ogni parametro regolabile al bersaglio fisiologico, all’indicazione pratica e alla rivalutazione.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_37.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 9.1. I parametri regolabili del settaggio NIV ecoguidato. Pressure support, EPAP/PEEP, FiO₂, trigger/cycling e interfaccia sono riportati in forma tabellare per collegare ogni parametro regolabile al bersaglio fisiologico, all’indicazione pratica e alla rivalutazione.<\/p>\n<h3>Prima di titolare: controllare che la NIV funzioni tecnicamente<\/h3>\n<p>Prima di aumentare <em>pressure<\/em> <em>support<\/em> o EPAP/PEEP bisogna controllare la tecnica. Una maschera che perde, un casco mal regolato, un <em>trigger<\/em> instabile o un <em>cycling<\/em> ritardato possono simulare una assistenza insufficiente. In quel caso il diaframma risulterà ancora iperattivo, gli intercostali aumenteranno l’attivazione e il paziente sembrerà “non rispondere”, ma il problema non è il bersaglio, la definizione del fenotipo: è il supporto erogato male.<\/p>\n<p>Le prime domande sono molto pratiche:<\/p>\n<p>il paziente tollera l’interfaccia?<\/p>\n<p>ci sono perdite importanti?<\/p>\n<p>il ventilatore eroga il supporto quando il paziente inspira?<\/p>\n<p>l’inspirazione termina nel momento giusto?<\/p>\n<p>il paziente ha fame d’aria o fastidio?<\/p>\n<p>i volumi stimati sono plausibili o eccessivi?<\/p>\n<p>Solo dopo questo controllo ha senso parlare di titolazione ecoguidata.<\/p>\n<h3><em>Pressure<\/em> <em>support<\/em>: quando aumentarlo e quando ridurlo<\/h3>\n<p>Il <em>pressure<\/em> <em>support<\/em> è il parametro regolabile principale quando il problema è i muscoli respiratori. Serve a ridurre il carico inspiratorio, migliorare la ventilazione alveolare e correggere ipercapnia e acidosi respiratoria.<\/p>\n<p><strong>Quando aumentarlo<\/strong><\/p>\n<p>Ha senso aumentare il <em>pressure<\/em> <em>support<\/em> se il paziente resta tachipnoico, dispnoico, ipercapnico o acidotico, con TFdi elevata, intercostali attivi e comfort non adeguato. Il ragionamento è: il paziente sta ancora lavorando troppo.<\/p>\n<p>L’aumento deve essere progressivo. Dopo ogni incremento bisogna rivalutare frequenza respiratoria, comfort, entità delle perdite, volume corrente stimato, TFdi/TR e EGA quando indicata.<\/p>\n<p><strong>Quando non aumentarlo<\/strong><\/p>\n<p>Non bisogna aumentare il <em>pressure<\/em> <em>support<\/em> se il problema principale è un polmone disomogeneo con alto rischio di fallimento, se i volumi letti sono già elevati, se le perdite peggiorano o se l’aumento genera asincronie.<\/p>\n<p>Nel paziente ipossiemico non cardiogeno, un <em>pressure<\/em> <em>support<\/em> troppo alto può favorire volumi correnti elevati e stress polmonare. In questo contesto la SpO₂ può migliorare mentre il rischio aumenta.<\/p>\n<p><strong>Quando ridurlo<\/strong><\/p>\n<p>Il pressure support può essere eccessivo se TFdi è molto bassa, i volumi sono elevati, compaiono perdite elevate o fastidio, il paziente appare dominato dal ventilatore o sono presenti asincronie. Ridurre il PS può migliorare sincronia e comfort, se il quadro clinico lo consente.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_38.png\" alt=\"Figura 9.2. Titolazione del pressure support. Il pressure support deve scaricare i muscoli respiratori senza generare sovra-assistenza, volumi eccessivi o asincronie. TFdi, TR intercostale, frequenza respiratoria, comfort ed EGA orientano la modifica.\" loading=\"lazy\"><figcaption>Figura 9.2. Titolazione del pressure support. Il pressure support deve scaricare i muscoli respiratori senza generare sovra-assistenza, volumi eccessivi o asincronie. TFdi, TR intercostale, frequenza respiratoria, comfort ed EGA orientano la modifica.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_38.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 9.2. Titolazione del pressure support. Il pressure support deve scaricare i muscoli respiratori senza generare sovra-assistenza, volumi eccessivi o asincronie. TFdi, TR intercostale, frequenza respiratoria, comfort ed EGA orientano la modifica.<\/p>\n<h3>EPAP/PEEP: non è solo ossigenazione<\/h3>\n<p>EPAP/PEEP è un parametro regolabile potente. Può reclutare aree atelettasiche, migliorare l’ossigenazione, ridurre il lavoro respiratorio nel paziente congesto e aiutare a superare l’auto-PEEP nei pazienti ostruttivi. Può anche peggiorare iperinflazione, ridurre ritorno venoso e stressare il ventricolo destro.<\/p>\n<p>Per questo la domanda non è “quanto alzo la PEEP?”, ma:<\/p>\n<p>qual è il bersaglio della PEEP in questo paziente?<\/p>\n<p><strong>Bersaglio: congestione<\/strong><\/p>\n<p>Se il LUS mostra artefatti verticali diffusi e ordinati, con quadro clinico cardiogeno coerente, CPAP/EPAP ha un razionale forte. La risposta attesa è riduzione del lavoro respiratorio, riduzione FiO₂, miglioramento LUS seriale e stabilità emodinamica.<\/p>\n<p><strong>Bersaglio: atelettasia o perdita declive di aerazione<\/strong><\/p>\n<p>Se il LUS mostra consolidamenti o perdita di aerazione declive, EPAP/PEEP può essere utile solo se l’area è almeno parzialmente reclutabile. In questo caso contano anche ottimizzazione della posizione, fisioterapia, ottimizzazione dell’analgesia e gestione delle secrezioni.<\/p>\n<p><strong>Bersaglio: auto-PEEP<\/strong><\/p>\n<p>Nel paziente ostruttivo, un’EPAP/PEEP adeguata può facilitare il trigger e ridurre il lavoro inspiratorio per vincere la pressione intrinseca. Troppa EPAP/PEEP può peggiorare iperinflazione e fastidio. Qui gli addominali, la forma della curva espiratoria e il comfort del paziente sono segnali importanti.<\/p>\n<p><strong>Bersaglio: ossigenazione senza meccanismo chiaro<\/strong><\/p>\n<p>Aumentare EPAP/PEEP solo per inseguire la SpO₂ è rischioso. Se LUS non migliora, il <em>drive<\/em> resta alto e il paziente richiede FiO₂ elevata, la risposta è incerta o sfavorevole.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_39.png\" alt=\"Figura 9.3. Titolazione di EPAP/PEEP con LUS e cuore. Ogni incremento di EPAP/PEEP deve avere un bersaglio: congestione, reclutamento, auto-PEEP o atelettasia. Dopo la modifica vanno rivalutati LUS, FiO₂, frequenza respiratoria, comfort e tolleranza emodinamica.\" loading=\"lazy\"><figcaption>Figura 9.3. Titolazione di EPAP/PEEP con LUS e cuore. Ogni incremento di EPAP/PEEP deve avere un bersaglio: congestione, reclutamento, auto-PEEP o atelettasia. Dopo la modifica vanno rivalutati LUS, FiO₂, frequenza respiratoria, comfort e tolleranza emodinamica.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_39.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 9.3. Titolazione di EPAP/PEEP con LUS e cuore. Ogni incremento di EPAP/PEEP deve avere un bersaglio: congestione, reclutamento, auto-PEEP o atelettasia. Dopo la modifica vanno rivalutati LUS, FiO₂, frequenza respiratoria, comfort e tolleranza emodinamica.<\/p>\n<h3>FiO₂: stabilizza, ma non cura il meccanismo<\/h3>\n<p>La FiO₂ è necessaria per garantire un’ossigenazione sicura, ma non corregge il problema fisiopatologico. Se si aumenta solo la FiO₂ senza che si riducano lavoro respiratorio, LUS score o <em>drive<\/em> respiratorio, si rischia di mascherare il fallimento del supporto NIV.<\/p>\n<p>In pratica, una FiO₂ che scende dopo avvio del supporto è un segnale favorevole. Una FiO₂ che resta alta, anche con SpO₂ accettabile, è un segnale di risposta incompleta. Se il paziente resta tachipnoico, con muscoli attivi e LUS score invariato o peggiorato, non bisogna interpretare una SpO₂ sufficiente come successo.<\/p>\n<h3><em>Trigger<\/em>, <em>cycling<\/em> e <em>rise time<\/em><\/h3>\n<p>Molti problemi di NIV nascono dalle asincronie. L’ecografia può mostrare diaframma e intercostali ancora attivi, ma la causa può essere una cattiva interazione paziente-ventilatore.<\/p>\n<p><strong><em>Trigger<\/em><\/strong><strong> inefficace<\/strong><\/p>\n<p>Il paziente inspira, ma il ventilatore non eroga il pressure support o lo eroga in ritardo. Clinicamente si vedono sforzi inspiratori, fastidio, tachipnea e aumento del reclutamento dei muscoli accessori. Nel paziente BPCO può dipendere anche da auto-PEEP. La correzione passa da ottimizzazione di trigger, perdite, EPAP/PEEP e interfaccia.<\/p>\n<p><strong><em>Cycling<\/em><\/strong><strong> ritardato<\/strong><\/p>\n<p>Il ventilatore continua a insufflare quando il paziente vorrebbe espirare. Questo è frequente con perdite e pressure support elevato. Può peggiorare fastidio, addominali attivi, espirazione forzata e asincronia.<\/p>\n<p><strong><em>Cycling<\/em><\/strong><strong> precoce<\/strong><\/p>\n<p>Il ventilatore termina l’inspirazione troppo presto. Il paziente resta affamato d’aria, può richiamare subito un altro atto e mantenere alto <em>drive<\/em> e FR.<\/p>\n<p><strong><em>Rise<\/em><\/strong><strong> <\/strong><strong><em>time<\/em><\/strong><\/p>\n<p>Un <em>rise time<\/em> troppo lento può causare fame d’aria; viceversa, un <em>rise time<\/em> troppo rapido può aumentare fastidio, perdite e pressurizzazione brusca.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_40.png\" alt=\"Figura 9.4. Prima di cambiare i parametri: controllare tecnica e sincronia. Perdite, trigger inefficace, cycling errato e rise time inadeguato possono simulare assistenza inefficace o fallimento. Prima di aumentare PS o EPAP/PEEP bisogna correggere la tecnica.\" loading=\"lazy\"><figcaption>Figura 9.4. Prima di cambiare i parametri: controllare tecnica e sincronia. Perdite, trigger inefficace, cycling errato e rise time inadeguato possono simulare assistenza inefficace o fallimento. Prima di aumentare PS o EPAP/PEEP bisogna correggere la tecnica.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_40.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 9.4. Prima di cambiare i parametri: controllare tecnica e sincronia. Perdite, trigger inefficace, cycling errato e rise time inadeguato possono simulare assistenza inefficace o fallimento. Prima di aumentare PS o EPAP/PEEP bisogna correggere la tecnica.<\/p>\n<h3>Interfaccia: parte del settaggio, non dettaglio logistico<\/h3>\n<p>La scelta dell’interfaccia modifica efficacia, perdite, comfort, asincronie e tolleranza. Una maschera troppo stretta può essere intollerabile; una maschera troppo lasca rende instabile il <em>trigger<\/em>. Il casco può essere utile in alcuni contesti, ma richiede attenzione a flussi, pressurizzazione, rumore, ritardo di risposta e comfort. Nella pratica, l’interfaccia va considerata una vera variabile regolabile terapeutica. Se il paziente non tollera l’interfaccia, il miglior algoritmo ecografico non funziona<\/p>\n<h3>Errore da evitare<\/h3>\n<p>L’errore più frequente è aumentare progressivamente tutto: più FiO₂, più pressure support, più EPAP/PEEP, maschera più stretta. Questo produce una NIV apparentemente più intensa, ma non necessariamente più efficace.<\/p>\n<p>Il settaggio ecoguidato non è aumentare i numeri: è scegliere il parametro regolabile giusto per il bersaglio giusto.<\/p>\n<h3>Bibliografia del Capitolo 9<\/h3>\n<p>1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.<\/p>\n<p>2. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7.<\/p>\n<p>3. Vignaux L, Vargas F, Roeseler J, Tassaux D, Thille AW, Kossowsky MP, Brochard L, Jolliet P. Patient-ventilator asynchrony during non-invasive ventilation for acute respiratory failure: a multicenter study. Intensive Care Med. 2009;35(5):840-846. doi:10.1007/s00134-009-1416-5.<\/p>\n<p>4. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.<\/p>\n<p>5. Vivier E, Mekontso Dessap A, Dimassi S, Vargas F, Lyazidi A, Thille AW, et al. Diaphragm ultrasonography to estimate the work of breathing during non-invasive ventilation. Intensive Care Med. 2012;38(5):796-803. doi:10.1007/s00134-012-2547-7.<\/p>\n<p>6. Bouhemad B, Brisson H, Le-Guen M, Arbelot C, Lu Q, Rouby JJ. Bedside ultrasound assessment of positive end-expiratory pressure-induced lung recruitment. Am J Respir Crit Care Med. 2011;183(3):341-347. doi:10.1164/rccm.201003-0369OC.<\/p>\n<p>7. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p>\n<p>8. Vieillard-Baron A, Matthay M, Teboul JL, Bein T, Schultz M, Magder S, Marini JJ. Experts’ opinion on management of hemodynamics in ARDS patients: focus on the effects of mechanical ventilation. Intensive Care Med. 2016;42(5):739-749. doi:10.1007/s00134-016-4326-3.<\/p>","plain":"Obiettivo pratico Dopo aver scelto il supporto iniziale, il problema diventa più concreto: quale parametro modificare, di quanto e perché? La titolazione ecoguidata non significa cambiare continuamente i parametri in base a ogni immagine. Significa collegare ogni modifica a un bersaglio fisiopatologico: pressure support se il problema è carico inspiratorio, ipercapnia o muscoli respiratori; EPAP/PEEP se il problema è reclutamento, congestione, auto-PEEP o atelettasia; FiO₂ se serve stabilizzare l’ossigenazione, ricordando che non corregge il meccanismo; trigger , cycling e rise time se il problema è asincronia; interfaccia se il problema è perdita elevata , comfort o intolleranza. La regola è semplice: una modifica, un bersaglio, una rivalutazione. Figura 9.1. I parametri regolabili del settaggio NIV ecoguidato. Pressure support, EPAP/PEEP, FiO₂, trigger/cycling e interfaccia sono riportati in forma tabellare per collegare ogni parametro regolabile al bersaglio fisiologico, all’indicazione pratica e alla rivalutazione. Figura 9.1. I parametri regolabili del settaggio NIV ecoguidato. Pressure support, EPAP/PEEP, FiO₂, trigger/cycling e interfaccia sono riportati in forma tabellare per collegare ogni parametro regolabile al bersaglio fisiologico, all’indicazione pratica e alla rivalutazione. Prima di titolare: controllare che la NIV funzioni tecnicamente Prima di aumentare pressure support o EPAP/PEEP bisogna controllare la tecnica. Una maschera che perde, un casco mal regolato, un trigger instabile o un cycling ritardato possono simulare una assistenza insufficiente. In quel caso il diaframma risulterà ancora iperattivo, gli intercostali aumenteranno l’attivazione e il paziente sembrerà “non rispondere”, ma il problema non è il bersaglio, la definizione del fenotipo: è il supporto erogato male. Le prime domande sono molto pratiche: il paziente tollera l’interfaccia? ci sono perdite importanti? il ventilatore eroga il supporto quando il paziente inspira? l’inspirazione termina nel momento giusto? il paziente ha fame d’aria o fastidio? i volumi stimati sono plausibili o eccessivi? Solo dopo questo controllo ha senso parlare di titolazione ecoguidata. Pressure support : quando aumentarlo e quando ridurlo Il pressure support è il parametro regolabile principale quando il problema è i muscoli respiratori. Serve a ridurre il carico inspiratorio, migliorare la ventilazione alveolare e correggere ipercapnia e acidosi respiratoria. Quando aumentarlo Ha senso aumentare il pressure support se il paziente resta tachipnoico, dispnoico, ipercapnico o acidotico, con TFdi elevata, intercostali attivi e comfort non adeguato. Il ragionamento è: il paziente sta ancora lavorando troppo. L’aumento deve essere progressivo. Dopo ogni incremento bisogna rivalutare frequenza respiratoria, comfort, entità delle perdite, volume corrente stimato, TFdi/TR e EGA quando indicata. Quando non aumentarlo Non bisogna aumentare il pressure support se il problema principale è un polmone disomogeneo con alto rischio di fallimento, se i volumi letti sono già elevati, se le perdite peggiorano o se l’aumento genera asincronie. Nel paziente ipossiemico non cardiogeno, un pressure support troppo alto può favorire volumi correnti elevati e stress polmonare. In questo contesto la SpO₂ può migliorare mentre il rischio aumenta. Quando ridurlo Il pressure support può essere eccessivo se TFdi è molto bassa, i volumi sono elevati, compaiono perdite elevate o fastidio, il paziente appare dominato dal ventilatore o sono presenti asincronie. Ridurre il PS può migliorare sincronia e comfort, se il quadro clinico lo consente. Figura 9.2. Titolazione del pressure support. Il pressure support deve scaricare i muscoli respiratori senza generare sovra-assistenza, volumi eccessivi o asincronie. TFdi, TR intercostale, frequenza respiratoria, comfort ed EGA orientano la modifica. Figura 9.2. Titolazione del pressure support. Il pressure support deve scaricare i muscoli respiratori senza generare sovra-assistenza, volumi eccessivi o asincronie. TFdi, TR intercostale, frequenza respiratoria, comfort ed EGA orientano la modifica. EPAP/PEEP: non è solo ossigenazione EPAP/PEEP è un parametro regolabile potente. Può reclutare aree atelettasiche, migliorare l’ossigenazione, ridurre il lavoro respiratorio nel paziente congesto e aiutare a superare l’auto-PEEP nei pazienti ostruttivi. Può anche peggiorare iperinflazione, ridurre ritorno venoso e stressare il ventricolo destro. Per questo la domanda non è “quanto alzo la PEEP?”, ma: qual è il bersaglio della PEEP in questo paziente? Bersaglio: congestione Se il LUS mostra artefatti verticali diffusi e ordinati, con quadro clinico cardiogeno coerente, CPAP/EPAP ha un razionale forte. La risposta attesa è riduzione del lavoro respiratorio, riduzione FiO₂, miglioramento LUS seriale e stabilità emodinamica. Bersaglio: atelettasia o perdita declive di aerazione Se il LUS mostra consolidamenti o perdita di aerazione declive, EPAP/PEEP può essere utile solo se l’area è almeno parzialmente reclutabile. In questo caso contano anche ottimizzazione della posizione, fisioterapia, ottimizzazione dell’analgesia e gestione delle secrezioni. Bersaglio: auto-PEEP Nel paziente ostruttivo, un’EPAP/PEEP adeguata può facilitare il trigger e ridurre il lavoro inspiratorio per vincere la pressione intrinseca. Troppa EPAP/PEEP può peggiorare iperinflazione e fastidio. Qui gli addominali, la forma della curva espiratoria e il comf
