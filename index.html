frequenza respiratoria, comfort ed EGA orientano la modifica.","file":"figure_scaricabili/figura_38.png"},{"index":39,"caption":"Figura 9.3. Titolazione di EPAP/PEEP con LUS e cuore. Ogni incremento di EPAP/PEEP deve avere un bersaglio: congestione, reclutamento, auto-PEEP o atelettasia. Dopo la modifica vanno rivalutati LUS, FiO₂, frequenza respiratoria, comfort e tolleranza emodinamica.","file":"figure_scaricabili/figura_39.png"},{"index":40,"caption":"Figura 9.4. Prima di cambiare i parametri: controllare tecnica e sincronia. Perdite, trigger inefficace, cycling errato e rise time inadeguato possono simulare assistenza inefficace o fallimento. Prima di aumentare PS o EPAP/PEEP bisogna correggere la tecnica.","file":"figure_scaricabili/figura_40.png"},{"index":41,"caption":"Figura 10.1. Monitoraggio seriale della NIV ecoguidata. La risposta al supporto deve essere rivalutata nel tempo integrando paziente, ventilatore, ecografia, EGA e decisione pratica.","file":"figure_scaricabili/figura_41.png"},{"index":42,"caption":"Figura 10.2. Successo reale, risposta apparente, fallimento. La risposta alla NIV deve essere classificata integrando SpO₂, FiO₂, frequenza respiratoria, LUS, muscoli respiratori ed EGA.","file":"figure_scaricabili/figura_42.png"},{"index":43,"caption":"Figura 10.3. Sicurezza del trial non invasivo: semaforo clinico. Il trial deve essere classificato rapidamente come favorevole, incerto o sfavorevole. La risposta incerta richiede correzione e rivalutazione ravvicinata; la risposta sfavorevole richiede escalation o cambio di strategia.","file":"figure_scaricabili/figura_43.png"},{"index":44,"caption":"Figura 10.4. Esempi ecografici per leggere il monitoraggio seriale LUS. La figura integra immagini ecografiche esemplificative per distinguere risposta reale, risposta apparente e fallimento probabile. Le immagini sono adattate dal materiale fornito dall’autore e hanno finalità didattica: non rappresentano una serie dello stesso paziente.","file":"figure_scaricabili/figura_44.png"},{"index":45,"caption":"Figura 10.5. Segnali di allarme durante NIV. I segnali clinici, EGA, ecografici, muscolari, ventilatori ed emodinamici devono essere letti insieme. Quando peggiorano più domini, il trial non invasivo non va prolungato.","file":"figure_scaricabili/figura_45.png"},{"index":46,"caption":"Figura 10.6. De-escalation: quando ridurre NIV o passare a HFNC/ossigeno. La riduzione del supporto deve essere progressiva: stabilità, riduzione dell’intensità, pause controllate e stop della NIV solo se il trend rimane favorevole.","file":"figure_scaricabili/figura_46.png"},{"index":47,"caption":"Figura 11.1. Percorsi clinici NIV ecoguidati: dal LUS alla decisione. La figura integra immagini ecografiche esemplificative nei quattro scenari pratici principali: BPCO/ipercapnia, edema cardiogeno, polmonite/ipossiemia de novo e post-operatorio/atelettasia.","file":"figure_scaricabili/figura_47.png"},{"index":48,"caption":"Figura 11.2. BPCO/ipercapnia: dal pattern A alla NIV in pressure support. Nel paziente ipercapnico con polmone prevalentemente aerato, il LUS orienta il ragionamento verso muscoli respiratori, auto-PEEP, trigger, cycling, pressure support e attività dei muscoli accessori.","file":"figure_scaricabili/figura_48.png"},{"index":49,"caption":"Figura 11.3. Edema cardiogeno: B-lines ordinate e CPAP/EPAP. Le B-lines diffuse e ordinate, se coerenti con il quadro clinico, rappresentano un bersaglio razionale per CPAP/EPAP e terapia causale.","file":"figure_scaricabili/figura_49.png"},{"index":50,"caption":"Figura 11.4. Polmone disomogeneo: polmonite, ipossiemia de novo e atelettasia. Nei quadri disomogenei il LUS serve a distinguere perdita di aerazione reclutabile, consolidamento non reclutabile e peggioramento progressivo durante il trial non invasivo.","file":"figure_scaricabili/figura_50.png"},{"index":51,"caption":"Figura 12.1. Algoritmo integrato di lettura dell'EGA. La lettura parte dal pH identifica la variabile che lo guida e collega il dato alla modifica della NIV o della terapia causale.","file":"figure_scaricabili/figura_51.png"},{"index":52,"caption":"Figura 12.2. Le tre variabili indipendenti dell'approccio di Stewart. PaCO₂, SID e ATOT aiutano a capire quale meccanismo sta guidando il pH.","file":"figure_scaricabili/figura_52.png"},{"index":53,"caption":"Figura 12.3. Stewart nella pratica clinica. Correggere il pH significa agire sulla variabile che lo determina: ventilazione alveolare/NIV, composizione dei fluidi e degli ioni forti, albumina e fosfati.","file":"figure_scaricabili/figura_53.png"},{"index":54,"caption":"Figura 13.1. Sequenza temporale della NIV ecoguidata. Il percorso conclusivo riassume le quattro finestre decisionali: indicazione, adattamento tecnico, risposta fisiopatologica e decisione a due ore.","file":"figure_scaricabili/figura_54.png"},{"index":55,"caption":"Figura 13.2. Valutazione iniziale per indicare la NIV. Il supporto nasce dall’integrazione tra polmone, muscoli respiratori, cuore e condizioni del paziente.","file":"figure_scaricabili/figura_55.png"},{"index":56,"caption":"Figura 13.3. Adattamento nei primi minuti. Prima di giudicare il fallimento bisogna correggere interfaccia, perdite, trigger, cycling, rise time e comfort.","file":"figure_scaricabili/figura_56.png"},{"index":57,"caption":"Figura 13.4. Risposta fisiopatologica a 30–60 minuti. La risposta reale richiede coerenza tra clinica, EGA, LUS, muscoli respiratori e dati del ventilatore.","file":"figure_scaricabili/figura_57.png"},{"index":58,"caption":"Figura 13.5. Decisione a due ore. Il trial può proseguire, essere corretto o de-escalato, oppure essere terminato se il trend è sfavorevole.","file":"figure_scaricabili/figura_58.png"}]}}
</script>
<script>









window.APP_DATA = JSON.parse(document.getElementById('app-data').textContent);
const D = window.APP_DATA;
const tabs = [
  ['home','Home','🏠'],
  ['manuale','Manuale','📘'],
  ['ega','EGA','🩸'],
  ['modalita','Modalità','🫁'],
  ['asincronie','Asincronie','〽️'],
  ['correzioni','Correzioni','🎛️'],
  ['algoritmo','Algoritmo','🧭'],
  ['calcoli','Calcolatori','🧮'],
  ['referto','Referto','📝'],
  ['visivo','Referto visivo','🖼️'],
  ['appendici','Appendici','🧩'],
  ['materiali','Figure e testo','📦'],
  ['atlante','Atlante','🌊']
];

let currentChapter = 0;
let currentPhenotype = 'pump';

document.addEventListener('DOMContentLoaded', init);

function init(){
  document.getElementById('nav').innerHTML = tabs.map(t =>
    `<button data-tab="${t[0]}" class="${t[0] === 'home' ? 'active' : ''}">${t[2]} ${t[1]}</button>`
  ).join('');
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  renderHome();
  renderManual();
  renderEga();
  renderModes();
  renderAsincronie();
  renderAsynchronyActions();
  renderAlgorithm();
  renderCalculators();
  renderReport();
  renderVisual();
  renderAppendici();
  renderMaterials();
  renderAtlas();
}

function switchTab(id){
  document.querySelectorAll('.tab').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderHome(){
  document.getElementById('home').innerHTML = `
  <section class="hero homeHeroFull">
    <div><span class="pill">Manuale pratico ADET</span><span class="pill">Eco-NIV</span><span class="pill">LUS + muscoli respiratori</span></div>
    <h2>Approccio ecoguidato alla ventilazione non invasiva</h2>
  </section>

  <div class="card introHomeCard" style="margin-top:18px">
    <span class="pill">Introduzione</span>
    <h2>Perché un manuale pratico sulla NIV ecoguidata</h2>
    <p>La ventilazione non invasiva è una terapia ad alta intensità decisionale. Non consiste soltanto nell’applicare un’interfaccia e impostare una pressione: modifica il lavoro respiratorio, la distribuzione dell’aerazione, il ritorno venoso, l’interazione cuore-polmone, il comfort del paziente e, in alcuni casi, anche il rischio di fallimento tardivo. Per questo, nella pratica clinica, il problema non è solo “iniziare la NIV”, ma capire se la NIV sta correggendo davvero il meccanismo fisiopatologico dominante. Nella gestione tradizionale, il settaggio viene spesso guidato da pochi indicatori: SpO₂, frequenza respiratoria, comfort, emogasanalisi e andamento clinico. Sono elementi indispensabili, ma non sempre sufficienti. La saturazione può migliorare mentre il polmone resta disomogeneo, il drive respiratorio rimane elevato e il paziente continua a generare uno sforzo importante. Allo stesso…</p>
    <button class="btn dark" onclick="switchTab('manuale')">Apri il manuale</button>
  </div>

  <div class="homeCleanGrid" style="margin-top:18px">
    <div class="card">
      <h2>Logica operativa</h2>
      <div class="logicCards">
        <div><b>Fenotipo</b><p>LUS dominante, contesto clinico, EGA e indicazione al supporto.</p></div>
        <div><b>Muscoli respiratori</b><p>Diaframma, intercostali, addominali e segni di carico respiratorio.</p></div>
        <div><b>Ventilatore</b><p>PS, EPAP/PEEP, FiO₂, perdite, trigger, cycling e comfort.</p></div>
        <div><b>Trend</b><p>Rivalutazione dopo modifica del parametro: LUS, FR, FiO₂, EGA e muscoli.</p></div>
      </div>
    </div>

    <div class="card">
      <h2>Criteri di lettura rapida</h2>
      <div class="decisionMini">
        <div class="ok"><b>Risposta favorevole</b><span>Comfort migliore, FR/drive in calo, FiO₂ o EGA in miglioramento, LUS o muscoli respiratori non peggiorano.</span></div>
        <div class="warn"><b>Risposta apparente</b><span>SpO₂ migliore ma drive, muscoli, FiO₂ o LUS restano sfavorevoli.</span></div>
        <div><b>Regola pratica</b><span>Modificare un parametro alla volta e documentare sempre il motivo della decisione.</span></div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:18px">
    <h2>Mappa dei moduli</h2>
    <div class="moduleMap">
      <div><b>Manuale</b><span>Testo completo navigabile.</span></div>
      <div><b>Algoritmo</b><span>Decisione per fenotipo.</span></div>
      <div><b>Calcolatori</b><span>LUS score e indici muscolari.</span></div>
      <div><b>Atlante</b><span>Video reali e schemi didattici.</span></div>
      <div><b>Appendici</b><span>Schede stampabili e compilabili.</span></div>
      <div><b>Referti</b><span>Testuale e visivo.</span></div>
    </div>
  </div>`;
}

function renderManual(list = D.manual){
  const c = list[currentChapter] || list[0];
  document.getElementById('manuale').innerHTML = `
  <div class="grid two">
    <div class="card">
      <div class="search">🔎 <input id="manualSearch" placeholder="Cerca nel manuale..."></div>
      <div class="sideList">
        ${list.map((x,i) => `<button class="item ${i === currentChapter ? 'active' : ''}" data-ch="${i}"><small>${x.part} · ${x.tag}</small><b>${x.title}</b></button>`).join('')}
      </div>
    </div>
    <div class="card">
      <div><span class="pill">${c.part}</span><span class="pill">${c.tag}</span></div>
      <h2>${c.title}</h2>
      <div class="summary">${c.html}</div>
    </div>
  </div>`;

  document.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => {
    currentChapter = Number(b.dataset.ch);
    renderManual(list);
  });

  document.getElementById('manualSearch').oninput = e => {
    const q = e.target.value.toLowerCase().trim();
    const filtered = !q ? D.manual : D.manual.filter(c => (c.title + ' ' + c.part + ' ' + c.tag + ' ' + c.plain).toLowerCase().includes(q));
    currentChapter = 0;
    renderManual(filtered);
    setTimeout(() => {
      const s = document.getElementById('manualSearch');
      if(s){ s.value = q; s.focus(); }
    }, 0);
  };
}


function renderAsincronie(){
  const boxes = D.asynchronyBoxes || [];
  const cards = D.asynchronyCards || [];
  const videos = D.asynchronyVideos || [];
  document.getElementById('asincronie').innerHTML = `
  <section class="hero asynchHero">
    <div><span class="pill">Sezione pratica</span><span class="pill">Capitolo 3</span><span class="pill">Curve ventilatore</span></div>
    <h2>Asincronie paziente-ventilatore nella NIV</h2>
    <p>Riconoscimento rapido sulle curve: prima di aumentare le pressioni, identificare quale parte del ciclo respiratorio non coincide con il paziente.</p>
  </section>

  <div class="asynchBoxesCompleteGrid">
    ${boxes.map((b,i) => `
      <div class="card asynchBoxCard asynchBoxCompleteCard">
        <div class="asynchBoxHeader">
          <span class="pill">${b.title}</span>
          <div>
            <h2>${b.subtitle}</h2>
            <p class="subtitle">Scheda completa originale con immagini, visualizzata grande per evitare compressione e scompaginazione.</p>
          </div>
        </div>
        <div class="asynchImageFrame asynchImageFrameComplete">
          <img src="${b.src}" alt="${b.subtitle}">
        </div>
        <div class="actions">
          <a href="${b.src}" target="_blank">Apri scheda in grande</a>
          <a class="secondary" href="${b.src}" download="scheda_asincronie_${i+1}.png">Scarica PNG</a>
        </div>
      </div>
    `).join('')}
  </div>

  <div class="card asynchVideoSection">
    <span class="pill">Mini-video pratici</span>
    <h2>Video rapidi sulle principali asincronie</h2>
    <p class="subtitle">Clip brevi con voce narrante e schermate operative, pensate per il ripasso rapido dentro la app.</p>
    <div class="asynchVideoGrid">
      ${videos.map(v => `
        <article class="asynchVideoCard">
          <div class="asynchVideoBox">
            <video controls playsinline preload="metadata" poster="${v.poster}">
              <source src="${v.video}" type="video/mp4">
            </video>
          </div>
          <div class="asynchVideoText">
            <h3>${v.title}</h3>
            <p>${v.desc}</p>
          </div>
        </article>
      `).join('')}
    </div>
  </div>

  <div class="card">
    <span class="pill">Lettura operativa</span>
    <h2>Dal segno sulla curva alla correzione pratica</h2>
    <div class="grid cards2 asynchQuickGrid">
      ${cards.map(c => `
        <div class="asynchMiniCard">
          <small>${c.phase}</small>
          <h3>${c.title}</h3>
          <p><b>Che cos’è:</b> ${c.what}</p>
          <p><b>Cause frequenti:</b> ${c.causes}</p>
          <p><b>Correzione:</b> ${c.action}</p>
        </div>
      `).join('')}
    </div>
  </div>

  <div class="card info">
    <b>Regola pratica</b><br>
    Se il paziente non è sincrono, la prima domanda non è quanto aumentare la pressione, ma quale fase del ciclo respiratorio non sta coincidendo: trigger, flusso, cycling o interfaccia.
  </div>`;
}

function renderAlgorithm(){
  const p = D.phenotypes.find(x => x.id === currentPhenotype) || D.phenotypes[0];
  document.getElementById('algoritmo').innerHTML = `
  <div class="grid two">
    <div class="card">
      <h2>1. Fenotipo iniziale</h2>
      <p class="subtitle">Scegli il problema dominante. La decisione nasce dall’integrazione tra LUS, muscoli respiratori, ventilatore e trend.</p>
      ${D.phenotypes.map(x => `<button class="item ${x.id === currentPhenotype ? 'active' : ''}" data-ph="${x.id}"><small>${x.question}</small><b>${x.title}</b></button>`).join('')}
    </div>
    <div class="card">
      <span class="pill">Algoritmo ADET</span><span class="pill">LUS + muscoli respiratori + ventilatore</span>
      <h2>${p.title}</h2>
      <div class="decisionFlow">
        <div class="flowStep"><b>1. Perché NIV?</b><br>${p.question}</div>
        <div class="flowStep"><b>2. Cosa dice il polmone?</b><br>${p.lus}</div>
        <div class="flowStep"><b>3. Cosa dice i muscoli respiratori?</b><br>${p.pump}</div>
        <div class="flowStep"><b>4. Cosa dice il ventilatore?</b><br>${p.ventilator}</div>
      </div>
      <div class="decisionBox"><small>Azione suggerita</small><strong>${p.action}</strong></div>
      <div class="grid cards2" style="margin-top:14px">
        <div class="info ok"><b>Rivalutazione</b><br>${p.reassess}</div>
        <div class="info warn"><b>Errore da evitare</b><br>${p.risk}</div>
      </div>
      <div class="info" style="margin-top:14px"><b>Regola pratica</b><br>Il trial non invasivo è favorevole solo se migliorano insieme comfort, FR/drive, FiO₂ o EGA, e almeno uno tra LUS o muscoli respiratori. La sola SpO₂ non basta.</div>
    </div>
  </div>`;
  document.querySelectorAll('[data-ph]').forEach(b => b.onclick = () => { currentPhenotype = b.dataset.ph; renderAlgorithm(); });
}

function field(id,label,val){
  return `<label><span>${label}</span><input id="${id}" value="${val}"></label>`;
}

function num(id){
  return Number((document.getElementById(id)?.value || '0').replace(',','.')) || 0;
}

function fmt(n){
  return (Math.round(n * 10) / 10).toString().replace('.', ',');
}

function renderCalculators(){
  document.getElementById('calcoli').innerHTML = `
  <div class="hero">
    <span class="pill">Calcolatori</span><span class="pill">LUS + muscoli respiratori</span>
    <h2>Calcolatori LUS-NIV</h2>
    <p>Score polmonare e indici muscolari vanno letti come trend: il numero isolato non sostituisce clinica, ventilatore, emogas e comfort.</p>
  </div>

function updateCalcs(){
  const lusTotal = [...document.querySelectorAll('.lusSel')].reduce((a,s) => a + Number(s.value), 0);
  const lusEl = document.getElementById('lusTotal');
  if(lusEl) lusEl.textContent = lusTotal;
  const lusNote = document.getElementById('lusNote');
  if(lusNote){
    lusNote.textContent =
      lusTotal <= 6 ? 'LUS basso: aerazione relativamente conservata o perdita limitata. Interpretare per distribuzione e fenotipo.' :
      lusTotal <= 18 ? 'LUS intermedio: perdita di aerazione significativa. Il trend dopo supporto è più informativo del valore isolato.' :
      'LUS elevato: perdita di aerazione estesa. Valutare pattern, reclutabilità, FiO₂, drive e rischio di fallimento.';
  }

  const dtf = num('tdExp') ? ((num('tdInsp') - num('tdExp')) / num('tdExp') * 100) : 0;
  const de = num('de');
  const rr = num('rrDia');
  const rrde = de ? rr / de : 0;

  document.getElementById('dtfResult').textContent = fmt(dtf) + '%';
  document.getElementById('dtfNote').textContent =
    dtf < 10 ? 'TFdi molto bassa: possibile iperassistenza, disfunzione o scarsa attivazione. Interpretare con PS/EPAP e drive.' :
    dtf < 20 ? 'TFdi bassa: valutare debolezza, over-assist o scarsa attivazione.' :
    dtf <= 35 ? 'Attività diaframmatica moderata: interpretare con FR, comfort e gas.' :
    'TFdi elevata: possibile alto drive, sottoassistenza o carico inspiratorio.';
  document.getElementById('rrdeResult').textContent = de ? fmt(rrde) + ' atti/min/cm' : '—';

  const tr = num('icExp') ? ((num('icInsp') - num('icExp')) / num('icExp') * 100) : 0;
  document.getElementById('trResult').textContent = fmt(tr) + '%';
  document.getElementById('trNote').textContent =
    tr < 10 ? 'TR basso: scarsa attivazione intercostale, da interpretare con drive e qualità della misura.' :
    tr < 25 ? 'TR moderato: attivazione accessoria presente ma non dominante.' :
    'TR elevato: possibile aumento del drive inspiratorio o sottoassistenza. Cercare asincronie, trigger/cycling e PS effettivo.';

  const oe = num('oeMin') ? ((num('oeMax') - num('oeMin')) / num('oeMin') * 100) : 0;
  const oi = num('oiMin') ? ((num('oiMax') - num('oiMin')) / num('oiMin') * 100) : 0;
  const tra = num('traMin') ? ((num('traMax') - num('traMin')) / num('traMin') * 100) : 0;
  const abdMean = (oe + oi + tra) / 3;
  document.getElementById('abdMeanResult').textContent = fmt(abdMean) + '%';
  document.getElementById('abdNote').textContent =
    abdMean < 10 ? 'Attivazione addominale bassa: non emerge espirazione attiva riparametronte.' :
    abdMean < 25 ? 'Attivazione addominale moderata: possibile compenso espiratorio, da correlare a comfort e ventilatore.' :
    'Attivazione addominale elevata: possibile espirazione attiva, carico espiratorio, discomfort, ostruzione o auto-PEEP.';

  const dPeep = num('peepB') - num('peepA');
  const dAbd = num('abdB') - num('abdA');
  const ratio = dPeep ? dAbd / dPeep : 0;
  document.getElementById('peepRespResult').textContent = dPeep ? fmt(ratio) + ' %/cmH₂O' : '—';
  document.getElementById('peepRespNote').textContent =
    !dPeep ? 'Inserire due valori diversi di EPAP/PEEP.' :
    ratio > 5 ? 'Dopo aumento di EPAP/PEEP gli addominali aumentano molto: possibile peggioramento del lavoro espiratorio o della tolleranza. Controllare comfort, FR, espirazione attiva, auto-PEEP, cycling e LUS.' :
    ratio > 0 ? 'Dopo modifica di EPAP/PEEP gli addominali aumentano: dato da interpretare con comfort, FR, LUS e FiO₂.' :
    ratio < -3 ? 'Dopo modifica di EPAP/PEEP gli addominali si riducono: possibile miglioramento del carico espiratorio, se coerente con clinica e LUS.' :
    'La modifica di EPAP/PEEP non cambia molto l’attivazione addominale. Guardare comunque il quadro globale.';

  const flags = [];
  if (lusTotal > 18) flags.push('LUS elevato: perdita di aerazione estesa. La decisione dipende da distribuzione, reclutabilità, FiO₂ e drive.');
  else if (lusTotal > 6) flags.push('LUS intermedio: utile confrontarlo dopo modifica del supporto, più che usarlo come valore isolato.');
  if (dtf > 35) flags.push('TFdi elevata: il diaframma sta lavorando molto. Possibile alto drive, sottoassistenza o carico inspiratorio.');
  if (tr > 25) flags.push('TR intercostale elevato: gli accessori inspiratori sono attivi. Controllare PS effettivo, trigger, cycling e asincronie.');
  if (abdMean > 25) flags.push('Addominali elevati: c’è verosimile espirazione attiva. Pensare a carico espiratorio, ostruzione, auto-PEEP o discomfort.');
  if (dPeep && ratio > 5) flags.push('PEEP test: l’aumento di EPAP/PEEP si associa a maggiore attivazione addominale. Serve a capire se quel parametro sta peggiorando la tolleranza o il lavoro espiratorio.');
  if (!flags.length) flags.push('Nessun segnale dominante. Interpretare insieme a clinica, ventilatore, EGA, comfort e trend.');

  document.getElementById('pumpSummary').innerHTML = flags.map(x => `<div class="info">${x}</div>`).join('');
}

function copyText(text){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).catch(() => {});
  }
}

function printText(title,text){
  const w = window.open('', '_blank');
  if(!w) return;
  w.document.write('<html><head><title>NIV EcoGuidata</title><style>body{font-family:Arial;margin:28px;line-height:1.5}pre{white-space:pre-wrap;font-family:Arial;border:1px solid #ddd;padding:16px;border-radius:12px}</style></head><body><button onclick="print()">Stampa / salva PDF</button><h1>' + escapeHtml(title) + '</h1><pre>' + escapeHtml(text) + '</pre></body></html>');
  w.document.close();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function previewImage(e,i){
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    document.getElementById('vp' + i).innerHTML = `<img src="${ev.target.result}" alt="Immagine ${i}">`;
    const lab = document.getElementById('vloaded' + i);
    if(lab) lab.textContent = 'caricata';
    updateVisual();
  };
  r.readAsDataURL(f);
}

  const closing = `\n\nInterpretazione: correlare documentazione visiva con quadro clinico, ventilatore, EGA, comfort e trend seriale.`;

  if(type === 'barcode') return base + `<div class="pleura"></div><div class="barcode"></div></div>`;
  if(type === 'lungPoint') return base + `<div class="lungPointA"></div><div class="lungPointB"></div><div class="aline" style="top:145px;left:30px;right:55%"></div><div class="aline" style="top:190px;left:30px;right:55%"></div></div>`;

  if(type === 'broncoDyn') return base + `<div class="pleura rough"></div><div class="hepat"></div><div class="airdot" style="left:105px;bottom:85px"></div><div class="airdot" style="left:150px;bottom:98px;animation-delay:.25s"></div><div class="airdot" style="left:195px;bottom:75px;animation-delay:.5s"></div></div>`;

  return base + `<div class="pleura"></div></div>`;
}

function updateEga(){
  if(!document.getElementById('egaAG')) return;
  const pH = num('egaPH'), co2 = num('egaCO2'), hco3 = num('egaHCO3'), be = num('egaBE');
  const na = num('egaNa'), k = num('egaK'), cl = num('egaCl'), alb = num('egaAlb'), phos = num('egaPhos'), lac = num('egaLac');
  const po2 = num('egaPO2'), fio2 = asFiO2(document.getElementById('egaFio2')?.value), hb = num('egaHb');

  const ag = na - cl - hco3;
  const agK = na + k - cl - hco3;
  const agc = ag + 2.5 * (4 - (alb || 4));
  const nacl = na - cl;

  // Stewart semplificato:
  // SID apparente semplificata: Na + K - Cl - lattato.
  // SID effettiva: bicarbonato + carica albumina + carica fosfato.
  const sida = na + k - cl - lac;
  const albGL = (alb || 4) * 10;
  const phosphate = phos || 0;
  const side = hco3 + albGL * (0.123 * pH - 0.631) + phosphate * (0.309 * pH - 0.469);
  const sig = sida - side;

  const pf = fio2 ? po2 / fio2 : 0;

  document.getElementById('egaAG').textContent = fmt(ag) + ' mEq/L' + (k ? '  (con K: ' + fmt(agK) + ')' : '');
  document.getElementById('egaAGc').textContent = fmt(agc) + ' mEq/L';
  document.getElementById('egaNaCl').textContent = fmt(nacl) + ' mEq/L';
  document.getElementById('egaSIDa').textContent = fmt(sida) + ' mEq/L';
  document.getElementById('egaSIDe').textContent = fmt(side) + ' mEq/L';
  document.getElementById('egaSIG').textContent = fmt(sig) + ' mEq/L';
  document.getElementById('egaPF').textContent = fio2 ? fmt(pf) : '—';

  let acid = pH < 7.35 ? 'acidemia' : pH > 7.45 ? 'alcalemia' : 'pH nel range';
  let agMsg = agc > 16 ? 'anion gap corretto aumentato: cercare lattato, uremia, chetoni, tossici o acidosi mascherata da ipoalbuminemia.' : agc < 8 ? 'anion gap basso: possibile effetto di ipoalbuminemia o diluizione; interpretare nel contesto.' : 'anion gap corretto non francamente aumentato.';
  let naclMsg = nacl < 32 ? 'Na-Cl ridotto: sospetta componente ipercloremica.' : nacl > 40 ? 'Na-Cl elevato: sospetta componente ipocloremica/alcalinizzante.' : 'rapporto Na-Cl non estremo.';

  let sidaMsg = sida < 38 ? 'SID apparente bassa: tendenza acidificante da eccesso relativo di cloro, lattato o altri anioni forti.' : sida > 44 ? 'SID apparente alta: tendenza alcalinizzante, spesso da cloro basso rispetto al sodio.' : 'SID apparente in area intermedia.';
  let sideMsg = side < 35 ? 'SID effettiva bassa: componente tampone ridotta, spesso per HCO₃⁻ basso e/o albumina bassa.' : side > 42 ? 'SID effettiva alta: prevale una componente tampone/alcalinizzante; leggere con pH, HCO₃⁻ e albumina.' : 'SID effettiva compatibile con area intermedia.';
  let sigMsg = sig > 6 ? 'Strong ion gap aumentato: probabili anioni non misurati; cercare lattato non spiegato, chetoni, uremia, tossici o acidosi complessa.' : sig < -2 ? 'Strong ion gap negativo o molto basso: dato da verificare; controllare unità, albumina, fosfato, cloro e campione.' : 'Strong ion gap non francamente aumentato.';
  let oxMsg = pf ? (pf < 100 ? 'ipossiemia severa' : pf < 200 ? 'ipossiemia moderata' : pf < 300 ? 'ipossiemia lieve-moderata' : 'ossigenazione relativamente conservata') : 'ossigenazione non valutabile senza FiO₂';

  let comp = [];
  if(hco3 < 22){
    const exp = 1.5*hco3 + 8;
    comp.push('Acidosi metabolica: PaCO₂ attesa ≈ ' + rangeText(exp, exp-2, exp+2, 'mmHg') + '.');
    if(co2 > exp+2) comp.push('PaCO₂ più alta dell’atteso: componente respiratoria acida o ventilazione alveolare insufficiente.');
    if(co2 < exp-2) comp.push('PaCO₂ più bassa dell’atteso: alcalosi respiratoria associata o alto drive.');
  } else if(hco3 > 26){
    const exp = 0.7*hco3 + 20;
    comp.push('Alcalosi metabolica: PaCO₂ attesa ≈ ' + rangeText(exp, exp-5, exp+5, 'mmHg') + '.');
  }
  if(co2 > 45){
    const acute = 24 + (co2-40)/10;
    const chronic = 24 + 3.5*(co2-40)/10;
    comp.push('Ipercapnia: HCO₃⁻ atteso se acuta ≈ ' + fmt(acute) + ', se cronica ≈ ' + fmt(chronic) + ' mEq/L.');
  }
  if(co2 < 35){
    const acute = 24 - 2*(40-co2)/10;
    const chronic = 24 - 4*(40-co2)/10;
    comp.push('Ipocapnia: HCO₃⁻ atteso se acuta ≈ ' + fmt(acute) + ', se cronica ≈ ' + fmt(chronic) + ' mEq/L.');
  }
  if(comp.length === 0) comp.push('Compenso non dominante dai dati inseriti: leggere trend e contesto clinico.');

  let niv = [];
  if(pH < 7.35 && co2 > 45) niv.push('Quadro coerente con acidosi respiratoria/ipercapnia: ragionare su NIV-PS, pressure support effettivo, perdite, trigger, cycling ed EGA di controllo.');
  if(co2 > 45 && pH >= 7.35 && hco3 >= 28) niv.push('Ipercapnia probabilmente compensata o cronica: non inseguire PaCO₂ normale, valutare trend, comfort, FR e lavoro respiratorio.');
  if(co2 < 35 && pf && pf < 250) niv.push('PaCO₂ bassa con ipossiemia: possibile alto drive; in polmone disomogeneo evitare trial NIV prolungati solo perché la SpO₂ migliora.');
  if(lac >= 4) niv.push('Lattato elevato: cercare shock/sepsi/ipoperfusione; la NIV non deve distrarre dalla terapia causale.');
  else if(lac >= 2) niv.push('Lattato aumentato: interpretare come stress perfusivo/metabolico e seguirne il trend.');
  if(agc > 16) niv.push('AG corretto elevato: possibile componente metabolica ad alto gap; non attribuire tutto alla ventilazione.');
  if(sida < 38 || nacl < 32) niv.push('Componente ipercloremica o da anioni forti possibile: rivedere fluidi, cloro e lattato prima di interpretare il BE come solo ipoperfusione.');
  if(sig > 6) niv.push('Strong ion gap aumentato: la parte metabolica non è spiegata solo da bicarbonato, albumina, fosfato, cloro e lattato misurati.');
  if(niv.length === 0) niv.push('Il dato va usato come trend: ripetere EGA dopo modifica del supporto se il quadro clinico lo richiede.');

  document.getElementById('egaInterpretation').innerHTML = '<b>Sintesi:</b> ' + acid + '. ' + agMsg + ' ' + sidaMsg + ' ' + sideMsg + ' ' + sigMsg + ' PaO₂/FiO₂: ' + oxMsg + '.';
  document.getElementById('egaClinicalCards').innerHTML = `
    <div class="info"><b>Compenso</b><br>${comp.join('<br>')}</div>
    <div class="info"><b>SID</b><br>${sidaMsg}<br>${sideMsg}<br>${sigMsg}</div>
    <div class="info warn"><b>Implicazione NIV</b><br>${niv.join('<br>')}</div>
    <div class="info"><b>Numeri da non isolare</b><br>SpO₂ e PaO₂ vanno sempre lette con FiO₂, EPAP/PEEP, LUS, lavoro respiratorio, Hb e trend clinico.</div>`;
}

function modeAdvice(key){
  const map = {
    pump:{title:'Muscoli respiratori / ipercapnia', mode:'NIV-PS / BiLevel S o S/T', why:'Il bersaglio è scaricare i muscoli respiratori e migliorare la ventilazione alveolare.', set:'Regolare pressure support, EPAP prudente se auto-PEEP, trigger sensibile ma stabile, cycling coerente con la meccanica.', monitor:'pH, PaCO₂, FR, comfort, TFdi, TR, perdite e asincronie.'},
    congestion:{title:'Congestione cardiogena / B-lines ordinate', mode:'CPAP/EPAP; NIV-PS se coesiste ipercapnia', why:'Il bersaglio è aerazione, riduzione del lavoro respiratorio e decongestione.', set:'Partire da CPAP/EPAP coerente con tolleranza; aggiungere PS solo se serve ventilazione.', monitor:'LUS seriale, FiO₂, PA, comfort, FR, EGA se indicata.'},
    hypoxemic:{title:'Ipossiemia non cardiogena / polmone disomogeneo', mode:'HFNC o trial NIV breve molto sorvegliato', why:'Il rischio è mascherare fallimento e mantenere alto drive su polmone disomogeneo.', set:'Evitare PS elevato e volumi alti; definire criteri di stop prima di iniziare.', monitor:'FR, FiO₂, PaO₂/FiO₂, LUS, TFdi/TR, Vt stimato, sensorio ed EGA.'},
    atelectasis:{title:'Atelettasia / post-operatorio / obesità', mode:'CPAP/EPAP + posizione, analgesia e fisioterapia', why:'Il bersaglio è ri-aerazione declive se il consolidamento è reclutabile.', set:'EPAP/CPAP graduale, posizione seduta o laterale/prona se indicata, gestione secrezioni e dolore.', monitor:'Zone posteriori, LUS seriale, FiO₂, comfort, tosse, broncogramma e versamento.'},
    ohs:{title:'OHS / ipoventilazione cronica / sonno', mode:'BiLevel S/T; considerare VAPS/AVAPS se Vt instabile', why:'Il bersaglio è ventilazione media stabile, soprattutto notturna o con meccanica variabile.', set:'Definire IPAP/EPAP o PS min/max; EPAP adeguata se eventi ostruttivi residui.', monitor:'PaCO₂/TcCO₂, Vt stimato, leak, comfort, aderenza e qualità del sonno.'},
    right:{title:'Cuore destro fragile / instabilità emodinamica', mode:'HFNC o pressioni basse; evitare escalation pressoria cieca', why:'La pressione positiva può ridurre ritorno venoso e peggiorare il ventricolo destro.', set:'EPAP/PEEP prudente, rivalutazione emodinamica ravvicinata, ecocardioscopia se possibile.', monitor:'PA, segni di ipoperfusione, VD, VCI, FiO₂, comfort e trend clinico.'}
  };
  return map[key] || map.pump;
}

}

  const map = {
