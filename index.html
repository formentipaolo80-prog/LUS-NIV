<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIV EcoGuidata</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--dark:#0f172a}
*{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1280px;margin:auto;padding:18px}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:13px;align-items:center}
.logo{width:50px;height:50px;border-radius:18px;background:#0f172a;color:white;display:grid;place-items:center;font-size:25px;font-weight:900}
.kicker{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.18em;text-transform:uppercase}
h1{font-size:24px;margin:3px 0 0;letter-spacing:-.03em}
nav{display:flex;gap:8px;overflow:auto}
nav button,.btn{border:0;border-radius:15px;padding:10px 13px;background:#e2e8f0;color:#334155;font-weight:800;cursor:pointer;white-space:nowrap}
nav button.active,.btn.dark{background:#0f172a;color:white}
.hero{background:linear-gradient(135deg,#0f172a,#1e293b);color:white;border-radius:32px;padding:28px;margin:20px 0;box-shadow:0 12px 30px rgba(15,23,42,.18)}
.hero h2{font-size:42px;letter-spacing:-.045em;margin:8px 0 10px}
.hero p{color:#cbd5e1;line-height:1.65;max-width:900px}
.pill,.badge{display:inline-flex;border-radius:999px;background:#e2e8f0;color:#334155;padding:6px 10px;font-size:12px;font-weight:800;margin:0 5px 5px 0}
.hero .pill{background:rgba(255,255,255,.12);color:#e2e8f0}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:0 8px 18px rgba(15,23,42,.05)}
.grid{display:grid;gap:18px}
.two{grid-template-columns:330px 1fr}.twoWide{grid-template-columns:1fr 520px}.cards2{grid-template-columns:repeat(2,1fr)}.cards3{grid-template-columns:repeat(3,1fr)}.cards4{grid-template-columns:repeat(4,1fr)}
.hidden{display:none!important}.subtitle{color:var(--muted);line-height:1.5}.summary{font-size:17px;line-height:1.65;color:#334155}
.item{width:100%;text-align:left;border:0;border-radius:18px;background:#f8fafc;margin-bottom:8px;padding:13px;cursor:pointer;color:#1e293b}
.item.active{background:#0f172a;color:white}.item small{opacity:.72;font-weight:800}.item b{display:block;margin-top:4px}.sideList{max-height:650px;overflow:auto;padding-right:4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:15px;padding:10px 12px;font:inherit;background:white}
textarea{min-height:90px;resize:vertical} label span{display:block;font-size:13px;font-weight:800;color:#475569;margin-bottom:6px}
.search{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:14px;background:white}
.homeGrid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.quickButtons{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.quickBtn{border:0;text-align:left;border-radius:24px;background:#fff;color:#0f172a;padding:18px;cursor:pointer;box-shadow:0 8px 18px rgba(15,23,42,.08);min-height:110px}
.quickBtn.dark{background:#0f172a;color:white}.quickBtn span{display:block;color:#64748b;font-size:13px;margin-top:5px;line-height:1.35}.quickBtn.dark span{color:#cbd5e1}.bigIcon{font-size:30px}
.info{background:#f8fafc;border:1px solid var(--line);border-radius:22px;padding:15px;line-height:1.55;color:#334155}.warn{background:#fff7ed;border-color:#fed7aa;color:#7c2d12}.ok{background:#ecfdf5;border-color:#bbf7d0;color:#14532d}
.result{background:#0f172a;color:white;border-radius:20px;padding:15px;margin-top:14px}.result small{display:block;color:#94a3b8;font-weight:800;text-transform:uppercase}.result strong{display:block;font-size:28px;margin-top:4px}
pre{white-space:pre-wrap;background:#0f172a;color:white;border-radius:22px;padding:16px;line-height:1.6;min-height:360px;font-size:13px}
.appendixGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.appendixCard img{display:block;width:100%;height:auto;border-radius:20px;border:1px solid var(--line);margin-top:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions a{display:inline-flex;text-decoration:none;border-radius:14px;padding:9px 12px;font-weight:800;background:#0f172a;color:white;font-size:13px}.actions a.secondary{background:#e2e8f0;color:#334155}
.atlasCard{background:#fff;border:1px solid var(--line);border-radius:30px;padding:18px;margin-bottom:20px;box-shadow:0 8px 18px rgba(15,23,42,.05)}
.atlasGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid var(--line);border-radius:24px;background:#f8fafc;padding:14px}.panel h4{margin:0 0 10px}
.media,.videoBox{height:300px;border-radius:24px}.media{background:linear-gradient(135deg,#0f172a,#1e293b);border:1px solid #334155;position:relative;overflow:hidden}
.media .label{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.12);color:#e5e7eb;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;z-index:3}
.media .pleura{position:absolute;left:0;right:0;top:86px;height:2px;background:rgba(255,255,255,.55)}.media .rough{height:3px;background:linear-gradient(90deg,rgba(255,255,255,.25),rgba(255,255,255,.85),rgba(255,255,255,.15))}
.aline{position:absolute;left:35px;right:35px;height:1px;background:rgba(255,255,255,.45);animation:fadeLine 2s infinite}
.vArtifact{position:absolute;top:87px;width:6px;height:178px;border-radius:99px;background:linear-gradient(to bottom,rgba(255,255,255,.92),rgba(255,255,255,.10));animation:pulseVA 1.5s infinite}.confluent{width:20px}
.shred{position:absolute;left:50px;right:50px;bottom:38px;height:90px;background:rgba(255,255,255,.42);clip-path:polygon(0 18%,18% 2%,35% 24%,50% 8%,66% 28%,83% 5%,100% 20%,100% 100%,0 100%)}
.hepat{position:absolute;left:55px;right:55px;bottom:35px;height:110px;border-radius:18px;background:rgba(255,255,255,.46)}
.airdot{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;animation:dotMove 1.2s infinite alternate}
.fluid{position:absolute;left:40px;right:40px;bottom:24px;height:92px;border-radius:0 0 30px 30px;background:rgba(147,197,253,.45);animation:wave 2s infinite}
.diaphragm{position:absolute;left:35px;right:35px;bottom:78px;height:24px;border-top:4px solid rgba(255,255,255,.85);border-bottom:4px solid rgba(255,255,255,.85);background:rgba(255,255,255,.16);border-radius:50%;animation:thicken 1.4s infinite alternate}
.mmode{position:absolute;left:32px;right:32px;bottom:38px;height:110px;border-left:1px solid rgba(255,255,255,.25);border-bottom:1px solid rgba(255,255,255,.25)}
.curve{position:absolute;left:32px;right:32px;bottom:65px;height:60px;border-radius:50%;border-top:3px solid rgba(255,255,255,.8);animation:curveMove 1.5s infinite alternate}
.lungPointA{position:absolute;left:0;top:86px;width:50%;height:2px;background:rgba(255,255,255,.08)}.lungPointB{position:absolute;right:0;top:86px;width:50%;height:2px;background:rgba(255,255,255,.65);animation:slide 1.1s infinite alternate}.sliding{animation:slide 1.1s infinite alternate}
.barcode{position:absolute;left:30px;right:30px;bottom:38px;top:115px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 3px,rgba(255,255,255,.02) 3px 8px)}
.videoBox{background:#0f172a;border:1px solid #334155;padding:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.videoBox video{display:block;width:100%;height:100%;object-fit:contain;border-radius:18px;background:#0f172a}
.interpret{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.interpret div{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:12px;font-size:14px;line-height:1.45;color:#475569}.interpret b{display:block;color:#0f172a;margin-bottom:4px}
@keyframes pulseVA{0%,100%{opacity:.55;transform:scaleY(.92)}50%{opacity:1;transform:scaleY(1.05)}}@keyframes fadeLine{0%,100%{opacity:.22}50%{opacity:.55}}@keyframes dotMove{from{transform:translateY(0)}to{transform:translateY(-22px)}}@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}@keyframes thicken{from{height:14px;bottom:83px}to{height:34px;bottom:73px}}@keyframes curveMove{from{transform:translateY(8px)}to{transform:translateY(-7px)}}@keyframes slide{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
@media(max-width:1050px){.two,.twoWide,.cards2,.cards3,.cards4,.homeGrid,.atlasGrid,.interpret,.appendixGrid{grid-template-columns:1fr}.media,.videoBox{height:260px}}
@media(max-width:900px){.hero h2{font-size:31px}.wrap{padding:14px}.media,.videoBox{height:230px}}

.singleHome{grid-template-columns:1fr!important;max-width:760px}

.decisionFlow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.flowStep{background:#f8fafc;border:1px solid var(--line);border-radius:20px;padding:14px;line-height:1.5;color:#334155}.flowStep b{display:block;color:#0f172a;margin-bottom:4px}.decisionBox{background:#0f172a;color:white;border-radius:22px;padding:16px;margin-top:14px}.decisionBox small{display:block;color:#94a3b8;text-transform:uppercase;font-weight:900;letter-spacing:.06em}.decisionBox strong{display:block;font-size:20px;line-height:1.4;margin-top:6px}.pumpSummary{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.videoPlaceholder{height:300px;border-radius:24px;background:#0f172a;color:#e2e8f0;border:1px dashed #64748b;display:grid;place-items:center;text-align:center;padding:18px;line-height:1.5}.videoPlaceholder span{color:#94a3b8}.rib{position:absolute;top:90px;width:26px;height:135px;border-radius:18px;background:rgba(255,255,255,.72)}.intercostalMuscle{position:absolute;left:105px;right:105px;top:125px;height:64px;border-radius:30px;background:rgba(56,189,248,.35);border:2px solid rgba(255,255,255,.55)}.muscleThicken{position:absolute;left:125px;right:125px;top:140px;height:34px;border-radius:30px;background:rgba(255,255,255,.35);animation:thickenIntercostal 1.3s infinite alternate}.probeLine{position:absolute;left:80px;right:80px;top:82px;height:2px;background:rgba(255,255,255,.8)}.abdLayer{position:absolute;left:65px;right:65px;height:42px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:white;font-weight:900;border:1px solid rgba(255,255,255,.45)}.abdLayer.oe{top:92px;background:rgba(56,189,248,.38)}.abdLayer.oi{top:145px;background:rgba(14,165,233,.45)}.abdLayer.tra{top:198px;background:rgba(2,132,199,.50)}.abdArrow{position:absolute;right:50px;top:145px;color:white;font-size:42px;animation:slide 1.1s infinite alternate}.pumpNode{position:absolute;border-radius:18px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.42);color:white;font-weight:900;text-align:center;padding:14px}.pumpNode.dia{left:105px;bottom:45px}.pumpNode.ic{left:45px;top:85px}.pumpNode.abd{right:45px;top:85px}.pumpLink{position:absolute;height:2px;background:rgba(56,189,248,.7);transform-origin:left center}.pumpLink.l1{left:140px;top:155px;width:105px;transform:rotate(32deg)}.pumpLink.l2{right:145px;top:155px;width:105px;transform:rotate(148deg)}.pumpLink.l3{left:150px;right:150px;bottom:92px}@keyframes thickenIntercostal{from{height:26px;top:144px;opacity:.5}to{height:56px;top:129px;opacity:1}}@media(max-width:1050px){.decisionFlow,.pumpSummary{grid-template-columns:1fr}.videoPlaceholder{height:260px}}@media(max-width:900px){.videoPlaceholder{height:230px}}

.heroStats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.heroStats div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:14px}
.heroStats b{display:block;font-size:30px;color:white}
.heroStats span{display:block;color:#cbd5e1;font-size:13px}
.dashboardGrid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.dashboardPrimary{min-height:100%}
.timeline{display:grid;gap:12px}
.timeline div{position:relative;background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 62px}
.timeline span{position:absolute;left:16px;top:16px;width:34px;height:34px;border-radius:99px;background:#0f172a;color:white;display:grid;place-items:center;font-weight:900}
.timeline b{display:block;color:#0f172a}
.timeline p{margin:4px 0 0;color:#64748b;line-height:1.35}
.appendixNativeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.appendixNative{background:#fff;border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:0 8px 18px rgba(15,23,42,.05)}
.appendixNative h2{margin-top:8px}
.nativeSection{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.nativeSection h3{margin:0 0 8px;color:#0f172a}
.checkGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.checkGrid label{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;color:#334155}
.reportTemplate{display:grid;gap:10px}
.reportTemplate div,.visualChecklist div,.nativeFlow div,.phrase{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px}
.reportTemplate b,.visualChecklist b{display:block;color:#0f172a;margin-bottom:4px}
.reportTemplate p,.phrase p{margin:0;color:#475569;line-height:1.45}
.phraseGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.phrase.danger{background:#fff7f7;border-color:#fecaca;color:#7f1d1d}
.phrase.warn{background:#fff7ed;border-color:#fed7aa}
.phrase.ok{background:#ecfdf5;border-color:#bbf7d0}
.visualChecklist{display:grid;gap:10px}
.visualChecklist span{display:block;color:#475569;line-height:1.4}
.nativeFlow{display:grid;gap:10px}
.nativeFlow div{position:relative;padding-left:62px}
.nativeFlow span{position:absolute;left:16px;top:16px;width:32px;height:32px;border-radius:99px;background:#0f172a;color:white;display:grid;place-items:center;font-weight:900}
.nativeFlow b{display:block;color:#0f172a}
.nativeFlow p{margin:4px 0 0;color:#475569}
.nativeTable{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:14px}
.nativeTable th{background:#0f172a;color:white;text-align:left;padding:10px}
.nativeTable td{border-top:1px solid var(--line);padding:10px;vertical-align:top}
.visualGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.visualSlot input[type=file]{margin-top:8px}
.slotHead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slotHead b{color:#64748b;font-size:13px}
.visualPreview{min-height:170px;margin-top:12px;background:#0f172a;border-radius:20px;display:grid;place-items:center;overflow:hidden;border:1px solid #334155}
.visualPreview:empty::before{content:"Anteprima immagine";color:#94a3b8;font-weight:800}
.visualPreview img{width:100%;height:240px;object-fit:contain;background:#0f172a}
@media(max-width:1050px){.heroStats,.dashboardGrid,.appendixNativeGrid,.visualGrid,.phraseGrid{grid-template-columns:1fr}.checkGrid{grid-template-columns:1fr}}

.appendixImageFrame{background:#f8fafc;border:1px solid var(--line);border-radius:22px;padding:12px;margin-top:12px;overflow:auto;max-height:760px}
.appendixImageFrame img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line);background:white}
@media(max-width:1050px){.appendixImageFrame{max-height:none}}

.homeCleanGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.logicCards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.logicCards div,.moduleMap div,.decisionMini div{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px}
.logicCards b,.moduleMap b,.decisionMini b{display:block;color:#0f172a;margin-bottom:5px}
.logicCards p{margin:0;color:#64748b;line-height:1.4}
.moduleMap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.moduleMap span,.decisionMini span{display:block;color:#64748b;line-height:1.4}
.decisionMini{display:grid;gap:12px}
.decisionMini .ok{background:#ecfdf5;border-color:#bbf7d0}
.decisionMini .warn{background:#fff7ed;border-color:#fed7aa}
.appendixReadableGrid{display:grid;grid-template-columns:1fr;gap:18px}
.appendixReadable{background:#fff;border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 8px 18px rgba(15,23,42,.05)}
.appendixTop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.appendixTop h2{margin:0}
.readableTwo{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.readableTwo section,.structuredReport div,.visualChecklistReadable div,.algorithmReadable div{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px}
.readableTwo h3{margin:0 0 6px;color:#0f172a}
.readableTwo p,.structuredReport span,.visualChecklistReadable span{margin:0;color:#475569;line-height:1.45;display:block}
.structuredReport{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.structuredReport b,.visualChecklistReadable b{display:block;color:#0f172a;margin-bottom:6px}
.visualChecklistReadable{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.algorithmReadable{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.algorithmReadable div{position:relative;padding-top:54px;min-height:170px}
.algorithmReadable span{position:absolute;left:14px;top:14px;width:34px;height:34px;border-radius:999px;background:#0f172a;color:white;display:grid;place-items:center;font-weight:900}
.algorithmReadable b{display:block;color:#0f172a;margin-bottom:6px}
.algorithmReadable p{margin:0;color:#475569;line-height:1.38}
.nativeTable{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:14px}
.nativeTable th{background:#0f172a;color:white;text-align:left;padding:10px}
.nativeTable td{border-top:1px solid var(--line);padding:10px;vertical-align:top}
.phraseGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.phrase{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px}
.phrase.ok{background:#ecfdf5;border-color:#bbf7d0}
.phrase.warn{background:#fff7ed;border-color:#fed7aa}
.phrase.danger{background:#fff7f7;border-color:#fecaca}
.phrase p{margin:5px 0 0;color:#475569;line-height:1.4}
@media(max-width:1050px){.homeCleanGrid,.logicCards,.moduleMap,.readableTwo,.structuredReport,.visualChecklistReadable,.algorithmReadable,.phraseGrid{grid-template-columns:1fr}}

.appendixGraphicList{display:grid;grid-template-columns:1fr;gap:22px}
.appendixGraphicCard{padding:20px}
.appendixGraphicHeader{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.appendixGraphicHeader h2{margin:0 0 4px}
.appendixGraphicFrame{background:#f8fafc;border:1px solid var(--line);border-radius:24px;padding:14px;overflow:auto;max-height:none}
.appendixGraphicFrame img{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line);background:white}
@media(min-width:1200px){.appendixGraphicFrame img{max-width:1150px;margin:auto}}

.appendixModeBar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.interactiveAppendixGrid{display:grid;grid-template-columns:1fr;gap:22px}
.interactiveAppendix pre{min-height:180px;margin-top:14px}
.checklistInteractive{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.checklistInteractive label{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:10px;color:#334155;font-weight:700}
@media(max-width:1050px){.checklistInteractive{grid-template-columns:1fr}}


/* ===== v13 aesthetic color layer ===== */
:root{
  --bg:#eef6fb; --card:#ffffff; --ink:#082f49; --muted:#557086;
  --line:#c7dbea; --dark:#073b73; --teal:#008c8c;
  --cyan:#38bdf8; --blue:#2563eb; --amber:#f59e0b;
  --rose:#e11d48; --green:#16a34a; --violet:#7c3aed;
}
body{
  background:
    radial-gradient(circle at top left, rgba(56,189,248,.18), transparent 34rem),
    radial-gradient(circle at top right, rgba(0,140,140,.14), transparent 32rem),
    linear-gradient(180deg,#f6fbff 0%,#eef6fb 45%,#f8fafc 100%);
}
header{background:rgba(255,255,255,.88);border-bottom:1px solid rgba(7,59,115,.14);box-shadow:0 8px 24px rgba(8,47,73,.06)}
.logo{background:linear-gradient(135deg,#073b73,#008c8c);box-shadow:0 10px 24px rgba(7,59,115,.22)}
nav button{background:linear-gradient(180deg,#ffffff,#e8f3fb);border:1px solid #cfe3ef;color:#0f4c81;box-shadow:0 4px 12px rgba(8,47,73,.05)}
nav button.active{background:linear-gradient(135deg,#073b73,#008c8c);color:white;box-shadow:0 10px 24px rgba(0,140,140,.22)}
.hero{
  background:
    radial-gradient(circle at 10% 20%,rgba(56,189,248,.26),transparent 19rem),
    radial-gradient(circle at 92% 20%,rgba(20,184,166,.24),transparent 21rem),
    linear-gradient(135deg,#073b73 0%,#075985 48%,#008c8c 100%);
  box-shadow:0 20px 48px rgba(7,59,115,.22);
  border:1px solid rgba(255,255,255,.16);
}
.hero h2{color:white;text-shadow:0 2px 12px rgba(0,0,0,.16)}

{"manual":[{"part":"Parte I — Fondamenti pratici di ventilazione non invasiva","title":"Capitolo 1. Supporti respiratori non invasivi: che cosa intendiamo per NIV","tag":"Capitolo 1","html":"\n<h3>Obiettivo pratico<\/h3>\n<p>Prima di usare l’ecografia per guidare la ventilazione non invasiva bisogna chiarire che cosa si sta impostando. Nella pratica clinica si tende a chiamare “NIV” qualsiasi forma di supporto respiratorio applicata senza protesi endotracheale (tubo o tracheostomia), ma ossigenoterapia convenzionale, HFNC (<em>high-flow nasal cannula<\/em><em>, <\/em>cannula nasale ad alto flusso), CPAP (<em>continuous positive airway pressure<\/em>, pressione delle vie aeree positiva continua) e NIV-PS (<em>non-invasive ventilation<\/em>-<em>pressure support<\/em> ventilazione non invasiva in pressione di supporto) non hanno lo stesso significato fisiologico.<\/p>\n<p>Il concetto di base è semplice: ogni supporto corregge un problema diverso, ha un bersaglio diverso. Se il problema dominante è l’ipossiemia lieve, può essere sufficiente aumentare la quantità di ossigeno inspirata dal paziente (FiO<sub>2<\/sub>). Se il problema è la perdita di aerazione o il collasso alveolare, serve una pressione positiva continua (CPAP). Se il problema è la ventilazione alveolare o la fatica dei muscoli respiratori, serve un supporto inspiratorio. Se il problema è un polmone gravemente disomogeneo con alto drive respiratorio, un supporto non invasivo prolungato può diventare pericoloso perché rischia di ritardare l’escalation terapeutica corretta, ovvero l’inizio della ventilazione meccanica invasiva [1,7].<\/p>\n<p>La domanda iniziale non è quindi: “metto la NIV?”. La domanda corretta è:<\/p>\n<p>quale problema voglio correggere con il supporto non invasivo? Qual è il mio bersaglio?<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_01.png\" alt=\"Figura 1.1. Lo spettro del supporto respiratorio non invasivo. Ossigenoterapia convenzionale, HFNC, CPAP e NIV in pressione di supporto rappresentano livelli differenti di intervento. Non sono equivalenti: aumentano FiO₂, flusso, pressione continua o supporto inspiratorio in modo diverso.\" loading=\"lazy\"><figcaption>Figura 1.1. Lo spettro del supporto respiratorio non invasivo. Ossigenoterapia convenzionale, HFNC, CPAP e NIV in pressione di supporto rappresentano livelli differenti di intervento. Non sono equivalenti: aumentano FiO₂, flusso, pressione continua o supporto inspiratorio in modo diverso.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_01.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 1.1. Lo spettro del supporto respiratorio non invasivo. Ossigenoterapia convenzionale, HFNC, CPAP e NIV in pressione di supporto rappresentano livelli differenti di intervento. Non sono equivalenti: aumentano FiO₂, flusso, pressione continua o supporto inspiratorio in modo diverso.<\/p>\n<h3>I supporti respiratori non invasivi<\/h3>\n<p><strong>Ossigenoterapia convenzionale<\/strong><\/p>\n<p>L’ossigenoterapia convenzionale aumenta la FiO₂, ma non fornisce una pressione positiva significativa e non riduce in modo rilevante il lavoro respiratorio. Può essere sufficiente nell’ipossiemia lieve, con paziente stabile, frequenza respiratoria contenuta, assenza di acidosi e di segni di fatica respiratoria.<\/p>\n<p>Limite pratico<strong>: <\/strong>può migliorare la SpO₂ senza modificare le caratteristiche del polmone, ovvero senza ridurre lo shunt, senza correggere un aumento dello spazio morto e senza ridurre il carico di lavoro dei muscoli respiratori. Una SpO₂ migliore non significa automaticamente ventilazione alveolare efficace né riduzione del lavoro respiratorio.<\/p>\n<p>Per tali ragioni, non è da considerarsi un supporto respiratorio.<\/p>\n<p><strong>HFNC<\/strong><\/p>\n<p>La cannula nasale ad alto flusso (HFNC) eroga gas riscaldato e umidificato a flussi elevati, con FiO₂ regolabile. I suoi effetti principali sono: fornire FiO₂ stabile, lavare lo spazio morto anatomico, migliorare il comfort del paziente, umidificare le vie aeree e fornire un modesto effetto pressorio (variabile in base al flusso, alla respirazione a bocca aperta o chiusa e alla meccanica del paziente) [2,6,11].<\/p>\n<p>È utile nell’insufficienza respiratoria ipossiemica lieve-moderata, soprattutto se il paziente è vigile, collaborante, non ipercapnico in modo significativo e non presenta fatica respiratoria marcata.<\/p>\n<p>Limite pratico: HFNC può migliorare il comfort del paziente, anche quando il lavoro respiratorio resta elevato. Per questo richiede un attento monitoraggio con frequenza respiratoria, SpO₂/FiO₂, ROX index (rapporto tra SpO₂/FiO₂ e frequenza respiratoria), ecografia polmonare e, quando possibile, valutazione del diaframma.<\/p>\n<h3>HFNC nella pratica: indicazioni, monitoraggio e fallimento<\/h3>\n<p>HFNC va considerata una forma di supporto non invasivo a bassa invasività, molto utile quando il problema dominante è l’ipossiemia con paziente vigile, collaborante e capace di proteggere le vie aeree. Non sostituisce la NIV-PS quando il problema principale è acidosi respiratoria ipercapnica con fatica dei muscoli respiratori, né deve ritardare l’intubazione nel paziente ipossiemico con drive elevato e peggioramento progressivo.<\/p>\n<p>Impostazione pratica: scegliere cannule di calibro adeguato, iniziare con flussi generalmente compresi tra 40 e 60 L/min se tollerati, impostare la FiO₂ per raggiungere il target di saturazione appropriato e garantire sempre riscaldamento e umidificazione. Nel paziente BPCO o ipercapnico il target di SpO₂ deve essere prudente, in genere 88–92%, salvo diversa indicazione clinica.<\/p>\n<p>Monitoraggio precoce: nei primi 5–10 minuti controllare comfort, tolleranza del flusso, frequenza respiratoria, uso dei muscoli accessori e stabilità emodinamica. A 30–60 minuti rivalutare SpO₂/FiO₂, frequenza respiratoria, lavoro respiratorio, LUS mirato ed EGA se il quadro è severo, ipercapnico o incerto.<\/p>\n<p>ROX index: può essere usato come indicatore di trend nella insufficienza respiratoria ipossiemica trattata con HFNC. Si calcola come (SpO₂/FiO₂) / frequenza respiratoria. Un ROX che migliora è un segnale favorevole; un ROX basso o in peggioramento, soprattutto se associato a FiO₂ elevata, tachipnea, LUS sfavorevole o EGA non rassicurante, deve far rivalutare rapidamente la strategia. Il ROX non decide da solo: aiuta a non sottostimare il fallimento.<\/p>\n<p>Segnali di allarme durante HFNC: FiO₂ persistentemente elevata, frequenza respiratoria non in calo, aumento del lavoro respiratorio, peggioramento del sensorio, PaCO₂ in aumento, lattato in crescita, LUS peggiorato o comparsa di consolidamenti/progressiva perdita di aerazione. In questi casi non bisogna limitarsi ad aumentare il flusso o la FiO₂: bisogna rivalutare NIV, intubazione o terapia causale.<\/p>\n<p><strong>CPAP<\/strong><\/p>\n<p>La pressione positiva continua (CPAP) applica una pressione positiva nelle vie aeree e quindi nel sistema respiratorio durante tutto il ciclo respiratorio (inspirazione ed espirazione). La pressione non “sale” in modo differenziale a ogni inspirazione: il paziente respira spontaneamente sopra un livello pressorio costante, che si misura a fine espiratorio come pressione positiva di fine espirazione (PEEP). Per questo la CPAP non è un vero supporto inspiratorio, ma un supporto pressorio continuo orientato soprattutto a migliorare aerazione, ossigenazione e stabilizzazione alveolare.<\/p>\n<p>La CPAP agisce soprattutto su aerazione e ossigenazione. È particolarmente utile quando il problema dominante è il collasso alveolare o la congestione: edema polmonare cardiogeno, atelettasie post-operatorie, perdita di aerazione potenzialmente reclutabile. Va distinta dalla NIV-PS, nella quale il ventilatore aggiunge una pressione inspiratoria sopra il livello di pressione espiratorio.<\/p>\n<p>Limite pratico: se il problema principale è la fatica ventilatoria con ipercapnia, la CPAP da sola può non bastare. Se il polmone non è reclutabile, aumentare la pressione delle vie aeree può peggiorare il comfort del paziente, causare distensione gastrica e/o iperinflazione polmonare e non essere tollerata dal punto di vista emodinamico.<\/p>\n<p>In pratica, mettere la CPAP significa “tenere aperto” più che “spingere dentro aria”. Se il paziente è ipercapnico, tachipnoico e affaticato, bisogna chiedersi se non sia più utile un supporto inspiratorio vero, cioè una NIV-PS.<\/p>\n<p><strong>NIV<\/strong><strong>-PS<\/strong><\/p>\n<p>La ventilazione non invasiva in pressione di supporto (NIV-PS) utilizza due livelli di pressione: una pressione positiva espiratoria, indicata come EPAP nelle modalità BiLevel/NIV e concettualmente analoga alla PEEP (pressione di fine espirazione), e una pressione inspiratoria (IPAP). La differenza matematica tra IPAP ed EPAP è il <em>pressure support<\/em>, cioè il supporto inspiratorio effettivo.<\/p>\n<p>L’EPAP lavora soprattutto su ossigenazione, reclutamento e contrasto dell’auto-PEEP. Il <em>pressure support<\/em> lavora soprattutto su ventilazione alveolare e riduzione del carico di lavoro dei muscoli inspiratori.<\/p>\n<p>La NIV-PS è la modalità di riferimento quando il problema dominante è ventilatorio: BPCO riacutizzata con acidosi respiratoria, ipoventilazione dell’obeso, patologie neuromuscolari, fatica dei muscoli respiratori e ipercapnia [1,3,4,10].<\/p>\n<p>Limite pratico:<strong> <\/strong>un supporto insufficiente lascia il diaframma sovraccarico; un supporto eccessivo può produrre sovra-assistenza, asincronie, volumi troppo elevati e ridotta attività diaframmatica [14,15].<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_02.png\" alt=\"Figura 1.2. CPAP vs NIV-PS. La CPAP mantiene una pressione positiva continua. Nella NIV in pressione di supporto, la pressione sale da EPAP a IPAP durante l’inspirazione; la differenza tra i due livelli è il pressure support.\" loading=\"lazy\"><figcaption>Figura 1.2. CPAP vs NIV-PS. La CPAP mantiene una pressione positiva continua. Nella NIV in pressione di supporto, la pressione sale da EPAP a IPAP durante l’inspirazione; la differenza tra i due livelli è il pressure support.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_02.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 1.2. CPAP vs NIV-PS. La CPAP mantiene una pressione positiva continua. Nella NIV in pressione di supporto, la pressione sale da EPAP a IPAP durante l’inspirazione; la differenza tra i due livelli è il pressure support.<\/p>\n<h3>I due parametri regolabili principali in NIV-PS: EPAP/PEEP e <em>pressure support<\/em><\/h3>\n<p>La distinzione più importante per il settaggio pratico è tra <strong>EPAP/PEEP<\/strong> e <strong><em>pressure support<\/em><\/strong>.<\/p>\n<p>EPAP/PEEP e <em>pressure support <\/em>non sono intercambiabili. Se il problema è il polmone “chiuso”, si ragiona sulla pressione espiratoria (EPAP/PEEP). Se il problema è i muscoli respiratori affaticata, si ragiona sul supporto inspiratorio (<em>pressure support<\/em>).<\/p>\n<table class=\"manualTable\"><tr><th>Parametro regolabile<\/th><th>Bersaglio principale<\/th><th>Può aiutare quando…<\/th><th>Può essere dannosa quando…<\/th><\/tr>\n<tr><td>EPAP/PEEP<\/td><td>Aerazione, ossigenazione, reclutamento, auto-PEEP<\/td><td>edema, atelettasia, collasso, piccole vie aeree instabili<\/td><td>polmone non reclutabile, iperinflazione, cuore destro fragile, ipotensione<\/td><\/tr>\n<tr><td>Pressure support<\/td><td>Ventilazione alveolare, PaCO₂, lavoro respiratorio, diaframma<\/td><td>ipercapnia, fatica respiratoria, diaframma sovraccarico<\/td><td>volumi eccessivi, asincronie, sovra-assistenza, perdite elevate<\/td><\/tr><\/table>\n<p class=\"manualCaptionText\">Tabella 1.1. EPAP/PEEP e pressure support: bersagli principali e rischi da controllare.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_03.png\" alt=\"Figura 1.3. EPAP/PEEP e pressure support: due parametri regolabili diversi. EPAP/PEEP e pressure support rispondono a problemi diversi. La prima agisce soprattutto su aerazione e ossigenazione; il secondo agisce su lavoro inspiratorio e ventilazione alveolare.\" loading=\"lazy\"><figcaption>Figura 1.3. EPAP/PEEP e pressure support: due parametri regolabili diversi. EPAP/PEEP e pressure support rispondono a problemi diversi. La prima agisce soprattutto su aerazione e ossigenazione; il secondo agisce su lavoro inspiratorio e ventilazione alveolare.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_03.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 1.3. EPAP/PEEP e pressure support: due parametri regolabili diversi. EPAP/PEEP e pressure support rispondono a problemi diversi. La prima agisce soprattutto su aerazione e ossigenazione; il secondo agisce su lavoro inspiratorio e ventilazione alveolare.<\/p>\n<h3>Cosa può fare la NIV-PS<\/h3>\n<p>La NIV-PS può migliorare l’ossigenazione, reclutare aree instabili, ridurre il lavoro respiratorio, aumentare la ventilazione alveolare, ridurre la PaCO₂, migliorare rapidamente l’edema polmonare cardiogeno e ridurre il ricorso all’intubazione nei pazienti correttamente selezionati [1,3-5].<\/p>\n<p>Questi effetti non sono automatici. Devono essere verificati precocemente mediante valutazione clinica, emogasanalisi (EGA), dati del ventilatore ed ecografia.<\/p>\n<h3>Cosa non può fare la NIV<\/h3>\n<p>La NIV non protegge le vie aeree, non rimuove le secrezioni, non risolve la chiusura di un bronco ostruito, non cura una polmonite, non corregge uno shock e non garantisce da sola la riduzione del lavoro respiratorio.<\/p>\n<p>Può diventare dannosa quando simula una stabilità apparente e ritarda l’intubazione. Il segnale tipico per identificare questa condizione clinica pericolosa è un paziente che mantiene una SpO₂ accettabile, ma che allo stesso tempo resta tachipnoico, affaticato, con FiO₂ elevata, LUS invariato o peggiorato e diaframma ancora iperattivo [7,8].<\/p>\n<h3>Errore da evitare<\/h3>\n<p>L’errore più comune è considerare la SpO₂ come unico indicatore di successo. La saturazione è necessaria, ma non basta: non distingue da sola tra incremento della FiO₂ inspirata, riduzione dello shunt, miglioramento della ventilazione alveolare, riduzione dello spazio morto o semplice compenso temporaneo. Una NIV funziona davvero se migliora ossigenazione, ventilazione, lavoro respiratorio, comfort, EGA e, quando pertinente, pattern ecografico.<\/p>\n<p>La NIV non va valutata solo guardando il monitor. Va valutata integrando le informazioni dal paziente, dal ventilatore, dall’EGA e dalla sonda ecografica.<\/p>\n<h3>Bibliografia del Capitolo 1<\/h3>\n<p>1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, Navalesi P, Antonelli M, Brozek J, Conti G, Ferrer M, Guntupalli K, Jaber S, Keenan S, Mancebo J, Mehta S, Raoof S. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.<\/p>\n<p>2. Oczkowski S, Ergan B, Bos L, Chatwin M, Ferrer M, Gregoretti C, Heunks L, Frat JP, Longhini F, Nava S, Navalesi P, Pisani L, Renda T, Thille AW, Winck JC, Windisch W, Tonia T, Boyd J, Sotgiu G, Scala R. ERS clinical practice guidelines: high-flow nasal cannula in acute respiratory failure. Eur Respir J. 2022;59(4):2101574. doi:10.1183/13993003.01574-2021.<\/p>\n<p>3. Brochard L, Mancebo J, Wysocki M, Lofaso F, Conti G, Rauss A, Simonneau G, Benito S, Gasparetto A, Lemaire F, Isabey D, Harf A. Noninvasive ventilation for acute exacerbations of chronic obstructive pulmonary disease. N Engl J Med. 1995;333(13):817-822. doi:10.1056/NEJM199509283331301.<\/p>\n<p>4. ntilation: impact of inspiratory effort. Am J Respir Crit Care Med. 2015;192(9):1080-1088. doi:10.1164/rccm.201503-0620OC.<\/p>\n<p>18. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, Melniker L, Gargani L, Noble VE, Via G, Dean A, Tsung JW, Soldati G, Copetti R, Bouhemad B, Reissig A, Agricola E, Rouby JJ, Arbelot C, Liteplo A, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4.<\/p>\n<p>19. Roca O, Messika J, Caralt B, García-de-Acilu M, Sztrymf B, Ricard JD, Masclans JR. Predicting success of high-flow nasal cannula in pneumonia patients with acute hypoxemic respiratory failure: the utility of the ROX index. J Crit Care. 2016;35:200-205. doi:10.1016/j.jcrc.2016.05.022.<\/p>","plain":"Obiettivo pratico Prima di usare l’ecografia per guidare la ventilazione non invasiva bisogna chiarire che cosa si sta impostando. Nella pratica clinica si tende a chiamare “NIV” qualsiasi forma di supporto respiratorio applicata senza protesi endotracheale (tubo o tracheostomia), ma ossigenoterapia convenzionale, HFNC ( high-flow nasal cannula , cannula nasale ad alto flusso), CPAP ( continuous positive airway pressure , pressione delle vie aeree positiva continua) e NIV-PS ( non-invasive ventilation - pressure support ventilazione non invasiva in pressione di supporto) non hanno lo stesso significato fisiologico. Il concetto di base è semplice: ogni supporto corregge un problema diverso, ha un bersaglio diverso. Se il problema dominante è l’ipossiemia lieve, può essere sufficiente aumentare la quantità di ossigeno inspirata dal paziente (FiO 2 ). Se il problema è la perdita di aerazione o il collasso alveolare, serve una pressione positiva continua (CPAP). Se il problema è la ventilazione alveolare o la fatica dei muscoli respiratori, serve un supporto inspiratorio. Se il problema è un polmone gravemente disomogeneo con alto drive respiratorio, un supporto non invasivo prolungato può diventare pericoloso perché rischia di ritardare l’escalation terapeutica corretta, ovvero l’inizio della ventilazione meccanica invasiva [1,7]. La domanda iniziale non è quindi: “metto la NIV?”. La domanda corretta è: quale problema voglio correggere con il supporto non invasivo? Qual è il mio bersaglio? Figura 1.1. Lo spettro del supporto respiratorio non invasivo. Ossigenoterapia convenzionale, HFNC, CPAP e NIV in pressione di supporto rappresentano livelli differenti di intervento. Non sono equivalenti: aumentano FiO₂, flusso, pressione continua o supporto inspiratorio in modo diverso. Figura 1.1. Lo spettro del supporto respiratorio non invasivo. Ossigenoterapia convenzionale, HFNC, CPAP e NIV in pressione di supporto rappresentano livelli differenti di intervento. Non sono equivalenti: aumentano FiO₂, flusso, pressione continua o supporto inspiratorio in modo diverso. I supporti respiratori non invasivi Ossigenoterapia convenzionale L’ossigenoterapia convenzionale aumenta la FiO₂, ma non fornisce una pressione positiva significativa e non riduce in modo rilevante il lavoro respiratorio. Può essere sufficiente nell’ipossiemia lieve, con paziente stabile, frequenza respiratoria contenuta, assenza di acidosi e di segni di fatica respiratoria. Limite pratico : può migliorare la SpO₂ senza modificare le caratteristiche del polmone, ovvero senza ridurre lo shunt, senza correggere un aumento dello spazio morto e senza ridurre il carico di lavoro dei muscoli respiratori. Una SpO₂ migliore non significa automaticamente ventilazione alveolare efficace né riduzione del lavoro respiratorio. Per tali ragioni, non è da considerarsi un supporto respiratorio. HFNC La cannula nasale ad alto flusso (HFNC) eroga gas riscaldato e umidificato a flussi elevati, con FiO₂ regolabile. I suoi effetti principali sono: fornire FiO₂ stabile, lavare lo spazio morto anatomico, migliorare il comfort del paziente, umidificare le vie aeree e fornire un modesto effetto pressorio (variabile in base al flusso, alla respirazione a bocca aperta o chiusa e alla meccanica del paziente) [2,6,11]. È utile nell’insufficienza respiratoria ipossiemica lieve-moderata, soprattutto se il paziente è vigile, collaborante, non ipercapnico in modo significativo e non presenta fatica respiratoria marcata. Limite pratico: HFNC può migliorare il comfort del paziente, anche quando il lavoro respiratorio resta elevato. Per questo richiede un attento monitoraggio con frequenza respiratoria, SpO₂/FiO₂, ROX index (rapporto tra SpO₂/FiO₂ e frequenza respiratoria), ecografia polmonare e, quando possibile, valutazione del diaframma. HFNC nella pratica: indicazioni, monitoraggio e fallimento HFNC va considerata una forma di supporto non invasivo a bassa invasività, molto utile quando il problema dominante è l’ipossiemia con paziente vigile, collaborante e capace di proteggere le vie aeree. Non sostituisce la NIV-PS quando il problema principale è acidosi respiratoria ipercapnica con fatica dei muscoli respiratori, né deve ritardare l’intubazione nel paziente ipossiemico con drive elevato e peggioramento progressivo. Impostazione pratica: scegliere cannule di calibro adeguato, iniziare con flussi generalmente compresi tra 40 e 60 L/min se tollerati, impostare la FiO₂ per raggiungere il target di saturazione appropriato e garantire sempre riscaldamento e umidificazione. Nel paziente BPCO o ipercapnico il target di SpO₂ deve essere prudente, in genere 88–92%, salvo diversa indicazione clinica. Monitoraggio precoce: nei primi 5–10 minuti controllare comfort, tolleranza del flusso, frequenza respiratoria, uso dei muscoli accessori e stabilità emodinamica. A 30–60 minuti rivalutare SpO₂/FiO₂, frequenza respiratoria, lavoro respiratorio, LUS mirato ed EGA se il quadro è severo, ipercapnico o incerto. ROX index: può essere usato come indicatore di trend nella insufficienza respiratoria ipossiemica trattata con HFNC. Si calcola come (SpO₂/FiO₂) / frequenza respiratoria. Un ROX che migliora è un segnale favorevole; un ROX basso o in peggioramento, soprattutto se associato a FiO₂ elevata, tachipnea, LUS sfavorevole o EGA non rassicurante, deve far rivalutare rapidamente la strategia. Il ROX non decide da solo: aiuta a non sottostimare il fallimento. Segnali di allarme durante HFNC: FiO₂ persistentemente elevata, frequenza respiratoria non in calo, aumento del lavoro respiratorio, peggioramento del sensorio, PaCO₂ in aumento, lattato in crescita, LUS peggiorato o comparsa di consolidamenti/progressiva perdita di aerazione. In questi casi non bisogna limitarsi ad aumentare il flusso o la FiO₂: bisogna rivalutare NIV, intubazione o terapia causale. CPAP La pressione positiva continua (CPAP) applica una pressione positiva nelle vie aeree e quindi nel sistema respiratorio durante tutto il ciclo respiratorio (inspirazione ed espirazione). La pressione non “sale” in modo differenziale a ogni inspirazione: il paziente respira spontaneamente sopra un livello pressorio costante, che si misura a fine espiratorio come pressione positiva di fine espirazione (PEEP). Per questo la CPAP non è un vero supporto inspiratorio, ma un supporto pressorio continuo orientato soprattutto a migliorare aerazione, ossigenazione e stabilizzazione alveolare. La CPAP agisce soprattutto su aerazione e ossigenazione. È particolarmente utile quando il problema dominante è il collasso alveolare o la congestione: edema polmonare cardiogeno, atelettasie post-operatorie, perdita di aerazione potenzialmente reclutabile. Va distinta dalla NIV-PS, nella quale il ventilatore aggiunge una pressione inspiratoria sopra il livello di pressione espiratorio. Limite pratico: se il problema principale è la fatica ventilatoria con ipercapnia, la CPAP da sola può non bastare. Se il polmone non è reclutabile, aumentare la pressione delle vie aeree può peggiorare il comfort del paziente, causare distensione gastrica e/o iperinflazione polmonare e non essere tollerata dal punto di vista emodinamico. In pratica, mettere la CPAP significa “tenere aperto” più che “spingere dentro aria”. Se il paziente è ipercapnico, tachipnoico e affaticato, bisogna chiedersi se non sia più utile un supporto inspiratorio vero, cioè una NIV-PS. NIV -PS La ventilazione non invasiva in pressione di supporto (NIV-PS) utilizza due livelli di pressione: una pressione positiva espiratoria, indicata come EPAP nelle modalità BiLevel/NIV e concettualmente analoga alla PEEP (pressione di fine espirazione), e una pressione inspiratoria (IPAP). La differenza matematica tra IPAP ed EPAP è il pressure support , cioè il supporto inspiratorio effettivo. L’EPAP lavora soprattutto su ossigenazione, reclutamento e contrasto dell’auto-PEEP. Il pressure support lavora soprattutto su ventilazione alveolare e riduzione del carico di lavoro dei muscoli inspiratori. La NIV-PS è la modalità di riferimento quando il problema dominante è ventilatorio: BPCO riacutizzata con acidosi respiratoria, ipoventilazione dell’obeso, patologie neuromuscolari, fatica dei muscoli respiratori e ipercapnia [1,3,4,10]. Limite pratico: un supporto insufficiente lascia il diaframma sovraccarico; un supporto eccessivo può produrre sovra-assistenza, asincronie, volumi troppo elevati e ridotta attività diaframmatica [14,15]. Figura 1.2. CPAP vs NIV-PS. La CPAP mantiene una pressione positiva continua. Nella NIV in pressione di supporto, la pressione sale da EPAP a IPAP durante l’inspirazione; la differenza tra i due livelli è il pressure support. Figura 1.2. CPAP vs NIV-PS. La CPAP mantiene una pressione positiva continua. Nella NIV in pressione di supporto, la pressione sale da EPAP a IPAP durante l’inspirazione; la differenza tra i due livelli è il pressure support. I due parametri regolabili principali in NIV-PS: EPAP/PEEP e pressure support La distinzione più importante per il settaggio pratico è tra EPAP/PEEP e pressure support . EPAP/PEEP e pressure support non sono intercambiabili. Se il problema è il polmone “chiuso”, si ragiona sulla pressione espiratoria (EPAP/PEEP). Se il problema è i muscoli respiratori affaticata, si ragiona sul supporto inspiratorio ( pressure support ). Parametro regolabile Bersaglio principale Può aiutare quando… Può essere dannosa quando… EPAP/PEEP Aerazione, ossigenazione, reclutamento, auto-PEEP edema, atelettasia, collasso, piccole vie aeree instabili polmone non reclutabile, iperinflazione, cuore destro fragile, ipotensione Pressure support Ventilazione alveolare, PaCO₂, lavoro respiratorio, diaframma ipercapnia, fatica respiratoria, diaframma sovraccarico volumi eccessivi, asincronie, sovra-assistenza, perdite elevate Tabella 1.1. EPAP/PEEP e pressure support: bersagli principali e rischi da controllare. Figura 1.3. EPAP/PEEP e pressure support: due parametri regolabili diversi. EPAP/PEEP e pressure support rispondono a problemi diversi. La prima agisce soprattutto su aerazione e ossigenazione; il secondo agisce su lavoro inspiratorio e ventilazione alveolare. Figura 1.3. EPAP/PEEP e pressure support: due parametri regolabili diversi. EPAP/PEEP e pressure support rispondono a problemi diversi. La prima agisce soprattutto su aerazione e ossigenazione; il secondo agisce su lavoro inspiratorio e ventilazione alveolare. Cosa può fare la NIV-PS La NIV-PS può migliorare l’ossigenazione, reclutare aree instabili, ridurre il lavoro respiratorio, aumentare la ventilazione alveolare, ridurre la PaCO₂, migliorare rapidamente l’edema polmonare cardiogeno e ridurre il ricorso all’intubazione nei pazienti correttamente selezionati [1,3-5]. Questi effetti non sono automatici. Devono essere verificati precocemente mediante valutazione clinica, emogasanalisi (EGA), dati del ventilatore ed ecografia. Cosa non può fare la NIV La NIV non protegge le vie aeree, non rimuove le secrezioni, non risolve la chiusura di un bronco ostruito, non cura una polmonite, non corregge uno shock e non garantisce da sola la riduzione del lavoro respiratorio. Può diventare dannosa quando simula una stabilità apparente e ritarda l’intubazione. Il segnale tipico per identificare questa condizione clinica pericolosa è un paziente che mantiene una SpO₂ accettabile, ma che allo stesso tempo resta tachipnoico, affaticato, con FiO₂ elevata, LUS invariato o peggiorato e diaframma ancora iperattivo [7,8]. Errore da evitare L’errore più comune è considerare la SpO₂ come unico indicatore di successo. La saturazione è necessaria, ma non basta: non distingue da sola tra incremento della FiO₂ inspirata, riduzione dello shunt, miglioramento della ventilazione alveolare, riduzione dello spazio morto o semplice compenso temporaneo. Una NIV funziona davvero se migliora ossigenazione, ventilazione, lavoro respiratorio, comfort, EGA e, quando pertinente, pattern ecografico. La NIV non va valutata solo guardando il monitor. Va valutata integrando le informazioni dal paziente, dal ventilatore, dall’EGA e dalla sonda ecografica. Bibliografia del Capitolo 1 1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, Navalesi P, Antonelli M, Brozek J, Conti G, Ferrer M, Guntupalli K, Jaber S, Keenan S, Mancebo J, Mehta S, Raoof S. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016. 2. Oczkowski S, Ergan B, Bos L, Chatwin M, Ferrer M, Gregoretti C, Heunks L, Frat JP, Longhini F, Nava S, Navalesi P, Pisani L, Renda T, Thille AW, Winck JC, Windisch W, Tonia T, Boyd J, Sotgiu G, Scala R. ERS clinical practice guidelines: high-flow nasal cannula in acute respiratory failure. Eur Respir J. 2022;59(4):2101574. doi:10.1183/13993003.01574-2021. 3. Brochard L, Mancebo J, Wysocki M, Lofaso F, Conti G, Rauss A, Simonneau G, Benito S, Gasparetto A, Lemaire F, Isabey D, Harf A. Noninvasive ventilation for acute exacerbations of chronic obstructive pulmonary disease. N Engl J Med. 1995;333(13):817-822. doi:10.1056/NEJM199509283331301. 4. Plant 8. Volpicelli G, Elbarbary M, Blaivas M, Lichtenstein DA, Mathis G, Kirkpatrick AW, Melniker L, Gargani L, Noble VE, Via G, Dean A, Tsung JW, Soldati G, Copetti R, Bouhemad B, Reissig A, Agricola E, Rouby JJ, Arbelot C, Liteplo A, et al. International evidence-based recommendations for point-of-care lung ultrasound. Intensive Care Med. 2012;38(4):577-591. doi:10.1007/s00134-012-2513-4. 19. Roca O, Messika J, Caralt B, García-de-Acilu M, Sztrymf B, Ricard JD, Masclans JR. Predicting success of high-flow nasal cannula in pneumonia patients with acute hypoxemic respiratory failure: the utility of the ROX index. J Crit Care. 2016;35:200-205. doi:10.1016/j.jcrc.2016.05.022."},{"part":"Parte I — Fondamenti pratici di ventilazione non invasiva","title":"Capitolo 2. Parametri ventilatori essenziali nella NIV","tag":"Capitolo 2","html":"\n<h3>Obiettivo pratico<\/h3>\n<p>Dopo aver scelto il supporto non invasivo, è necessario impostarlo in modo coerente. La NIV non fallisce solo perché l’indicazione è sbagliata: può fallire anche perché i parametri sono impostati male, perché il paziente non è sincrono, perché le perdite non vengono corrette o perché si guarda soltanto la saturazione.<\/p>\n<p>Il capitolo non ha lo scopo di descrivere tutti i dettagli tecnici dei ventilatori. L’obiettivo è più semplice: capire quali parametri modificare, perché modificarli e quali segnali usare per decidere se la variazione di impostazione ha funzionato o meno.<\/p>\n<p>Il principio operativo è questo:<\/p>\n<p>ogni parametro deve avere un bersaglio clinico.<\/p>\n<h3>Nomenclatura dei ventilatori: perché si crea confusione<\/h3>\n<p>La stessa modalità ventilatoria può essere chiamata in modo diverso a seconda del ventilatore. CPAP indica pressione continua senza supporto inspiratorio differenziale. BiLevel o BiPAP indicano, nel linguaggio clinico, una ventilazione a due livelli pressori: un livello espiratorio e un livello inspiratorio. PSV, NIV-PS o pressure support indicano una modalità spontanea assistita, nella quale il paziente avvia l’atto e il ventilatore aggiunge un supporto inspiratorio sopra EPAP/PEEP.<\/p>\n<p>Le modalità S/T (spontanea/temporizzata) aggiungono una frequenza di sicurezza: se il paziente non attiva il ventilatore entro il tempo previsto, il ventilatore eroga un atto temporizzato. PC o PCV indicano una ventilazione controllata a pressione; VC o VCV una ventilazione controllata a volume; PRVC indica una modalità a controllo duale, nella quale il ventilatore varia la pressione per avvicinarsi a un volume target. SIMV-PC e SIMV-VC indicano modalità sincronizzate con atti mandatori rispettivamente a pressione o a volume: sono termini frequenti nei ventilatori da terapia intensiva e non vanno confusi con la NIV-PS usata nella maggior parte dei trial non invasivi acuti.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_04.png\" alt=\"Figura 2.1. Parametri NIV: cosa controllano davvero. I parametri principali della NIV non sono equivalenti: EPAP/PEEP, IPAP, pressure support, FiO₂, trigger, cycling, rise time e backup rate hanno bersagli differenti.\" loading=\"lazy\"><figcaption>Figura 2.1. Parametri NIV: cosa controllano davvero. I parametri principali della NIV non sono equivalenti: EPAP/PEEP, IPAP, pressure support, FiO₂, trigger, cycling, rise time e backup rate hanno bersagli differenti.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_04.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 2.1. Parametri NIV: cosa controllano davvero. I parametri principali della NIV non sono equivalenti: EPAP/PEEP, IPAP, pressure support, FiO₂, trigger, cycling, rise time e backup rate hanno bersagli differenti.<\/p>\n<h3>Parametri che posso impostare<\/h3>\n<p><strong>EPAP/PEEP<\/strong><\/p>\n<p>EPAP e PEEP sono concetti molto vicini, ma non sempre identici nella nomenclatura dei ventilatori. EPAP indica la pressione positiva espiratoria nelle modalità BiLevel/NIV: è il livello di pressione su cui il paziente espira. PEEP indica la pressione positiva di fine espirazione, termine classico della ventilazione invasiva e di molte modalità CPAP/NIV. Nella pratica clinica vengono spesso usati come equivalenti funzionali, ma conviene ricordare il contesto: EPAP quando si ragiona sui due livelli di pressione della NIV-PS; PEEP quando si ragiona sulla pressione di fine espirazione e sul reclutamento della CPAP.<\/p>\n<p>I suoi bersagli principali sono:<\/p>\n<p>migliorare l’ossigenazione;<\/p>\n<p>mantenere aperte le unità alveolari instabili;<\/p>\n<p>contrastare il collasso espiratorio;<\/p>\n<p>ridurre il lavoro di trigger in presenza di auto-PEEP;<\/p>\n<p>modificare l’interazione cuore-polmone.<\/p>\n<p>Nella pratica, la EPAP è utile quando c’è un problema di aerazione o di pressione di fine espirazione intrinseca al paziente. È tipicamente utilizzata nell’edema polmonare cardiogeno, nelle atelettasie reclutabili, nel post-operatorio, nell’obesità e in alcune riacutizzazioni di BPCO con auto-PEEP.<\/p>\n<p><strong>Attenzione:<\/strong> aumentare la EPAP non è sempre benefico. Se il polmone non è reclutabile, l’aumento pressorio può sovradistendere le zone già aperte. Nella BPCO può peggiorare l’iperinflazione se supera il livello utile a contrastare l’auto-PEEP. Nei pazienti con ventricolo destro fragile può peggiorare il ritorno venoso e la tolleranza emodinamica. Non si aumenta la EPAP/PEEP “perché il paziente va male”. Si aumenta la EPAP/PEEP se il problema è aerazione, reclutamento, ossigenazione o auto-PEEP.<\/p>\n<table class=\"manualTable\"><tr><th>Messaggio operativo<br>sto cercando di aprire e mantenere aperto il polmone, oppure sto cercando di scaricare i muscoli respiratori?<br>Nel primo caso ragiono sulla EPAP/PEEP. Nel secondo caso ragiono sul pressure support.<\/th><\/tr><\/table>\n<p><strong>IPAP e pressure support<\/strong><\/p>\n<p>La IPAP è la pressione raggiunta durante l’inspirazione assistita, è la somma di EPAP/PEEP e <em>pressure support<\/em>. Il <em>pressure<\/em> <em>support<\/em> – quindi - è la differenza tra IPAP ed EPAP.<\/p>\n<p><strong><em>Pressure<\/em><\/strong><strong> <\/strong><strong><em>support<\/em><\/strong><strong> = IPAP − EPAP<\/strong><\/p>\n<p>È il <em>pressure<\/em> <em>support<\/em>, più che la IPAP isolata, a determinare l’aiuto inspiratorio. Se EPAP è 6 cmH₂O e IPAP è 16 cmH₂O, il <em>pressure<\/em> <em>support<\/em> è 10 cmH₂O. Se aumento EPAP a 8 cmH₂O lasciando IPAP a 16 cmH₂O, il <em>pressure<\/em> <em>support<\/em> scende a 8 cmH₂O. Questo passaggio è spesso sottovalutato.<\/p>\n<p>Il <em>pressure<\/em> <em>support<\/em> serve soprattutto a:<\/p>\n<p>ridurre il lavoro inspiratorio;<\/p>\n<p>aumentare il volume corrente;<\/p>\n<p>migliorare la ventilazione alveolare;<\/p>\n<p>ridurre la PaCO₂;<\/p>\n<p>scaricare il diaframma ed i muscoli accessori.<\/p>\n<p>È il parametro principale da regolare nei pazienti ipercapnici e affaticati, come in caso di BPCO riacutizzata, ipoventilazione dell’obeso, malattie neuromuscolari e fatica respiratoria.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_05.png\" alt=\"Figura 2.2. PSV o NIV-PS. Il paziente triggera il ventilatore; il supporto pressorio sale sopra EPAP/PEEP e termina quando il flusso inspiratorio scende sotto la soglia di cycling.\" loading=\"lazy\"><figcaption>Figura 2.2. PSV o NIV-PS. Il paziente triggera il ventilatore; il supporto pressorio sale sopra EPAP/PEEP e termina quando il flusso inspiratorio scende sotto la soglia di cycling.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_05.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 2.2. PSV o NIV-PS. Il paziente triggera il ventilatore; il supporto pressorio sale sopra EPAP/PEEP e termina quando il flusso inspiratorio scende sotto la soglia di cycling.<\/p>\n<p><strong>Attenzione: un pressure support troppo basso lascia il paziente tachipnoico e affaticato. Un pressure support troppo alto può produrre volumi eccessivi, asincronie, fastidio, perdite elevate e sovra-assistenza. Nel paziente ipossiemico de novo, volumi correnti elevati durante NIV-PS sono associati a rischio di fallimento e possibile danno. Non si aumenta il pressure support “perché il paziente satura poco”. Si aumenta il pressure support se il problema è ventilazione alveolare, ipercapnia o lavoro respiratorio.<\/strong><\/p>\n<p><strong>FiO₂<\/strong><\/p>\n<p>La FiO₂ serve a raggiungere il target di ossigenazione, ma non corregge il meccanismo dell’insufficienza respiratoria. Aumentare la FiO₂ può essere necessario, ma non deve diventare una scorciatoia per evitare la rivalutazione del polmone e del lavoro respiratorio.<\/p>\n<p>Una FiO₂ elevata persistente indica che il sistema non è stabile o che il supporto respiratorio impostato non sta correggendo il problema. Il trattamento non colpisce il bersaglio. In questi casi bisogna rivalutare:<\/p>\n<p>LUS e perdita di aerazione;<\/p>\n<p>reclutabilità;<\/p>\n<p>frequenza respiratoria;<\/p>\n<p>comfort e sincronia;<\/p>\n<p>EGA;<\/p>\n<p>indicazione a CPAP, NIV-PS o <em>escalation<\/em>.<\/p>\n<table class=\"manualTable\"><tr><th>Messaggio operativo: la FiO₂ corregge la saturimetria, non la malattia.<\/th><\/tr><\/table>\n<p><strong><em>Trigger<\/em><\/strong><strong> inspiratorio<\/strong><\/p>\n<p>Il <em>trigger<\/em> è il meccanismo con cui il ventilatore riconosce l’inizio dello sforzo inspiratorio del paziente. Può essere impostato a pressione o a flusso. Nel <em>trigger<\/em> a pressione, il ventilatore eroga il supporto quando rileva una piccola caduta di pressione generata dallo sforzo inspiratorio del paziente. Nel <em>trigger<\/em> a flusso il ventilatore eroga il supporto quando rileva una variazione di flusso nel circuito.<\/p>\n<p>Problemi tipici che si possono verificare in NIV-PS:<\/p>\n<p><strong><em>trigger<\/em><\/strong><strong> inefficace:<\/strong><strong> il paziente inspira ma il ventilatore non <\/strong><strong>eroga supporto<\/strong><strong>;<\/strong><\/p>\n<p><strong><em>trigger<\/em><\/strong><strong> ritardato:<\/strong> il ventilatore eroga il supporto tardi rispetto all’inspirazione del paziente, aumentando lo sforzo respiratorio complessivo;<\/p>\n<p>autotrigger: il ventilatore eroga supporto in assenza di inspirazione del paziente<\/p>\n<p>Nella BPCO, l’auto-PEEP può rendere difficile il trigger del ventilatore. Una EPAP adeguata può ridurre lo sforzo inspiratorio necessario ad attivare il trigger, ma solo se non aumenta ulteriormente l’iperinflazione. Le perdite elevate, soprattutto nei circuiti monotubo, possono invece favorire autotrigger o mancato trigger a seconda degli algoritmi di compensazione del ventilatore.<\/p>\n<p><strong><em>Rise<\/em><\/strong><strong> <\/strong><strong><em>time<\/em><\/strong><\/p>\n<p>Il <em>rise<\/em> <em>time<\/em> indica la velocità con cui la pressione sale da EPAP a IPAP. Un <em>rise time<\/em> troppo lento può dare sensazione di “fame d’aria”, perché il supporto arriva tardi. Un <em>rise time<\/em> troppo rapido può essere sgradevole, aumentare le perdite e peggiorare l’adattamento.<\/p>\n<p>Nella pratica clinica, quando valuto:<\/p>\n<p>paziente dispnoico, alto <em>drive<\/em> respiratorio, richiesta inspiratoria intensa: può servire una salita più rapida;<\/p>\n<p>paziente fragile, perdite elevate, fastidio o asincronie: può servire una salita più morbida.<\/p>\n<p>Il <em>rise<\/em> <em>time<\/em> non si regola guardando solo il ventilatore. Si regola guardando il paziente insieme al ventilatore: comfort, sincronia, frequenza respiratoria, uso dei muscoli accessori.<\/p>\n<p><strong><em>Cycling<\/em><\/strong><strong> espiratorio<\/strong><\/p>\n<p>Il <em>cycling<\/em> è il passaggio dall’inspirazione all’espirazione. In NIV-PS, nella maggior parte dei ventilatori, avviene quando il flusso inspiratorio scende sotto una quota percentuale del picco di flusso inspiratorio. Una soglia di <em>cycling<\/em> più alta tende ad accorciare il tempo inspiratorio; una soglia più bassa tende ad allungarlo.<\/p>\n<p>Se il cycling è tardivo, il ventilatore continua a insufflare la miscela di aria/ossigeno quando il paziente vorrebbe già espirare. Questo può generare fastidio, asincronia, perdite elevate e iperinflazione. Se il cycling è precoce, l’assistenza termina troppo presto e il paziente può restare dispnoico o richiedere un nuovo sforzo immediato.<\/p>\n<p>Questo punto è particolarmente importante nella BPCO: tempi inspiratori troppo lunghi riducono il tempo espiratorio e favoriscono l’iperinflazione dinamica. In molti pazienti ostruttivi può essere utile un <em>cycling<\/em> più precoce, sempre verificando comfort, frequenza respiratoria, addominali attivi, entità delle perdite e curve del ventilatore.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_06.png\" alt=\"Figura 2.3. Ciclo assistito in NIV-PS: trigger, rise time e cycling. Il trigger avvia l’assistenza, il rise time determina la velocità di salita della pressione, il cycling definisce il passaggio all’espirazione. Molte asincronie dipendono da questi tre elementi più che dal valore assoluto delle pressioni.\" loading=\"lazy\"><figcaption>Figura 2.3. Ciclo assistito in NIV-PS: trigger, rise time e cycling. Il trigger avvia l’assistenza, il rise time determina la velocità di salita della pressione, il cycling definisce il passaggio all’espirazione. Molte asincronie dipendono da questi tre elementi più che dal valore assoluto delle pressioni.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_06.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 2.3. Ciclo assistito in NIV-PS: trigger, rise time e cycling. Il trigger avvia l’assistenza, il rise time determina la velocità di salita della pressione, il cycling definisce il passaggio all’espirazione. Molte asincronie dipendono da questi tre elementi più che dal valore assoluto delle pressioni.<\/p>\n<p><strong><em>Backup<\/em><\/strong><strong> <\/strong><strong><em>rate<\/em><\/strong><\/p>\n<p>La <em>backup rate<\/em> è la frequenza minima garantita dal ventilatore nelle modalità che prevedono atti temporizzati, per esempio S/T. Subentra quando il paziente non attiva spontaneamente il ventilatore entro l’intervallo previsto dalla frequenza impostata o quando viene rilevata una condizione assimilabile ad apnea secondo l’algoritmo del ventilatore.<\/p>\n<p>Nel paziente acuto tachipnoico, la <em>backup rate <\/em>non è quasi mai il primo parametro da correggere. Se il paziente respira a 30 atti/min, impostare una backup rate a 14/min non riduce la fatica: significa solo che il ventilatore interverrà se il paziente smette di respirare. Diventa più rilevante in caso di ipoventilazione centrale, sonno, patologia neuromuscolare, sedazione, encefalopatia o rischio di apnea.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_07.png\" alt=\"Figura 2.4. Modalità S/T. Gli atti spontanei assistiti restano prevalenti; se il paziente non triggera, la frequenza di backup genera un atto temporizzato.\" loading=\"lazy\"><figcaption>Figura 2.4. Modalità S/T. Gli atti spontanei assistiti restano prevalenti; se il paziente non triggera, la frequenza di backup genera un atto temporizzato.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_07.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 2.4. Modalità S/T. Gli atti spontanei assistiti restano prevalenti; se il paziente non triggera, la frequenza di backup genera un atto temporizzato.<\/p>\n<table class=\"manualTable\"><tr><th>Messaggio operativo<br>la backup rate è una rete di sicurezza, non il trattamento della dispnea.<\/th><\/tr><\/table>\n<h3>Parametri che posso leggere sul ventilatore<\/h3>\n<p><strong>Perdite<\/strong><\/p>\n<p>Le perdite sono inevitabili in NIV, ma quando diventano eccessive compromettono l’efficacia del supporto respiratorio. Sono uno dei motivi più comuni del fallimento pratico della NIV. Possono ridurre il volume realmente erogato, disturbare trigger e cycling, aumentare fastidio, secchezza, rumore, lesioni cutanee e asincronie.<\/p>\n<p>Le perdite vanno sospettate quando:<\/p>\n<p>il paziente non si sincronizza, è agitato;<\/p>\n<p>il ventilatore mostra autotrigger;<\/p>\n<p>la pressione target (IPAP e/o EPAP) non viene raggiunta;<\/p>\n<p>il volume corrente stimato è incoerente;<\/p>\n<p>la maschera è rumorosa;<\/p>\n<p>il paziente è agitato o riferisce fastidio;<\/p>\n<p>gli occhi sono irritati da fuga d’aria verso l’alto, specie con le maschere naso-bocca<\/p>\n<p>è necessario stringere molto le cinghie dell’interfaccia<\/p>\n<p>Correggere le perdite non significa sempre semplicemente stringere di più le cinghie della maschera. A volte bisogna cambiare taglia, cambiare interfaccia, modificare la postura, ridurre transitoriamente le pressioni, umidificare meglio o correggere il <em>trigger<\/em>.<\/p>\n<p><strong>Volume corrente stimato<\/strong><\/p>\n<p>Molti ventilatori mostrano un volume corrente stimato, ovvero derivato in genere dell’integrale dell’onda di flusso. È utile, ma va interpretato con cautela perché le perdite possono renderlo impreciso. Nonostante questo limite, un volume molto basso può indicare supporto insufficiente o perdita eccessiva; un volume molto alto può suggerire sovra-assistenza o drive respiratorio elevato.<\/p>\n<p>Nel paziente ipossiemico de novo, volumi elevati durante NIV devono far aumentare il livello di attenzione: il paziente può continuare a generare grandi oscillazioni di pressione transpolmonare, peggiorare il danno polmonare ed essere a rischio di fallimento del trial.<\/p>\n<h3>Lettura rapida del ventilatore<\/h3>\n<p>Quando si rivaluta un paziente in NIV-PS, non basta chiedersi se “sta saturando”. Bisogna leggere insieme quattro livelli:<\/p>\n<table class=\"manualTable\"><tr><th>Livello<\/th><th>Cosa guardare<\/th><th>Perché serve<\/th><\/tr>\n<tr><td>Pressioni<\/td><td>EPAP, IPAP, PS effettivo<\/td><td>capire quale parametro stiamo regolando<\/td><\/tr>\n<tr><td>Scambi<\/td><td>FiO₂, SpO₂, EGA<\/td><td>capire se ossigena e ventila<\/td><\/tr>\n<tr><td>Interazione<\/td><td>perdite, trigger, cycling, asincronie<\/td><td>capire se il supporto arriva davvero<\/td><\/tr>\n<tr><td>Risposta clinica<\/td><td>FR, comfort, muscoli accessori, sensorio<\/td><td>capire se il paziente lavora meno<\/td><\/tr><\/table>\n<p class=\"manualCaptionText\">Tabella 2.1. Lettura rapida del ventilatore durante NIV.<\/p><figure class=\"manualFigure\"><img src=\"figure_scaricabili/figura_08.png\" alt=\"Figura 2.5. Lettura rapida del ventilatore durante NIV. I dati del ventilatore devono essere interpretati insieme a clinica ed ecografia. Il numero sul display conta solo se è coerente con il paziente.\" loading=\"lazy\"><figcaption>Figura 2.5. Lettura rapida del ventilatore durante NIV. I dati del ventilatore devono essere interpretati insieme a clinica ed ecografia. Il numero sul display conta solo se è coerente con il paziente.<\/figcaption><div class=\"manualFigureActions\"><a class=\"btn mini\" href=\"figure_scaricabili/figura_08.png\" download>Scarica questa immagine<\/a><\/div><\/figure>\n<p class=\"manualCaptionText\">Figura 2.5. Lettura rapida del ventilatore durante NIV. I dati del ventilatore devono essere interpretati insieme a clinica ed ecografia. Il numero sul display conta solo se è coerente con il paziente.<\/p>\n<table class=\"manualTable\"><tr><th>Messaggi chiave<br>EPAP/PEEP e pressure support correggono problemi diversi: la prima agisce soprattutto su aerazione e ossigenazione, il secondo sulla ventilazione e sul lavoro respiratorio.<br>Il vero supporto inspiratorio non è la IPAP da sola, ma la differenza tra IPAP ed EPAP.<br>La FiO₂ migliora la saturazione, ma non corregge da sola il problema respiratorio.<br>Trigger, rise time e cycling regolano la sincronia tra paziente e ventilatore.<br>Le perdite possono rendere inefficace una NIV anche quando i parametri sembrano corretti.<br>Il volume corrente letto sul ventilatore va interpretato con prudenza, soprattutto se ci sono perdite.<br>Ogni modifica delle manopole deve avere un obiettivo preciso e va rivalutata sul paziente.<\/th><\/tr><\/table>\n<h3>Bibliografia del Capitolo 2<\/h3>\n<p>1. Rochwerg B, Brochard L, Elliott MW, Hess D, Hill NS, Nava S, et al. Official ERS/ATS clinical practice guidelines: noninvasive ventilation for acute respiratory failure. Eur Respir J. 2017;50(2):1602426. doi:10.1183/13993003.02426-2016.<\/p>\n<p>2. Nava S, Hill N. Non-invasive ventilation in acute respiratory failure. Lancet. 2009;374(9685):250-259. doi:10.1016/S0140-6736(09)60496-7.<\/p>\n<p>3. Hess DR. Noninvasive ventilation for acute respiratory failure. Respir Care. 2013;58(6):950-972. doi:10.4187/respcare.02319.<\/p>\n<p>4. Vignaux L, Vargas F, Roeseler J, Tassaux D, Thille AW, Kossowsky MP, et al. Patient-ventilator asynchrony during non-invasive ventilation for acute respiratory failure: a multicenter study. Intensive Care Med. 2009;35(5):840-846. doi:10.1007/s00134-009-1416-5.<\/p>\n<p>5. Calderini E, Confalonieri M, Puccio PG, Francavilla N, Stella L, Gregoretti C. Patient-ventilator asynchrony during noninvasive ventilation: the role of expiratory trigger. Intensive Care Med. 1999;25(7):662-667. doi:10.1007/s001340050927.<\/p>\n<p>6. Carteaux G, Lyazidi A, Córdoba-Izquierdo A, Vignaux L, Jolliet P, Thille AW, et al. Patient-ventilator asynchrony during noninvasive ventilation: a bench and clinical study. Chest. 2012;142(2):367-376. doi:10.1378/chest.11-2279.<\/p>\n<p>7. Oto J, Chenelle CT, Marchese AD, Kacmarek RM. A comparison of leak compensation in acute care ventilators during noninvasive and invasive ventilation: a lung model study. Respir Care. 2013;58(12):2027-2037. doi:10.4187/respcare.02319.<\/p>\n<p>8. Carteaux G, Millán-Guilarte T, De Prost N, Razazi K, Abid S, Thille AW, et al. Failure of noninvasive ventilation for de novo acute hypoxemic respiratory failure: role of tidal volume. Crit Care Med. 2016;44(2):282-290. doi:10.1097/CCM.0000000000001379.<\/p>\n<p>9. Bouhemad B, Mongodi S, Via G, Rouquette I. Ultrasound for “lung monitoring” of ventilated patients. Anesthesiology. 2015;122(2):437-447. doi:10.1097/ALN.0000000000000558.<\/p>\n<p>10. Umbrello M, Formenti P. Ultrasonographic assessment of diaphragm function in critically ill subjects. Respir Care. 2016;61(4):542-555. doi:10.4187/respcare.04412.<\/p>","plain":"Obiettivo pratico Dopo aver scelto il supporto non invasivo, è necessario impostarlo in modo coerente. La NIV non fallisce solo perché l’indicazione è sbagliata: può fallire anche perché i parametri sono impostati male, perché il paziente non è sincrono, perché le perdite non vengono corrette o perché si guarda soltanto la saturazione. Il capitolo non ha lo scopo di descrivere tutti i dettagli tecnici dei ventilatori. L’obiettivo è più semplice: capire quali parametri modificare, perché modificarli e quali segnali usare per decidere se la variazione di impostazione ha funzionato o meno. Il principio operativo è questo: ogni parametro deve avere un bersaglio clinico. Nomenclatura dei ventilatori: perché si crea confusione La stessa modalità ventilatoria può essere chiamata in modo diverso a seconda del ventilatore. CPAP indica pressione continua senza supporto inspiratorio differenziale. BiLevel o BiPAP indicano, nel linguaggio clinico, una ventilazione a due livelli pressori: un livello espiratorio e un livello inspiratorio. PSV, NIV-PS o pressure support indicano una modalità spontanea assistita, nella quale il paziente avvia l’atto e il ventilatore aggiunge un supporto inspiratorio sopra EPAP/PEEP. Le modalità S/T (spontanea/temporizzata) aggiungono una frequenza di sicurezza: se il paziente non attiva il ventilatore entro il tempo previsto, il ventilatore eroga un atto temporizzato. PC o PCV indicano una ventilazione controllata a pressione; VC o VCV una ventilazione controllata a volume; PRVC indica una modalità a controllo duale, nella quale il ventilatore varia la pressione per avvicinarsi a un volume target. SIMV-PC e SIMV-VC indicano modalità sincronizzate con atti mandatori rispettivamente a pressione o a volume: sono termini frequenti nei ventilatori da terapia intensiva e non vanno confusi con la NIV-PS usata nella maggior parte dei trial non invasivi acuti. Figura 2.1. Parametri NIV: cosa controllano davvero. I parametri principali della NIV non sono equivalenti: EPAP/PEEP, IPAP, pressure support, FiO₂, trigger, cycling, rise time e backup rate hanno bersagli differenti. Figura 2.1. Parametri NIV: cosa controllano davvero. I parametri principali della NIV non sono equivalenti: EPAP/PEEP, IPAP, pressure support, FiO₂, trigger, cycling, rise time e backup rate hanno bersagli differenti. Parametri che posso impostare EPAP/PEEP EPAP e PEEP sono concetti molto vicini, ma non sempre identici nella nomenclatura dei ventilatori. EPAP indica la pressione positiva espiratoria nelle modalità BiLevel/NIV: è il livello di pressione su cui il paziente espira. PEEP indica la pressione positiva di fine espirazione, termine classico della ventilazione invasiva e di molte modalità CPAP/NIV. Nella pratica clinica vengono spesso usati come equivalenti funzionali, ma conviene ricordare il contesto: EPAP quando si ragiona sui due livelli di pressione della NIV-PS; PEEP quando si ragiona sulla pressione di fine espirazione e sul reclutamento della CPAP. I suoi bersagli principali sono: migliorare l’ossigenazione; mantenere aperte le unità alveolari instabili; contrastare il collasso espiratorio; ridurre il lavoro di trigger in presenza di auto-PEEP; modificare l’interazione cuore-polmone. Nella pratica, la EPAP è utile quando c’è un problema di aerazione o di pressione di fine espirazione intrinseca al paziente. È tipicamente utilizzata nell’edema polmonare cardiogeno, nelle atelettasie reclutabili, nel post-operatorio, nell’obesità e in alcune riacutizzazioni di BPCO con auto-PEEP. Attenzione: aumentare la EPAP non è sempre benefico. Se il polmone non è reclutabile, l’aumento pressorio può sovradistendere le zone già aperte. Nella BPCO può peggiorare l’iperinflazione se supera il livello utile a contrastare l’auto-PEEP. Nei pazienti con ventricolo destro fragile può peggiorare il ritorno venoso e la tolleranza emodinamica. Non si aumenta la EPAP/PEEP “perché il paziente va male”. Si aumenta la EPAP/PEEP se il problema è aerazione, reclutamento, ossigenazione o auto-PEEP. Messaggio operativo sto cercando di aprire e mantenere aperto il polmone, oppure sto cercando di scaricare i muscoli respiratori? Nel primo caso ragiono sulla EPAP/PEEP. Nel secondo caso ragiono sul pressure support. IPAP e pressure support La IPAP è la pressione raggiunta durante l’inspirazione assistita, è la somma di EPAP/PEEP e pressure support . Il pressure support – quindi - è la differenza tra IPAP ed EPAP. Pressure support = IPAP − EPAP È il pressure support , più che la IPAP isolata, a determinare l’aiuto inspiratorio. Se EPAP è 6 cmH₂O e IPAP è 16 cmH₂O, il pressure support è 10 cmH₂O. Se aumento EPAP a 8 cmH₂O lasciando IPAP a 16 cmH₂O, il pressure support scende a 8 cmH₂O. Questo passaggio è spesso sottovalutato. Il pressure support serve soprattutto a: ridurre il lavoro inspiratorio; aumentare il volume corrente; migliorare la ventilazione alveolare; ridurre la PaCO₂; scaricare il diaframma ed i muscoli accessori. È il parametro principale da regolare nei pazienti ipercapnici e affaticati, come in caso di BPCO riacutizzata, ipoventilazione dell’obeso, malattie neuromuscolari e fatica respiratoria. Figura 2.2. PSV o NIV-PS. Il paziente triggera il ventilatore; il supporto pressorio sale sopra EPAP/PEEP
